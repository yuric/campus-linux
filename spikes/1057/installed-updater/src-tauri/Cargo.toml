[package]
name = "campus-updater-1057"
version = "1.0.0"
edition = "2021"
rust-version = "1.99.1"
description = "Disposable installed updater evidence for Campus Linux card 1057"
license = "Apache-2.0"
default-run = "campus-updater-1057"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["rustls-tls"] }
base64 = "=0.22.1"
minisign-verify = "=0.3.0"
reqwest = { version = "0.13", default-features = false }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
url = "2"

[[bin]]
name = "campus-updater-1057"
path = "src/main.rs"

[[bin]]
name = "verify-signature"
path = "src/bin/verify-signature.rs"
required-features = ["privileged-verifier"]

[features]
custom-protocol = ["tauri/custom-protocol"]
privileged-verifier = []
