name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# ---------------------------------------------------------------------------
# Every job here is gated on the repository being public.
#
# GitHub-hosted runner minutes are metered on private repositories, and this
# account runs a self-hosted fleet for the monorepo rather than paying for them.
# On a private repo these jobs get no runner at all: they fail in ~3 seconds with
# zero steps and runner_name empty, which reads as a broken workflow rather than
# an unavailable one. Gating keeps them visibly skipped instead of falsely red.
#
# They begin running the moment the repository is made public, which is also when
# hosted minutes become free and when CI starts to matter.
#
# Do NOT resolve this by attaching a self-hosted runner. These repositories are
# intended to become public, and a fork's pull request can execute arbitrary code
# on a self-hosted runner — which would put the machine that builds and deploys
# Campus behind an anonymous contributor's diff.
# ---------------------------------------------------------------------------

jobs:
  links:
    if: ${{ !github.event.repository.private }}
    name: Internal links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check every relative link in Markdown points at a file that exists
        run: |
          fail=0
          while IFS= read -r f; do
            base=$(dirname "$f")
            grep -oE '\]\([^)#][^)]*\)' "$f" | sed 's/^](//;s/)$//' | while read -r t; do
              case "$t" in
                http*|mailto:*|"#"*) continue ;;
              esac
              target="${t%%#*}"
              [ -z "$target" ] && continue
              if [ ! -e "$base/$target" ]; then
                echo "::error file=$f::broken link -> $target"
                exit 1
              fi
            done || fail=1
          done < <(find . -name '*.md' -not -path './.git/*')
          exit $fail

  spec:
    if: ${{ !github.event.repository.private }}
    name: OpenAPI spec parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse docs/api/openapi.yaml
        run: |
          python3 - <<'PY'
          import sys, pathlib
          try:
              import yaml
          except ImportError:
              sys.exit("pyyaml missing")
          p = pathlib.Path("docs/api/openapi.yaml")
          if not p.exists():
              sys.exit("docs/api/openapi.yaml is missing — every README promises it")
          d = yaml.safe_load(p.read_text())
          paths = d.get("paths") or {}
          print(f"openapi {d.get('openapi')}, {len(paths)} paths")
          if not paths:
              sys.exit("spec has no paths")
          PY

  boundary:
    if: ${{ !github.event.repository.private }}
    name: Client renders, API decides
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test boundary policy tooling
        run: python3 -B -m unittest discover -s scripts/tests -v
      - name: Check reviewed client authority boundary (PRD D7)
        run: scripts/check-client-boundary.sh
