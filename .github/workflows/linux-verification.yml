name: Linux verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify_amd64:
    name: Linux policy x86_64
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 scripts/verify-linux.py --arch amd64 --output receipts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-policy-amd64
          path: receipts/
          if-no-files-found: error
          retention-days: 14
  verify_arm64:
    name: Linux policy arm64
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 scripts/verify-linux.py --arch arm64 --output receipts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-policy-arm64
          path: receipts/
          if-no-files-found: error
          retention-days: 14
  admission:
    name: Linux verification admission
    needs: [verify_amd64, verify_arm64]
    # Private visibility allocates no paid runner. Coordinator must reject a skipped gate.
    if: ${{ always() && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: linux-policy-*
          path: receipts
          merge-multiple: true
      - name: Reject missing, skipped or wrong-head evidence
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB_RESULTS: '{"verify_amd64":"${{ needs.verify_amd64.result }}","verify_arm64":"${{ needs.verify_arm64.result }}"}'
        run: python3 -B scripts/check_acceptance.py --receipts receipts --head "$EXACT_HEAD" --results "$JOB_RESULTS"
