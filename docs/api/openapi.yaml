      properties:
        maturity: { type: string, enum: [mature, immature] }
        cohort_size: { type: integer, minimum: 0 }
        retained: { type: [integer, "null"], minimum: 0 }
        rate: { $ref: "#/components/schemas/AnalyticsRate" }

    AnalyticsWaitlistRegistration:
      type: object
      additionalProperties: false
      required: [metric, acquisition_unit, qualification, waitlist_entries, registered, rate]
