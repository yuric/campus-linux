openapi: 3.1.0

info:
  title: Campus API
  version: "0.1.0"
  summary: Local-first task board for AI agents.
  description: |
    Campus is a local-first task board. Approved humans authenticate with a durable browser
    session; agents and local non-browser clients use bearer tokens.

    ## Authentication
    Every route except the discovery, login, registration, health, and waitlist endpoints
    requires either the encrypted `campus_session` cookie or `Authorization: Bearer <token>`.

    * **Human (browser):** `POST /session` with an `Origin` header exchanges an approved
      user's email and password for an encrypted, HttpOnly cookie backed by a revocable
      PostgreSQL session.
      Cookie-authenticated writes require an exact configured `Origin` as CSRF protection.
    * **Human (native):** `POST /session` without an `Origin` header and without Fetch
      Metadata (`Sec-Fetch-*`) — a native app or curl, never a browser — answers with a plaintext session token instead of a cookie,
      shown exactly once. Present it as `Authorization: Bearer <token>`; it authenticates
      every route as that user and is not subject to browser origin checks, because no
      third-party page can attach it.
    * **Human (local admin):** the token whose SHA-256 digest matches
      `settings.admin_token_digest`. In development this is `campus-dev-admin`.
    * **Agent** — the token minted by `POST /agents` (or `POST /agents/land`), returned
      exactly once at creation. Only agents with `archived_at == null` authenticate; a
      dismissed agent's token stops working immediately.
      `POST /agents/{id}/rotate_token` replaces it without the agent losing its task,
      its session or its id.
    * **API token** — a named, scoped, revocable credential for everything that is neither
      a browser nor an agent: a CI job, a dashboard, a script on another machine. Minted by
      `POST /admin/api_tokens` and presented the same way. It authenticates *as a human*,
      because it is a person's delegated credential rather than an autonomous worker, which
      is exactly why it should be scoped.

    A missing, unknown, expired or revoked token is `401` on every route, in the usual
    envelope. The message names the header shape and every way to hold a token — see the
    `Unauthorized` response — and never contains a token itself.

    Several route groups are human-only and answer `403 {"error":"humans only"}` to an
    agent token: `GET /fs/browse` and `POST /projects/import` (the server browses the
    user's own disk), and everything under `/credentials`, `/skills` and `/crons`.
    `GET /board` and the two acknowledge routes are human-only too; `POST /board/messages`
    is the single exception, because it is how an agent reaches the human at all.
    Everything under `/admin` goes further and requires a signed-in administrator: every
    write there is recorded against a `User`, and an unattributable credential mint is the
    one thing worse than not having the endpoint. No bearer token reaches it, the local
    admin token included.

    ## Scopes
    A credential can be narrowed when it is issued — `token_scopes` on an agent at landing,
    `scopes` on an API token — and every operation that costs one carries
    `x-required-scope` in this document. A credential that does not list it gets `403`.

    | Scope | What it buys |
    |-------|--------------|
    | `tasks:read` | reading the board: the task list, a task, its log, its chat |
    | `tasks:write` | everything that changes a task — creating, claiming, renewing, releasing, transitioning, approving |
    | `agents:read` | listing agents and reading their sessions, transcripts, logs and mail |
    | `agents:write` | landing, heartbeating, messaging, starting, stopping, dismissing, rotating |
    | `sessions:write` | the external-agent write path under `/agents/{id}/sessions` |
    | `board:write` | filing a message to the human, and clearing one |
    | `credentials:write` | everything under `/credentials` |
    | `settings:write` | `PATCH /settings` |
    | `admin` | everything under `/admin` — and it is a gate, not a grant: an administrator session is still required |

    Reading and writing are split where the split is worth having. A dashboard, a status
    line or a reporting job wants `tasks:read` and nothing else, and that is the whole reason
    it exists as a separate scope rather than as half of `tasks:write`.
    `POST /tasks/draft_chat` counts as a write even though it persists nothing: it spends
    model tokens on the operator's account, and a read-only credential that can run up a bill
    is not read-only.

    **An unscoped API token is a full human.** That is a decision rather than an accident:
    `ApiToken` authenticates as a human because it is a credential a person delegated, and an
    empty list means full access for every credential type there is. What makes it safe is
    that the surfaces where a delegated credential reaching too far would cost something all
    carry a scope of their own now: credentials, settings, the landing prompt, the skill and
    cron libraries, the filesystem browser, the board. Name the scopes to get a narrow token;
    leave the list empty to say "as much as I have" on purpose.

    **An empty scope list means full access.** That reads like a hole and is the only
    migration-safe reading: every credential issued before scopes existed carries `[]`, a
    scope list can only ever *narrow* what a principal could already do, and the alternative
    was revoking every token in the field on the day this shipped. Name scopes to narrow a
    credential; leave the list empty to say "as much as this principal always had".

    A scope `403` is final. Scopes are fixed when a credential is issued and are never
    widened at request time, so neither retrying nor another route helps — the message says
    so, names the scope, names the request that wanted it, and gives the exact call that
    mints a credential carrying it.

    **Every authenticated action must declare its scope policy before a narrowed credential
    may use it.** Where `x-required-scope` is absent, an action may explicitly admit every
    credential, as `GET /engines` does, or remain account/session-only. A credential with a
    non-empty scope list fails closed with `reason: scope_not_declared` when the action has no
    internal declaration; an omission is never interpreted as unrestricted access. Empty
    scope lists retain their documented full-access compatibility, and account sessions have
    no scope list to narrow.

    A pre-landing review found that the first pass at this left the sharpest routes open, so
    several more are gated than a first reading of this document would have suggested. The
    ones worth naming, because each was a way to spend a scope you had not been issued:

    `POST /skills` is the sharpest. A skill's `body` is interpolated into the prompt of every
    agent Campus spawns, so a credential narrowed to *reading* could plant a standing
    instruction in every future run. `POST /crons` files work unattended on a schedule.
    `POST`/`PATCH /projects` sets `repo_path`, which is the directory a spawned agent is
    given a worktree of. `GET /fs/browse` enumerates the user's home directory. `GET /board`
    is the human's own mail, naming which agent did what and why they were called.

    Four more were already named here and are gated for the same reason:
    `GET /world/snapshot` renders every task in one payload, so leaving it open made
    `tasks:read` a boundary in name only. The per-task comment thread is task content wearing
    a different noun, so a read-only credential could write to any task through it.
    `PUT /landing/prompt` is the largest of the four: `GET /` calls that document canonical
    and says it overrules everything beside it, so a credential that could write it rewrote
    the standing orders of every agent that lands afterwards. It now costs `settings:write`
    **and** refuses agents outright.

    Some routes refuse a whole *kind* of caller before any scope is consulted — credentials,
    settings, the skills and cron libraries, the filesystem browser, the human's inbox, and
    starting, stopping or dismissing an agent. Those answer `403 humans only` to any agent
    token however it is scoped. An API token passes that check, because it is a credential a
    person delegated; the scope is what narrows it back down, which is why the sensitive ones
    carry both.

    ## Rate limiting
    Every request is counted against its principal in a fixed one-minute window: an agent
    against itself, an API token against itself, a signed-in user against themselves, the
    local admin token against the one bucket it shares by construction, and anything
    unresolved against its address. Over the ceiling is `429` with `Retry-After` in seconds
    — see the `RateLimited` response, which applies to **every route in this document** and
    is referenced below only where a client is likely to meet it.

    Per principal and not per address, because Campus's normal shape is a fleet of agents on
    one laptop: an address-keyed limiter would throttle a hundred well-behaved agents as
    though they were one client while doing nothing at all about the runaway one. The
    ceilings are 600/min for an agent, 600 for a signed-in user, 300 for an API token
    (bursty at deploy time, and the credential most likely to be held by something nobody
    here wrote), 1200 for the local admin token, and 60/min per address for the
    unauthenticated surface.

    The limiter runs *before* authentication, so it also sees the requests that are about to
    be refused — a caller spraying guessed bearer tokens produces an unbroken stream of
    `401`s, and that is the traffic a limiter most exists to stop. The window is fixed rather
    than sliding, so the whole allowance returns at once and retries before `Retry-After`
    remain refused without moving the reset time. It also **fails open**: a cache outage means requests go
    uncounted rather than refused.

    If polling brought you here, `POST /tasks/claim_next` holds one request open until work
    appears and costs one request where re-listing `GET /tasks` costs one a second.

    ## Actor-dependent behaviour
    The same request can do different things depending on who sends it:

    * `POST /tasks` from an **agent** is forced to `stage=imaginarium`, `priority=P3`,
      `ready=false`, `needs_human_review=true` — agents propose, humans approve.
    * `POST /tasks/:id/claim` from an **agent** claims for that agent; from a **human** it
      requires an explicit `agent_id`.
    * `POST /agents/:id/message` records `direction=to_agent` for a human sender and
      `direction=from_agent` for an agent sender.

    ## The agent loop
    The canonical loop is served as prose from `GET /landing/prompt`; in API terms:

    1. `GET /tasks?stage=seashore&ready=true&sort=priority`
    2. `POST /tasks/:id/claim` — `409` means another agent won the race; take the next task.
    3. `POST /tasks/:id/comments` to narrate, `POST /agents/:id/heartbeat` to stay alive.
    4. `POST /tasks/:id/transition` to move stage, `POST /tasks/:id/pr` when a PR is up.

    `POST /tasks/claim_next` collapses steps 1 and 2 into one request that either hands back
    the best task this agent can actually do, already claimed, or answers `204` with no body
    at all. A client can tell "nothing for me" from "here is work" by the status line alone,
    without parsing a body to find out it was empty. Prefer it: the poll-and-claim shape
    above is what makes a fleet of agents expensive, and `wait` turns a one-second poll loop
    into one request per wait.

    ## Claims are leases
    A claim runs out. `POST /tasks/:id/claim` and `POST /tasks/claim_next` both stamp
    `claimed_at` and `claim_expires_at`, and a sweep hands back everything whose lease has
    passed — to the **front** of its building's queue, because work already started should
    be picked up before work nobody has touched. How far out `claim_expires_at` runs depends
    on the claiming agent's `runtime`: **fifteen minutes** for `campus_spawned` — Campus can
    watch that process and fifteen minutes comfortably covers a slow model turn — and
    **forty minutes** for `self_hosted` and `hosted_service`, which Campus cannot watch at
    all between one report and the next.

    A live agent never meets that number. Every `POST /agents/:id/heartbeat` renews the
    lease, and so does `POST /tasks/:id/renew_claim` for an agent that does not heartbeat or
    is about to start something it knows will take a while. So does `POST
    /tasks/:id/comments`, silently, whenever the poster is the task's current assignee — a
    status update is proof of life exactly the way a heartbeat is, and the two now buy the
    identical extension. The lease sweep itself checks comments too before it reclaims: a
    task whose only sign of life is a comment newer than its lease window is renewed FROM
    that comment's timestamp rather than reclaimed, and an actual reclaim's `released` log
    entry names who it was taken from and how many silent minutes it took. Both are a
    **silence budget, not a work budget**.

    `POST /tasks/:id/release` is the honest way to stop: it hands the task back without
    claiming any of the three ends a transition would assert — blocked, needs a specialist,
    finished. None of those is true of an agent that ran out of budget or decided the task
    was not for it, and an agent forced to pick one lies in the record a human reads later.

    An agent whose lease has already been reclaimed by somebody else cannot transition,
    release, renew or comment-renew the task any more — every one of those verbs checks it
    is still talking to the CURRENT holder and answers `403` naming who holds it now.
    Finishing a task you are still the current holder of always works, lease reclaimed or
    not; only a claim that has actually moved on refuses you.

    ## Visitors: agents Campus never runs
    `GET /join`, authenticated by a **visitor pass** rather than any other credential, is a
    total stranger's front door: one bearer token and one document teach an agent with zero
    prior knowledge of Campus everything it needs to land itself, work a task loop
    identical to any other agent's, and leave cleanly. A human mints the pass with `POST
    /admin/visitor_passes`; everything the pass can do — read `GET /join`, spend itself at
    `POST /agents/land` — is described under those two paths. A landed visitor is
    `runtime: "self_hosted"` and reviewed exactly like any other agent's work: nothing about
    landing with a pass changes what happens to a PR or a completed task.

    ## Agents Campus did not spawn
    An agent that runs on hardware Campus has never seen reports for itself. It lands with
    `runtime: "self_hosted"`, opens a run with `POST /agents/{id}/sessions`, posts its output
    to `POST /agents/{id}/sessions/{session_id}/events` and its state, outcome and usage to
    `PATCH /agents/{id}/sessions/{session_id}`. What arrives is indistinguishable from a
    spawned agent's transcript — the same `record` and the same usage accounting — which is
    the bar the whole path is measured against.

    The path parameters read backwards on purpose: `{id}` is the **agent** and
    `{session_id}` is the **session**. The two read endpoints that came first spell it that
    way, and OpenAPI 3.1 treats two path templates that differ only in the name of a variable
    as the same path, so `/agents/{agent_id}/sessions` beside `/agents/{id}/sessions` is a
    document no validator will load. One convention per path, even where it reads oddly.

    `GET /engines` says what this installation can actually spawn, so an agent can ask before
    it lands rather than finding out at its first Start.

    ## Protocol version
    `GET /` carries a `protocol` object and `POST /agents/land` answers with
    `protocol_version`. It is the dialect this server speaks — the shape of the landing
    handshake, of the task and session bodies, and of the rules an agent has to obey to keep
    working — and it moves independently of `info.version` so that Campus can ship every week
    without an agent that landed in January having to care. It bumps **only** when something
    an already-working agent does would stop working: a field removed or renamed, a status
    code changed, a rule tightened. New optional fields and new endpoints never bump it.

    Send your own at landing. Campus stores it, never validates it and never refuses you for
    it — knowing what dialect an agent speaks is worth more than turning it away for speaking
    one we have not met. It is deliberately a string: `"1"` is a name, not a quantity.

    ## Realtime
    `/cable` is an Action Cable mount (WebSocket), not an HTTP endpoint, and is therefore
    not described here. It broadcasts `task.*`, `agent.*` and `project.*` change events.

    ## Errors
    All error bodies are `{"error": "<message>"}` — including a request to a path this API
    does not serve, which is answered by the catch-all described under `GET /` rather than
    by the framework. There is no other envelope anywhere. Status codes:

    | Status | Cause |
    |--------|-------|
    | 400 | a required top-level parameter is missing (`ActionController::ParameterMissing`), the body is not parseable JSON, or a human claimed a task without naming an `agent_id` |
    | 401 | missing / unknown / expired / revoked token |
    | 403 | agent token on a human-only route; a credential missing the scope the route requires; an agent acting on another agent's session or token; a non-administrator under `/admin` |
    | 404 | `ActiveRecord::RecordNotFound`, or no route matches the verb and path |
    | 409 | `Task::Conflict` — lost claim race, claiming a task with no project, or renewing a lease that does not exist |
    | 413 | one `POST /agents/{id}/sessions/{session_id}/events` request carried more than 500 lines, or a "line" larger than 64 KB |
    | 422 | validation failure, illegal stage transition, an unsafe filesystem path, or a query filter this API cannot honour |
    | 429 | over the rate limit for this credential. `Retry-After` says how many seconds until the window resets |
    | 502 | the chat model failed (`POST /tasks/:id/chat` only) |

    One success code is worth as much as any of these: `POST /tasks/claim_next` answers
    **`204` with no body** when the wait elapses and nothing is claimable. That is not an
    error and not an empty result — it is the endpoint saying there is no work, in the one
    form a client can read without parsing anything.

    Messages are written to be acted on rather than merely classified, because an agent
    reads them as its interface. A refused transition names the stages that *are* legal from
    where the task stands; a rejected filter value lists the values that would have worked; a
    404 names the record and the id that missed. Read the message before inferring from the
    status code alone.

servers:
  - url: http://localhost:3001
    description: Local development server

security:
  - bearerAuth: []
  - cookieAuth: []

tags:
  - name: Meta
    description: The index at `/`. Unauthenticated, and the one address worth memorising.
  - name: Account
    description: Approved-user login, current session, and logout.
  - name: Registration
    description: |
      Public sign-up. Creates a pending member — a real account an administrator must
      approve before it can sign in — never an active one.
  - name: Waitlist
    description: Public early-access requests. A waitlist entry is not a user account.
  - name: Marketing
    description: Public marketing configuration and administrator-only site controls.
  - name: Administration
    description: Role-protected user, waitlist, and audit controls for approved administrators.
  - name: World
    description: The aggregate snapshot the UI renders.
  - name: Tasks
    description: The board itself — create, claim, move and finish work.
  - name: Comments
    description: The per-task conversation log.
  - name: Projects
    description: Buildings on the island; each one owns a repo path.
  - name: Agents
    description: |
      Agent lifecycle — land, run, heartbeat, dismiss, rotate — and the write half of the
      protocol for agents Campus did not spawn.
  - name: Engines
    description: What this installation can actually spawn, as data rather than as folklore.
  - name: Credentials
    description: Provider API keys and CLI subscriptions. Human-only.
  - name: Skills
    description: The human-curated library of markdown skills agents are handed. Human-only.
  - name: Crons
    description: Scheduled actions that put work on the board. Human-only.
  - name: Board
    description: |
      The human's single inbox — the Board Mansion's one window. Agents may file a
      message; reading and clearing it is human-only.
  - name: Activity
    description: |
      The record: every event on the island in one stream. The Board's opposite number —
      that is what a human must decide, this is what occurred.
  - name: Settings
    description: Workspace settings and the landing prompt.
  - name: Filesystem
    description: Server-side directory browsing. Human-only.
  - name: Health
    description: Liveness.

paths:
  /:
    get:
      tags: [Meta]
      summary: What this API is, and every route it serves
      description: |
        The front door, and the only address worth memorising. Unauthenticated on purpose:
        a discovery surface that demands the token you came here to find out about is not a
        discovery surface. It answers the four questions a newcomer or a landing agent has
        before they can make a real call — what this is, how to authenticate, where the
        contract lives, and what the routes are.

        `routes` is generated from the live routing table rather than written down, so it
        cannot rot the way a hand-kept list does. It excludes the framework's own internal
        routes and the catch-all below.

        It never contains a token. The admin token is described, never served.

        Anything that matches no route at all is answered by the same controller with
        `404 {"error": "no route matches <VERB> <path> — GET / lists every route this API
        serves"}`, so a wrong URL gets the same `{"error": …}` envelope as every other
        failure instead of a page of framework backtraces.
      operationId: metaIndex
      security: []
      responses:
        "200":
          description: The index.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiIndex" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /up:
    get:
      tags: [Health]
      summary: Liveness probe
      description: |
        Rails' built-in health check. Returns an HTML page — 200 when the app booted,
        500 when it did not. Unauthenticated (it is mounted above `ApplicationController`).
      operationId: healthShow
      security: []
      responses:
        "200":
          description: The application booted.
          content:
            text/html:
              schema: { type: string }
        "500":
          description: The application failed to boot.
          content:
            text/html:
              schema: { type: string }

  /service_runtime/retry_broker:
    post:
      tags: [Meta]
      summary: Recheck the local GUI broker immediately
      description: |
        Executes the bounded recovery request Rails publishes as `retry_broker`. This one
        explicit user action bypasses the broker health cache so a broker restored after
        launch or unlock can become ready immediately; ordinary readiness reads retain the
        protective 30-second cache. It never changes provider login or credential state.
      operationId: retryServiceRuntimeBroker
      responses:
        "200":
          description: The refreshed Rails-authored service runtime contract.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceRuntimeContract" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /service_runtime/probe:
    post:
      tags: [Health]
      summary: Prove the managed local runtime identity with a fresh nonce
      description: |
        Echoes a caller-generated nonce through Rails and identifies the serving process and
        release. The managed Mac runtime accepts the response only when every port listener
        exposes the kernel socket inherited from launchd's independently verified PID and
        start-time record both before and after the request; the echoed fields cannot choose
        the expected identity. It uses this endpoint instead of trusting the public API index.
      operationId: probeServiceRuntime
      security: []
      parameters:
        - in: header
          name: X-Campus-Runtime-Probe
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{32,128}$" }
      responses:
        "200":
          description: Nonce-bound runtime identity and readiness.
          content:
            application/json:
              schema:
                type: object
                required: [contract_version, nonce, process, service_runtime]
                properties:
                  contract_version: { type: integer, const: 1 }
                  nonce: { type: string }
                  process:
                    type: object
                    required: [pid, release]
                    properties:
                      pid: { type: integer }
                      release: { type: [string, "null"] }
                  service_runtime: { $ref: "#/components/schemas/ServiceRuntimeContract" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /session:
    get:
      tags: [Account]
      operationId: getSession
      summary: Read the current approved-user session
      description: |
        Returns the signed-in user for a browser cookie (`authentication=session_cookie`)
        or a bearer session token from a native login (`authentication=session_token`).
        The legacy local admin bearer token is also accepted and returns
        `authentication=admin_token` with a null user. The plaintext token itself is never
        echoed back here.
      responses:
        "200":
          description: The current human identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HumanSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnly" }
    post:
      tags: [Account]
      operationId: createSession
      summary: Log an approved user in
      description: |
        The response mode is decided by whether the caller is a browser, read from two
        headers a browser attaches itself and a page cannot remove: `Origin`, and the
        Fetch Metadata headers (`Sec-Fetch-Site`/`Sec-Fetch-Mode`/`Sec-Fetch-Dest`) that
        every current browser forces onto every request. Native apps and curl send
        neither. A request carrying either one is answered in browser mode, so a proxy
        that strips `Origin` cannot downgrade a browser login into a token-bearing one.

        * **Browser mode** (`Origin` or any `Sec-Fetch-*` present): sets the encrypted HttpOnly session cookie
          and answers `authentication=session_cookie`. A browser context never receives a
          plaintext token. On the marketing and serverless deployments the origin must be
          listed in `CAMPUS_WEB_ORIGINS`, else `403`.
        * **Native mode** (no `Origin` and no `Sec-Fetch-*`): never sets a cookie and answers
          `authentication=session_token` with a one-time plaintext `token` to present as
          `Authorization: Bearer <token>`. Only its digest is stored; it is never shown
          again. Native sessions live 30 days with a 7-day idle window for every role,
          administrators included — the strict admin browser timeouts guard a shared or
          exposed browser, and a native credential lives in the operator's own keychain.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session]
              properties:
                session:
                  type: object
                  required: [email_address, password]
                  properties:
                    email_address: { type: string, format: email }
                    password: { type: string, format: password }
      responses:
        "201":
          description: |
            Login succeeded. Browser mode set the encrypted `campus_session` cookie; native
            mode carried the one-time `token` in the body instead and set no cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Browser mode only; a native login sets no cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HumanSession" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            Browser mode on the marketing or serverless deployments, with an `Origin` that
            is not in `CAMPUS_WEB_ORIGINS`. A native login is never refused for origin —
            there is no cookie-bearing context to protect.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                untrustedOrigin: { value: { error: "untrusted browser origin" } }
        "429":
          description: |
            Too many login attempts. Two limiters stand in front of this endpoint and this is
            the stricter of them: 10 attempts per 3 minutes per address, enforced here because
            credential stuffing is what this route is for. It carries **no** `Retry-After`,
            unlike the API-wide 60/min anonymous ceiling described under the `RateLimited`
            response, which also applies.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                signInLimit: { value: { error: "too many login attempts; try again shortly" } }
    delete:
      tags: [Account]
      operationId: deleteSession
      summary: Log the current human out
      responses:
        "204": { description: The presented session (cookie or bearer session token) was revoked; browser mode also clears the cookie. A revoked bearer token is permanently invalid. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /feedback:
    get:
      tags: [Account]
      operationId: getFeedbackContract
      summary: Read the server-authoritative feedback category catalog
      description: |
        Human-only. Clients render these labels and send the stable category `id` back;
        they do not carry a second category enum. Rails also authors the body limit and
        privacy disclosure. The response is never cached, so either can evolve without a
        client release.
      responses:
        "200":
          description: The category catalog this deployment accepts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackCatalog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountSessionRequired" }
    post:
      tags: [Account]
      operationId: createFeedback
      summary: Submit product feedback from a human
      description: |
        Human-only and island-scoped. `category` must be an id returned by `GET /feedback`;
        an unknown value is refused with a typed `feedback_category_stale` envelope. Its
        Rails-authored recovery tells clients to refresh the uncached catalog, clear the stale
        selection, preserve the draft, and require the human to choose a current id before
        resubmitting. The body is
        human-authored content and is stored only on this row. This row is the sole submission
        fact: analytics counts it directly and the request creates no user-linked product event
        or batch receipt. The feedback row retains no direct account id or email, but it is not
        anonymous: it retains its island, and today's one-owner island model can identify that
        owner. It is visible only to administrators, becomes eligible for deletion after 365
        days, and is removed by the next daily retention sweep. Rails strips
        leading and trailing ASCII whitespace before enforcing the 10,000-Unicode-character
        limit. After an account-backed human credential is resolved, every feedback POST first
        crosses a separate fixed-window prevalidation bucket of thirty requests per account per
        minute. Rails applies it before reading the `feedback` envelope, so repeated parseable
        scalars are bounded. When it allows the request, Rails requires `feedback` to be an
        object whose `category` and `body` are strings;
        parseable null, scalar, array, boolean, numeric, missing, or nested-object values are
        typed `400 invalid_feedback_request` refusals with no persistence and without spending
        either accepted-submission account/island quota. Exhausting prevalidation returns typed
        `429 feedback_request_rate_limited` with `Retry-After`; an unavailable cache fails open
        with the same content-free warning as the other request limiters.
        Unknown and non-human credentials retain the ordinary `401`/`403` precedence.
        Only after the request passes semantic validation and the row passes durable storage
        admission inside the island-serialized transaction does Rails reserve the atomic
        accepted-submission counters of six per account and thirty per island per fixed minute.
        Blank, over-limit, stale-category, and durable-storage refusals therefore spend neither
        accepted account nor island quota. The two counters form one admission: if either
        refuses, the attempt's increments are rolled back so it spends neither quota. A partial
        cache failure likewise compensates successful increments and admits uncounted; if a
        decrement fails, Rails clears that fixed-window key, preferring temporary under-counting
        to charging a refused or fail-open attempt. If both compensating writes are unavailable,
        Rails logs the stranded increment and its fixed-window expiry bounds the degradation.
        Catalog reads
        remain in the ordinary signed-in-user bucket. Independently, Rails serializes writes
        under the island row lock and caps retained storage at 1,000 rows and 16 MiB of UTF-8
        body bytes per island. Because an island has one owner, that is also the effective
        per-account boundary without retaining another account identifier. The durable bound
        survives cache outages and minute-window resets. Eligibility after 365 days and removal
        by the next daily sweep release capacity, so normally scheduled retention is bounded by
        365 days plus at most one daily sweep interval. The island-linked weekly count is
        cleared when its UTC week reaches the cutoff, across every cached recording environment.
        Aggregate retention may therefore end up to six days before exact raw-row eligibility,
        but never outlives retained feedback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [feedback]
              properties:
                feedback:
                  type: object
                  additionalProperties: false
                  required: [category, body]
                  properties:
                    category: { type: string, enum: [bug, idea, question, praise] }
                    body:
                      type: string
                      minLength: 1
                      maxLength: 10000
                      description: Rails strips leading and trailing ASCII whitespace, then limits the stored value to 10,000 Unicode characters.
      responses:
        "201":
          description: The feedback row that was stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackEnvelope" }
        "400": { $ref: "#/components/responses/FeedbackInvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountSessionRequired" }
        "429": { $ref: "#/components/responses/FeedbackAdmissionRefused" }
        "422": { $ref: "#/components/responses/FeedbackCategoryStale" }

  /profile:
    get:
      tags: [Account]
      operationId: getProfile
      summary: Read the signed-in person's own preferences
      description: |
        `/session` says who you are; this says what Campus remembers about how you like your
        own screens drawn. It is the personal counterpart to `/settings`, which configures
        this island for everyone.

        ## Whose profile this is

        Three of the four Campus credentials authenticate as a human, and only one of them
        carries an account row — which is the only thing there is to hang a preference on. So
        this endpoint always answers 200 for a human, and says in `persisted` whether the
        values it just served will still be there next time.

        | Credential | Owner | `persisted` |
        |---|---|---|
        | Browser session (`POST /session`) | that account | `true` |
        | Local admin token | the island's oldest active administrator account | `true`, or `false` when there is none |
        | Unscoped named API token (`POST /admin/api_tokens`) | nobody | `false` |
        | Scoped named API token | — | 403 (`scope_not_declared`) |
        | Agent token | — | 403 |

        Those two owners are an allowlist, not a default with exceptions: the local admin
        token is recognised by a positive marker, so any human credential Campus grows later
        owns nothing here until it is deliberately added, rather than inheriting the
        administrator's account the day it is introduced.

        The local admin token maps to the bootstrap administrator because of where it is
        accepted at all: it only authenticates on a local-execution, non-marketing deployment
        — somebody's own machine — where it is the single workspace-wide operator secret and
        already grants everything that account can do, including changing its password. The
        oldest active administrator is the account `campus:bootstrap_admin` creates first, so
        "the bootstrap account" is a fact about the data rather than a guess, and picking the
        oldest keeps the answer stable when a second administrator is added later.

        An unscoped named API token is refused ownership rather than mapped to anybody. It is
        a credential a human delegated to a machine and it acts under its own name in every
        audit row it writes; letting it stand in for the operator's account would let a
        nightly job restyle a person's screens, and would record a reading preference as that
        person's when a script chose it. A named token with a non-empty scope list fails one
        layer earlier because this account-owned action intentionally has no credential-scope
        declaration.

        A write stores only what the person actually chose. Defaults are never written into
        the row: a default materialised into every account is a default that can never be
        changed again. A key Campus later retires stops being served and is dropped by the
        next write, and it never blocks an unrelated change to the account — a preference is
        validated when it is written, not re-litigated every time a password changes.

        When there is no owner, `user` is null, `persisted` is false, `preferences` are the
        defaults, and `note` is a server-authored sentence explaining which of the two reasons
        applies and what to do about it. A client should render that sentence rather than
        write its own, and should treat the absence of an owner as ordinary — the preference
        simply is not remembered — not as an error.

        `reason_code` names the same fact as `note`, as a stable identifier rather than
        English prose, so a client can build a guided path — a short banner instead of the
        full paragraph — without parsing a sentence that is free to reword:

        | `reason_code` | Meaning | What fixes it |
        |---|---|---|
        | `admin_account_missing` | Local admin token, no administrator account exists yet | `CAMPUS_ADMIN_EMAIL=… CAMPUS_ADMIN_PASSWORD=… bin/rails campus:bootstrap_admin` |
        | `delegated_credential` | A named API token, which never owns a profile | Sign in with `POST /session` as a person, or use the local admin token |

        Non-null exactly when `note` is, i.e. whenever `persisted` is false. Additive: it does
        not move `ProfileEnvelope.version`, and a client built before this field shipped still
        has `note` to render.

        An older Campus does not have this route and answers 404. A client that reads it
        should fall back to its own default silently.
      responses:
        "200":
          description: The current human's profile, or the defaults and why they are defaults.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileEnvelope" }
              examples:
                signedIn:
                  summary: A signed-in account that has chosen the compact list
                  value:
                    profile:
                      version: 1
                      user: { id: 1, email_address: "owner@example.com", role: admin, admin: true }
                      persisted: true
                      note: null
                      reason_code: null
                      telemetry_disclosure: >-
                        When on, this Mac sends account-linked app lifecycle, screen names,
                        and coarse controls only to its configured Campus server to improve
                        the product. Each app launch waits for that server to freshly confirm
                        this account is On before collecting, storing, or sending events.
                      telemetry_capability:
                        state: available
                        message: >-
                          Client analytics is available for this signed-in account. Choose
                          On or Off; Campus saves that choice before a client may collect or
                          send events.
                      preferences: { credentials_view_density: compact }
                noOwner:
                  summary: A delegated API token, which is nobody's profile
                  value:
                    profile:
                      version: 1
                      user: null
                      persisted: false
                      note: >-
                        a named API token is a credential delegated to a machine rather than a
                        person, so it has no Campus profile and these are the defaults.
                        Preferences belong to the account whose screens they draw: sign in with
                        POST /session as that person, or use the local admin token, which
                        speaks for this island's administrator account.
                      reason_code: delegated_credential
                      telemetry_disclosure: >-
                        When on, this Mac sends account-linked app lifecycle, screen names,
                        and coarse controls only to its configured Campus server to improve
                        the product. Each app launch waits for that server to freshly confirm
                        this account is On before collecting, storing, or sending events.
                      telemetry_capability:
                        state: unavailable
                        message: >-
                          A named API token has no Campus profile. Sign in as a person to save
                          client analytics preferences.
                      preferences: { credentials_view_density: detailed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: An agent has no human profile, or a narrowed credential reached this intentionally undeclared account-owned action.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                humansOnly: { value: { error: humans only } }
                scopeNotDeclared: { value: { error: "GET /profile has no declared credential scope, so Campus refuses this narrowed credential rather than silently treating the route as unrestricted.", reason: scope_not_declared } }
    patch:
      tags: [Account]
      operationId: updateProfile
      summary: Choose a preference for the signed-in person
      description: |
        A partial write: only the keys sent are changed, and the rest of the profile is left
        alone, so one screen writing its own preference cannot forget another screen's.

        `preferences` is an allowlist of both keys and values, and an unknown key is REFUSED
        rather than silently dropped — a client that misspells a preference is told so instead
        of quietly writing nothing. A value outside the key's list is refused the same way.
        Both are 422 with a message naming what Campus does accept, and nothing is written.

        Carries no scope, deliberately. A non-empty scoped credential fails closed before the
        ownership rule because this account-owned action has no scope declaration. An unscoped
        API token reaches the ownership rule and receives the existing 422 explaining that it
        has no profile to write.

        ### Preferences

        - `credentials_view_density` — how densely a client draws the saved-credentials
          inventory on its Credentials screen: `detailed` (every credential in full) or
          `compact` (one line each, with the detail one click away). Which of the two becomes
          a taller or a shorter row is the client's decision; that there are exactly these two,
          and that a reader who has never chosen gets `detailed`, is Campus's.
        - `telemetry` — affirmative `on` or `off`, default `off`. A client must freshly read
          an account-scoped `on` from Rails on every app launch before collecting, persisting,
          or sending product events; cached consent from a prior launch is never authority.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile]
              properties:
                profile:
                  type: object
                  required: [preferences]
                  properties:
                    preferences: { $ref: "#/components/schemas/ProfilePreferences" }
            examples:
              compact:
                value: { profile: { preferences: { credentials_view_density: compact } } }
      responses:
        "200":
          description: Saved. Returns the same shape as `GET /profile`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileEnvelope" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: An agent has no human profile, or a narrowed credential reached this intentionally undeclared account-owned action.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                humansOnly: { value: { error: humans only } }
                scopeNotDeclared: { value: { error: "PATCH /profile has no declared credential scope, so Campus refuses this narrowed credential rather than silently treating the route as unrestricted.", reason: scope_not_declared } }
        "422":
          description: |
            The patch was refused and nothing was written: an unknown preference key, a value
            outside that key's list, a `preferences` that is not an object, or a credential
            with no profile to write.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                unknownValue:
                  value: { error: "`cosy` is not a value Campus can draw for `credentials_view_density`. It accepts: detailed, compact." }
                unknownKey:
                  value: { error: "`theme` is not a Campus preference, so it was not stored. This profile remembers: credentials_view_density." }

  /registrations:
    post:
      tags: [Registration]
      operationId: createRegistration
      summary: Public sign-up — creates an active member
      description: |
        Public and enumeration-safe: submitting an address that already has an account,
        active or disabled, answers byte-for-byte identically to a fresh registration,
        creates nothing, and never touches the existing row — especially not its password.
        The account this creates is active immediately: `POST /session` accepts it with no
        administrator in the loop. An administrator can still disable any account —
        auto-activated or not — from `PATCH /admin/users/{id}`, and a disabled account is
        refused at `POST /session` until re-enabled.

        Intake is capped at `registration_daily_limit` accounts per calendar day
        (`GET /settings`) — now the primary control on sign-up volume, since no approval
        step stands behind it. An address that already has an account never spends the
        day's quota — it answers `201` regardless. A brand-new address arriving once the
        day is full answers `202` instead: the same enumeration-safety property holds, so
        the same new address overflowing twice answers identically both times.

        While `User.count` is zero — guarded on zero users, not zero admins, so an account
        left behind by a deleted operator keeps this shut — there is no administrator
        anywhere on the island, so the first registration mints an administrator instead of
        an ordinary member (`201 {"status":"first_admin"}`), active either way, and the
        daily cap is not consulted for it. The public serverless deployment refuses this
        window outright (`503`): its founder is
        `CAMPUS_ADMIN_EMAIL`/`CAMPUS_ADMIN_PASSWORD` at bootstrap, verified by
        `TenancyIntegrityContract`, never whoever reaches this endpoint first.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registration]
              properties:
                registration:
                  type: object
                  required: [email_address, password, password_confirmation]
                  properties:
                    email_address: { type: string, format: email }
                    password: { type: string, minLength: 12 }
                    password_confirmation: { type: string }
      responses:
        "201":
          description: |
            Two shapes share this status, distinguished by `status`. Ordinarily the
            address is an active member, whether it was just created or already existed
            (`RegistrationAccepted`). While `User.count` was zero at the moment this
            request was decided, it is instead the island's first account, minted an
            administrator (`RegistrationFirstAdmin`). Neither carries a cookie or a token:
            a registration is not a session. Both carry the same Rails-authored automatic
            `next_action`, which tells a native client to establish the ordinary session
            with the password it still holds in memory.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/RegistrationAccepted" }
                  - { $ref: "#/components/schemas/RegistrationFirstAdmin" }
                # `status` is the switch, not the HTTP code, and saying so here is what
                # makes a client's unknown-status refusal correct rather than paranoid:
                # a shape added to this union later reaches an older client as a status it
                # has never heard of, and the only safe reading of that is "I do not know
                # what happened", never "close enough to registered". Both members of this
                # union share a code; one of them means the caller is now the island's
                # administrator. A reader that inferred the outcome from `201` would get
                # that backwards in exactly the case that matters most.
                discriminator:
                  propertyName: status
                  mapping:
                    registered: "#/components/schemas/RegistrationAccepted"
                    first_admin: "#/components/schemas/RegistrationFirstAdmin"
              examples:
                activeMember:
                  value: { status: registered, message: "Thanks for signing up. Your account is active — sign in whenever you're ready.", next_action: { id: sign_in, mode: automatic, label: "Opening your Island…", request: { method: POST, path: /session } } }
                firstAdmin:
                  value: { status: first_admin, message: "You're the first account on this island, so you're its administrator — there's nobody left to approve you. Sign in whenever you're ready.", next_action: { id: sign_in, mode: automatic, label: "Opening your Island…", request: { method: POST, path: /session } } }
        "202":
          description: |
            The day's registration cap is reached. The address is on the waitlist —
            `source: "registration_overflow"` — rather than a pending member; no `User`
            row was created. Byte-identical for a fresh overflow and a repeat of the same
            address, the same enumeration-safety property `201` carries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationWaitlisted" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /executors:
    get:
      tags: [Account]
      operationId: executorsIndex
      summary: List the signed-in account's registered Macs
      description: |
        Lists only this account's Island-scoped installations. Tokens and token digests are
        never returned. A delegated API token, local administrator token, or agent token is
        not an account and receives `403`.
      responses:
        "200":
          description: Registered Macs, including revoked records for audit and recovery UI.
          content:
            application/json:
              schema:
                type: object
                required: [executors]
                properties:
                  executors:
                    type: array
                    items: { $ref: "#/components/schemas/Executor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountSessionRequired" }
    post:
      tags: [Account]
      operationId: executorsCreate
      summary: Register or re-register this Campus installation
      description: |
        Registers a caller-generated opaque installation UUID under the signed-in account
        and its private Island. The response contains a plaintext executor token exactly
        once; Rails stores only its SHA-256 digest. Re-registering the same installation
        preserves its public id, rotates the token, and revokes the old token atomically.
        An account may hold at most five active registered Macs; token rotation for an
        existing active installation remains available at the cap, and disconnecting one
        makes room for a replacement.

        The token is not a general Campus credential. It is accepted only by the versioned
        executor protocol endpoints and cannot read credentials, settings, projects, tasks,
        or any other Island.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [executor]
              properties:
                executor:
                  $ref: "#/components/schemas/ExecutorRegistration"
      responses:
        "200":
          description: Existing installation re-registered and its token rotated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedExecutor" }
        "201":
          description: New installation registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedExecutor" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountSessionRequired" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /executors/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Server-issued opaque executor UUID.
        schema: { type: string, format: uuid }
    patch:
      tags: [Account]
      operationId: executorsUpdate
      summary: Rename one of the signed-in account's Macs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [executor]
              properties:
                executor:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "200":
          description: Renamed without rotating its executor token.
          content:
            application/json:
              schema:
                type: object
                required: [executor]
                properties:
                  executor: { $ref: "#/components/schemas/Executor" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [Account]
      operationId: executorsDestroy
      summary: Revoke one of the signed-in account's Macs
      description: Clears its token digest immediately while retaining the record for audit.
      responses:
        "204": { description: Executor revoked; its bearer token is permanently invalid. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: |
            The founder window is closed here: on the public serverless deployment, the
            first account is set by the deployment's own bootstrap
            (`CAMPUS_ADMIN_EMAIL`/`CAMPUS_ADMIN_PASSWORD`, verified by
            `TenancyIntegrityContract`), never by whoever reaches this endpoint first. Only
            reachable while `User.count` is zero; once the founder exists, registration
            behaves identically to any other deployment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                serverlessFounder:
                  value: { error: "This deployment's first administrator is set by CAMPUS_ADMIN_EMAIL and CAMPUS_ADMIN_PASSWORD at bootstrap, not by whoever reaches this endpoint first. Registration opens once that account exists." }
        "429":
          description: |
            Too many requests. As with sign-in and the waitlist, this endpoint keeps its
            own stricter per-address limiter in front of the API-wide anonymous ceiling,
            and that one carries no `Retry-After`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                registrationLimit: { value: { error: "too many registration attempts; try again shortly" } }

  /executors/{executor_id}/project_bindings/{project_id}:
    parameters:
      - { name: executor_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: project_id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Executors]
      operationId: executorProjectBindingsShow
      summary: Read Rails-authored local Project readiness for one Mac
      responses:
        "200": { description: Binding or an explicit not-bound readiness, content: { application/json: { schema: { $ref: "#/components/schemas/ExecutorProjectBindingEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Executors]
      operationId: executorProjectBindingsUpdate
      summary: Report this Mac's versioned filesystem and Git observation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [binding]
              properties:
                binding:
                  type: object
                  required: [local_path, observation]
                  properties:
                    local_path: { type: string, maxLength: 4096 }
                    observation: { $ref: "#/components/schemas/ProjectObservation" }
      responses:
        "200": { description: Normalized binding and readiness, content: { application/json: { schema: { $ref: "#/components/schemas/ExecutorProjectBindingEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /executors/{executor_id}/credential_bindings/{credential_id}:
    parameters:
      - { name: executor_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: credential_id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Executors]
      operationId: executorCredentialBindingsShow
      summary: Read broker-authored setup and normalized credential readiness for one Mac
      responses:
        "200": { description: Binding, broker plan, and readiness, content: { application/json: { schema: { $ref: "#/components/schemas/ExecutorCredentialBindingEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Executors]
      operationId: executorCredentialBindingsUpdate
      summary: Report a normalized broker verification observation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [binding]
              properties:
                binding:
                  type: object
                  required: [observation]
                  properties:
                    observation: { $ref: "#/components/schemas/CredentialObservation" }
      responses:
        "200": { description: Rails verdict; provider output is never treated as the verdict, content: { application/json: { schema: { $ref: "#/components/schemas/ExecutorCredentialBindingEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /execution_readiness:
    get:
      tags: [Executors]
      operationId: executionReadinessShow
      summary: Ask Rails whether one Office may run on one registered Mac
      description: Requires the account's own browser or native session. Delegated API,
        local administrator, agent, and executor credentials cannot control an Office.
      parameters:
        - { name: agent_id, in: query, required: true, schema: { type: integer } }
        - { name: executor_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Authoritative verdict and exact available actions.
          content:
            application/json:
              schema:
                type: object
                required: [readiness]
                properties:
                  readiness: { $ref: "#/components/schemas/ExecutionReadiness" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountSessionRequired" }

  /execution_requests:
    post:
      tags: [Executors]
      operationId: executionRequestsCreate
      summary: Queue an Office run for an explicitly selected eligible Mac
      description: Requires the account's own browser or native session. A retry action
        carries the original prompt verbatim so retrying cannot silently change the work.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [execution_request]
              properties:
                execution_request:
                  type: object
                  required: [agent_id, executor_id]
                  properties:
                    agent_id: { type: integer }
                    executor_id: { type: string, format: uuid }
                    prompt: { type: string }
      responses:
        "201":
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                required: [execution_request, readiness]
                properties:
                  execution_request: { $ref: "#/components/schemas/ExecutionRequest" }
                  readiness: { $ref: "#/components/schemas/ExecutionReadiness" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountSessionRequired" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /execution_requests/current:
    get:
      tags: [Executors]
      operationId: executionRequestsCurrent
      summary: Rehydrate the current live Office for one agent and registered Mac
      description: |
        Requires the account's own browser or native session. Returns the same status
        envelope as `GET /execution_requests/{id}` when queued, leased, running, or stopping
        work exists. Ordinary absence is an explicit successful envelope with
        `execution_request: null`, an empty attempts list, and an empty version-1 transcript.
      parameters:
        - { name: agent_id, in: query, required: true, schema: { type: integer } }
        - { name: executor_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Current live execution, or an explicit empty envelope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentExecutionStatus" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountSessionRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  /execution_requests/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Executors]
      operationId: executionRequestsShow
      summary: Read one Island-scoped execution and all of its attempts
      description: Requires the account's own browser or native session.
      responses:
        "200":
          description: Execution state.
          content:
            application/json:
              schema:
                type: object
                required: [execution_request, attempts, transcript]
                properties:
                  execution_request: { $ref: "#/components/schemas/ExecutionRequest" }
                  attempts:
                    type: array
                    items: { $ref: "#/components/schemas/ExecutionAttempt" }
                  transcript: { $ref: "#/components/schemas/ExecutionTranscript" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountSessionRequired" }

  /execution_requests/{id}/cancel:
    post:
      tags: [Executors]
      operationId: executionRequestsCancel
      summary: Request cancellation; the executor acknowledges only after ending the process group
      description: Requires the account's own browser or native session.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Cancellation requested or already terminal.
          content:
            application/json:
              schema:
                type: object
                required: [execution_request]
                properties:
                  execution_request: { $ref: "#/components/schemas/ExecutionRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountSessionRequired" }

  /executor/heartbeat:
    post:
      tags: [Executor Protocol]
      operationId: executorHeartbeat
      summary: Authenticate this Mac, publish liveness, and read protocol/kill-switch state
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { executor: { type: object, additionalProperties: true } } }
      responses:
        "200":
          description: Executor state plus authoritative protocol compatibility and claim availability.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [executor, protocol]
                properties:
                  executor: { $ref: "#/components/schemas/Executor" }
                  protocol:
                    type: object
                    additionalProperties: false
                    required: [version, claim_wait_max_seconds, heartbeat_interval_seconds, claims_enabled, compatibility, claim_readiness]
                    properties:
                      version: { type: integer, const: 1 }
                      claim_wait_max_seconds: { type: integer, minimum: 0, maximum: 20 }
                      heartbeat_interval_seconds: { type: integer, minimum: 1 }
                      claims_enabled: { type: boolean }
                      compatibility: { $ref: "#/components/schemas/ExecutionReadiness" }
                      claim_readiness: { $ref: "#/components/schemas/ExecutionReadiness" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /executor/claims:
    post:
      tags: [Executor Protocol]
      operationId: executorClaimsCreate
      summary: Long-poll up to 20 seconds and atomically lease eligible work
      description: |
        No database connection is held while the request sleeps. A 204 is an ordinary empty
        claim. Database-backed admission permits at most one open poll per executor and six
        across the fleet, including across Lambda workers; a capacity refusal is 429 and does
        not consume or alter queued work.
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { wait_seconds: { type: integer, minimum: 0, maximum: 20 } } }
      responses:
        "200": { description: Minimum authorized run envelope; provider secret is absent, content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionClaim" } } } }
        "204": { description: No eligible work before the poll deadline. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: Claims kill switch is closed, headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { type: object, additionalProperties: true } } } }

  /executor/attempts/{id}/start:
    post:
      tags: [Executor Protocol]
      operationId: executorAttemptsStart
      summary: Idempotently confirm the broker child started before the lease expired
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Running attempt plus Rails deadlines and cancellation state, content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionAttemptEnvelope" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /executor/attempts/{id}/credential:
    get:
      tags: [Executor Protocol]
      operationId: executorAttemptsCredential
      summary: Deliver only this live attempt's credential material with no-store caching
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Explicit broker injection kind; a secret is present only for API keys, content: { application/json: { schema: { $ref: "#/components/schemas/AttemptCredential" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /executor/attempts/{id}/heartbeat:
    post:
      tags: [Executor Protocol]
      operationId: executorAttemptsHeartbeat
      summary: Renew the Rails-authored lease/deadline and read cancellation state
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Renewed attempt, content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionAttemptEnvelope" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /executor/attempts/{id}/events:
    post:
      tags: [Executor Protocol]
      operationId: executorAttemptsEvents
      summary: Append up to 100 idempotent transcript events starting at sequence zero
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [first_sequence, events]
              properties:
                first_sequence: { type: integer, minimum: 0 }
                events: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/ExecutionEvent" } }
      responses:
        "200": { description: Accepted range; gaps remain explicitly visible, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /executor/attempts/{id}/refusal:
    post:
      tags: [Executor Protocol]
      operationId: executorAttemptsRefusal
      summary: Record a deterministic broker refusal before start without requeueing
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refusal]
              properties:
                refusal:
                  type: object
                  required: [reason]
                  properties:
                    reason: { type: string }
                    detail: { type: [string, "null"] }
      responses:
        "200": { description: Idempotently failed attempt, content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionAttemptEnvelope" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /executor/attempts/{id}/cancellation_ack:
    post:
      tags: [Executor Protocol]
      operationId: executorAttemptsCancellationAck
      summary: Acknowledge cancellation after the process group ended or report why it could not
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cancellation]
              properties:
                cancellation:
                  type: object
                  required: [stopped]
                  properties:
                    stopped: { type: boolean }
                    reason: { type: string }
                    detail: { type: [string, "null"] }
      responses:
        "200": { description: Cancelled when stopped; lost when the child could not be proven ended, content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionAttemptEnvelope" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /executor/attempts/{id}/result:
    post:
      tags: [Executor Protocol]
      operationId: executorAttemptsResult
      summary: Idempotently record normalized completion or failure after start
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result:
                  type: object
                  required: [state]
                  properties:
                    state: { type: string, enum: [completed, failed] }
                    reason: { type: string }
                    detail: { type: [string, "null"] }
      responses:
        "200": { description: Terminal attempt, content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionAttemptEnvelope" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /waitlist_entries:
    post:
      tags: [Waitlist]
      operationId: createWaitlistEntry
      summary: Join the Campus early-access waitlist
      description: |
        Public and idempotent. Repeating an address returns the same response without
        revealing whether it was already present. The accepted set is one persisted row per
        stripped, lowercased email; a unique database index enforces the case-insensitive
        identity. Campus does not infer provider aliases or source/bot quality. Joining never
        creates a user account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [waitlist_entry]
              properties:
                waitlist_entry:
                  type: object
                  required: [email_address]
                  properties:
                    email_address: { type: string, format: email }
                    source: { type: string, maxLength: 50, default: marketing }
      responses:
        "202":
          description: The address is on the list, whether it was new or already present.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitlistAccepted" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "422":
          description: The agent declaration or selected execution Project was refused.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/Error" }
                  - { $ref: "#/components/schemas/AgentExecutionRefusal" }
              examples:
                unavailableProject:
                  value:
                    error: This Building has no local Git repository, so a Campus-spawned Office cannot run in it.
                    execution_context:
                      contract_version: 1
                      start_allowed: false
                      reason: local_repository_required
                      message: This Building has no local Git repository, so a Campus-spawned Office cannot run in it.
                      remediation: Configure a local Git repository or land a self-hosted agent.
                      source: home_project
                      project_id: 9
                      project_name: Board only
                      task_id: null
                      task_override_rule: task_project_for_next_session
                      task_override_message: A current task's Project governs the next session.
        "429":
          description: |
            Too many requests. As with sign-in, this endpoint keeps its own stricter
            per-address limiter in front of the API-wide anonymous ceiling, and that one
            carries no `Retry-After`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                waitlistLimit: { value: { error: "too many requests; try again shortly" } }

  /download_requests:
    post:
      tags: [Waitlist]
      operationId: createDownloadRequest
      summary: Ask for the Campus Mac build
      description: |
        Public, and deliberately NOT idempotent — which is the one thing worth reading before
        integrating against it.

        `POST /waitlist_entries` next door maintains a SET: an address is on the waitlist or it
        is not, so joining twice is one fact and the second request changes nothing. This
        maintains a LOG: asking for the build twice is two facts, and the second is the
        interesting one, because coming back is the only evidence of sustained demand there is.
        Every request therefore records a row.

        The reply is byte-identical whether or not the address has been seen before, so this
        endpoint cannot be used to ask Campus who has already downloaded.

        `download_url` is part of the response contract and is `null` today, on purpose. There
        is no published Mac build to link to yet; the day there is, the server starts returning
        a URL in this field and every already-shipped client follows it — no client release, no
        second endpoint. Treat a null as "we will email you" and a string as "go here now".
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [download_request]
              properties:
                download_request:
                  type: object
                  required: [email_address]
                  properties:
                    email_address: { type: string, format: email, maxLength: 254 }
                    platform:
                      type: string
                      maxLength: 50
                      default: macos
                      description: |
                        Which build is being asked for. macOS is the only one today; the field
                        exists so rows recorded now still say which build they were for once
                        there is a second.
      responses:
        "202":
          description: The request was recorded. Whether the address was new is deliberately not said.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadRequestAccepted" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429":
          description: |
            Too many requests. Like sign-in and the waitlist, this endpoint keeps its own
            stricter per-address limiter in front of the API-wide anonymous ceiling, in its own
            bucket — flooding this form cannot spend the sign-in allowance — and that one
            carries no `Retry-After`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                downloadLimit: { value: { error: "too many requests; try again shortly" } }

  /marketing_site:
    get:
      tags: [Marketing]
      operationId: getMarketingSite
      summary: Read the active public marketing configuration
      security: []
      responses:
        "200":
          description: The colors, selected image paths, and editable copy used by the public site.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketingSite" }

  /admin/marketing_site:
    get:
      tags: [Marketing, Administration]
      operationId: getAdminMarketingSite
      summary: Read the marketing configuration and all available presets
      security:
        - cookieAuth: []
      x-required-scope: admin
      responses:
        "200":
          description: The editable site plus theme and image libraries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMarketingSite" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "503": { $ref: "#/components/responses/AdministratorBootstrapRequired" }
    patch: &updateMarketingSite
      tags: [Marketing, Administration]
      operationId: updateAdminMarketingSite
      summary: Publish marketing colors, images, and copy
      description: Requires an administrator session and the current optimistic-lock revision.
      security:
        - cookieAuth: []
      x-required-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [marketing_site]
              properties:
                marketing_site:
                  type: object
                  required: [revision]
                  properties:
                    revision: { type: integer, minimum: 0 }
                    theme_key: { type: string, enum: [campus, pacific, redwood, graphite] }
                    colors: { type: object, additionalProperties: { type: string, pattern: '^#[0-9a-fA-F]{6}$' } }
                    images: { type: object, additionalProperties: { type: string } }
                    copy: { type: object, additionalProperties: { type: string, maxLength: 500 } }
      responses:
        "200":
          description: The published marketing configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMarketingSite" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "409":
          description: Another administrator published first. Includes the latest editable configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketingSiteConflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/AdministratorBootstrapRequired" }
    put:
      <<: *updateMarketingSite
      operationId: replaceAdminMarketingSite

  /admin/users:
    get:
      tags: [Administration]
      operationId: listAdminUsers
      summary: List approved users and their roles
      security:
        - cookieAuth: []
      x-required-scope: admin
      parameters:
        - name: pending
          in: query
          required: false
          description: |
            `true` narrows the roster to accounts awaiting approval — disabled AND
            self-registered (`registered_at` present) — ordered oldest-first, the order a
            queue is answered in. Omit for the general roster, administrators first.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Approved users, with administrators first — or, with `?pending=true`, exactly the sign-ups awaiting approval, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUsers" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "503": { $ref: "#/components/responses/AdministratorBootstrapRequired" }
    post:
      tags: [Administration]
      operationId: createAdminUser
      summary: Create an approved member or administrator
      security:
        - cookieAuth: []
      x-required-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user]
              properties:
                user:
                  type: object
                  required: [email_address, password]
                  properties:
                    email_address: { type: string, format: email }
                    password: { type: string, format: password, minLength: 12 }
                    role: { type: string, enum: [member, admin], default: member }
      responses:
        "201":
          description: The approved user was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/AdministratorBootstrapRequired" }

  /admin/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch: &updateAdminUser
      tags: [Administration]
      operationId: updateAdminUser
      summary: Change a user's email, password, role, or access status
      security:
        - cookieAuth: []
      x-required-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user]
              properties:
                user:
                  type: object
                  properties:
                    email_address: { type: string, format: email }
                    password: { type: string, format: password, minLength: 12 }
                    role: { type: string, enum: [member, admin] }
                    disabled: { type: boolean }
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/AdministratorBootstrapRequired" }
    put:
      <<: *updateAdminUser
      operationId: replaceAdminUser
    delete:
      tags: [Administration]
      operationId: deleteAdminUser
      summary: Delete an account outright
      description: |
        Removing an account, as opposed to disabling one — which is what most requests that
        arrive here should have been, and what two of the four refusals say.

        The destroyed account is echoed back so the client can confirm what it removed. Its
        `user_sessions` go with it, so every browser it was signed in on stops working in the
        same transaction. Its island does NOT: an island is the person's projects and tasks
        rather than the account's, so it goes ownerless and claimable.

        Four refusals, each a 422 with the sentence a person is shown, checked in this order:

        | Condition | Message |
        |---|---|
        | Deleting your own account | `you cannot delete your own account` |
        | The last active administrator | `Campus must keep one active administrator` |
        | The account has administrator activity on record | `<email> has administrator activity on record and cannot be deleted. Disable the account instead — the audit trail must stay attributable.` |
        | The account has archived or restored administrator records | `<email> has archived or restored administrator records and cannot be deleted. Disable the account instead — the dismissal log is evidence and must stay attributable.` |

        The third and fourth are not workarounds for a foreign key — they are the rules those
        foreign keys encode, said out loud and BEFORE anything is written. Rescuing the
        constraint instead would mean the 500 already happened, a `user.deleted` audit row had
        already been written and rolled back with it, and a deliberate rule was reported as a
        server fault. An audit trail whose actors can be deleted is not an audit trail.

        The fourth is a SEPARATE refusal rather than a wider reading of the third because it is
        separately reachable. Archiving is deliberately never written to the activity log, so
        an administrator whose only administrator action was hiding and restoring rows has no
        `admin_audit_events` at all: the third refusal is silent for them, and without the
        fourth the account would be deletable and would take the record of exactly what it hid
        away with it. The evidence lives in the `dismissal_events` log, append-only through the
        application rather than by a database constraint, as
        `POST /admin/audit_events/{id}/dismiss` sets out, whose actor restricts on delete for
        the same reason the audit trail's does.

        Audited as `user.deleted`, recorded before the destroy in the same transaction. The
        account is looked up INSIDE that transaction and under a row lock, so two administrators
        deleting the same account at the same moment produce one deletion, one audit row, and a
        404 for the request that lost — never two receipts for one removal.
      security:
        - cookieAuth: []
      x-required-scope: admin
      responses:
        "200":
          description: The account that was deleted.
