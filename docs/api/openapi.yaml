    AnalyticsFunnelSnapshot:
      type: object
      additionalProperties: false
      required: [waitlist_registration, credential_connected]
      properties:
        waitlist_registration: { $ref: "#/components/schemas/AnalyticsWaitlistRegistration" }
        credential_connected: { $ref: "#/components/schemas/AnalyticsCredentialConnected" }

    AnalyticsFunnel:
      type: object
      additionalProperties: false
      required:
        - contract_version
        - availability
        - availability_message
        - environments
        - source_environment
        - contributing_environments
        - unavailable_environments
        - generated_at
        - snapshot
        - weeks
      properties:
        contract_version: { type: integer, const: 1 }
        availability:
          type: string
          enum: [available, unavailable]
          description: >-
            Available when source_environment contributed the live facts. For a mixed request,
            contributing_environments and unavailable_environments disclose exact coverage.
        availability_message: { type: [string, "null"] }
        environments:
          type: array
          minItems: 1
          items: { type: string, enum: [local, production] }
        source_environment: { type: [string, "null"], enum: [local, production, null] }
        contributing_environments:
          description: Requested deployments whose source-table facts contributed to every returned metric.
          type: array
          uniqueItems: true
          items: { type: string, enum: [local, production] }
        unavailable_environments:
          description: Requested deployments whose source-table facts this deployment cannot read.
          type: array
          uniqueItems: true
          items: { type: string, enum: [local, production] }
        generated_at: { type: string, format: date-time }
        snapshot:
          oneOf:
            - { $ref: "#/components/schemas/AnalyticsFunnelSnapshot" }
            - { type: "null" }
        weeks:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/AnalyticsFunnelWeek" }
      oneOf:
        - properties:
            availability: { const: available }
            availability_message: { type: "null" }
            source_environment: { type: string, enum: [local, production] }
            contributing_environments: { minItems: 1, maxItems: 1 }
            unavailable_environments: { maxItems: 0 }
            snapshot: { $ref: "#/components/schemas/AnalyticsFunnelSnapshot" }
            weeks: { minItems: 12, maxItems: 12 }
        - properties:
            availability: { const: available }
            availability_message: { type: string, minLength: 1 }
            source_environment: { type: string, enum: [local, production] }
            contributing_environments: { minItems: 1, maxItems: 1 }
            unavailable_environments: { minItems: 1 }
            snapshot: { $ref: "#/components/schemas/AnalyticsFunnelSnapshot" }
            weeks: { minItems: 12, maxItems: 12 }
        - properties:
            availability: { const: unavailable }
            availability_message: { type: string, minLength: 1 }
            source_environment: { type: "null" }
            contributing_environments: { maxItems: 0 }
            unavailable_environments: { minItems: 1 }
            snapshot: { type: "null" }
            weeks: { maxItems: 0 }

    AnalyticsEngagement:
      type: object
      additionalProperties: false
      required: [contract_version, availability, availability_message, environments,
                 source_environment, generated_at, screen_catalog, feature_catalog, weeks]
      properties:
        contract_version: { type: integer, const: 1 }
        availability:
          type: string
          enum: [available, partial, unavailable]
          description: Partial means current-environment raw facts are present but another selected environment is not readable here.
        availability_message: { type: [string, "null"] }
        environments:
          type: array
          minItems: 1
          items: { type: string, enum: [local, production] }
        source_environment: { type: [string, "null"], enum: [local, production, null] }
        generated_at: { type: string, format: date-time }
        screen_catalog:
          type: array
          items: { type: string, enum: [board, buildings, island, agents, inbox, activity, credentials, settings] }
        feature_catalog:
          type: array
          items: { type: string, enum: [activity_ask, draft_chat, council, crons, skills, passes] }
        weeks:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/AnalyticsEngagementWeek" }
      oneOf:
        - properties:
            availability: { const: available }
            availability_message: { type: "null" }
            source_environment: { type: string, enum: [local, production] }
            weeks: { minItems: 12, maxItems: 12 }
        - properties:
            availability: { const: partial }
            availability_message: { type: string, minLength: 1 }
            source_environment: { type: string, enum: [local, production] }
            weeks: { minItems: 12, maxItems: 12 }
        - properties:
            availability: { const: unavailable }
            availability_message: { type: string, minLength: 1 }
            source_environment: { type: "null" }
            weeks: { maxItems: 0 }

    AnalyticsEngagementWeek:
      type: object
      additionalProperties: false
      required: [week_start, app_sessions, screen_reach, supervision, feature_adoption,
                 feedback_submitted, cost_attribution]
      properties:
        week_start: { type: string, format: date }
        app_sessions:
          type: object
          additionalProperties: false
          required: [app_opens, opening_islands, distinct_sessions, app_opens_per_opening_island,
                     closed_sessions, unterminated_sessions, median_duration_ms]
          properties:
            app_opens: { type: integer, minimum: 0 }
            opening_islands:
              type: integer
              minimum: 0
              description: Islands that emitted at least one app.opened event in this week.
            distinct_sessions: { type: integer, minimum: 0 }
            app_opens_per_opening_island: { type: [number, "null"], minimum: 0 }
            closed_sessions: { type: integer, minimum: 0 }
            unterminated_sessions: { type: integer, minimum: 0 }
            median_duration_ms: { type: [integer, "null"], minimum: 0 }
        screen_reach:
          type: object
          required: [board, buildings, island, agents, inbox, activity, credentials, settings]
          additionalProperties: false
          properties:
            board: { $ref: "#/components/schemas/AnalyticsScreenReach" }
            buildings: { $ref: "#/components/schemas/AnalyticsScreenReach" }
            island: { $ref: "#/components/schemas/AnalyticsScreenReach" }
            agents: { $ref: "#/components/schemas/AnalyticsScreenReach" }
            inbox: { $ref: "#/components/schemas/AnalyticsScreenReach" }
            activity: { $ref: "#/components/schemas/AnalyticsScreenReach" }
            credentials: { $ref: "#/components/schemas/AnalyticsScreenReach" }
            settings: { $ref: "#/components/schemas/AnalyticsScreenReach" }
        supervision:
          type: object
          additionalProperties: false
          required: [blocked_entries, resolved, unresolved, median_ms]
          properties:
            blocked_entries: { type: integer, minimum: 0 }
            resolved: { type: integer, minimum: 0 }
            unresolved: { type: integer, minimum: 0 }
            median_ms: { type: [integer, "null"], minimum: 0 }
        feature_adoption:
          type: object
          additionalProperties: false
          required: [activity_ask, draft_chat, council, crons, skills, passes]
          properties:
            activity_ask: { type: integer, minimum: 0 }
            draft_chat: { type: integer, minimum: 0 }
            council: { type: integer, minimum: 0 }
            crons: { type: integer, minimum: 0 }
            skills: { type: integer, minimum: 0 }
            passes: { type: integer, minimum: 0 }
        feedback_submitted: { type: integer, minimum: 0 }
        cost_attribution:
          type: object
          additionalProperties: false
          required: [status, message, shipped_tasks, tasks_with_linked_sessions, linked_sessions,
                     sessions_with_reported_usage, task_linkage_rate, session_usage_rate,
                     reported_cost_usd, nominal_token_cost_usd, known_comparable_cost_usd,
                     known_comparable_cost_per_shipped_task_usd, cost_per_shipped_task_usd]
          properties:
            status: { type: string, enum: [partial, unavailable] }
            message: { type: string }
            shipped_tasks: { type: integer, minimum: 0 }
            tasks_with_linked_sessions: { type: integer, minimum: 0 }
            linked_sessions: { type: integer, minimum: 0 }
            sessions_with_reported_usage:
              type: integer
              minimum: 0
              description: Linked sessions with nonnegative reported money or an explicit token counter; duration-only reports are excluded.
            task_linkage_rate: { $ref: "#/components/schemas/AnalyticsRate" }
            session_usage_rate: { $ref: "#/components/schemas/AnalyticsRate" }
            reported_cost_usd:
              type: [number, "null"]
              minimum: 0
              description: >-
                Sum of explicit nonnegative monetary reports. For a partial row, numeric zero
                means no comparable session contributed to this component; null means the whole
                cost row is unavailable.
            nominal_token_cost_usd:
              type: [number, "null"]
              minimum: 0
              description: >-
                Nominal sum for sessions with explicit token evidence and no monetary report.
                For a partial row, numeric zero means no comparable session contributed to this
                component; null means the whole cost row is unavailable.
            known_comparable_cost_usd:
              type: [number, "null"]
              minimum: 0
              description: >-
                Null when no linked session has comparable money/token evidence; an explicit
                zero report is numeric zero.
            known_comparable_cost_per_shipped_task_usd:
              type: "null"
              description: Withheld until every shipped task has complete comparable cost evidence.
            cost_per_shipped_task_usd:
              type: "null"
              description: Always null until every shipped task has authoritative session cost attribution.

    AnalyticsScreenReach:
      type: object
      additionalProperties: false
      required: [sessions, rate]
      properties:
        sessions: { type: integer, minimum: 0 }
        rate: { $ref: "#/components/schemas/AnalyticsRate" }

