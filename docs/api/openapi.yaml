      summary: One coherent snapshot of every operator-facing analytics tier
      description: |
        Returns the summary, funnel, and engagement contracts from one PostgreSQL
        REPEATABLE READ transaction. The server captures one UTC calendar date and one
        generation timestamp for the request, and repeats the snapshot's environment set
        and timestamp in every nested contract. The opaque UUID identifies this response;
        clients must not derive chronology or business meaning from it.

        `environments` is validated once before any analytics query runs. The summary can
        still serve published rows recorded by another deployment. Funnel and engagement
        source-table facts remain explicitly unavailable when the selected set excludes the
        current deployment; the aggregate never turns that unavailable state into zeroes.
        The three existing analytics endpoints remain available for compatible clients.
      security:
        - cookieAuth: []
      x-required-scope: admin
      parameters:
        - name: environments[]
          in: query
          required: false
          description: Recording deployments requested. Defaults to all; an explicit empty list is refused.
          schema:
            type: array
            minItems: 1
            items: { type: string, enum: [local, production] }
      responses:
        "200":
          description: All analytics tiers from one identified database snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsDashboard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/AdministratorBootstrapRequired" }

  /admin/analytics/summary:
    get:
      tags: [Administration]
      operationId: adminAnalyticsSummary
      summary: The Tier 0 heartbeat across every island, twelve trailing weeks
      description: |
        Agent-shipped tasks, weekly active islands, and activation per registration
        cohort — the only deliberately cross-island read surface Campus has. Every
        number is distinct-per-week, cached or live: the cache stores weekly rows
        computed by the same queries the live path runs.

        `environments` filters by RECORDING DEPLOYMENT, not per-fact provenance — the
        source facts (activity events, sessions, credentials, users) deliberately carry
        no environment column. Live numbers are facts computed from this database and
        join the response only when the filter includes this deployment's own identity;
        cached rows are served under the identity of whichever deployment wrote them.
        Consequence, documented rather than hidden: in a database restored from another
        deployment's copy, the same underlying history can appear once as live-current
        and once as cached-foreign when both environments are requested — the filter
        separates recorders, and cannot separate what a copy made identical. Activation
        is null for cohorts younger than their 7-day window — never a fake zero. See
        ANALYTICS_PRD.md for the definitions.
      security:
        - cookieAuth: []
      x-required-scope: admin
      parameters:
