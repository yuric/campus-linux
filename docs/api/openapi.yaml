                ownAccount: { value: { error: you cannot delete your own account } }
                lastAdministrator: { value: { error: Campus must keep one active administrator } }
                hasActivity:
                  value:
                    error: >-
                      operator@example.com has administrator activity on record and cannot be
                      deleted. Disable the account instead — the audit trail must stay
                      attributable.
                hasDismissals:
