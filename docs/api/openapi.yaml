        generated_at: { type: string, format: date-time }
        registrations:
          type: object
          additionalProperties: false
          required: [weeks]
          properties:
            weeks:
              type: array
              minItems: 12
              maxItems: 12
              items:
                type: object
                additionalProperties: false
                required: [week_start, count]
                properties:
                  week_start: { type: string, format: date }
                  count: { type: integer, minimum: 0 }
        waitlist_registration: { $ref: "#/components/schemas/AnalyticsWaitlistRegistration" }

    AdminAuditLog:
      type: object
      additionalProperties: false
      required: [audit_events, pagination]
      properties:
        audit_events:
          type: array
          items: { $ref: "#/components/schemas/AdminAuditEvent" }
        pagination: { $ref: "#/components/schemas/AdminAuditPagination" }

    AdminAuditPagination:
      type: object
      additionalProperties: false
      required: [before_id, next_before_id, per_page]
      properties:
        before_id: { type: [integer, "null"], minimum: 1 }
        next_before_id: { type: [integer, "null"], minimum: 1 }
        per_page: { type: integer, minimum: 1, maximum: 200 }

    DownloadRequestAccepted:
      type: object
      additionalProperties: false
      required: [message, download_url, release, email]
      properties:
        message:
          type: string
          description: |
            Server-authored, and the only sentence a client shows. It is composed from what is
            actually true — whether a build is published, and whether this deployment can send
            mail — so a client must render it verbatim and must never compose its own from the
            other fields. This endpoint used to answer "Thanks — we'll email your download
            link" unconditionally, from an API with no mail transport; that string is gone.
          example: "Your Campus download is ready — the link is below, and a copy is on its way to your inbox."
        download_url:
          type: [string, "null"]
          format: uri
          description: |
            The current published build for the platform that was asked for, or null when
            there is none that Campus may serve. Only a release whose manifest reports it as
            really signed and really notarized is ever named here.

            A client treats a string as "go here now" and null as "there is nothing to
            download yet" — it must not infer that an email is coming, which is what `email`
            below answers.
        release:
          oneOf:
            - { $ref: "#/components/schemas/PublicMacRelease" }
            - { type: "null" }
          description: What is on the other end of `download_url`, or null when there is none.
        email: { $ref: "#/components/schemas/DownloadEmailStatus" }

    DownloadEmailStatus:
      type: object
      additionalProperties: false
      required: [status, reason]
      description: |
        Whether Campus is sending a copy of the link by email, decided by the server and
        never inferred by a client. Campus does not promise an email it cannot send: the copy
        is delivered by a background job through a configured mail transport, and a
        deployment with neither says so here rather than staying silent.
      properties:
        status:
          type: string
          enum: [queued, not_sent]
        reason:
          type: [string, "null"]
          enum: [no_release, delivery_unavailable, null]
          description: |
            Null exactly when `status` is `queued`.

            `no_release` — there is no published build for that platform, so there is nothing
            to send. `delivery_unavailable` — there is a build and the link is in
            `download_url`, but this deployment cannot deliver mail right now. The precise
            server-side cause is deliberately not published here: a stranger submitting a
            public form can act on none of them, and naming them would describe this
            deployment's configuration to anybody who can reach the endpoint.

    PublicMacRelease:
      type: object
      additionalProperties: false
      required: [platform, channel, version, build, sha256, size_bytes, minimum_macos, architectures, published_at]
      description: |
        The published build a download link points at, as `deploy/mac-app.sh` measured it.
        `sha256` is read back out of the signed artifact rather than asserted, so a client may
        show it and a careful person may verify the bytes they received.
      properties:
        platform: { type: string, example: macos }
        channel: { type: string, example: developer-id }
        version: { type: string, example: "0.25.119.3" }
        build: { type: string, example: "4211" }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        size_bytes: { type: integer, minimum: 1 }
        minimum_macos: { type: [string, "null"], example: "14.0" }
        architectures:
          type: array
          items: { type: string }
          example: [arm64, x86_64]
        published_at: { type: string, format: date-time }

    AdminMacRelease:
      type: object
      additionalProperties: false
      required:
        [id, platform, channel, product_channel, version, build, revision, url, sha256,
         size_bytes, minimum_macos, architectures, signed, notarized, signing_authority,
         distributable, current, built_at, published_at, published_by]
      properties:
        id: { type: integer }
        platform: { type: string, enum: [macos] }
        channel: { type: string, enum: [developer-id, app-store] }
        product_channel: { type: string, enum: [dev, production] }
        version: { type: string }
        build: { type: string }
        revision: { type: string, pattern: "^[0-9a-f]{40}$" }
        url: { type: string, format: uri }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        size_bytes: { type: integer }
        minimum_macos: { type: [string, "null"] }
        architectures: { type: array, items: { type: string } }
        signed: { type: boolean }
        notarized: { type: boolean }
        signing_authority: { type: [string, "null"] }
        distributable:
          type: boolean
          description: |
            Server-derived, never taken from the request: true only for a `developer-id`
            build that is both signed and notarized. An `app-store` package is always false —
            it is uploaded for review, not downloaded, and notarytool rejects an Apple
            Distribution signature outright.
        current:
          type: boolean
          description: |
            Whether this is the release the public download serves. At most one release per
            platform, channel and product channel is current, and a release that is not
            distributable can never be.
        built_at: { type: [string, "null"], format: date-time }
        published_at: { type: string, format: date-time }
        published_by:
          oneOf:
            - { $ref: "#/components/schemas/User" }
            - { type: "null" }

    AdminMacReleases:
      type: object
      additionalProperties: false
      required: [mac_releases]
      properties:
        mac_releases:
          type: array
          items: { $ref: "#/components/schemas/AdminMacRelease" }

    AdminMacReleaseEnvelope:
      type: object
      additionalProperties: false
      required: [mac_release]
      properties:
        mac_release: { $ref: "#/components/schemas/AdminMacRelease" }

    RequestLocationContract:
      type: object
      additionalProperties: false
      required: [country, region, city, source]
      description: |
        Where a public request came from, and — today, always — an honest statement that Campus
        cannot tell. There is no IP geolocation here: the public API is API Gateway in front of
        Lambda, with no CDN or load balancer in the path, so no viewer-geolocation header ever
        reaches Rails.

        `source` is the server-authored reason code that makes the empty case honest rather
        than ambiguous. A client renders "Unknown" because Campus said `unavailable`; it must
        never infer that from three nulls. The fields fill and `source` becomes
        `viewer_headers` with no client change the day a CDN with viewer geolocation sits in
        front of the API AND the deployment asserts that it strips these headers and writes its
        own. Absent that assertion the headers are not read at all: unbacked, they are the
        caller's own text rather than a CDN's finding, and a value a caller chose for itself
        must never reach an administrator's screen as though a distribution had determined it.
      properties:
        country: { type: [string, "null"] }
        region: { type: [string, "null"] }
        city: { type: [string, "null"] }
        source:
          type: string
          enum: [viewer_headers, unavailable]
          description: |
            `viewer_headers` — a CDN this deployment declared trustworthy reported at least one
            of the three fields. `unavailable` — nothing Campus is willing to believe did,
            which is the ordinary answer today. The two ways of not knowing (no intermediary
            spoke, or none was declared so nothing was read) are deliberately one value: they
            mean the same thing to a reader, and a third code would invite a client to render
            what a caller claimed about itself.

    AdminDownloadRequest:
      type: object
      additionalProperties: false
      required: [id, email_address, platform, ip_address, user_agent, location, dismissed_at,
                 dismissed_by, created_at]
      properties:
        id: { type: integer }
        email_address: { type: string, format: email }
        platform: { type: string, example: macos }
        ip_address: { type: [string, "null"] }
        user_agent: { type: [string, "null"] }
        location: { $ref: "#/components/schemas/RequestLocationContract" }
        dismissed_at: { type: [string, "null"], format: date-time }
        dismissed_by:
          oneOf:
            - { $ref: "#/components/schemas/User" }
            - { type: "null" }
        created_at: { type: string, format: date-time }

    AdminDownloadRequests:
      type: object
      additionalProperties: false
      required: [download_requests, pagination]
      properties:
        download_requests:
          type: array
          items: { $ref: "#/components/schemas/AdminDownloadRequest" }
        pagination: { $ref: "#/components/schemas/Pagination" }

    AdminDownloadRequestEnvelope:
      type: object
      additionalProperties: false
      required: [download_request]
      properties:
        download_request: { $ref: "#/components/schemas/AdminDownloadRequest" }

    AdminProfile:
      type: object
      additionalProperties: false
      required: [profile]
      properties:
        profile:
          type: object
          additionalProperties: false
          required: [user]
          properties:
            user: { $ref: "#/components/schemas/AdminUser" }

    AdminProfileUpdate:
      allOf:
        - { $ref: "#/components/schemas/AdminProfile" }
        - type: object
          required: [reauthentication_required]
          properties:
            reauthentication_required:
              type: boolean
              description: |
                Whether this request destroyed the caller's own session. True for a password
                change, false for an address change: Campus revokes every session of an account
                whose password, role or disabled state changes, and deliberately not one whose
                email address changes. Server-authored because the alternative is a client
                reimplementing a server rule and getting it wrong in one of two bad directions
                — stranding an administrator on a dead session, or signing them out of a
                working one.

    HumanSession:
      type: object
      required: [user, authentication, expires_at]
      properties:
        user:
          oneOf:
            - { $ref: "#/components/schemas/User" }
            - { type: "null" }
        authentication: { type: string, enum: [session_cookie, session_token, admin_token] }
        expires_at: { type: [string, "null"], format: date-time }
        token:
          type: string
          description: |
            Present exactly once: in the `201` for a native login (no `Origin` header).
            Send it back as `Authorization: Bearer <token>`. Only its SHA-256 digest is
            stored, it is never reissued, and `GET /session` never repeats it. Browser
            logins never receive it.

    ExecutorRegistration:
      type: object
      additionalProperties: false
      required: [installation_id, name, app_channel, app_version, app_build, protocol_version, capabilities]
      properties:
        installation_id:
          type: string
          format: uuid
          description: Random UUID created and persisted by this product installation; not a hardware identifier.
        name: { type: string, minLength: 1, maxLength: 120 }
        app_channel: { type: string, enum: [production, dev] }
        app_version: { type: string, minLength: 1, maxLength: 40 }
        app_build: { type: string, minLength: 1, maxLength: 40 }
        protocol_version: { type: integer, minimum: 1 }
        capabilities:
          type: object
          additionalProperties: true
          description: Versioned machine observations; Rails derives readiness rather than trusting capability claims directly.

    Executor:
      type: object
      additionalProperties: false
      required: [id, name, app_channel, app_version, app_build, protocol_version, capabilities, state, last_seen_at, heartbeat_at, revoked_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        app_channel: { type: string, enum: [production, dev] }
        app_version: { type: string }
        app_build: { type: string }
        protocol_version: { type: integer, minimum: 1 }
        capabilities: { type: object, additionalProperties: true }
        state: { type: string, enum: [registered, online, offline, revoked] }
        last_seen_at: { type: string, format: date-time }
        heartbeat_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }

    IssuedExecutor:
      type: object
      additionalProperties: false
      required: [executor, token]
      properties:
        executor: { $ref: "#/components/schemas/Executor" }
        token:
          type: string
          minLength: 40
          description: Plaintext executor credential returned only by this registration response; store in the product-scoped Keychain service.

    ExecutionAction:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
        request:
          type: [object, "null"]
          properties:
            method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
            path: { type: string }
            body: { type: object, additionalProperties: true }

    ExecutionReadiness:
      type: object
      additionalProperties: false
      description: |
        Rails-authored execution decision. A queued request is bound to its immutable Project
        and credential snapshot; if the Office selection later changes, Rails closes it with
        `request_selection_changed`. Native-session refusals use
        `native_session_requires_local_login`, `native_session_credential_changed`,
        `native_session_project_changed`, or `native_session_provider_unsupported`; clients
        render the accompanying title/message/actions and do not reconstruct compatibility.
        The first public release also returns
        `provider_execution_requires_approval_boundary` for a Gemini API-key credential. No
        execution request, lease, agent token, or provider secret is issued for that credential
        until enforced workspace, approval, network, and secret-isolation controls have passed
        adversarial tests. A verified local Google CLI subscription is not covered by this gate.
      required: [version, state, reason, severity, title, message, actions]
      properties:
        version: { type: integer, const: 1 }
        state: { type: string, enum: [ready, usable, compatible, unavailable] }
        reason: { type: string }
        severity: { type: string, enum: [info, warning, error] }
        title: { type: string }
        message: { type: string }
        actions: { type: array, items: { $ref: "#/components/schemas/ExecutionAction" } }

    ProjectObservation:
      type: object
      additionalProperties: false
      required: [version, path_exists, path_kind, readable, writable, git_repository, observed_at]
      properties:
        version: { type: integer, const: 1 }
        path_exists: { type: boolean }
        path_kind: { type: string, enum: [directory, file, other] }
        readable: { type: boolean }
        writable: { type: boolean }
        git_repository: { type: boolean }
        origin_url: { type: [string, "null"], maxLength: 2048 }
        head_oid: { type: [string, "null"], maxLength: 128 }
        repository_root: { type: [string, "null"], maxLength: 4096 }
        observed_at: { type: string, format: date-time }

    ExecutorProjectBindingEnvelope:
      type: object
      required: [binding, readiness]
      properties:
        binding: { type: [object, "null"], additionalProperties: true }
        readiness: { $ref: "#/components/schemas/ExecutionReadiness" }

    CredentialObservation:
      type: object
      additionalProperties: false
      required: [version, state, observed_at]
      properties:
        version: { type: integer, const: 1 }
        state: { type: string, enum: [verified, unverified, missing, expired, unavailable] }
        reason: { type: [string, "null"], maxLength: 2048 }
        config_dir:
          type: [string, "null"]
          maxLength: 4096
          description: Required for a CLI subscription or ambient provider login; absent for an API key.
        account_identifier: { type: [string, "null"], maxLength: 320 }
        observed_at: { type: string, format: date-time }

    ExecutorBrokerPlan:
      type: object
      required: [version, engine, config_dir, login, verification]
      properties:
        version: { type: integer, const: 1 }
        engine: { type: [string, "null"], enum: [claude, codex, gemini, agy, grok, null] }
        config_dir: { type: [string, "null"] }
        login:
          type: object
          additionalProperties: true
          description: CLI subscriptions carry a directly forwardable broker login request with an opaque credential_scope; the broker allocates its local directory. Ambient credentials instead describe the provider CLI's existing current login and never request a new broker login.
        verification:
          type: object
          additionalProperties: true
          description: CLI subscriptions and ambient credentials carry matching broker verification requests; Swift does not choose provider commands or paths. Ambient verification is marked explicitly so the broker can allow only the engine's exact default namespace.

    ExecutorCredentialBindingEnvelope:
      type: object
      required: [binding, broker, readiness]
      properties:
        binding: { type: [object, "null"], additionalProperties: true }
        broker: { $ref: "#/components/schemas/ExecutorBrokerPlan" }
        readiness: { $ref: "#/components/schemas/ExecutionReadiness" }

    ExecutionRequest:
      type: object
      required: [id, agent_id, executor_id, project_id, credential_id, state, protocol_version, actions, created_at]
      properties:
        id: { type: string, format: uuid }
        agent_id: { type: integer }
        executor_id: { type: string, format: uuid }
        project_id: { type: integer }
        credential_id: { type: [integer, "null"] }
        state: { type: string, enum: [queued, leased, running, stopping, cancelled, completed, failed, lost] }
        protocol_version: { type: integer, const: 1 }
        cancel_requested_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        reason: { type: [string, "null"], maxLength: 120 }
        detail: { type: [string, "null"], maxLength: 16384 }
        actions: { type: array, items: { $ref: "#/components/schemas/ExecutionAction" } }
        readiness:
          oneOf:
            - { $ref: "#/components/schemas/ExecutionReadiness" }
            - { type: "null" }
        created_at: { type: string, format: date-time }

    CurrentExecutionStatus:
      type: object
      additionalProperties: false
      required: [execution_request, attempts, transcript]
      properties:
        execution_request:
          oneOf:
            - { $ref: "#/components/schemas/ExecutionRequest" }
            - { type: "null" }
        attempts:
          type: array
          items: { $ref: "#/components/schemas/ExecutionAttempt" }
        transcript: { $ref: "#/components/schemas/ExecutionTranscript" }

    ExecutionAttempt:
      type: object
      required: [id, request_id, number, state, next_sequence, gap_detected]
      properties:
        id: { type: string, format: uuid }
        request_id: { type: string, format: uuid }
        number: { type: integer, minimum: 1 }
        state: { type: string, enum: [leased, running, stopping, expired, cancelled, completed, failed, lost] }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        next_sequence: { type: integer, minimum: 0 }
        gap_detected: { type: boolean }
        reason: { type: [string, "null"], maxLength: 120 }
        detail: { type: [string, "null"], maxLength: 16384 }

    ExecutionDeadlines:
      type: object
      required: [lease_expires_at, heartbeat_expires_at, heartbeat_interval_seconds]
      properties:
        lease_expires_at: { type: string, format: date-time }
        heartbeat_expires_at: { type: [string, "null"], format: date-time }
        heartbeat_interval_seconds: { type: integer, minimum: 1 }

    ExecutionCancellation:
      type: object
      required: [state, requested_at, title, message]
      properties:
        state: { type: string, enum: [none, requested] }
        requested_at: { type: [string, "null"], format: date-time }
        title: { type: [string, "null"] }
        message: { type: [string, "null"] }

    ExecutionAttemptEnvelope:
      type: object
      required: [attempt, cancellation, deadlines]
      properties:
        attempt: { $ref: "#/components/schemas/ExecutionAttempt" }
        cancellation: { $ref: "#/components/schemas/ExecutionCancellation" }
        deadlines: { $ref: "#/components/schemas/ExecutionDeadlines" }

    ExecutionClaim:
      type: object
      required: [execution_request, attempt, project, execution, cancellation, deadlines]
      properties:
        execution_request: { $ref: "#/components/schemas/ExecutionRequest" }
        attempt: { $ref: "#/components/schemas/ExecutionAttempt" }
        project: { type: object, additionalProperties: true }
        execution:
          type: object
          required: [protocol_version, compatibility, broker_request, shutdown_result, terminal_delivery, agent_runtime_credential, credential_lease]
          properties:
            protocol_version: { type: integer, const: 1 }
            compatibility: { $ref: "#/components/schemas/ExecutionReadiness" }
            broker_request:
              type: object
              description: |
                Directly forwardable to the channel-scoped local broker; generic env contains
                only CAMPUS_* keys and never a provider secret. Ambient credentials carry
                `ambient_login: true` plus the verified provider-default `config_dir`; the
                broker accepts that flag only for its own exact engine default and never as a
                caller-selected path bypass.
              additionalProperties: true
            shutdown_result:
              type: object
              additionalProperties: false
              required: [state, reason, detail]
              properties:
                state: { type: string, const: failed }
                reason: { type: string, const: executor_shutdown }
                detail: { type: string }
            terminal_delivery:
              type: object
              additionalProperties: false
              description: Rails-authored bounded retry policy for identical terminal payload delivery. Retry only failures where no HTTP response was received; any HTTP response or invalid response ends delivery immediately.
              required: [version, max_attempts, backoff_ms, retry_on, stop_on]
              properties:
                version: { type: integer, const: 1 }
                max_attempts: { type: integer, const: 3 }
                backoff_ms: { type: integer, const: 100 }
                retry_on:
                  type: array
                  prefixItems:
                    - { type: string, const: transport_error }
                    - { type: string, const: timeout }
                  minItems: 2
                  maxItems: 2
                stop_on:
                  type: array
                  prefixItems:
                    - { type: string, const: http_response }
                    - { type: string, const: invalid_response }
                  minItems: 2
                  maxItems: 2
            agent_runtime_credential:
              type: object
              additionalProperties: false
              required: [kind, secret, injection]
              properties:
                kind: { type: string, const: campus_agent_token }
                secret:
                  type: string
                  description: One-run agent bearer delivered only to the authorized executor and broker semantic secret channel; never included in prompt, argv, generic env, logs, or transcript.
                injection:
                  type: object
                  additionalProperties: false
                  required: [kind, name]
                  properties:
                    kind: { type: string, const: fixed_env }
                    name: { type: string, const: CAMPUS_API_TOKEN }
            credential_lease: { type: object, additionalProperties: true }
        cancellation: { $ref: "#/components/schemas/ExecutionCancellation" }
        deadlines: { $ref: "#/components/schemas/ExecutionDeadlines" }

    AttemptCredential:
      type: object
      required: [credential]
      properties:
        credential:
          type: object
          required: [kind, secret, injection]
          properties:
            kind: { type: string, enum: [api_key, cli_subscription, ambient] }
            secret: { type: [string, "null"], description: Returned only for an API key and never in a claim, log, argv, or generic env. }
            injection:
              type: object
              required: [kind, provider]
              properties:
                kind: { type: string, enum: [provider_api_key, local_config] }
                provider: { type: string, enum: [anthropic, openai, google, xai, openrouter, custom] }

    ExecutionEvent:
      type: object
      additionalProperties: false
      required: [sequence, event_id, kind, body, display_body, occurred_at]
      properties:
        sequence: { type: integer, minimum: 0, maximum: 2147483647 }
        event_id: { type: string, maxLength: 120 }
        kind:
          type: string
          enum: [stdout, stderr, status, diagnostic, tool, start, line, end]
          description: Raw broker start/line/end are accepted and normalized by Rails before the transcript is served.
        body:
          type: string
          maxLength: 65536
          description: Immutable raw broker audit record; clients must not render this field.
        display_body:
          type: string
          maxLength: 65536
          description: Rails-authored presentation value with terminal and invisible controls removed.
        occurred_at: { type: string, format: date-time }

    ExecutionTranscript:
      type: object
      additionalProperties: false
      required: [version, attempt_id, next_sequence, gap_detected, presentation, events]
      properties:
        version: { type: integer, const: 1 }
        attempt_id: { type: [string, "null"], format: uuid }
        next_sequence: { type: integer, minimum: 0 }
        gap_detected: { type: boolean }
        presentation:
          type: [object, "null"]
          properties:
            severity: { type: string, enum: [warning] }
            title: { type: string }
            message: { type: string }
        events:
          type: array
          maxItems: 400
          items: { $ref: "#/components/schemas/ExecutionEvent" }

    ProfilePreferences:
      type: object
      description: |
        Every per-person presentation choice Campus remembers. An allowlist: a key that is not
        named here cannot be stored, and neither can a value outside its enum. Adding a key is
        additive and does not move `ProfileEnvelope.version` — an older client ignoring a key
        it does not know is the correct outcome.
      properties:
        credentials_view_density:
          type: string
          enum: [detailed, compact]
          default: detailed
          description: |
            How densely a client draws its saved-credentials inventory. `detailed` shows every
            credential in full; `compact` shows one line each with the detail one click away.
        telemetry:
          type: string
          enum: [on, off]
          default: off
          description: |
            Whether clients may emit content-free product events to their configured Campus
            server. Whoever operates that server receives and stores the events; in a hosted
            deployment that includes the hosting operator. Clients send them nowhere else.
            Capture, local persistence, and delivery require an affirmative `on`; server-
            derived product facts are unaffected.

    ProductEventBatchRequest:
      type: object
      additionalProperties: false
      required: [batch_ulid, events]
      properties:
        batch_ulid: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
        events:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/ProductEventInput" }

    ProductEventInput:
      description: Rails' exact four-name content-free client catalog.
      discriminator:
        propertyName: name
        mapping:
          app.opened: "#/components/schemas/ProductEventAppOpened"
          app.closed: "#/components/schemas/ProductEventAppClosed"
          screen.viewed: "#/components/schemas/ProductEventScreenViewed"
          ui.interaction: "#/components/schemas/ProductEventUIInteraction"
      oneOf:
        - { $ref: "#/components/schemas/ProductEventAppOpened" }
        - { $ref: "#/components/schemas/ProductEventAppClosed" }
        - { $ref: "#/components/schemas/ProductEventScreenViewed" }
        - { $ref: "#/components/schemas/ProductEventUIInteraction" }

    ProductEventAppOpened:
      type: object
      additionalProperties: false
      required: [name, occurred_at, session_ulid, meta]
      properties:
        name: { type: string, const: app.opened }
        occurred_at: { type: string, format: date-time }
        session_ulid: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
        meta: { type: object, additionalProperties: false, maxProperties: 0 }

    ProductEventAppClosed:
      type: object
      additionalProperties: false
      required: [name, occurred_at, session_ulid, meta]
      properties:
        name: { type: string, const: app.closed }
        occurred_at: { type: string, format: date-time }
        session_ulid: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
        duration_ms:
          type: integer
          minimum: 0
          maximum: 86400000
          description: Optional client sanity cross-check; Rails derives session duration.
        meta: { type: object, additionalProperties: false, maxProperties: 0 }

    ProductEventScreenViewed:
      type: object
      additionalProperties: false
      required: [name, occurred_at, session_ulid, meta]
      properties:
        name: { type: string, const: screen.viewed }
        occurred_at: { type: string, format: date-time }
        session_ulid: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
        meta:
          type: object
          additionalProperties: false
          required: [screen]
          properties:
            screen:
              type: string
              enum: [board, buildings, island, agents, inbox, activity, credentials, settings]

    ProductEventUIInteraction:
      type: object
      additionalProperties: false
      required: [name, occurred_at, session_ulid, meta]
      properties:
        name: { type: string, const: ui.interaction }
        occurred_at: { type: string, format: date-time }
        session_ulid: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
        meta:
          type: object
          additionalProperties: false
          required: [screen, control]
          properties:
            screen:
              type: string
              enum: [board, buildings, island, agents, inbox, activity, credentials, settings]
            control:
              type: string
              enum: [open_screen, open_search, new_task, new_project, land_agent, refresh]
              description: Rails-owned coarse vocabulary; arbitrary labels are refused.

    ProductEventBatchResponse:
      type: object
      additionalProperties: false
      required: [contract_version, batch_ulid, replayed, delivery_status, retryable, results]
      properties:
        contract_version: { type: integer, const: 1 }
        batch_ulid: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
        replayed: { type: boolean }
        delivery_status:
          type: string
          const: processed
          description: The batch ULID has a terminal receipt; do not submit it again.
        retryable: { type: boolean, const: false }
        results:
          type: array
          items:
            oneOf:
              - { $ref: "#/components/schemas/ProductEventAcceptedDecision" }
              - { $ref: "#/components/schemas/ProductEventRefusedDecision" }

    ProductEventAcceptedDecision:
      type: object
      additionalProperties: false
      required: [index, status, retryable]
      properties:
        index: { type: integer, minimum: 0, maximum: 99 }
        status: { type: string, const: accepted }
        retryable: { type: boolean, const: false }

    ProductEventRefusedDecision:
      type: object
      additionalProperties: false
      required: [index, status, retryable, reason, message]
      properties:
        index: { type: integer, minimum: 0, maximum: 99 }
        status: { type: string, const: refused }
        retryable:
          type: boolean
          const: false
          description: Every item decision in a processed receipt is terminal.
        reason:
          type: string
          enum: [event_not_object, unknown_event_fields, invalid_event_name,
                 invalid_session_ulid, invalid_occurred_at, occurred_at_out_of_range,
                 invalid_meta, unknown_meta_keys, missing_meta_keys, invalid_screen,
                 invalid_control, invalid_duration, unexpected_duration]
          description: Stable Rails-authored refusal code.
        message:
          type: string
          description: Fixed catalog-safe copy that never incorporates request content.

    ProductEventDeliveryFailure:
      type: object
      additionalProperties: false
      required: [contract_version, delivery_status, retryable, reason, retry_after_seconds, error]
      properties:
        contract_version: { type: integer, const: 1 }
        delivery_status: { type: string, enum: [refused, retry_later] }
        retryable:
          type: boolean
          description: True only when the same batch ULID should be retained and retried.
        reason:
          type: string
          description: Stable machine-readable failure code; clients must not infer it from HTTP status or error prose.
          enum: [unauthorized, humans_only, account_session_required, telemetry_off,
                 batch_ulid_conflict, invalid_batch, request_too_large, rate_limited, storage_quota_exceeded,
                 untrusted_origin]
        retry_after_seconds:
          type: [integer, "null"]
          minimum: 1
          description: Present as an integer only for retryable rate_limited delivery; otherwise null.
        error: { type: string }

    ProfileEnvelope:
      type: object
      required: [profile]
      properties:
        profile:
          type: object
          required: [version, user, persisted, note, telemetry_disclosure,
                     telemetry_capability, preferences]
          properties:
            version:
              type: integer
              example: 1
              description: |
                The shape of this envelope, so a client can tell a field it does not know from
                a Campus that predates the field. Bumped when the envelope changes meaning,
                never when a preference key is added.
            user:
              oneOf:
                - { $ref: "#/components/schemas/User" }
                - { type: "null" }
              description: The account these preferences belong to, or null when no credential owns them.
            persisted:
              type: boolean
              description: |
                Whether the values served here will still be there on the next read. False
                means there is no account row to remember them against — see `note`. Read this
                rather than inferring it from `user` being null.
            note:
              type: [string, "null"]
              description: |
                Server-authored: why these are the defaults and what to do to have a choice
                remembered. Non-null exactly when `persisted` is false. Render it verbatim;
                its absence is not an error condition.
            reason_code:
              type: [string, "null"]
              enum: [admin_account_missing, delegated_credential, null]
              description: |
                The same fact as `note`, named as a stable identifier a client can switch on
                instead of matching English prose. Non-null exactly when `note` is. Additive —
                does not move `version` — so an older client that has never heard of this field
                still has `note` to fall back to.
            telemetry_disclosure:
              type: string
              description: |
                Server-authored privacy disclosure for the telemetry preference. Clients
                render it verbatim. Each app launch requires a fresh account-scoped On
                confirmation before collecting, persisting, or sending events; a cached
                preference from a prior launch is not consent authority.
            telemetry_capability:
              type: object
              required: [state, message]
              description: |
                Rails-authored capability and copy for the client-analytics control. Clients
                render `message` verbatim and allow writes only for `available`. A current
                client talking to an older server may see this additive object absent; that
                mixed-version case is update-required and analytics remains Off.
              properties:
                state:
                  type: string
                  enum: [available, unavailable, update_required]
                message:
                  type: string
            preferences: { $ref: "#/components/schemas/ProfilePreferences" }

    RegistrationAccepted:
      type: object
      required: [status, message, next_action]
      properties:
        status:
          type: string
          const: registered
        message:
          type: string
          description: |
            Server-authored, and identical for every registration, new or duplicate. Never
            names the address and never says whether the account was just created — the
            account is active either way.
          example: "Thanks for signing up. Your account is active — sign in whenever you're ready."
        next_action: { $ref: "#/components/schemas/RegistrationSignInAction" }

    RegistrationFirstAdmin:
      type: object
      required: [status, message, next_action]
      properties:
        status:
          type: string
          const: first_admin
        message:
          type: string
          description: Server-authored. Told once, plainly — there is nobody else on the island to say it to them.
          example: "You're the first account on this island, so you're its administrator — there's nobody left to approve you. Sign in whenever you're ready."
        next_action: { $ref: "#/components/schemas/RegistrationSignInAction" }

    RegistrationSignInAction:
      type: object
      description: |
        Rails-authored next step for an active registration. Native clients may execute it
        immediately using the password still held in memory; registration itself never
        returns a credential and never persists that password in a client.
      required: [id, mode, label, request]
      properties:
        id: { type: string, const: sign_in }
        mode: { type: string, const: automatic }
        label: { type: string, example: "Opening your Island…" }
        request:
          type: object
          required: [method, path]
          properties:
            method: { type: string, const: POST }
            path: { type: string, const: /session }

    RegistrationWaitlisted:
      type: object
      required: [status, message, next_action]
      properties:
        status:
          type: string
          const: waitlisted
        message:
          type: string
          description: |
            Server-authored, and identical for every overflow, new or repeat. Names no
            address and promises no mechanism Campus does not have — only that the day is
            full and when it will not be.
          example: "Campus has reached today's sign-up limit. Your address is on the waitlist — the daily limit resets at midnight."
        next_action:
          type: "null"
          description: There is no executable account action because no User row was created.

    WaitlistAccepted:
      type: object
      required: [message]
      properties:
        message: { type: string, example: "You're on the list." }

    ApiIndex:
      type: object
      description: |
        `GET /`, key for key. The contract test binds this schema to the real response, so a
        key added to `MetaController#index` fails the suite until it is written down here.
      required: [name, version, release, summary, protocol, service_runtime, authentication, unauthenticated, docs, agent_quickstart, routes]
      properties:
        name:
          type: string
          description: Always `Campus API`.
          example: Campus API
        version:
          type: string
          description: Matches `info.version` in this document.
          example: "0.1.0"
        release:
          type: [string, "null"]
          description: |
            The product release this deployment was built from — the repository's `VERSION`
            stamp — as opposed to `version` above, which is this contract's own number.
            `release` moves with every ship; `version` moves only when the contract does.
            This is the number that lets tooling compare a live deployment against `main`.
            `null` when the deployment genuinely does not know its release; a client must
            treat that as unknown, never as `0.0.0` or as the last value it saw.
          example: "0.25.108.1"
        summary:
          type: string
          description: Matches `info.summary` in this document.
        protocol:
          type: object
          description: |
            The dialect, as opposed to `version` (the contract's number) and `release` (the
            deployed build). They move independently on purpose: Campus can ship every week
            without an agent that landed in January having to care, and an agent that *does*
            have to care should learn it from one number rather than by diffing a changelog.
          required: [version, summary]
          properties:
            version:
              type: string
              description: |
                Deliberately a string — `"1"` is a name, not a quantity, and nobody should be
                tempted to compare it with `>`. The same value `POST /agents/land` answers with.
              example: "1"
            summary:
              type: string
              description: |
                What the number covers and what makes it move: only a change that would stop an
                already-working agent working. New optional fields and new endpoints never bump it.
        service_runtime:
          $ref: "#/components/schemas/ServiceRuntimeContract"
        authentication:
          type: object
          description: How to get a token and which routes need one. Never carries a token.
          required: [header, human, agent, unauthenticated]
          properties:
            header:
              type: string
              description: The two authentication envelopes supported by protected routes.
              example: "Humans use the encrypted session cookie; agents and local admins use Authorization: Bearer <token>."
            human:
              type: string
              description: How an approved user logs in, with the local admin fallback.
            agent:
              type: string
              description: That `POST /agents/land` returns the agent token exactly once.
            unauthenticated:
              type: array
              description: The routes that need no token at all.
              items: { type: string }
              example: ["GET /", "GET /up", "POST /registrations", "POST /session", "POST /waitlist_entries"]
        unauthenticated:
          type: array
          description: |
            The same list as `authentication.unauthenticated`, surfaced again at the top
            level: "which routes need no token" is a question about the front door, not
            about authentication mechanics.
          items: { type: string }
          example: ["GET /", "GET /up", "POST /registrations", "POST /session", "POST /waitlist_entries"]
        docs:
          type: object
          description: Where the three things worth reading live.
          required: [openapi, landing_prompt, readme]
          properties:
            openapi: { type: string, description: This document, and what it guarantees. }
            landing_prompt: { type: string, description: "`GET /landing/prompt`, the protocol agents act on." }
            readme: { type: string, description: How to run the server, its databases and its tests. }
        agent_quickstart:
          type: object
          description: |
            The four-step loop in brief. `GET /landing/prompt` is authoritative and the human
            who runs the island can edit it, so `canonical` points there.
          required: [canonical, steps]
          properties:
            canonical: { type: string, example: "GET /landing/prompt" }
            steps:
              type: array
              items: { type: string }
        routes:
          type: array
          description: |
            Every route this API serves, `"<VERB> <path>"`, sorted. Generated from the live
            routing table; framework-internal routes and the catch-all are excluded.
          items: { type: string }
          example: ["GET /", "GET /tasks", "POST /tasks/{id}/claim"]

    BoardSeverity:
      type: string
      enum: [info, warn, urgent]
      description: Sorts the inbox above recency.

    BoardChannel:
      type: object
      description: |
        One split of the inbox. The taxonomy — ids, order, labels, tones — is the
        server's; a client renders the array verbatim and may filter messages by their
        `channel` field, but never computes membership itself. The set may grow
        additively: a client must treat an id it does not know as data, not an error.
      required: [id, label, description, tone, active, unread]
      properties:
        id:
          type: string
          examples: [act_now, questions, reviews, system, notes]
        label: { type: string, description: Display copy, server-authored. }
        description:
          type: string
          description: >-
            One sentence saying what lands in this channel and what makes an item leave
            it — server-authored for the same reason `label` is. The rules it describes
            (urgency outranking kind, derived items clearing themselves, how long an
            agent's note is borrowed) live in `Board`, so a client renders this verbatim
            and never composes its own. A client reading an older server that omits the
            field shows no line rather than inventing one.
          examples:
            - >-
              Things said to you rather than asked of you. An agent's note in its own
              thread is borrowed here while it is fresh and drops off after 7 days; a
              message filed straight to the board has no other home and stays until you
              resolve it. Anything urgent leaves for Act now.
        tone:
          $ref: "#/components/schemas/BoardSeverity"
          description: >-
            Colour hint, deliberately the severity vocabulary — a client colours a channel
            the way it already colours a severity and learns no second palette.
        active: { type: integer, description: Whole-inbox count, like the top-level `active`. }
        unread: { type: integer, description: Whole-inbox count, like the top-level `unread`. }

    BoardChannelSweep:
      type: object
      required: [channel, read, unread]
      properties:
        channel: { type: string }
        read: { type: integer, description: How many messages this sweep marked seen. }
        unread:
          type: integer
          description: The new whole-inbox count, so a client never re-polls just to stop glowing.

    BoardMessage:
      type: object
      description: One item in the human's inbox.
      required:
        [id, kind, severity, channel, title, source, body, task_id, agent_id, project_id,
         from, from_kind, derived, age_seconds, at, read_at, resolved_at]
      properties:
        id:
          type: string
          description: |
            The message key, and the id `POST /board/messages/{id}/read` takes.
            `blocked:42` for a derived message, `board:17` for a stored one.
          examples: ["blocked:42", "board:17"]
        kind:
          type: string
          enum: [blocked, question, agent_error, council, agent_message, credentials_exhausted, resource, direct]
          description: |
            The first six are derived live from a task, a comment, an agent, a council
            verdict, an agent's note, or the island's own credentials — a
            `credentials_exhausted` row is present while every credential of a provider Campus
            can fall back on is resting after a rate limit, and stops being derived the moment
            one recovers. `resource` and `direct` are stored.
        severity: { $ref: "#/components/schemas/BoardSeverity" }
        channel:
          type: string
          examples: [act_now, questions, reviews, system, notes]
          description: >-
            The server-assigned split this message belongs to — one of the ids in the
            inbox's `channels` array, which may grow additively. Urgency outranks kind:
            an urgent message is `act_now` whatever filed it.
        title: { type: [string, "null"], description: Usually the task's title. }
        body:
          type: string
          description: |
            Re-read from the source on every request for a derived message — the current
            `blocked_reason`, the question as asked — so it can never be a stale copy.
        source:
          type: object
          description: What this message is about, so a client can deep-link to it.
          properties:
            kind: { type: string, examples: [task, comment, agent, agent_message, board_message] }
            id: { type: integer }
            blocked_kind: { type: [string, "null"], enum: [needs_input, error, waiting_reset, null] }
            council_verdict: { type: [string, "null"] }
        task_id: { type: [integer, "null"] }
        agent_id: { type: [integer, "null"] }
        project_id: { type: [integer, "null"] }
        from: { type: [string, "null"], description: Who is asking. }
        from_kind: { type: [string, "null"], enum: [human, agent, system, null] }
        derived:
          type: boolean
          description: "`true` when the message is computed from a live source rather than stored."
        age_seconds: { type: integer, description: How long it has been waiting on the human. }
        at: { type: string, format: date-time }
        read_at: { type: [string, "null"], format: date-time }
        resolved_at: { type: [string, "null"], format: date-time }
        board_message_id:
          type: [integer, "null"]
          description: The receipt row's id, present only once a human has read or acknowledged a derived message.

    BoardInbox:
      type: object
      required: [unread, active, urgent, channels, messages, digest, generated_at]
      properties:
        unread:
          type: integer
          description: >-
            What makes the Board Mansion's one window glow. Zero means dark. Counts the
            whole inbox, not the page — `limit` and `unread` narrow `messages` only.
            Saturates at 100, the board's own ceiling.
        active:
          type: integer
          description: >-
            Everything still waiting, read or not, in the whole inbox — unchanged by
            `limit` and `unread`. Same 100 ceiling.
        urgent:
          type: integer
          description: >-
            How many of `active` are urgent. Whole inbox, same 100 ceiling.
        channels:
          type: array
          items: { $ref: "#/components/schemas/BoardChannel" }
          description: >-
            The split taxonomy, always the full set in server order, with whole-inbox
            counts per channel — a one-item page must still say how much sits in every
            split.
        messages:
          type: array
          items: { $ref: "#/components/schemas/BoardMessage" }
        digest:
          description: >-
            The latest day Campus wrote up, carried beside the stream rather than in it.
            Never in `messages`, never in the three counts above, and unable to light the
            window: a summary is information, not a request. `limit` and `unread` shape the
            page and leave this alone.
          $ref: "#/components/schemas/BoardDigest"
        generated_at: { type: string, format: date-time }

    BoardAck:
      type: object
      required: [id, kind, derived, read_at, resolved_at, unread]
      properties:
        id: { type: string }
        kind: { type: string }
        derived: { type: boolean }
        read_at: { type: [string, "null"], format: date-time }
        resolved_at: { type: [string, "null"], format: date-time }
        unread:
          type: integer
          description: The new count, so a client never has to re-poll just to stop glowing.

    SummaryParagraph:
      type: object
      description: >-
        `Summary#as_snapshot` — one day of one project in prose, or the world rollup when
        `project_id` is null. One row per project per day; re-running a day replaces it
        rather than adding to it.
      required:
        [id, project_id, project_name, date, body, stats, source, provider, model,
         generated_at]
      properties:
        id: { type: integer }
        project_id:
          type: [integer, "null"]
          description: Null on the world rollup, which is the day across every building.
        project_name: { type: [string, "null"] }
        date: { type: string, format: date }
        body:
          type: string
          description: >-
            One paragraph of plain prose, flattened out of whatever the model returned and
            capped at 1200 characters.
        stats:
          type: object
          additionalProperties: true
          description: >-
            What actually moved that day — `created`, `claimed`, `completed`, `blocked`,
            `closed`, `staged`, `approved`, `resumed`, `department`, `comments`, and an
            `actors` map of who touched it how often. The world rollup adds
            `projects_touched` and `agents_landed`.
        source:
          type: string
          enum: [model, computed]
          description: >-
            `computed` is the honest line a quiet day gets. A day with nothing on it never
            reaches the model at all, because a model asked to describe nothing invents
            something.
        provider: { type: [string, "null"], examples: [anthropic, openai] }
        model: { type: [string, "null"] }
        generated_at: { type: string, format: date-time }

    BoardDigest:
      type: object
      description: >-
        One day of Campus in prose. Read live from the `summaries` rows on every request, so
        it can never be a stale copy, and it accumulates nothing — a day replaces a day.
      required: [date, world, projects, days]
      properties:
        date:
          type: [string, "null"]
          format: date
          description: >-
            The day these paragraphs are about. Null only on an island where the nightly
            summary has never run.
        world:
          description: The rollup across every building. Null when that day has none.
          oneOf:
            - $ref: "#/components/schemas/SummaryParagraph"
            - type: "null"
        projects:
          type: array
          description: One paragraph per project that existed that day, oldest project first.
          items: { $ref: "#/components/schemas/SummaryParagraph" }
        days:
          type: array
          description: >-
            The days that have a digest, newest first, capped at 30 — the index a client
            walks back through instead of guessing at dates.
          items: { type: string, format: date }

    Stage:
      type: string
      enum: [imaginarium, seashore, in_progress, department, blocked, done, closed]

    BoardLane:
      type: string
      enum: [approval, in_progress, blocked, seashore, imaginarium, done]
      description: |
        API-owned Kanban lane. `approval` is a reviewed imaginarium task; `department`
        remains `in_progress`; and `closed` remains `done` history.

    AgentSummary:
      type: object
      required: [total, active, needs_you]
      properties:
        total: { type: integer, minimum: 0 }
        active:
          type: integer
          minimum: 0
          description: Agents in traveling, working, or blocked_helping status.
        needs_you:
          type: integer
          minimum: 0
          description: |
            Agents whose activity is `needs_input` or `error` — the ones where nothing moves
            until a person acts. API-computed so a client cannot badge one number while
            colouring its cards from another; `complete` is excluded because a finished agent
            wants a reader, not a rescue. Archived agents are never counted.

    Priority:
      type: string
      enum: [none, P0, P1, P2, P3]
      description: "`P3` is the default every task carries so nothing stalls unprioritized."

    Activity:
      type: string
      enum: [idle, thinking, complete, needs_input, error]

    AgentAttention:
      type: string
      enum: [neutral, needs_human, error]
      description: |
        Rails-owned projection used for the agent card's visual treatment. The aggregate
        `agent_summary.needs_you` count is derived from this same projection so clients never
        recreate which activities require a person.

    AgentStatus:
      type: string
      enum: [landing, idle_park, traveling, working, blocked_helping, offline]

    TaskApprovalBatch:
      type: object
      additionalProperties: false
      required: [version, action, requested_count, approved_count, successful_count, results]
      properties:
        version: { type: integer, enum: [1] }
        action: { $ref: "#/components/schemas/TaskApprovalBatchAction" }
        requested_count: { type: integer, minimum: 1, maximum: 100 }
        approved_count:
          type: integer
          minimum: 0
          description: Tasks newly moved by this request.
        successful_count:
          type: integer
          minimum: 0
          description: Newly moved tasks plus idempotent already-on-Seashore successes.
        results:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/TaskApprovalBatchResult" }

    TaskApprovalBatchAction:
      type: object
      additionalProperties: false
      required: [id, label, destination]
      properties:
        id: { type: string, enum: [approve_selected] }
        label: { type: string, enum: ["Approve selected → Ready"] }
        destination:
          type: object
          additionalProperties: false
          required: [stage, label]
          properties:
            stage: { type: string, enum: [seashore] }
            label: { type: string, enum: [Ready] }

    TaskApprovalBatchResult:
      type: object
      additionalProperties: false
      required: [task_id, outcome, message]
      properties:
        task_id: { type: integer }
        outcome: { type: string, enum: [approved, already_approved, refused] }
        message: { type: string, description: API-authored result or recovery copy. }
        task:
          allOf: [{ $ref: "#/components/schemas/Task" }]
          description: Present for approved and already-approved outcomes; absent for refusals.

    Task:
      type: object
      description: Every column of `tasks`, plus the derived server-authored human workflow.
      required:
        [id, project_id, title, description, stage, priority, ready, needs_human_review,
         agent_approved, proposed_priority, staged, queue_position, board_position, auto_triage,
         review_on_create,
         confidence, specialist_type, auto_specialist, requesting_agent_id, assignee_id,
         follow_up_of_id, blocked_reason, blocked_kind, blocked_at, pr_links, pr_state, pr_checks, pr_mergeable,
         pr_checked_at, council_verdict, council_checked_at, sprite, created_by_kind,
         created_by_name, created_at, updated_at, requirements, claimed_at, claim_expires_at,
         provider_preference, model_preference, cost_hint_usd, board_lane, workflow,
         board_drag, assignment, assignment_notice, assignment_state, assignment_detail,
         assignment_requested_at, assignment_attempts, assignment_created_agent_id,
         attachments, resolution]
      properties:
        id: { type: integer }
        project_id: { type: [integer, "null"] }
        title: { type: string }
        description: { type: string }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/TaskAttachment" }
        stage: { $ref: "#/components/schemas/Stage" }
        board_lane: { $ref: "#/components/schemas/BoardLane" }
        priority: { $ref: "#/components/schemas/Priority" }
        ready: { type: boolean, description: On the seashore and claimable. }
        needs_human_review: { type: boolean }
        agent_approved: { type: boolean, description: The auto-reviewer vetted this idea. }
        proposed_priority:
          oneOf: [{ $ref: "#/components/schemas/Priority" }, { type: "null" }]
          description: The reviewer's suggestion; beats the bare `P3` default on approval.
        staged: { type: boolean, description: Queued at its building; sorts first in claim order. }
        queue_position: { type: [integer, "null"] }
        board_position:
          type: [integer, "null"]
          description: |
            Manual place within the task's Kanban lane, written by `POST /tasks/{id}/reorder`.
            Null means never manually placed; those cards draw first, newest first.
        auto_triage:
          type: boolean
          description: |
            Defaults to true. Lets the auto-reviewer sweep this idea and propose a
            priority; unrelated to `review_on_create` below.
        review_on_create:
          type: boolean
          description: |
            Defaults to true. Creation then queues an out-of-band critique that appears
            as an assistant message in `GET /tasks/{id}/chat`. Unrelated to `auto_triage`.
        confidence: { type: [integer, "null"], description: 0–100, set when the task is delivered. }
        specialist_type: { type: [string, "null"] }
        auto_specialist: { type: boolean }
        requesting_agent_id: { type: [integer, "null"], description: Who asked for the specialist. }
        assignee_id: { type: [integer, "null"] }
        follow_up_of_id:
          type: [integer, "null"]
          description: |
            The task this one continues, if any. Must name a task that exists — one that does
            not is `422` and creates nothing. Human and agent callers may both send it.
        blocked_reason: { type: [string, "null"] }
        blocked_kind:
          type: [string, "null"]
          enum: [needs_input, error, waiting_reset, null]
          description: |
            Why the card is in Blocked. `needs_input` waits on a person. `error` is a
            failure that will not resume by itself. `waiting_reset` is a temporary
            park: every usable credential is spent, Campus will resume when the
            named credential resets, and a human is not required. Added 2026-08-17;
            clients that do not know the token must treat it as an unknown
            `blocked_kind` (fail closed on actions, never as `error`).
        resolution:
          oneOf:
            - $ref: "#/components/schemas/TaskResolution"
            - type: "null"
        blocked_at:
          type: [string, "null"]
          format: date-time
          description: |
            When the task most recently entered `blocked`; null in every other stage. This is
            the attention clock: PR polling, title edits, council detail updates, and comments
            do not move it. A human reply supplies context but does not implicitly resolve the
            wait; only an explicit transition out of `blocked` clears it, and re-entry starts
            a new clock. Existing blocked rows were backfilled from `updated_at`, the only
            historic timestamp available and therefore the best bounded estimate. During the
            rolling-deploy window, readers tolerate a null written by an old process and use
            `updated_at`; new writers self-heal that row. A later release may enforce the
            invariant in the database after all writers run this dual-write code.
        pr_links: { type: array, items: { type: string } }
        pr_state:
          type: [string, "null"]
          description: |
            GitHub state of the newest PR link, refreshed by a background sweep over
            blocked tasks. `unknown` when GitHub could not be read. Surfacing only —
            Campus never transitions a task on a merge; that stays a human decision.
          examples: [open, merged, closed, unknown]
        pr_checks: { type: [string, "null"], description: CI rollup for that PR, or null when it could not be read. }
        pr_mergeable: { type: [string, "null"] }
        pr_checked_at: { type: [string, "null"], format: date-time }
        council_verdict:
          type: [string, "null"]
          description: |
            Outcome of the council review. Deliberately conservative — anything that
            cannot be read confidently is `unclear`, never `approved`.
          examples: [approved, changes_requested, unclear]
        council_checked_at: { type: [string, "null"], format: date-time }
        sprite: { type: object, description: Free-form render hints for the world view. }
        created_by_kind: { type: string, enum: [human, agent] }
        created_by_name: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        requirements:
          type: array
          description: |
            What the filer says this work needs, matched against an agent's `capabilities` by
            **set containment**: claimable when `requirements ⊆ capabilities`. An empty list —
            which is every task that existed before this column — is claimable by anyone, which
            is what `[] ⊆ anything` already means and is why the rule is written this way
            round.

            Normalised on write: lowercase, trimmed, deduplicated, strings only. A stray number
            or object in here would make the task permanently unclaimable with nothing anywhere
            to see it by.
          items: { $ref: "#/components/schemas/Capability" }
        claimed_at:
          type: [string, "null"]
          format: date-time
          description: |
            When the current holder took it. Survives a `blocked → in_progress` round trip: the
            claim did not change hands, only the lease was renewed, and when the agent picked
            this up is worth keeping.
        claim_expires_at:
          type: [string, "null"]
          format: date-time
          description: |
            When this claim stops being believed — 15 minutes from the claim or the last
            renewal, whichever is later. A sweep hands back everything past its expiry.

            **A claim with no expiry is not an expired claim.** That is every task claimed
            before leases existed, and reading those as abandoned would have swept the board
            clean the first time this shipped.
        provider_preference:
          type: [string, "null"]
          description: |
            The one preference the server **enforces**: a task naming a provider is only
            offered to, and only claimable by, an agent with that `provider`. Null and the
            empty string both mean "anyone", because a form posts one and an API client sends
            the other.
          example: anthropic
        model_preference:
          type: [string, "null"]
          description: |
            **Advisory.** Carried, never policed. Campus cannot see which model an external
            agent actually loads, so enforcing it here would be a promise the server has no way
            to keep — it rides in the task and in the claim response so that an agent which
            wants to honour it can.
        cost_hint_usd:
          type: [number, "null"]
          description: |
            **Advisory**, for the same reason as `model_preference`: Campus cannot see what an
            external agent spends. An API that claims a ceiling it cannot hold is worse than
            one that admits it is a request.
        workflow: { $ref: "#/components/schemas/TaskWorkflow" }
        board_drag: { $ref: "#/components/schemas/TaskBoardDrag" }
        assignment: { $ref: "#/components/schemas/TaskAssignment" }
        assignment_notice:
          oneOf: [{ $ref: "#/components/schemas/TaskAssignmentNotice" }, { type: "null" }]
          description: |
            The board-facing sentence about this task's assignment, or null for the
            overwhelming majority of tasks, which never met the auto-assigner. Present in
            every task representation. Clients render it verbatim: `headline` on the Kanban
            card, `detail` in the task detail sheet. Null when `assignment.state` is
            `none`, and null for any state this server version cannot phrase a headline
            for — the notice fails closed as absent rather than publishing a null
            `headline`.
        assignment_state:
          type: string
          enum: [none, pending, assigned, failed]
          description: |
            The raw column behind `assignment.state`. Render `assignment` — it carries the
            server-authored copy for each state; this is here because the schema documents
            every column of `tasks`.
        assignment_detail:
          type: [string, "null"]
          description: |
            Server-authored sentence explaining the current `assignment_state`: why the
            reviewer chose this agent, or what went wrong. Rendered verbatim; never parsed.
        assignment_requested_at:
          type: [string, "null"]
          format: date-time
          description: When the human asked Campus to choose an agent. Drives the stale sweep.
        assignment_attempts:
          type: integer
          description: |
            How many of the bounded reviewer attempts this assignment has taken. Taken
            *before* each model call, so a worker that dies mid-call still spends one.
        assignment_created_agent_id:
          type: [integer, "null"]
          description: |
            The agent auto-assignment landed for this task, when it landed one. Written before
            the hand-over, so a retry re-uses that agent instead of creating a second.

    TaskBoard:
      type: object
      additionalProperties: false
      required: [version, filter, filters, project_filter, project_filters, columns]
      properties:
        version: { type: integer, enum: [1] }
        filter:
          type: object
          additionalProperties: false
          required: [id, label, assignee_id]
          properties:
            id: { type: string, examples: [all, unassigned, "agent:7"] }
            label: { type: string, description: Server-authored selected-filter label. }
            assignee_id: { type: [string, "null"], examples: [null, unassigned, "7"] }
            agent_id: { type: integer }
        filters:
          type: array
          description: API-authored choices and normalized assignee_id query values.
          items: { $ref: "#/components/schemas/TaskBoardFilter" }
        project_filter:
          allOf: [{ $ref: "#/components/schemas/TaskBoardProjectFilter" }]
          description: |
            The selected project option, named the same way `filter` names the selected
            assignment. `project_filters[0]` (all projects) when `project_id` is omitted.
        project_filters:
          type: array
          minItems: 1
          description: |
            The API-authored project menu: `all`, then every project ordered by id. It is
            built from the assignment-filtered scope BEFORE `project_id` narrows the board,
            so the choices never narrow — selecting a project does not remove the others from
            the menu it was selected from. `open_count` does follow `assignee_id`, so the
            numbers describe the board the reader is actually looking at.
          items: { $ref: "#/components/schemas/TaskBoardProjectFilter" }
        columns:
          type: array
          minItems: 6
          maxItems: 6
          description: API-authored left-to-right lane order.
          items:
            type: object
            additionalProperties: false
            required: [id, label, hint, count]
            properties:
              id: { $ref: "#/components/schemas/BoardLane" }
              label: { type: string }
              hint: { type: string }
              count: { type: integer, minimum: 0 }

    TaskBoardFilter:
      type: object
      additionalProperties: false
      required: [id, label, assignee_id]
      properties:
        id: { type: string, examples: [all, unassigned, "agent:7"] }
        label: { type: string }
        assignee_id: { type: [string, "null"], examples: [null, unassigned, "7"] }
        agent_id: { type: integer }

    TaskBoardProjectFilter:
      type: object
      additionalProperties: false
      required: [id, label, project_id, open_count]
      properties:
        id: { type: string, examples: [all, "project:7"] }
        label:
          type: string
          description: |
            The project's own name, or `All projects` for the unfiltered choice. Render it
            verbatim; clients do not relabel the project vocabulary.
          examples: [All projects, campus]
        project_id:
          type: [integer, "null"]
          description: The `project_id` query value this choice selects; null for all projects.
        open_count:
          type: integer
          minimum: 0
          description: |
            Open tasks (every stage except `done` and `closed` — the same definition as
            `Project.open_count`) under the board's current `assignee_id`. The `all` row is
            the sum over the same scope and therefore also counts tasks filed under no
            project, which is why it can exceed the sum of the rows below it.

    TaskBoardPage:
      type: object
      additionalProperties: false
      required: [version, lane, tasks, page]
      properties:
        version: { type: integer, enum: [1] }
        lane: { $ref: "#/components/schemas/BoardLane" }
        tasks:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/TaskSummary" }
        page:
          $ref: "#/components/schemas/TaskBoardPageInfo"

    TaskBoardPageInfo:
      type: object
      additionalProperties: false
      required: [page_size, max_page_size, total, loaded, has_more, next_cursor, loaded_label]
      properties:
        page_size: { type: integer, minimum: 1, maximum: 100 }
        max_page_size: { type: integer, enum: [100] }
        total: { type: integer, minimum: 0 }
        loaded:
          type: integer
          minimum: 0
          description: Cumulative rows returned from the first page through this page.
        has_more: { type: boolean }
        next_cursor:
          type: [string, "null"]
          description: Opaque continuation cursor when `has_more` is true; otherwise null.
        loaded_label:
          type: string
          description: Server-authored N-of-total progress copy for presentation.

    TaskAttention:
      type: object
      additionalProperties: false
      description: The Board's active request, carried verbatim to a task detail destination.
      required: [version, kind, ask, from, source, actions]
      properties:
        version: { type: integer, enum: [1] }
        kind: { type: string }
        ask: { type: string }
        from: { type: [string, "null"] }
        source: { $ref: "#/components/schemas/BoardSource" }
        actions:
          type: array
          items: { $ref: "#/components/schemas/TaskResolutionAction" }

    TaskResolution:
      type: object
      additionalProperties: false
      required: [version, reason, input_required, actions]
      properties:
        version: { type: integer, enum: [1] }
        reason: { type: string }
        input_required: { type: string }
        actions:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/TaskResolutionAction" }

    TaskResolutionAction:
      type: object
      additionalProperties: false
      required: [id, label, intent, description, input]
      properties:
        id: { type: string }
        label: { type: string }
        intent: { type: string, enum: [default, deliberate] }
        description: { type: string }
        input:
          type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [none, note, confirmation] }
            label: { type: string }
            required: { type: boolean }

    TaskResolutionResult:
      type: object
      additionalProperties: false
      required: [version, report, task]
      properties:
        version: { type: integer, enum: [1] }
        report: { type: string }
        task: { $ref: "#/components/schemas/TaskDetail" }

    BoardSource:
      type: object
      additionalProperties: true
      required: [kind, id]
      properties:
        kind: { type: string, examples: [task, comment, agent, agent_message, board_message] }
        id: { type: integer }

    TaskWorkflow:
      type: object
      additionalProperties: false
      description: |
        Versioned, server-authored actions a human client may offer for this task. Rails owns
        the action ids, labels, semantic intent and exact transition request. Clients choose
        controls and visual treatment; they must not reconstruct `Task::TRANSITIONS`.
      required: [version, actions]
      properties:
        version: { type: integer, enum: [1] }
        actions:
          type: array
          items: { $ref: "#/components/schemas/TaskWorkflowAction" }

    TaskWorkflowAction:
      type: object
      additionalProperties: false
      required: [id, label, intent, transition]
      properties:
        id:
          type: string
          enum: [approve, complete, block_for_review, resume, unblock, return_to_ready, close,
                 return_to_ideas, send_to_seashore, start_work, reopen]
          description: |
            Stable identifier for the action. `approve` and `send_to_seashore` are the two
            readings of the single `imaginarium → seashore` move and are **mutually
            exclusive**: an idea an agent has vetted (`agent_approved`) offers `approve`, and
            one nobody has read offers `send_to_seashore`. Both carry the identical,
            server-resolved `transition.priority`; neither sets `agent_approved`, which stays
            the record of whether an agent actually read the idea.

            `start_work` is the one action that asks the reader a question — who picks the
            work up — and it is the only one carrying an `assignment` offer.

            `close` is offered by every open stage. It always carries the exact
            `{to: closed}` request and server-authored confirmation; clients must not infer
            its availability from the lane.

            `reopen` is the one action a human-only edge of `Task::TRANSITIONS` backs: `done`
            and `closed` both offer it, back into the imaginarium, and an agent token that
            posts its `transition` gets `403` naming the rule rather than the move. It is the
            only action carrying `confirm.alternative`.
        label:
          type: string
          description: |
            Server-authored user-facing action copy. A label names its object, not just its
            verb (`Close task`, not `Close`), because it is rendered beside dismiss controls
            the client owns and Rails cannot see. Labels are copy, not identity — key on `id`.
          examples: [Mark done, Close task, Close idea, Start work, Reopen task]
        intent:
          type: string
          enum: [default, destructive, deliberate]
          description: |
            Semantic intent; clients choose how that intent is rendered. `destructive` is a
            one-way door into history; `deliberate` (today, only `reopen`) undoes a human
            verdict rather than destroying anything, but is no more a drag than `destructive`
            is — `TaskBoardDrag` offers neither as a drop, only ever `default`.
        confirm:
          allOf: [{ $ref: "#/components/schemas/TaskWorkflowConfirmation" }]
          description: |
            Present when Rails wants this action confirmed before it is dispatched — today
            every `destructive` or `deliberate` action and nothing else. A client that renders
            the action MUST NOT send the transition until the reader has agreed to these
            words; the dialog and its own cancel control are the client's, the sentences are
            not. Absent means dispatch on activation.
        transition: { $ref: "#/components/schemas/TaskWorkflowTransition" }
        assignment: { $ref: "#/components/schemas/TaskAssignmentOffer" }

    TaskWorkflowConfirmation:
      type: object
      additionalProperties: false
      description: |
        What Campus asks before a one-way-feeling action. The body states the consequence
        only the state machine knows — `closed` has only a human-only way back out — so it is
        Rails' sentence rather than a client's guess.
      required: [title, body, confirm_label]
      properties:
        title: { type: string, examples: ["Close this task?"] }
        body:
          type: string
          examples: ["It leaves Ready for history. A human can reopen it later; nothing else can."]
        confirm_label:
          type: string
          description: The confirming button's copy; matches the action's own `label`.
          examples: [Close task]
        alternative:
          $ref: "#/components/schemas/TaskWorkflowAlternative"

    TaskWorkflowAlternative:
      type: object
      additionalProperties: false
      description: |
        A better move offered beside the one just confirmed, not instead of it — `reopen`'s
        confirmation carries this, and nothing else does, because reopening a done or closed
        task is legal but often the wrong move: the record usually reads better with the old
        task left alone and a fresh, linked one carrying the work forward.
      required: [id, label, compose]
      properties:
        id: { type: string, enum: [create_follow_up] }
        label: { type: string, examples: ["Create a follow-up instead"] }
        compose:
          $ref: "#/components/schemas/TaskWorkflowFollowUpCompose"

    TaskWorkflowFollowUpCompose:
      type: object
      additionalProperties: false
      description: |
        Pre-filled `POST /tasks` fields for the linked follow-up, resolved per task in
        `TaskWorkflow.for` the same way `resolve_beach_priority!` resolves a beach-bound
        priority: the gesture that reaches for `reopen` names no follow-up task, and only
        Rails can say which task it would continue. Posting this object back as the `task`
        body, plus whatever else the reader wrote, is a complete, legal `POST /tasks` request.
      required: [follow_up_of_id, title, description]
      properties:
        follow_up_of_id: { type: integer, description: The reopened task's own id. }
        title: { type: string, examples: ["Follow-up: Fix the flaky login test"] }
        description: { type: string, description: Server-authored sentence naming the task this continues. }

    TaskWorkflowTransition:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to: { $ref: "#/components/schemas/Stage" }
        priority: { $ref: "#/components/schemas/Priority" }
        blocked_reason: { type: string }
        blocked_kind: { type: string, enum: [needs_input, error, waiting_reset] }
        specialist_type: { type: string }
        confidence: { type: number, minimum: 0, maximum: 100 }
        assignee:
          oneOf: [{ type: integer }, { type: string, enum: [auto] }]
          description: |
            Who picks the work up. Required by `seashore → in_progress` and ignored by every
            other transition — starting queued work is a claim, and a claim with no holder is
            the hole this field exists to close.

            An **agent id** hands the task to that agent immediately, exactly as
            `POST /tasks/{id}/claim` would. The literal **`auto`** asks the workspace reviewer
            model to choose: the task moves to `in_progress` in the same response with
            `assignment.state = "pending"`, and a background job resolves it. See
            `TaskAssignment`.

            `start_work` publishes `auto` in its transition body, so a client that posts what
            the server published performs a complete, legal move; `TaskAssignmentOffer` is
            how a client that can ask the human puts an id here instead.

    TaskAssignmentOffer:
      type: object
      additionalProperties: false
      description: |
        Present on an action whose transition takes an `assignee`, and it is the whole
        contract for offering that choice: which field the answer goes in, the sentinel that
        means "you choose", and the words for both. A client renders these strings; it does
        not name the field or write the copy, because "assign to the next best available
        agent" is a claim about a mechanism the server owns.

        Ignoring this key is always safe — the action's `transition` is already complete.
      required: [version, field, prompt, auto_value, auto_label]
      properties:
        version:
          type: integer
          enum: [1]
          description: |
            A client that does not know this version posts the transition as published, which
            means auto-assignment. It must not invent a picker of its own.
        field:
          type: string
          enum: [assignee]
          description: The transition field the chosen agent id (or `auto_value`) goes in.
        prompt: { type: string, description: Server-authored question to put above the picker. }
        auto_value:
          type: string
          enum: [auto]
          description: The value meaning "the reviewer chooses". Never an empty string or null.
        auto_label:
          type: string
          description: Server-authored copy for the auto option, shown beside the agent list.

    TaskAssignment:
      type: object
      additionalProperties: false
      description: |
        What is happening to "who is going to do this?", on every task, always.

        The state is **explicit rather than inferred**. A card in the In progress lane with no
        `assignee` used to be unreadable — stalled work and work whose agent is still being
        chosen look identical — so this says which, in a versioned field, and carries the
        sentence to show for it.

        Its states:

        * `none` — the ordinary answer, and the one every task that never went through
          auto-assignment carries. `label` is null; there is nothing to say.
        * `pending` — a human asked Campus to choose and the reviewer has not answered yet.
          The task is in `in_progress` with no assignee **on purpose**. This is the state a
          client draws as "working on it".
        * `assigned` — the reviewer answered and the task was handed over. `detail` says why
          that agent, and `created_agent_id` is set when the agent was landed for this task.
        * `failed` — Campus gave up, and the task has been put **back in the Seashore queue**,
          at the front, so nobody is left believing work is under way that is not. `detail`
          says what happened. The human's recovery is `start_work` again, naming the agent.

        Nothing stays `pending`: the reviewer is asked a bounded number of times, and a
        reservation nothing is working on any more is swept after ten minutes. An assignment
        is never fabricated — an agent the reviewer names that is not on the roster it was
        shown is a failure, not an agent to create.
      required: [version, state, label, detail, created_agent_id]
      properties:
        version:
          type: integer
          enum: [1]
          description: |
            A client that does not know this version must withhold assignment affordances
            rather than guess at what a missing assignee means.
        state: { type: string, enum: [none, pending, assigned, failed] }
        label:
          type: [string, "null"]
          description: |
            Server-authored copy for this state, rendered verbatim. Null **only** for `none`.
        detail:
          type: [string, "null"]
          description: |
            Server-authored sentence about this particular task: the reviewer's reason for its
            choice, or what went wrong. Null when there is nothing to add.
        created_agent_id:
          type: [integer, "null"]
          description: |
            The agent auto-assignment landed for this task, so a human can see afterwards that
            an agent was created and go and read why. Null when no agent was created.

    TaskAssignmentNotice:
      type: object
      additionalProperties: false
      description: |
        What a human is meant to SEE about an assignment, as opposed to the raw record of
        it. This exists because the outcome a human most needs to notice — Campus tried to
        start the work and could not, and the card is back in Ready — was written to
        `assignment_state`/`assignment_detail` and never surfaced; the card only ever showed
        the transient searching copy while the assignment was pending.

        `headline` is deliberately short: the failed `detail` can run to whole paragraphs
        (branch listings, provider answers), and a card is not where a paragraph is read.
        The failed headline therefore points at the card, and the detail sheet renders
        `detail` verbatim. Clients render both as written and compose neither.
      required: [state, headline, detail]
      properties:
        state:
          type: string
          enum: [pending, assigned, failed]
          description: |
            Mirrors `assignment_state`. `none` never appears here — a task with no
            assignment activity publishes a null `assignment_notice` instead.
        headline:
          type: string
          description: |
            The sentence the Kanban card shows. Searching copy while `pending`; names the
            holding agent when `assigned`; says Campus could not start the work and to open
            the card for the reason when `failed`.
        detail:
          type: [string, "null"]
          description: |
            The precise server-authored reason (`assignment_detail`), rendered verbatim in
            the task detail sheet. Null when there is nothing to add.

    TaskBoardDrag:
      type: object
      additionalProperties: false
      description: |
        Versioned, server-authored list of the Kanban **lanes** this card may be dragged
        into, and the exact transition each drop represents.

        This exists because the board is organized by lane while `TaskWorkflow` is keyed by
        stage, and `board_lane` is a lossy grouping of the two: `in_progress` and
        `department` share one lane, `done` and `closed` share another, and `imaginarium`
        splits into `approval` once an agent has vetted the idea. "Drag from lane X to lane
        Y" therefore has no 1:1 answer in `TaskWorkflow`, and a client that worked one out
        would be keeping a second copy of `Task::TRANSITIONS` in its own language.

        It is published **per task, not per lane**, because a lane does not determine the
        answer. Approving an idea never clears `agent_approved`, so `return_to_ideas` sends
        one Seashore card back to the `approval` lane and its neighbour to `imaginarium` —
        same lane, same action, two destinations.

        Three families of action are deliberately **absent**, and the rule is the server's:
        destructive ones (`close`) have no confirming click in a drag; ones that do not
        change lane (`department → in_progress`) have no drop a human could aim at; and two
        actions landing in the same lane withhold that lane, because a drop is a lane and
        cannot choose between them. Every one of them remains available as a
        `TaskWorkflow` action, so drag never becomes the only route to a move.

        A destination the server did not publish must not be offered. `Task::TRANSITIONS`
        remains the enforcement table and refuses the request regardless.
      required: [version, destinations]
      properties:
        version:
          type: integer
          enum: [1]
          description: |
            A client that does not know this version withholds dragging entirely rather
            than substituting its own idea of which lane moves are legal.
        destinations:
          type: array
          description: Empty when nothing on this card may be moved by dragging.
          items: { $ref: "#/components/schemas/TaskBoardDragDestination" }

    TaskBoardDragDestination:
      type: object
      additionalProperties: false
      description: |
        One lane this card may be dropped on, carrying the `TaskWorkflow` action that drop
        performs. `action_id`, `label`, `intent` and `transition` are that action's own
        values, copied rather than re-derived, so a drag and the equivalent button send the
        identical request — including the values a drag gesture cannot supply and a client
        must never invent: the resolved approval `priority`, the `blocked_reason` and
        `blocked_kind`, the recorded `confidence`, and the `assignee` a drop into In progress
        needs.

        That last one is why `assignment` may be present here too. Dropping a Seashore card
        into In progress starts work, and work needs a holder; the published `transition`
        carries `assignee: "auto"` so posting it verbatim remains a complete, legal request —
        letting go of a card without saying more means asking Campus to find somebody. A
        client that can put the question to the human instead renders `assignment` and sends
        the same request with an agent id in the same field. Both are one action, so a drop
        and the button on the card can never mean two different things.
      required: [lane, action_id, label, intent, transition]
      properties:
        lane: { $ref: "#/components/schemas/BoardLane" }
        action_id:
          type: string
          enum: [approve, complete, block_for_review, resume, unblock, return_to_ready, close,
                 return_to_ideas, send_to_seashore, start_work]
          description: The `TaskWorkflowAction.id` this drop performs. Never a parallel vocabulary.
        label: { type: string, description: Server-authored copy for the action this drop performs. }
        intent:
          type: string
          enum: [default]
          description: |
            Only `default` is ever published here. A `destructive` action is not draggable —
            see `TaskBoardDrag` — so the enum is narrower than `TaskWorkflowAction.intent`
            on purpose rather than by omission.
        transition: { $ref: "#/components/schemas/TaskWorkflowTransition" }
        assignment: { $ref: "#/components/schemas/TaskAssignmentOffer" }

    TaskAssignee:
      type: object
      description: |
        The agent a task is assigned to, trimmed to what a board needs to draw it.

        `GET /tasks` and `GET /tasks/{id}` render the **identical** object — both serialize
        `TasksController::ASSIGNEE_JSON`, which exists so the two can never drift. The key is
        **absent**, not null, when the task is unclaimed: `include:` omits an association
        that is nil.
      required: [id, name, activity]
      properties:
        id: { type: integer }
        name: { type: string }
        activity: { $ref: "#/components/schemas/Activity" }

    TaskFollowUpOf:
      type: object
      description: |
        A linked task, trimmed to what a client needs to jump to it — the follow-up itself
        (`follow_up_of`) or one of the tasks that continue this one (`continued_in`), both
        rendered from `TasksController::FOLLOW_UP_JSON`, which is why they carry the same
        shape. `follow_up_of` is **absent**, not null, when the task links to nothing:
        `include:` omits a `belongs_to` that is nil. `continued_in` is always an array, empty
        when nothing continues this task.
      required: [id, title, stage]
      properties:
        id: { type: integer }
        title: { type: string }
        stage: { $ref: "#/components/schemas/Stage" }

    TaskSummary:
      description: A task as `GET /tasks` returns it — every column plus the assignee and follow-up links, no comments.
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          properties:
            assignee: { $ref: "#/components/schemas/TaskAssignee" }
            follow_up_of: { $ref: "#/components/schemas/TaskFollowUpOf" }
            continued_in:
              type: array
              items: { $ref: "#/components/schemas/TaskFollowUpOf" }

    TaskDetail:
      description: A task as `GET /tasks/{id}` returns it — every column plus its run history, active Board request, assignee, follow-up links, and full comment thread.
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          required: [runs]
          properties:
            runs: { $ref: "#/components/schemas/TaskRuns" }
            attention:
              oneOf:
                - $ref: "#/components/schemas/TaskAttention"
                - type: "null"
              description: The active Board request that led here; null when none points here.
            comments:
              type: array
              items: { $ref: "#/components/schemas/Comment" }
            assignee: { $ref: "#/components/schemas/TaskAssignee" }
            follow_up_of: { $ref: "#/components/schemas/TaskFollowUpOf" }
            continued_in:
              type: array
              items: { $ref: "#/components/schemas/TaskFollowUpOf" }

    AlarmTask:
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          required: [age_seconds]
          properties:
            age_seconds:
              type: integer
              description: Seconds since `blocked_at` — how long the current blocked wait has lasted.

    TaskInput:
      type: object
      description: |
        The permitted attributes for create and update. `stage` is deliberately not
        writable — use `POST /tasks/{id}/transition`.
      properties:
        project_id:
          type: [integer, "null"]
          description: |
            Must name a project that exists. One that does not is `422`, naming the id —
            it used to reach Postgres and come back as a `500` quoting a foreign-key
            constraint name. `null` is legal and means the task is unassigned.
        title:
          type: string
          description: |
            A human-visible task identity. Control characters, bidirectional text controls,
            and invisible direction/word-boundary controls are rejected with `422`; Campus
            stores the exact accepted text and never silently normalizes it.
        description:
          type: string
          description: |
            Authored task prose. Tabs and line endings remain valid. Terminal repaint,
            bidirectional, and high-risk invisible controls are rejected with `422`; Campus
            stores accepted text exactly and never silently normalizes it.
        attachments:
          type: array
          maxItems: 4
          description: Base64 image inputs accepted on create; each decoded image is limited to 5 MB.
          items: { $ref: "#/components/schemas/TaskAttachmentInput" }
        priority: { $ref: "#/components/schemas/Priority" }
        ready: { type: boolean }
        proposed_priority: { $ref: "#/components/schemas/Priority" }
        agent_approved: { type: boolean }
        follow_up_of_id:
          type: [integer, "null"]
          description: |
            Links this task as a follow-up of another. Must name a task that exists — one
            that does not is `422` and creates nothing. Human and agent callers may both send
            it; the reopen workflow action's `confirm.alternative.compose` pre-fills it for
            the task the reader just reopened, or chose not to.
        specialist_type: { type: string }
        auto_specialist: { type: boolean }
        review_on_create: { type: boolean, default: true, description: Queue the out-of-band critique on create. }
        sprite: { type: object }
        requirements:
          type: array
          description: |
            What this work needs, as capability strings. Only agents whose `capabilities` are a
            superset can claim it, so this is the one field that can make a task unclaimable by
            the whole fleet — say `[]` (or omit it) unless the work genuinely needs something.
          items: { $ref: "#/components/schemas/Capability" }
        provider_preference:
          type: [string, "null"]
          description: Enforced. Restricts the claim to agents with this `provider`; empty means anyone.
        model_preference:
          type: [string, "null"]
          description: Advisory. Carried to whoever claims it and never checked.
        cost_hint_usd:
          type: [number, "null"]
          description: Advisory. Carried to whoever claims it and never checked.

    TaskAttachment:
      type: object
      additionalProperties: false
      required: [id, filename, content_type, byte_size, state, attached_at, preview_url]
      properties:
        id:
          type: string
          description: >
            Server-assigned and opaque. A caller cannot choose one: `TaskAttachmentInput`
            accepts no `id`, and an id sent anyway is ignored rather than kept.
        filename: { type: string }
        content_type: { type: string, enum: [image/png, image/jpeg, image/gif, image/webp] }
        byte_size: { type: integer, maximum: 5242880 }
        state:
          type: string
          enum: [stored, expired]
          description: >
            `expired` once the retention sweep has removed the image, six months after it
            was attached. The metadata stays so a reader is told the image expired rather
            than left wondering whether it ever existed; fetching `preview_url` for an
            expired attachment is a `404`.
        attached_at:
          type: [string, "null"]
          format: date-time
          description: When the image was attached. What the retention sweep expires on.
        preview_url: { type: string, description: Authenticated relative URL for the image bytes. }

    TaskAttachmentInput:
      type: object
      additionalProperties: false
      description: >
        One image on the way in. **Attachment identity is server-assigned and there is no
        create-idempotency here**: this object accepts no `id`, and posting the same image
        twice — whether as a retry or as two entries in one request — produces two distinct
        attachments with two distinct server-assigned ids and two stored objects. An earlier
        version of this schema documented an optional client-chosen `id` that would make a
        retried create keep one copy; that was never implemented, the field was never read
        from a request, and the claim has been withdrawn rather than honoured. An id is also a
        path component of the object's storage key, which is not a thing a caller chooses.

        Where the bytes are stored is likewise never a caller's to name. There is no way to
        point a task at an already-stored object.
      required: [filename, content_type, data_base64]
      properties:
        filename: { type: string }
        content_type:
          type: string
          enum: [image/png, image/jpeg, image/gif, image/webp]
          description: >
            Checked against the bytes' own signature, not taken on trust. A payload whose
            leading bytes are not this format is rejected however it is labelled.
        data_base64: { type: string, format: byte }

    Comment:
      type: object
      required: [id, task_id, author_kind, author_name, kind, body, created_at, updated_at]
      properties:
        id: { type: integer }
        task_id: { type: integer }
        author_kind: { type: string, enum: [human, agent] }
        author_name: { type: [string, "null"] }
        kind: { type: string, enum: [comment, question, status] }
        body: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ChatMessage:
      type: object
      required: [id, task_id, role, body, display_body, edited_task, created_at]
      properties:
        id: { type: integer }
        task_id: { type: integer }
        role: { type: string, enum: [user, assistant] }
        body: { type: string, description: Raw immutable turn retained for audit. }
        display_body:
          type: string
          description: Rails-authored display form with terminal and invisible controls removed.
        edited_task: { type: boolean, description: This turn rewrote the task. }
        created_at: { type: string, format: date-time }

    ChatReply:
      type: object
      required: [reply, task, edited, actions]
      properties:
        reply: { $ref: "#/components/schemas/ChatMessage" }
        task:
          allOf: [{ $ref: "#/components/schemas/TaskDetail" }]
          description: The task **after** any edit the turn made.
        edited: { type: boolean, description: Whether title, description, priority or stage changed. }
        actions:
          type: array
          items: { $ref: "#/components/schemas/TaskAssistantAction" }

    TaskAssistantAction:
      type: object
      required: [version, id, label, description, intent]
      properties:
        version: { type: integer, enum: [1] }
        id: { type: string, description: Opaque server-authored action identifier. }
        label: { type: string }
        description: { type: string, description: Includes server-authoritative owner liveness. }
        intent: { type: string, enum: [default, destructive] }

    TaskAssistantActionResult:
      type: object
      required: [version, report, task, actions]
      properties:
        version: { type: integer, enum: [1] }
        report: { type: string, description: Server-authored description of exactly what happened. }
        task: { $ref: "#/components/schemas/TaskDetail" }
        actions:
          type: array
          items: { $ref: "#/components/schemas/TaskAssistantAction" }

    ActivityEvent:
      type: object
      required: [id, subject_type, subject_id, actor_kind, actor_name, verb, meta, created_at]
      properties:
        id: { type: integer }
        subject_type: { type: string, enum: [Task, Agent, Project, Setting, Credential, Skill, Cron] }
        subject_id: { type: integer }
        actor_kind: { type: string, enum: [human, agent, system] }
        actor_name: { type: [string, "null"] }
        verb: { type: string, examples: [created, claimed, transitioned, staged, commented, dismissed, reopened, continued, council_reviewed] }
        meta:
          type: object
          description: |
            Verb-specific payload. Additive; new keys land at any time as new verbs and new
            per-verb detail ship. One documented shape today, added by
            PRD_AGENT_FALLBACK.md §7 (S4c): `council_reviewed` additionally carries `engine`
            (the EngineRegistry engine string that ran the review, e.g. "claude_cli" or
            "codex_cli") and `credential_id`/`credential_label`, identifying which engine and
            credential actually performed the review. Present once a real run was attempted;
            absent when the verdict never reached one (a missing skill, no PR link) — never
            a guessed or defaulted value. This is what keeps a cross-provider fallback review
            from ever being mistaken for the anthropic-only review this verb used to mean
            exclusively.
        created_at: { type: string, format: date-time }

    ProjectSnapshot:
      type: object
      description: A project plus everything the island needs to draw its building.
      required:
        [id, name, description, repo_path, completed_count, peak_agent_windows, project_form,
         building_form, open_count, undone_fraction, stage_counts, windows, alarms, attention,
         construction_visible,
         work_status, archived_at, lifecycle]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        repo_path: { type: [string, "null"] }
        completed_count: { type: integer, description: Tasks delivered. Drives the building's form. }
        peak_agent_windows: { type: integer, description: High-water mark of concurrent agents; windows never shrink. }
        project_form:
          type: string
          enum: [little_house, middle_class_house, mansion, commercial_01, commercial_02, commercial_03, commercial_04, commercial_05, building_group]
          description: |
            The silhouette this project takes on the island. Derived from `completed_count`
            via the form ladder (32 / 64 / 128 / 512 / 1024 / 2048 / 4096 / 8192), raised
            when `peak_agent_windows` needs more windows than that rung can carry. Both
            inputs are high-water marks, so a form never shrinks.

            Added 2026-08 as the authoritative name for what `building_form` used to carry
            alone: the API's domain term is Project, and Building is a client's presentation
            choice (AGENTS.md). Read this field. The enum VALUES are unchanged — including
            `building_group`, which names a shape on the island, not the resource.
        building_form:
          deprecated: true
          type: string
          enum: [little_house, middle_class_house, mansion, commercial_01, commercial_02, commercial_03, commercial_04, commercial_05, building_group]
          description: |
            DEPRECATED ALIAS of `project_form`, always present and always equal to it.

            Kept for the mixed-version rollout window: clients built before 2026-08 read
            this name and nothing else, and a server that dropped it would blank their
            island. New clients must read `project_form`; a client keeping a fallback to
            this field must use it only when `project_form` is absent, never in preference
            to it.

            Removal: once no supported client reads it. Removing it is a breaking change to
            this schema and needs its own versioned contract note here — do not delete it
            as a tidy-up alongside an unrelated change.
        open_count: { type: integer, description: Tasks not `done` and not `closed`. }
        undone_fraction: { type: number, format: float, description: Open ÷ non-closed, rounded to 3 dp. }
        stage_counts:
          type: object
          additionalProperties: { type: integer }
          description: Task count per stage; stages with no tasks are absent.
        windows:
          type: array
          items:
            type: object
            required: [agent_id, name, activity, tired]
            properties:
              agent_id: { type: integer }
              name: { type: string }
              activity: { $ref: "#/components/schemas/Activity" }
              tired: { type: boolean }
        alarms:
          type: array
          description: |
            This building's blocked tasks, longest-waiting first. The world-wide `alarms`
            list in `GET /world/snapshot` is not enough on its own: a light beam is drawn
            per building, and its colour (`needs_input` vs `error`) and its age — beams grow
            and brighten the longer they wait — have to travel with the project.

            `blocked_kind` is defaulted to `needs_input` here, so it is never null even when
            the task's own column is.
          items:
            type: object
            required: [task_id, blocked_kind, age_seconds, title]
            properties:
              task_id: { type: integer }
              blocked_kind: { type: string, enum: [needs_input, error, waiting_reset] }
              age_seconds: { type: integer, description: Seconds since the task's `blocked_at`. }
              title: { type: string }
        attention:
          type: object
          description: |
            Who needs a human here, authored by the server so clients never re-derive
            "needs attention" from the alarm array. Added 2026-08; servers built before
            it omit the field, and clients that know it must treat that absence as
            "render without triage" — never classify locally.
          required: [state, rank, summary]
          properties:
            state:
              type: string
              enum: [blocked_error, blocked, active, quiet]
              description: |
                `blocked_error` — at least one alarm is an `error` · `blocked` — alarms,
                all `needs_input` · `active` — no alarms, agents at windows · `quiet` —
                neither. Clients must tolerate unknown future states: render the state
                without classifying locally, and keep a non-null `summary` visible — a
                summary always means a human is waited on, whatever the state is called.
            rank:
              type: integer
              description: Sort key for the state, 0 = most urgent. Order by this, never by re-deriving precedence.
            summary:
              type: [string, "null"]
              description: 'The banner sentence, copy-safe ("3 tasks waiting on you — oldest 3d"). Null when nothing waits.'
        construction_visible:
          type: boolean
          description: "`undone_fraction > settings.construction_threshold` — scaffolding shows."
        work_status: { $ref: "#/components/schemas/ProjectWorkStatus" }
        archived_at:
          type: [string, "null"]
          format: date-time
          description: |
            When this project was archived, or null. An archived project is absent from
            `GET /projects`, `GET /world/snapshot` and the island; `GET /projects?archived=true`
            is the only way to list it. Its tasks and history are kept.
        lifecycle: { $ref: "#/components/schemas/ProjectLifecycle" }

    ProjectWorkStatus:
      type: string
      enum: [active, stopped, idle, done]
      description: |
        Whether anything is happening in this project, derived by the server in ONE place and
        served identically here and by `GET /projects/status`. Clients render it; they never
        re-derive it from `windows`, `stage_counts` or an agent's self-reported `status`.

        * `active` — at least one live agent (seen inside the liveness window) is holding one
          of this project's tasks. The only value that means "right now".
        * `stopped` — no live agent, but work has been STARTED and left: a task in progress
          whose holder has gone silent, a task blocked on a human, or one queued for a
          specialist. Deliberately not "failed" — Campus does not record failure, and this is
          the weaker claim it can actually stand behind.
        * `idle` — nothing started. No tasks at all, or only unstarted ones.
        * `done` — the project has tasks and none of them is open.

        Clients must tolerate values added later: render an unknown status without
        classifying it locally, and do not treat it as `active`.

    ProjectLifecycle:
      type: object
      description: |
        The archive and delete affordances, authored by the server the way `TaskWorkflow`
        authors a task's. A client chooses the control and the layout; it does not write the
        warning, decide which action is destructive, or decide what a confirmation must match.
      required: [version, archive, delete]
      properties:
        version: { type: integer, description: Bump when the shape changes. Currently 1. }
        archive: { $ref: "#/components/schemas/ProjectLifecycleAction" }
        delete: { $ref: "#/components/schemas/ProjectLifecycleAction" }

    ProjectLifecycleAction:
      type: object
      required: [action_id, label, intent, heading, disclosure, confirm_label, confirmation]
      properties:
        action_id:
          type: string
          enum: [archive, delete]
          description: Stable id. `archive` is `POST /projects/{id}/archive`; `delete` is `DELETE /projects/{id}`.
        label: { type: string, description: The control's label. }
        intent:
          type: string
          enum: [default, destructive]
          description: |
            Mapped to a native button treatment. Only `delete` is `destructive`: archiving
            keeps the row and its history, deleting does not, and exactly one of the two
            should be painted like it.
        heading: { type: string, description: The confirmation dialog's title. }
        disclosure:
          type: string
          description: |
            The dialog's warning paragraph — what the cascade will actually do. This is domain
            copy about server behavior, so the server writes it and the client displays it
            verbatim. Present it as selectable text.
        confirm_label: { type: string, description: The label of the button that commits. }
        confirmation:
          type: object
          required: [required, prompt, expected]
          properties:
            required:
              type: boolean
              description: Whether the server will refuse without a matching `confirm`. Currently true for both.
            prompt: { type: string, description: The instruction shown above the field. }
            expected:
              type: string
              description: |
                The exact string the server will compare `confirm` against — the project's
                name. Sent so the client never decides what "matches" means; it may enable its
                own button on an exact match, but the server compares again and is the
                authority. The comparison is exact, not trimmed or case-folded.

    ProjectCascade:
      type: object
      description: |
        What an archive or a delete actually did. Both run the same cascade, in this order:

        1. **The stop boundary is stamped first.** `archived_at` is written in a single guarded
           UPDATE before anything else happens. From that moment the project's work is no
           longer offered by `POST /tasks/claim_next` and cannot be claimed by naming a task's
           id, so there is no window in which an agent can pick up work the cascade is about
           to stop. The guard is persisted rather than a lock, which means it also survives a
           crash: a cascade that dies half-done leaves the project closed to new work, and a
           retry finishes the job instead of starting a second one.
        2. Every non-archived agent holding one of the project's tasks is dismissed with the
           existing dismissal semantics, which hands its in-flight task back to the seashore.
        3. Every task in a stage with a legal transition to `closed` is closed.
        4. The postcondition is re-checked. If any live agent is somehow still holding this
           project's work the operation fails with `409` rather than reporting a success it
           cannot stand behind.

        Ordering is what lets the cascade reach in-flight work without lying about it: a
        dismissed agent's task lands in the seashore, and the seashore may legally be closed,
        so the task never has to be marked `done` to get out of the way.

        **The counts describe THIS run.** Deleting a project that was already archived reports
        zero dismissed and zero closed, because the archive already did that work — a count of
        what somebody else stopped is not a true answer to "what did this do".
      required: [agents_dismissed, tasks_closed, tasks_left_open, summary]
      properties:
        agents_dismissed: { type: integer }
        tasks_closed: { type: integer }
        tasks_left_open:
          type: integer
          description: |
            Tasks the workflow does not allow to be closed — in progress, blocked, or waiting
            on a specialist. Work that has started ends in `done`, and Campus will not record
            unfinished work as finished, so these are left exactly where they are. After a
            delete they remain on the board, detached from the project.
        summary:
          type: string
          description: |
            The same three numbers as one copy-safe sentence, and it names the verb —
            "Archiving this project…" or "Deleting this project…". The two operations do
            different things to the project and only one of them is reversible, so a reader
            who has just confirmed one deserves to be told which one they got.

    ImportOutcome:
      type: string
      description: What happened to one child folder. See `POST /projects/import`.
      enum: [created, skipped_worktree, skipped_existing, skipped_name_taken, skipped_not_a_directory]

    ImportReport:
      type: object
      description: |
        The result of `POST /projects/import`, identical in shape whether it was a preview
        or a real run — `dry_run` is the only thing that says which.
      required: [parent_path, dry_run, truncated, counts, results]
      properties:
        parent_path: { type: string, description: The folder that was walked, resolved. }
        dry_run: { type: boolean, description: "True → nothing was written; `created` rows mean *would be created*." }
        truncated:
          type: boolean
          description: More than 500 non-hidden children; only the first 500 were considered.
        counts:
          type: object
          description: One key per outcome, always all five, zeros included.
          required: [created, skipped_worktree, skipped_existing, skipped_name_taken, skipped_not_a_directory]
          additionalProperties: { type: integer }
          properties:
            created: { type: integer }
            skipped_worktree: { type: integer }
            skipped_existing: { type: integer }
            skipped_name_taken: { type: integer }
            skipped_not_a_directory: { type: integer }
        results:
          type: array
          description: One row per non-hidden child, sorted case-insensitively by name.
          items:
            type: object
            required: [name, path, outcome]
            properties:
              name: { type: string, description: The folder's name, which becomes the project's name. }
              path: { type: string, description: Absolute path, resolved through symlinked parents. }
              outcome: { $ref: "#/components/schemas/ImportOutcome" }
              reason:
                type: string
                description: Present on every skip — why this folder was passed over.
              project_id:
                type: integer
                description: |
                  The project this row is about: the one just created, or — for
                  `skipped_existing` / `skipped_name_taken` — the one already in the way.
                  Absent on a `created` row from a dry run, since nothing was created.
      example:
        parent_path: /Users/yuri/Documents/Codebase
        dry_run: true
        truncated: false
        counts: { created: 2, skipped_worktree: 1, skipped_existing: 1, skipped_name_taken: 0, skipped_not_a_directory: 1 }
        results:
          - { name: campus, path: /Users/yuri/Documents/Codebase/campus, outcome: skipped_existing, reason: 'already imported as "campus"', project_id: 1 }
          - { name: notes.md, path: /Users/yuri/Documents/Codebase/notes.md, outcome: skipped_not_a_directory, reason: not a folder }
          - { name: solomon, path: /Users/yuri/Documents/Codebase/solomon, outcome: created }
          - { name: typeship, path: /Users/yuri/Documents/Codebase/typeship, outcome: created }
          - { name: wt-feature-x, path: /Users/yuri/Documents/Codebase/wt-feature-x, outcome: skipped_worktree, reason: a git worktree of /Users/yuri/Documents/Codebase/typeship }

    AgentRuntime:
      type: string
      enum: [campus_spawned, self_hosted, hosted_service]
      default: campus_spawned
      description: |
        **Who runs this agent**, which is a different question from `provider` (what model
        backs it) and from `status` (what it says it is doing). Campus spawns a
        `campus_spawned` agent as a child process on this machine; a `self_hosted` one runs on
        somebody else's; a `hosted_service` one is a product someone else operates.

        Only the first has a process here to start, and until this existed Campus assumed all
        three did. The default keeps every agent that landed before it behaving exactly as it
        did.

    Capability:
      type: string
      description: |
        One thing an agent can do, matched against a task's `requirements` by set containment.
        Free-form lowercase snake_case, **not** a closed list: an agent that can do something
        Campus has never heard of must be able to say so, or every new skill in the world would
        need a Campus release first. The documented vocabulary below exists so that agents
        which mean the same thing spell it the same way.

        Normalised on the way in — downcased, trimmed, deduplicated, non-strings dropped —
        because the comparison is a jsonb containment query and one stray element makes a task
        permanently unclaimable with nothing anywhere to see it by.
      examples: [code_edit, shell, git, browse, test, review, chat, long_context, vision]

    Scope:
      type: string
      enum:
        [tasks:read, tasks:write, agents:read, agents:write, sessions:write, board:write,
         credentials:write, settings:write, admin]
      description: |
        One permission on a Campus credential. The same vocabulary for an agent's
        `token_scopes` and an API token's `scopes`, deliberately — an agent token and an API
        token must not mean two different things by the same word.

        **An empty list means full access**; see the Scopes section of this document's
        description for why that is the only migration-safe reading. Unknown members are
        refused rather than dropped, which is the opposite of how `capabilities` treats junk,
        and the asymmetry is the point: silently dropping an unrecognised scope leaves `[]`
        behind, and `[]` grants everything — so a typo in a scope name would *widen* the
        credential instead of refusing it.

    Agent:
      type: object
      description: "`Agent#as_json_public`. The token digest is never exposed."
      required:
        [id, name, character, provider, model, status, activity, tired, is_mascot, specialty,
         attention, current_task_id, credential_id, home_project_id, execution_context, created_at,
         archived_at, runtime, capabilities, token_scopes, last_seen_at, live, conversation,
         dismissal]
      properties:
        id: { type: integer }
        name: { type: string }
        character:
          type: object
          properties:
            archetype: { type: string, examples: [claude_starburst, openai_blossom, generic_blob] }
            seed: { type: string }
            palette: { type: [string, "null"] }
        provider: { type: [string, "null"] }
        model: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/AgentStatus" }
        activity: { $ref: "#/components/schemas/Activity" }
        attention: { $ref: "#/components/schemas/AgentAttention" }
        tired: { type: boolean }
        is_mascot: { type: boolean }
        specialty: { type: [string, "null"] }
        current_task_id: { type: [integer, "null"] }
        credential_id: { type: [integer, "null"] }
        home_project_id:
          type: [integer, "null"]
          description: The persisted home Project selected for a Campus-spawned Office.
        execution_context: { $ref: "#/components/schemas/AgentExecutionContext" }
        created_at: { type: string, format: date-time }
        archived_at: { type: [string, "null"], format: date-time, description: Set on dismissal; archived agents cannot authenticate. }
        dismissal:
          description: |
            The Rails-authored destructive action shown by human clients. `null` after the
            agent is dismissed. Clients withhold the action when this field is absent during
            mixed-version rollout or when `version` is unknown.
          oneOf:
            - { $ref: "#/components/schemas/AgentDismissalAction" }
            - { type: "null" }
        runtime: { $ref: "#/components/schemas/AgentRuntime" }
        capabilities:
          type: array
          description: |
            What this agent says it can do. Decides what work it may be handed — a task is
            claimable when its `requirements` are a subset of this list — and nothing else. An
            empty list can still take any task with no requirements, which is every task that
            existed before requirements did.
          items: { $ref: "#/components/schemas/Capability" }
        token_scopes:
          type: array
          description: |
            What this agent's own token may do. **Empty means full access**, which is what
            every agent that landed before scopes existed carries. Capabilities can only narrow
            what work an agent is *offered*; scopes decide what it may *do*.
          items: { $ref: "#/components/schemas/Scope" }
        last_seen_at:
          type: [string, "null"]
          format: date-time
          description: |
            When Campus last heard from this agent — bumped by every authenticated request it
            makes, not by the endpoints it happens to call, so an agent polling and finding
            nothing is still alive.

            The pair with `status` is the point. `status` is what the agent *says* about
            itself and is only ever as fresh as its last write, so a self-hosted agent that
            dies mid-task leaves `status: "working"` on the board forever. This is what Campus
            *observed*.
        live:
          type: boolean
          description: |
            Derived, not stored: `last_seen_at` within the last 2 minutes. Two minutes is
            tight because every authenticated request refreshes it, so silence here really is
            silence — unlike an external session's ten-minute window, which is bumped only when
            an agent has something to say.
        conversation:
          description: |
            What the NEXT message to this Office will do about its memory — a prediction,
            recomputed on read. The run that follows records what it actually did on its own
            `AgentSession`.
          allOf:
            - $ref: "#/components/schemas/AgentConversation"
        resume_recovery:
          $ref: "#/components/schemas/ResumeRecovery"

    ResumeRecovery:
      type: object
      description: |
        Rails-authored resume-class diagnosis for this Office's newest run. Present on every
        agent. `class` and `action` are null when the newest run is not a resume-class
        failure. A client renders `last_error` and `action.label` verbatim and never
        classifies the death from HTTP success or provider output.
      required: [version, class, last_error, action]
      properties:
        version: { type: integer }
        class:
          type: [string, "null"]
          enum: [conversation_missing, cwd_missing, dead_birth_binding, null]
        last_error: { type: [string, "null"] }
        action:
          type: [object, "null"]
          required: [version, id, label, description, intent]
          properties:
            version: { type: integer }
            id: { type: string, enum: [detach_and_start_fresh] }
            label: { type: string }
            description: { type: string }
            intent: { type: string, enum: [destructive] }

    AgentConversation:
      type: object
      description: |
        Whether this Office continues the provider conversation it was already having.

        Campus spawns a one-shot provider process per message, so without this every message
        started with no memory of the last one. `ProviderConversation` is the single authority
        for which providers can be continued and how they are asked; a client renders `mode`
        and `message` and never infers either from the provider, the model, or engine output.
      required: [version, mode, message]
      properties:
        version:
          type: integer
          description: |
            This object's contract version. A client that meets a version it does not know
            must render `message` and withhold conversation-specific affordances rather than
            substituting a rule of its own.
        mode:
          type: string
          enum: [resumed, fresh, unsupported]
          description: |
            `resumed` — the provider is asked to continue an existing conversation.
            `fresh` — a new conversation is started, and Campus records it so the next message
            continues from here.
            `unsupported` — Campus has no way to continue a conversation for this Office, so
            every message starts one with no memory of earlier messages. That is the honest
            answer for an Office Campus does not run at all, and for a provider registered
            through `Setting#engines` that Campus can spawn but has no resume for.
        message:
          type: string
          description: Rails-authored copy explaining the mode, rendered verbatim.

    AgentLanding:
      type: object
      description: |
        Everything an agent gets to declare about itself at landing. `name` is always required;
        `home_project_id` is conditionally required for `campus_spawned` when Settings has no
        selectable default. Every other field is a promise the agent makes about itself, and
        Campus stores what it is told.
      required: [name]
      properties:
        name: { type: string, example: scout-7 }
        credential_id:
          type: [integer, "null"]
          description: |
            An active saved credential from the current island. For a concrete provider,
            omitting it asks Campus to assign one: the first active credential for that
            provider in the island's fallback order, or `reason: no_credential` when there is
            none. It never selects the machine's own CLI login. Ignored when `provider` is
            `auto`, because Rails chooses the complete saved credential/provider/model tuple.
            Agent-token callers may not name a saved credential id. An id outside the
            authenticated island, or one that does not exist, is refused identically and is
            never silently replaced.
        home_project_id:
          type: [integer, "null"]
          description: |
            Required for `campus_spawned` unless the server's configured default from
            `GET /agents/landing_options` is being used. Ignored for externally run agents.
        provider:
          type: string
          description: |
            The literal `"auto"` (PRD_AGENT_FALLBACK.md §8, additive) asks Campus to pick
            for a `campus_spawned` agent: Rails resolves it to the least-used qualified
            credential's real provider, that credential, and a provider-pair-correct
            `model` (the configured default only when the resolved provider matches it;
            otherwise the catalog default; never a model for `openai`, which has none to
            guess). Any `credential_id`/`model` sent alongside `"auto"` is ignored — Campus
            chooses the whole pair. `"auto"` is accepted from an agent token exactly like
            any other provider; naming a `credential_id` explicitly stays forbidden for
            that caller regardless of provider. A landing with no qualified credential at
            all refuses with the same sentence any other credential-less provider gets.
            Every other value names a real provider directly, exactly as before.
          example: anthropic
        model: { type: string, example: claude-sonnet-5 }
        specialty: { type: [string, "null"], example: security }
        is_mascot: { type: boolean, default: false }
        skills: { type: array, items: { type: string } }
        runtime: { $ref: "#/components/schemas/AgentRuntime" }
        capabilities:
          type: array
          description: |
            What this agent can do. Sent as an array of scalars; anything nested is dropped
            before the model sees it, and what remains is downcased, trimmed and deduplicated.
          items: { $ref: "#/components/schemas/Capability" }
        token_scopes:
          type: array
          description: |
            What the token handed back should be allowed to do. Omit — or send `[]` — for full
            access. An unrecognised scope is `422` naming the offenders, never a silent drop.
          items: { $ref: "#/components/schemas/Scope" }
        protocol_version:
          type: string
          description: |
            The dialect this agent speaks. Stored, never validated, never a reason to refuse a
            landing — knowing what an agent speaks is worth more than turning it away for
            speaking something we have not met. The response carries the **server's** version,
            not this one.
          example: "1"
        character:
          type: object
          description: Merged over the provider-derived default.
          properties:
            archetype: { type: string }
            seed: { type: string }
            palette: { type: [string, "null"] }

    AgentLandingError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        reason:
          type: string
          enum: [no_credential, auto_all_over_threshold]
          description: Absent for ordinary validation failures.
        threshold:
          type: integer
          minimum: 0
          maximum: 100
          description: Present with `auto_all_over_threshold`; the server setting Auto enforced.
        credentials:
          type: array
          description: Present with `auto_all_over_threshold`; the same server-authored table Auto judged.
          items:
            type: object
            required: [credential_id, label, provider, used_percent, rank_percent, window,
                       resets, state, over_threshold]
            properties:
              credential_id: { type: integer }
              label: { type: string }
              provider: { type: string }
              used_percent: { type: [integer, "null"], minimum: 0, maximum: 100 }
              rank_percent: { type: [integer, "null"], minimum: 0, maximum: 100 }
              window: { type: [string, "null"], enum: [session, weekly, null] }
              resets: { type: [string, "null"] }
              state: { type: string, enum: [known, unknown] }
              over_threshold: { type: boolean }

    AgentWithToken:
      allOf:
        - $ref: "#/components/schemas/Agent"
        - type: object
          required: [token, landing_prompt, protocol_version, token_notice, start]
          properties:
            token:
              type: string
              description: 48-hex bearer token. Returned once and never again — only its digest is stored.
            landing_prompt:
              type: string
              description: The billboard markdown, so a landed agent knows the loop without a second request.
            protocol_version:
              type: string
              description: |
                The dialect **this server** speaks, not an echo of what the agent sent. An
                agent that opened with `"0.9"` is told `"1"` rather than agreed with.
              example: "1"
            token_notice:
              type: [string, "null"]
              description: |
                Rails-authored token handling guidance. Null when the queued start will rotate
                this token immediately; otherwise rendered verbatim beside the one-time token.
            start:
              $ref: "#/components/schemas/LandingStart"

    LandingStart:
      type: object
      description: |
        What Campus did about running the agent it just landed. `message` is written to be
        shown as it stands; `state` is for keying an icon or a tone off, never for composing
        a sentence a client then owns.
      required: [state, message]
      properties:
        state:
          type: string
          enum: [queued, declined, external_runtime, human_only, no_engine, not_local]
        message: { type: string }
      example:
        state: queued
        message: Campus is starting scout-7 now — landing an agent Campus runs is starting it.

    ProjectExecutionCapability:
      type: object
      required: [contract_version, selectable, start_allowed, reason, message, remediation]
      properties:
        contract_version: { type: integer, enum: [1] }
        selectable: { type: boolean }
        start_allowed: { type: boolean }
        reason:
          type: string
          enum: [ready, project_archived, local_execution_unavailable,
                 local_repository_required, local_repository_missing,
                 local_repository_inaccessible, local_repository_not_git]
        message: { type: string }
        remediation: { type: [string, "null"] }

    AgentLandingProject:
      type: object
      required: [id, name, execution]
      properties:
        id: { type: integer }
        name: { type: string }
        execution: { $ref: "#/components/schemas/ProjectExecutionCapability" }

    AgentLandingOptions:
      type: object
      required: [contract_version, bulk_landing, project_selection, credential_selection, task_override, ambient_credential, projects]
      properties:
        contract_version: { type: integer, enum: [2] }
        bulk_landing:
          type: object
          description: |
            How many agents this host can take, and the sentence explaining why. Versioned on
            its own so a client can adopt bulk landing without waiting for the rest of this
            contract to move.

            `maximum` is derived from the host's AVAILABLE memory, after reserving room for
            Campus and ordinary desktop work, bounded by the processor count, and it falls
            back to 11 exactly when the machine's counters cannot be read (`basis: fallback`).
            `available` is `maximum` minus the Campus-spawned agents already running, which is
            the number a quantity control should offer. Clients render these values and the
            explanation verbatim; a client that computes capacity is inventing a claim about a
            machine the server is the one running on.

            No name preview is published here: a preview is only true for a chosen model and
            credential, and this route has neither.
          required: [contract_version, capacity, message]
          properties:
            contract_version: { type: integer, enum: [1] }
            capacity:
              type: object
              required: [maximum, running, available, basis, explanation]
              properties:
                maximum: { type: integer, description: Agents this host can run at once. }
                running: { type: integer, description: Campus-spawned agents with a live session. }
                available: { type: integer, description: "`maximum` minus `running`, never below zero." }
                basis:
                  type: string
                  enum: [measured, fallback]
                  description: "`fallback` means the machine's counters could not be read and 11 is being offered."
                explanation: { type: string }
            message: { type: string }
        project_selection:
          type: object
          required: [required, default_project_id, message]
          properties:
            required: { type: boolean, enum: [true] }
            default_project_id: { type: [integer, "null"] }
            message: { type: string }
        credential_selection:
          type: [object, "null"]
          description: Present for human principals; null for agent tokens so credential metadata is not disclosed.
          required: [required, message, options, empty]
          properties:
            required:
              type: boolean
              enum: [false]
              description: A saved credential is optional because `ambient_credential` is a runnable explicit choice.
            message: { type: string }
            options:
              type: array
              items: { $ref: "#/components/schemas/Credential" }
            empty:
              type: object
              required: [message, action]
              properties:
                message: { type: string }
                action:
                  type: object
                  required: [id, label, destination, presentation]
                  properties:
                    id: { type: string, enum: [add_credentials] }
                    label: { type: string }
                    destination: { type: string, enum: [credentials] }
                    presentation: { type: string, enum: [add_credential] }
        task_override:
          type: object
          required: [rule, message]
          properties:
            rule: { type: string, enum: [task_project_for_next_session] }
            message: { type: string }
        ambient_credential:
          type: object
          description: |
            Copy for the "no credential selected" row. `label` describes what leaving the
            selection empty does — Campus assigns an active credential for the chosen provider
            in fallback order — and is rendered verbatim. `kind` is a retained wire constant,
            not an offer to bind the machine's own CLI login; see the endpoint description for
            the rename plan.
          required: [kind, label]
          properties:
            kind: { type: string, enum: [ambient] }
            label: { type: string }
        projects:
          type: array
          items: { $ref: "#/components/schemas/AgentLandingProject" }

    AgentExecutionContext:
      type: object
      required: [contract_version, start_allowed, reason, message, remediation, source,
                 project_id, project_name, task_id, task_override_rule, task_override_message]
      properties:
        contract_version: { type: integer, enum: [1] }
        start_allowed: { type: boolean }
        reason: { type: string }
        message: { type: string }
        remediation: { type: [string, "null"] }
        source: { type: string, enum: [home_project, current_task, not_applicable] }
        project_id: { type: [integer, "null"] }
        project_name: { type: [string, "null"] }
        task_id: { type: [integer, "null"] }
        task_override_rule: { type: string, enum: [task_project_for_next_session] }
        task_override_message: { type: string }

    AgentExecutionRefusal:
      type: object
      required: [error, execution_context]
      properties:
        error: { type: string }
        execution_context: { $ref: "#/components/schemas/AgentExecutionContext" }

    AgentDismissalAction:
      type: object
      required: [version, label, intent, confirmation]
      properties:
        version: { type: integer, enum: [1] }
        label: { type: string }
        intent: { type: string, enum: [destructive] }
        confirmation:
          type: object
          required: [title, body, confirm_label]
          properties:
            title: { type: string }
            body: { type: string }
            confirm_label: { type: string }

    RotatedAgent:
      description: |
        `POST /agents/{id}/rotate_token` — the agent, unchanged in every respect except its
        key, plus the new plaintext. No landing prompt and no protocol version: this is not a
        landing, and the agent already has both.
      allOf:
        - $ref: "#/components/schemas/Agent"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The new 48-hex bearer token. Shown once; the previous one is already dead.

    DismissedAgent:
      allOf:
        - $ref: "#/components/schemas/Agent"
        - type: object
          required: [released_task_id, released_task_title]
          properties:
            released_task_id: { type: [integer, "null"], description: The task pushed back to the seashore, if any. }
            released_task_title: { type: [string, "null"] }

    SessionState:
      type: string
      enum: [starting, running, exited, failed, lost]
      description: |
        `starting` and `running` are the open states — a session in either keeps a window lit
        on the island; `exited`, `failed` and `lost` are terminal, and a terminal session takes
        no more output. `lost` is a campus-spawned run whose OS process is gone without a
        provider refusal — the reaper stamps it so the Office stops offering Stop for a pid
        that does not exist, and the agent returns to the park. A session left in `running`
        goes on being believed until it has been silent for ten minutes (external) or its pid
        stops answering (spawned).

    TaskRuns:
      type: object
      additionalProperties: false
      required: [version, empty_message, entries]
      properties:
        version: { type: integer, enum: [1] }
        empty_message: { type: string, description: Rails-authored copy used when entries is empty. }
        entries:
          type: array
          description: Live runs first, then newest started run first; includes every prior holder.
          items: { $ref: "#/components/schemas/TaskRun" }

    TaskRun:
      type: object
      additionalProperties: false
      required: [session_id, agent_id, agent_name, engine, started_at, ended_at,
                 duration_seconds, outcome]
      properties:
        session_id: { type: integer }
        agent_id: { type: integer }
        agent_name: { type: string }
        engine: { type: string }
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        duration_seconds: { type: [number, "null"], minimum: 0 }
        outcome:
          type: object
          additionalProperties: false
          required: [state, exit_code, headline]
          properties:
            state: { $ref: "#/components/schemas/SessionState" }
            exit_code: { type: [integer, "null"] }
            headline: { type: string, description: Rails-authored outcome or failure summary. }

    AgentSession:
      type: object
      description: "One run. `AgentSession#as_json_public` — spawned and external alike."
      required:
        [id, agent_id, engine, state, pid, workdir, exit_code, last_error, project_id,
         project_name, execution_source, started_at, ended_at, source, label, external_ref,
         last_reported_at]
      properties:
        id: { type: integer }
        agent_id: { type: integer }
        engine:
          type: string
          description: |
            What produced this output. A free string for an external session — Campus never has
            to be able to spawn it — and one of the registry's engines for a spawned one.
          examples: [claude_cli, codex_cli, hermes]
        state: { $ref: "#/components/schemas/SessionState" }
        pid:
          type: [integer, "null"]
          description: |
            Always null for an external session, and deliberately never consulted for one:
            a pid belonging to another machine either matches nothing here — a confident "dead"
            for an agent that is working fine — or collides with an unrelated local process and
            reports a dead agent as alive. Both answers come out with the same confidence,
            which is what would make the check dangerous rather than merely wrong.
        workdir: { type: [string, "null"], description: The git worktree (or sandbox) the process runs in. }
        exit_code: { type: [integer, "null"] }
        last_error: { type: [string, "null"] }
        project_id:
          type: [integer, "null"]
          description: The Project this particular session executed in; preserved across later overrides.
        project_name: { type: [string, "null"] }
        execution_source:
          type: [string, "null"]
          enum: [home_project, current_task, null]
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        source:
          type: string
          enum: [campus, external]
          default: campus
          description: |
            Who is running the process this session transcribes. `campus` is one Campus spawned
            and holds a pid for; `external` is one that landed itself and runs somewhere we
            cannot see. Everything downstream — the transcript, the channel, the usage columns,
            the tired rule — is deliberately blind to this: it exists so liveness can ask the
            right question, not so the rest of Campus can treat the two differently.
        label:
          type: [string, "null"]
          description: The agent's own name for this run, for a human reading the office window.
        external_ref:
          type: [string, "null"]
          description: |
            The agent's own id for the run. What makes opening a session retry-safe: a live
            session already carrying this ref is returned with `200` instead of a second office
            being lit.
        last_reported_at:
          type: [string, "null"]
          format: date-time
          description: |
            When this session last said anything — bumped by `POST .../events` (empty batches
            included) and by `PATCH .../sessions/{session_id}`. It is the only liveness
            evidence an external session has, and it buys ten minutes.

            Ten rather than two, and the asymmetry of being wrong is the reason for the size.
            Too short and a working agent goes dark mid-run: its window unlights, every client
            tailing it is told it is finished, and a start would cheerfully spawn a second run
            over the top of the first. Too long and a crashed agent leaves one office lit,
            which a human can see is wrong and can clear by hand. One of those is a lie you can
            fix and the other costs you a duplicate agent, so the window errs long — and ten
            minutes is then set by the longest silence a *healthy* agent produces, which is a
            single long tool call.
        native_session:
          description: |
            The exact provider-native conversation this row binds or resumes. Absent from
            ordinary sessions. Rails authors the version and normalized identity; clients do
            not infer resume behavior from engine output.
          allOf:
            - $ref: "#/components/schemas/NativeSessionBinding"
        conversation:
          description: |
            What THIS run did about the Office's memory, which stays true after the Office has
            moved on to another conversation. Absent from a run that was never part of the
            feature — a brokered native resume, whose whole story is `native_session`, and a
            session an external agent reported for itself.
          allOf:
            - $ref: "#/components/schemas/AgentConversation"
        credential:
          description: |
            Which account paid for this run. Absent from a run that named no credential.
          allOf:
            - $ref: "#/components/schemas/SessionCredential"
        takeover:
          description: |
            Present only on a run Campus started to continue a previous one the provider
            refused at a rate limit. Absent from every ordinary run.
          allOf:
            - $ref: "#/components/schemas/SessionTakeover"

    SessionCredential:
      type: object
      description: |
        The credential this run was billed to, answered from immutable columns copied onto the
        session when it started rather than from the credential row itself. `provider` and
        `label` are therefore still true after the credential is deleted, which is what keeps a
        historical run's cost reconcilable to the account that paid it; `id` goes null at that
        point, because there is no longer a row to point at.
      required: [id, provider, label]
      properties:
        id: { type: [integer, "null"] }
        provider: { type: [string, "null"] }
        label: { type: [string, "null"] }

    SessionTakeover:
      type: object
      description: |
        A run's place in a takeover chain. Rails authors `message`; a client renders it and
        must not assemble its own sentence from the id.
      required: [of_session_id, message]
      properties:
        of_session_id:
          type: integer
          description: The rate-limited run this one was started to continue.
        message:
          type: string
          description: |
            Server-authored provenance, including the honest note that the successor was told
            to check what the interrupted run had already done before repeating any of it.

    NativeSessionBinding:
      type: object
      required: [version, id, provider, credential_id, project_path, title, import_cursor]
      properties:
        version: { type: integer, const: 1 }
        id: { type: string, description: Opaque provider session id. }
        provider: { type: string, enum: [anthropic, openai] }
        credential_id: { type: integer }
        project_path: { type: [string, "null"] }
        title: { type: [string, "null"] }
        import_cursor: { type: [string, "null"] }

    NativeSessionCredential:
      type: object
      required: [id, provider, label, account_email]
      properties:
        id: { type: integer }
        provider: { type: string }
        label: { type: string }
        account_email: { type: [string, "null"] }

    NativeSessionPreview:
      type: object
      required: [native_session_id, provider, project_path, title, started_at, updated_at]
      properties:
        native_session_id: { type: string, description: Opaque provider session id. }
        provider: { type: string, enum: [claude, codex] }
        project_path: { type: [string, "null"] }
        title: { type: [string, "null"] }
        started_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }

    NativeSessionCapability:
      type: object
      required: [version, state, discoverable, attachable, heading, message, credential, sessions]
      properties:
        version: { type: integer, const: 1 }
        state:
          type: string
          enum: [available, broker_unavailable, unsupported_version, unsupported_provider,
                 unsupported_credential, credential_mismatch, credential_unavailable,
                 project_missing, office_live]
        discoverable: { type: boolean }
        attachable: { type: boolean }
        heading: { type: string, description: API-authored copy rendered verbatim. }
        message: { type: string, description: API-authored copy rendered verbatim. }
        credential: { $ref: "#/components/schemas/NativeSessionCredential" }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/NativeSessionPreview" }

    NativeSessionAttachRequest:
      type: object
      required: [version, credential_id, native_session_id]
      properties:
        version: { type: integer, const: 1 }
        credential_id: { type: integer }
        native_session_id: { type: string, maxLength: 512 }

    NativeSessionAttachResult:
      type: object
      required: [version, state, heading, message, native_session, session]
      properties:
        version: { type: integer, const: 1 }
        state: { type: string, const: attached }
        heading: { type: string, description: API-authored copy rendered verbatim. }
        message: { type: string, description: API-authored copy rendered verbatim. }
        native_session: { $ref: "#/components/schemas/NativeSessionBinding" }
        session: { $ref: "#/components/schemas/AgentSession" }

    NativeSessionRefusal:
      type: object
      required: [version, state, heading, message]
      properties:
        version: { type: integer, const: 1 }
        state: { type: string }
        heading: { type: string, description: API-authored copy rendered verbatim. }
        message: { type: string, description: API-authored copy rendered verbatim. }

    SessionOpen:
      type: object
      description: What an external agent sends to open a run.
      required: [engine]
      properties:
        engine:
          type: string
          description: |
            Whatever is actually producing this session's output. A free string, required —
            without it a transcript arrives with nothing on it to say what wrote it.
          example: hermes
        state:
          allOf: [{ $ref: "#/components/schemas/SessionState" }]
          default: running
          description: |
            Defaults to `running`, not to the column's `starting`: an external agent posts this
            when it is already up. Send `starting` if it is still warming up.
        label: { type: [string, "null"], example: nightly backlog sweep }
        external_ref:
          type: [string, "null"]
          description: |
            The agent's own id for this run. Send one: it is what makes a retry idempotent.
            Without it there is nothing to match on and every call opens a new session, which
            is the honest reading of a client that declined to name its own work.
          example: run-2026-07-28-01
        workdir: { type: [string, "null"] }

    SessionOutput:
      type: object
      description: |
        One request's worth of output. **Two shapes**, because Campus does not control these
        clients: `lines` for a batch, or `kind`/`body` for a single line in the same shape the
        spawned path uses. A body carrying neither is `400`; `{"lines": []}` is a deliberate
        heartbeat and is accepted.
      properties:
        lines:
          type: array
          maxItems: 500
          description: |
            Up to 500 lines, each under 64 KB. Blank lines are neither stored nor streamed.
            An empty array records nothing and still counts as a report.
          items: { type: string }
        kind:
          type: string
          enum: [stdout, stderr]
          default: stdout
          description: |
            Only the paint on a line. An unrecognised value falls back to `stdout` rather than
            being refused — losing a run's output to protect the label on it would be the wrong
            trade every time. Usage is scanned on both streams here, unlike the spawned path.
        body:
          type: string
          description: A single line, as an alternative to `lines`.

    SessionOutputReceipt:
      type: object
      description: What `POST /agents/{id}/sessions/{session_id}/events` answers with.
      required: [session_id, recorded, cursor, last_reported_at]
      properties:
        session_id: { type: integer }
        recorded:
          type: integer
          description: |
            Rows actually written. Lower than what was sent when blank lines were dropped, and
            `0` for a heartbeat — which is still a `201`, because one status is worth more to a
            client than the extra honesty of a `200` for the empty case.
        cursor:
          type: [integer, "null"]
          description: The id of the last event written, or null when none was.
        last_reported_at: { type: string, format: date-time }

    SessionReport:
      type: object
      description: |
        State, outcome and usage, reported from outside. Every field is optional: a usage-only
        report leaves everything else alone and still counts as a report, and so does an empty
        body.

        The usage counters are applied as running **maxima**, never as plain writes. An engine
        states cumulative totals, so a client that retried a delivery it was not sure landed
        would otherwise double-count itself into the tired cohort — a halo earned by a flaky
        network rather than by spending anything. Numbers sent as strings are still numbers.
      properties:
        state: { $ref: "#/components/schemas/SessionState" }
        exit_code:
          type: [integer, "null"]
          description: An explicit `null` clears a value reported earlier, which is a different request from one that never mentioned the field.
        last_error:
          type: [string, "null"]
          description: Same explicit-null rule as `exit_code`.
        ended_at:
          type: string
          format: date-time
          description: |
            Optional. Moving to a terminal state stamps this if the client did not send one —
            a session that says it ended without saying when leaves every duration
            unanswerable — but a client that sent a usable timestamp keeps it, because a report
            arriving late still knows when the run finished better than the clock reading it.
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        cache_read_tokens: { type: integer, minimum: 0 }
        cache_creation_tokens: { type: integer, minimum: 0 }
        total_cost_usd: { type: number, minimum: 0 }
        num_turns: { type: integer, minimum: 0 }
        duration_ms: { type: integer, minimum: 0 }

    Engine:
      type: object
      description: |
        One row of the engine registry — what this installation knows about a provider, and
        whether it will spawn it.
      required: [provider, display_name, engine, binary, spawnable, credential_kinds,
                 model_catalog_supported, fallback, spawn_note, credential_kinds_note]
      properties:
        provider:
          type: string
          description: |
            The key an agent lands with. What ties an agent to an engine. `"auto"` is a
            special row (PRD_AGENT_FALLBACK.md §8): landing with `provider: "auto"` resolves
            it to the least-used qualified credential's real provider + credential_id +
            model, so `spawnable` is always `false` for the row itself — it names a choice
            Rails makes, not an engine anything ever invokes directly — while the agent it
            produces is ordinary from the moment it lands. A landing that finds no qualified
            credential at all refuses the same way any other provider with none does.
          examples: [anthropic, openai, google, openrouter, auto]
        display_name:
          type: string
          description: Server-authored provider label for dropdowns; unknown registered providers are titleized.
          examples: [Anthropic (Claude), OpenAI (Codex), "Auto — least used"]
        engine:
          type: [string, "null"]
          description: |
            The invocation Campus knows, or null for an entry that names none. An entry with no
            engine can never be spawnable however its flag is set — otherwise a typo'd settings
            entry becomes a start that gets all the way to provisioning a workspace before
            failing.
          examples: [claude_cli, codex_cli, gemini_cli]
        binary:
          type: [string, "null"]
          description: What has to be on `PATH` for a start to work.
          examples: [claude, codex, gemini]
        spawnable:
          type: boolean
          description: |
            Whether Campus will start this itself. False either because the entry names no
            engine, or because an operator switched it off in `settings.engines`. Absent still
            means spawnable — an entry that says nothing about the flag stays on, which is what
            every built-in relies on — and the flag is cast rather than compared, because a
            JSON client sends `false` and a form-encoded PATCH sends the string `"false"`, and
            an operator switching an engine off in a hurry is exactly the person who cannot
            afford to be told it worked when it did not.
        credential_kinds:
          type: array
          items: { type: string, enum: [api_key, cli_subscription, ambient] }
          description: |
            Stored credential kinds the runner can actually apply for this provider. Clients
            use this list to prevent a credential picker from promising a pairing the server
            will silently ignore. A present empty list means none; settings-only providers
            stay empty because registering an invocation does not teach Campus how to inject
            that provider's secret. Google deliberately lists both: API keys run through
            Gemini and CLI subscriptions through the macOS Antigravity broker.
        model_catalog_supported:
          type: boolean
          description: |
            Whether Rails has a model-selection contract for this provider. False for a
            settings-registered provider whose invocation does not also define discovery,
            normalization, defaults and validation; clients must not offer those entries in
            provider/model Settings controls.
        fallback:
          type: string
          enum: [supported, unsupported]
          description: |
            Whether Campus has a MEASURED, pinned rate-limit signature for this provider's
            agent-run mode (PRD_AGENT_FALLBACK.md §1) — additive, so clients render truth
            instead of promise. Derived from the `RateLimitSignature` registry rather than a
            hardcoded list: a provider reads `supported` iff the registry carries a
            fixture-pinned entry for it. `(anthropic, agent_stream_json)` and
            `(openrouter, agent_stream_json)` are measured today (the latter runs on the same
            `codex_cli` engine as `openai`, gateway-configured — PRD §10 / S8); every other
            (provider, mode) pair is honestly `unsupported` until its own signature is
            measured. `unsupported` does not mean "cannot run" — it means a rate-limited run
            on that provider fails exactly as it always has, with no takeover offered.
        active_credentials:
          type: array
          description: |
            **Present only for a caller who may read credentials** — a human (or an API token
            acting for one) holding `credentials:write`, exactly what `GET /credentials`
            costs. Agents must never enumerate credentials, and a `label` can fall back to an
            account's email address, so for anyone else this key and `credential_note` are
            absent and the row is the shape it has always been. A client treats absent as
            "the server did not say" and hides nothing.

            This installation's **active** credentials for the provider, oldest first — the
            join between "what Campus could spawn" and "what it can authenticate". Clients
            offer a provider in a provider/model picker only when this list is non-empty (and
            may name the credential beside it); a provider Campus can spawn but cannot
            authenticate is not a choice, and offering it only produced a refusal later. A
            saved provider that has since lost its credentials stays visible as a preserved
            row so an unrelated save cannot silently rewrite it. Unverified and expired
            credentials are deliberately absent: they are not something an agent can run with.
          items: { $ref: "#/components/schemas/EngineCredential" }
        credential_note:
          type: [string, "null"]
          description: |
            Server-authored copy for the empty case, null when `active_credentials` is
            non-empty and absent entirely for a caller who may not read credentials. It exists
            so a client renders one sentence about a domain it does not own instead of
            composing its own; the Credentials destination it names is the client's own
            navigation.

            The `provider: "auto"` row (see below) is never itself empty of credentials in
            the ordinary sense — it is not tied to one provider's list at all — so it always
            carries its own explanatory sentence here instead of the generic one.
          examples:
            - "Campus has no active anthropic credential, so it cannot run this provider yet. Add one under Credentials, then pick a model here."
            - "Picks the least-used qualified credential across every provider at landing time, then behaves like an ordinary agent on whatever it picked — nothing ever persists provider \"auto\". A landing that finds no qualified credential at all refuses the same way any other provider with none does."
        spawn_note:
          type: [string, "null"]
          description: |
            Why Campus will not start this provider, in words for the person looking at a
            picker, and `null` when it will. Render it; never compose a sentence about this
            from `spawnable` and a guess at the reason.

            **Compatibility.** This field replaced `notes` on 2026-08-17 and `notes` is no
            longer sent. `notes` carried the operational facts about an engine — how the CLI
            is spawned, which exit code lies, what scrubs `XAI_API_KEY` — and clients rendered
            it verbatim under the Provider picker, so a brand-new island on a hosted
            deployment showed five to seven lines of internal documentation in red, with the
            AWS Lambda explanation appended. Those facts still exist in
            `EngineRegistry::DEFAULTS` as operator documentation; they are simply not part of
            this contract, because they were never written for a reader. A client that still
            decodes `notes` gets an absent field and must treat that as "nothing to say"
            rather than as an error; every shipped client already defaults it to empty.

            Four reasons, one sentence each, ordered by what a reader can act on:
          examples:
            - "This Campus runs in the cloud and cannot start Anthropic (Claude) here. Land a self-hosted agent instead, or run Campus on your own Mac."
            - "Anthropic (Claude) is switched off for this Campus. Turn it back on in Settings, or choose another provider."
            - "This Campus has no way to start Anthropic (Claude). Choose another provider, or run this agent outside Campus."
            - "Campus picks the provider and credential for you when this agent lands."
        credential_kinds_note:
          type: [string, "null"]
          description: |
            Why a credential kind this provider normally accepts is unavailable right now, and
            `null` when none is. Today the one case is a Google CLI login while the macOS
            broker's `agy` path is unhealthy: `credential_kinds` loses `cli_subscription` and
            `ambient`, and this says why, so a reader is not left wondering where the
            credential they already added went. It used to be appended to `notes`, which is
            how one genuinely user-facing sentence came to travel beside five lines that were
            not.
          examples:
            - "The unlocked macOS broker's `agy` engine is not currently available, so Google CLI-login credentials are blocked until that broker path is healthy."

    EngineCredential:
      type: object
      additionalProperties: false
      required: [id, label, kind]
      description: |
        One active credential, named the way `GET /credentials` names it. Enough to choose
        and to show; never the secret, and never the config dir.
      properties:
        id: { type: integer }
        label:
          type: string
          description: Server-authored — the operator's label, else `provider · account email`.
        kind: { type: string, enum: [api_key, cli_subscription, ambient] }

    ModelCatalog:
      type: object
      additionalProperties: false
      required: [version, provider, credential_id, status, source, cache, fetched_at, default_model,
                 recommended_model, models, warning, notice, reason]
      properties:
        version:
          type: integer
          const: 2
          description: Explicit generation of this Rails-owned response contract.
        provider: { type: string }
        credential_id:
          type: [integer, "null"]
          description: The selected active credential when discovery was scoped, otherwise null.
        status:
          type: string
          enum: [available, stale, unavailable, unsupported]
          description: |
            `stale` is a prior successful catalog after a failed refresh. `unavailable` means
            discovery exists but failed and there is no stale copy. `unsupported` means
            nothing this installation holds can answer a model-list question for the
            provider — and `warning` then distinguishes the two ways that happens: no active
            credential at all, or an active credential whose kind has no safe list-only
            operation. An active CLI subscription whose supported set Campus knows is
            `available`, not `unsupported`; see `notice`.
        source:
          type: [string, "null"]
          description: |
            Successful sources joined with `+`, e.g. `openai_api+codex_app_server`.
            `<provider>_subscription` is the set an active CLI subscription supports, which is
            Campus's own answer rather than a vendor response — see `notice`.
        cache: { type: string, enum: [fresh, refreshed, stale, none] }
        fetched_at: { type: [string, "null"], format: date-time }
        default_model: { type: [string, "null"] }
        recommended_model: { type: [string, "null"] }
        models:
          type: array
          description: |
            Server-ordered, and the order is meaningful: the recommendation first, then the
            catalog's own order — a vendor list keeps the vendor's ordering, and Campus's own
            compatibility set is written strongest first. A preserved saved model that is no
            longer available is appended last. Clients render this order and must not re-sort
            it; sorting by display name is what once put Haiku above Opus.
          items: { $ref: "#/components/schemas/ModelCatalogEntry" }
        warning:
          type: [string, "null"]
          description: API-authored availability, partial-refresh, stale, or preserved-value warning.
        notice:
          type: [string, "null"]
          description: |
            API-authored explanation of an **available** catalog that did not come from a live
            vendor response — currently, the model set an active CLI subscription supports. It
            is deliberately not a `warning`: nothing is degraded, and a Claude subscription
            reported as a missing credential was the bug this field exists to end. Withheld as
            soon as any live source also answers, because a merged catalog is not the
            subscription's set. Null when there is nothing to explain; clients render it as
            information, never as a failure.
        reason:
          type: [string, "null"]
          description: |
            `no_credential` when the provider has no active credential at all — the same
            machine-readable code the error envelope carries on credential-less operations,
            so a model-selection client can offer the way to credential setup (Settings →
            Credentials) without parsing `warning`, which carries the matching
            server-authored sentence. Null whenever an active credential exists. Mac and web
            clients render `warning` and route the Credentials deep-link off this code
            only; they must not re-parse `warning` prose for meaning.

    ModelCatalogEntry:
      type: object
      additionalProperties: false
      required: [id, display_name, availability, recommended]
      properties:
        id: { type: string, description: Normalized id written to settings and passed to the provider. }
        display_name: { type: string, description: Server-normalized human label. }
        availability: { type: string, enum: [available, unavailable] }
        recommended: { type: boolean }

    ApiToken:
      type: object
      description: |
        A named, scoped, revocable credential for a client that is neither a browser nor an
        agent. `ApiToken#as_json_admin` — **never** the plaintext and never the digest: the
        digest is not a secret the way the plaintext is, but it is the exact value
        authentication compares against, so handing it to a client turns an offline guess into
        an offline verification.
      required: [id, name, scopes, created_by, active, last_used_at, expires_at, revoked_at, created_at]
      properties:
        id: { type: integer }
        name:
          type: string
          description: |
            Unique, case-insensitively. Also what lands in `created_by` and `actor_name` on
            every row this token writes, permanently and unrenamably, so the audit trail says
            *which* credential acted.
          example: ci-deploy-bot
        scopes:
          type: array
          description: Empty means full access — the operator's explicit choice, made by leaving the list empty.
          items: { $ref: "#/components/schemas/Scope" }
        created_by:
          type: [string, "null"]
          description: The email of the administrator who minted it.
          format: email
        active:
          type: boolean
          description: |
            Neither revoked nor expired. Derived, and the field worth reading first — it folds
            both conditions together so a client never has to compare `expires_at` against its
            own clock.
        last_used_at:
          type: [string, "null"]
          format: date-time
          description: |
            When this credential last authenticated a request. Refreshed at most once every
            five minutes per token, deliberately: it exists to answer "is this still in use",
            which nobody asks to the second, and writing it on every request would make the
            table every request reads also the table every request dirties.
        expires_at: { type: [string, "null"], format: date-time }
        revoked_at:
          type: [string, "null"]
          format: date-time
          description: |
            When it stopped working. Revocation keeps the row, so what a token did stays
            readable after it can no longer do it.
        created_at: { type: string, format: date-time }

    ApiTokenList:
      type: object
      additionalProperties: false
      required: [api_tokens]
      properties:
        api_tokens:
          type: array
          description: Newest first, revoked and expired included.
          items: { $ref: "#/components/schemas/ApiToken" }

    IssuedApiToken:
      description: |
        The one response that carries a plaintext token. Campus stores a SHA-256 digest and
        cannot reissue or recover it.
      allOf:
        - $ref: "#/components/schemas/ApiToken"
        - type: object
          required: [token, notice]
          properties:
            token:
              type: string
              description: 48 hex characters, exactly the shape an agent's token has — a Campus bearer token should look like one whichever door it came through.
            notice:
              type: string
              description: Says out loud that this is the only time the token is shown, and names the call that replaces it.
              example: >-
                this is the only time the token is shown. Campus stores a SHA-256 digest and
                cannot reissue it or recover it — copy it now. If it is lost, revoke this one
                with DELETE /admin/api_tokens/12 and create another.

    VisitorPass:
      type: object
      description: |
        `VisitorPass#as_json_admin` — **never** the plaintext and never the digest, same
        reasoning as `ApiToken`. Opens `GET /join` and lands exactly one agent through
        `POST /agents/land` before it is spent; landing forces `runtime: "self_hosted"`
        regardless of the pass's own fields.
      required: [id, label, project_id, max_agents, agents_landed_count, expires_at, revoked_at, valid, created_at]
      properties:
        id: { type: integer }
        label: { type: string, description: How a human tells one pass from another in the list. }
        project_id:
          type: [integer, "null"]
          description: What `GET /join` resolves to when its own `?project=` is absent or unresolved. Null is island-wide.
        max_agents:
          type: integer
          description: How many agents this pass may ever land, total.
          default: 5
        agents_landed_count:
          type: integer
          description: How many have landed against this pass so far.
        expires_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        valid:
          type: boolean
          description: Not revoked, not expired, and `agents_landed_count < max_agents` — everything `POST /agents/land` checks before admitting a visitor.
        created_at: { type: string, format: date-time }

    IssuedVisitorPass:
      description: |
        The one response that carries a plaintext pass token. Campus stores a SHA-256 digest
        and cannot reissue or recover it.
      allOf:
        - $ref: "#/components/schemas/VisitorPass"
        - type: object
          required: [token, invite_sentence, notice]
          properties:
            token:
              type: string
              description: "`cvp_` followed by 48 hex characters — prefixed so a pasted credential is recognisable as a visitor pass at a glance."
              example: cvp_4f2a9c1e8b3d7065e4a1c2b9d8f70634e5a1b2c3d4e5f607
            invite_sentence:
              type: string
              description: Server-authored, ready to paste into another agent's very first prompt exactly as returned.
              example: >-
                Join the Campus at https://campus.example.com with pass
                cvp_4f2a9c1e8b3d7065e4a1c2b9d8f70634e5a1b2c3d4e5f607. Fetch GET /join with
                header Authorization: Bearer cvp_4f2a9c1e8b3d7065e4a1c2b9d8f70634e5a1b2c3d4e5f607
                and follow its instructions exactly. If you are working inside a repository,
                pass its name as ?project=<name>.
            notice:
              type: string
              description: Says out loud that this is the only time the token is shown, and names the call that replaces it.

    JoinDocument:
      type: object
      description: |
        `JoinDocument.render` — everything a stranger's agent needs to land itself and start
        working, assuming no prior knowledge of Campus. Server-authored in one place so the
        prose and the machine fields below it can never say two different things.
      required: [version, document, endpoint_origin, project, land, endpoints]
      properties:
        version: { type: integer }
        document:
          type: string
          description: Markdown. A language-model agent can follow this alone with no other knowledge of Campus.
        endpoint_origin:
          type: string
          description: The base URL every path below is relative to.
          example: https://campus.example.com
        project:
          type: [object, "null"]
          description: What this pass resolved to — PART 1 item 4's four-way order. Null is an island-wide visitor.
          properties:
            id: { type: integer }
            name: { type: string }
        land:
          type: object
          description: The exact `POST /agents/land` call to make next, body already filled in.
          required: [method, path, body]
          properties:
            method: { type: string, enum: [POST] }
            path: { type: string }
            body:
              type: object
              description: "A ready-to-send agent-landing body. `home_project_id` mirrors `project` above."
        endpoints:
          type: object
          description: The rest of the work loop, as method/path pairs. `{id}` is a task or agent id, filled in by the caller.
          required: [claimable_list, claim, comment, transition, heartbeat, release, leave]
          properties:
            claimable_list: { $ref: "#/components/schemas/JoinEndpoint" }
            claim: { $ref: "#/components/schemas/JoinEndpoint" }
            comment: { $ref: "#/components/schemas/JoinEndpoint" }
            transition: { $ref: "#/components/schemas/JoinEndpoint" }
            heartbeat: { $ref: "#/components/schemas/JoinEndpoint" }
            release: { $ref: "#/components/schemas/JoinEndpoint" }
            leave: { $ref: "#/components/schemas/JoinEndpoint" }

    JoinEndpoint:
      type: object
      required: [method, path]
      properties:
        method: { type: string, enum: [GET, POST] }
        path: { type: string }

    SessionEvent:
      type: object
      required: [id, agent_session_id, kind, body, display_body, transcript, created_at]
      properties:
        id: { type: integer }
        agent_session_id: { type: integer }
        kind: { type: string, examples: [stdout, stderr] }
        body: { type: [string, "null"], description: Immutable audit record, truncated to 8000 characters at write time. Never render this field directly. }
        display_body:
          type: string
          description: Rails-authored rendering form with ANSI terminal sequences, bidirectional overrides, and zero-width controls removed recursively from structured JSON. Clients render this field while retaining body only for audit.
        transcript: { $ref: "#/components/schemas/TranscriptEntry" }
        created_at: { type: string, format: date-time }

    TranscriptEntry:
      type: object
      description: |
        Rails' own reading of one engine line, so a client never classifies provider events
        itself. Additive beside `body` and `display_body`, which are unchanged.

        A provider record shape Campus has not measured is answered honestly rather than
        dropped or dressed up: `role: out`, the record's own type as the label, and
        `secondary: true`.

        Clients accept contract version 1 and its documented enums. A present unknown version
        or enum fails closed; it must not revive client-side parsing of the provider `body`.
      required: [contract_version, role, text, text_format, secondary, is_error]
      properties:
        contract_version: { type: integer, examples: [1] }
        role:
          type: string
          enum: [agent, human, tool, status, error, out]
          description: |
            `agent` is the model's own prose and is the only role a client should draw as the
            agent speaking. `human` is a native transcript's user prompt, `tool` is work it
            did, `status` is bookkeeping, `error` is a wall it hit, `out` is a line Campus
            could not classify.
        label:
          type: [string, "null"]
          maxLength: 200
          description: Server-authored headline or activity label for the line, e.g. "Ran a command", "Edited 2 files", or "Used Read" beside agent prose. Null when `text` is the whole story.
        text:
          type: string
          description: The readable body, display-safe and truncated to 2000 characters. The full record remains in `body`.
        text_format:
          type: string
          enum: [plain, command, command_output, file_list]
          description: How to render `text`. Anything but `plain` is monospace machine output, which is what keeps a page of SQL out of a speech bubble.
        secondary:
          type: boolean
          description: Bookkeeping and routine tool activity. Clients collapse or de-emphasize these; a failure is never secondary.
        is_error: { type: boolean }

    AgentMessage:
      type: object
      required: [id, agent_id, direction, body, delivered, created_at, updated_at]
      properties:
        id: { type: integer }
        agent_id: { type: integer }
        direction: { type: string, enum: [to_agent, from_agent], description: Derived from the sender's token, never the body. }
        body: { type: string }
        delivered: { type: boolean }
        dispatch_state:
          type: [string, "null"]
          enum: [waiting, queued, running, completed, failed, null]
          description: |
            Durable delivery state. `waiting` is an external agent's inbox handoff;
            `queued`/`running`/`completed` describe a Campus runner session. `failed` is
            terminal and carries `dispatch_error`. Null on legacy rows and agent replies.
        dispatch_error:
          type: [string, "null"]
          description: Why Campus could not start or finish the message-triggered run.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Credential:
      type: object
      description: "`Credential#as_json_public`. `secret` is write-only and never present."
      required: [id, provider, kind, label, account_email, status, config_dir, created_at, availability,
                 exhausted_until, fallback_position]
      properties:
        id: { type: integer }
        provider: { type: string, enum: [anthropic, openai, google, xai, openrouter, custom] }
        kind: { type: string, enum: [api_key, cli_subscription, ambient] }
        label: { type: string, description: "Falls back to `\"<provider> · <account_email or 'unverified'>\"`." }
        account_email: { type: [string, "null"] }
        status:
          type: string
          enum: [unverified, active, expired]
          description: |
            `unverified` — created, never confirmed to work. `active` — a login check passed
            or an API key has stored secret material; a registered executor still requires its
            own verified binding before it may run. `expired` — a previously active login was
            proven broken, so an isolated subscription must sign in and verify again
            (`POST /credentials/{id}/login_command`, then `POST /credentials/{id}/verify`).
            An inconclusive provider check never expires a credential.

            A legacy `ambient` row reports its stored status like any other, but Campus no
            longer provisions or restores one: the kind was retired on 2026-08-16 and is never
            selected for a run, only honoured through an explicit existing binding.
        config_dir:
          type: [string, "null"]
          description: Private Campus-owned config directory for an isolated CLI subscription, the broker-observed provider-default directory for an ambient login, or null for an API key.
        created_at: { type: string, format: date-time }
        availability:
          $ref: "#/components/schemas/CredentialAvailability"
        exhausted_until:
          type: [string, "null"]
          format: date-time
          description: |
            The live exhaustion marker, when one is set — temporary bookkeeping distinct
            from `status`: a rate limit or a usage probe finding 0% remaining never expires
            a credential. Null when no marker is live or a previous one has already passed.
            See `resting_message` on `CredentialUsage` for the server-authored copy this
            pairs with.
          examples: ["2026-08-11T18:40:00Z", null]
        fallback_position:
          type: [integer, "null"]
          description: |
            This island's manual fallback-chain order. `GET /credentials` renders in
            `(fallback_position, id)` order — the list IS the chain, top to bottom — and
            `POST /credentials/{id}/reorder` is the only way to change it. No two rows are
            required to hold different values by a database constraint; every reorder or
            new-credential placement renumbers the whole island densely instead. Null only
            momentarily, before a newly created row is placed.
          examples: [1, 2, null]

    CredentialAvailability:
      type: object
      required: [state, message]
      description: |
        Whether THIS deployment target can actually put this credential to work right now —
        distinct from `status`, which is about the login itself. A provider CLI login's OAuth
        tokens live on one registered Mac, so an active `cli_subscription` or `ambient`
        credential can still be unusable from the AWS request process while remaining usable
        through its verified executor;
        a client must never infer that from HTTP status alone, so Rails authors both the
        verdict and the explanation.
      properties:
        state:
          type: string
          enum: [usable, needs_secret, machine_bound]
          description: |
            `usable` — this deployment can use it: local execution (any kind), or a
            serverless `api_key` with a stored secret. `needs_secret` — a serverless
            `api_key` with no stored secret; it must be re-entered on this deployment.
            `machine_bound` — a `cli_subscription` or `ambient` credential on a serverless
            deployment; its tokens live on a registered Mac and Lambda delegates rather than
            reading them.
        message:
          type: [string, "null"]
          description: API-authored explanation, present for every non-`usable` state and null for `usable`.

    CredentialUsage:
      type: object
      required: [version, credential_id, provider, state, severity, source, heading, message, dimensions]
      properties:
        version:
          type: integer
          const: 1
          description: Explicit response-contract version; clients never infer schema generations.
        credential_id: { type: integer }
        provider: { type: string, enum: [anthropic, openai, google, xai, openrouter, custom] }
        state: { type: string, enum: [available, unsupported, unavailable, unknown, error] }
        severity: { type: string, enum: [neutral, good, attention, failure] }
        severity_label:
          type: [string, "null"]
          description: Server-authored accessible label for the semantic severity.
        source: { type: string, const: provider_account }
        heading: { type: string, description: API-authored card heading. }
        message: { type: string, description: API-authored domain explanation. }
        detail:
          type: [string, "null"]
          description: |
            Optional API-authored supporting detail. For `unknown`, this is the bounded raw
            terminal tail that could not be recognized, so layout drift is diagnosable without
            Campus fabricating a quota value.
        resting_message:
          type: [string, "null"]
          description: |
            Server-authored "resting until ~HH:MM" copy, present on every state (not only
            `available`) whenever this credential carries a live exhaustion marker — see
            `Credential.exhausted_until`. Absent when no marker is live. Additive; older
            clients that do not read it lose nothing else in this response.
          examples: ["Resting until ~18:40 after a rate limit, so Campus will skip it until then.", null]
        summary_label:
          type: [string, "null"]
          description: |
            The whole result in one short API-authored phrase, for a dense one-line row
            that has no space for the card. Present when the result has something to say
            on one line — a quota figure for `available`, the fact that this provider
            reports none for `unsupported` — and absent when it does not, in which case a
            one-line row shows severity alone rather than inventing a phrase.

            When more than one fact fits, Rails joins the fragments itself with ` · ` (for
            example `100% used · 0 resets`) so no client assembles a phrase out of a number
            and a noun. A fragment with nothing to say is dropped rather than padded, so
            the phrase never carries a dangling separator, and a provider that reports no
            allowance is byte-for-byte unchanged. Clients render this string verbatim.
        outlined: { type: [boolean, "null"], description: Presentation hint authored by the API. }
        plan: { type: [string, "null"] }
        fetched_at: { type: [string, "null"], format: date-time }
        code:
          type: [string, "null"]
          description: |
            Stable concise failure category such as `timeout`, `broker_unavailable`,
            `tmux_missing`, or `collector_error`. Collector transport failures remain
            distinct from a provider refusing the read.
        dimensions:
          type: array
          items: { $ref: "#/components/schemas/AccountUsageDimension" }

    AccountUsageDimension:
      type: object
      required: [id, label, kind]
      properties:
        id: { type: string }
        label: { type: string }
        kind:
          type: string
          enum: [quota, account_activity, account_allowance]
          description: |
            Separates account quota from non-quota account-wide counters.

            `account_allowance` is a consumable entitlement the account may spend, counted
            in whole units rather than measured as a percentage — today only Codex's
            `Usage limit resets`. It is deliberately not a `quota` window: it has no
            percentage, no duration and no `resets_at`, and a zero is a real answer that
            clients must render rather than treat as absent. Additive: a client that does
            not recognize the value renders `label` and `value` like any other non-quota
            dimension, so this did not bump the contract version.
        scope:
          type: string
          enum: [account, model]
          default: account
          description: |
            How wide this window's claim is, and therefore whether Campus may act on it as
            a fact about the credential.

            `account` is the whole subscription — Claude's `Current session` and
            `Current week (all models)`, plus providers such as Codex and Grok whose
            reported windows cover the credential. `model` caps one model or model family
            inside the account, such as Claude's `Current week (Fable)` or Antigravity's
            `Gemini models · Weekly Limit`: it can read 0% remaining while the account's own
            windows still have room, so it is rendered like any other dimension but never
            benches the credential and never counts toward the fallback usage threshold.
            Campus has no model-scoped fallback yet; until it does, a spent per-model cap
            is reported and not acted on.

            Additive and optional: an absent value means `account`, which is how every
            snapshot written before this field existed behaves, so this did not bump the
            contract version.
        window:
          type: [string, "null"]
          enum: [session, weekly, null]
          description: |
            Which account quota window this dimension measures. `session` is a provider's
            short rolling window; `weekly` is its account week. Auto landing ranks by the
            account-scoped weekly window and gates by the account-scoped session window when
            present, otherwise by the account-scoped weekly window. Model-scoped windows are
            rendered but never rank or gate a whole credential. An absent value means the
            provider evidence did not classify the window, never that a client should infer it
            from `label`.
        used_percent: { type: [integer, "null"], minimum: 0, maximum: 100 }
        remaining_percent: { type: [integer, "null"], minimum: 0, maximum: 100 }
        used_label:
          type: [string, "null"]
          description: server-authored endpoint label for a complete quota progress bar.
        remaining_label:
          type: [string, "null"]
          description: server-authored endpoint label for a complete quota progress bar.
        resets_at: { type: [string, "null"], format: date-time }
        reset_description:
          type: [string, "null"]
          description: |
            Provider-supplied reset text. Claude still emits this prose (no year, a named
            zone in parentheses). When the prose parses, `resets_at` is also filled as
            ISO8601 in that zone; unparseable or already-past prose leaves `resets_at`
            null and keeps this field so the card can still render it.
        amount:
          type: [string, "null"]
          description: API-normalized counter whose provider-documented denomination is known.
        unit:
          type: [string, "null"]
          description: Provider-documented denomination for `amount`; never inferred from an opaque provider field.
        value: { type: [string, "null"], description: API-authored display value. }
        detail: { type: [string, "null"], description: API-authored reset or account/session distinction. }

    VerifiedCredential:
      allOf:
        - $ref: "#/components/schemas/Credential"
        - type: object
          required: [verified, detail, reason, diagnostic]
          properties:
            verified: { type: boolean, description: Whether the login check passed. A `false` here is still HTTP 200. }
            detail: { type: [string, "null"], description: Human-readable outcome from the CLI. }
            reason:
              type: [string, "null"]
              enum: [null, not_logged_in, auth_failed, wrong_auth, unavailable, unsupported]
              description: |
                Why the check came out the way it did, and the only thing that decides
                whether `status` moved. `null` means verified.

                `not_logged_in` / `auth_failed` / `wrong_auth` mean the login itself is
                broken: a credential that was `active` is now `expired`, with an `expired`
                ActivityEvent logged. `unavailable` / `unsupported` mean the check was
                inconclusive — the status is deliberately left unchanged, so a flaky
                network can never revoke a good subscription. See the operation
                description for the full table.
            diagnostic:
              $ref: "#/components/schemas/CredentialDiagnostic"

    CredentialDiagnostic:
      type: object
      description: |
        The API-authored presentation model for a verification result. Clients render the
        declared kind and copy verbatim; they must not derive color or wording from HTTP
        status, `verified`, `reason`, or provider output.
      required: [version, kind, heading, message, notice, hint]
      properties:
        version: { type: integer, const: 1, description: Version of this diagnostic presentation contract. }
        kind:
          type: string
          enum: [error, warning, message]
          description: "`error` renders red, `warning` amber, and `message` green."
        heading: { type: string }
        message: { type: string, description: Human-readable verification/provider detail. }
        notice: { type: string, description: Short transient status text, with the same semantic kind. }
        hint: { type: [string, "null"], description: Optional explanation of an incomplete check. }

    LoginCommand:
      type: object
      required: [credential, provider, config_dir, env, argv, command, run_it_yourself, instructions]
      properties:
        credential: { $ref: "#/components/schemas/Credential" }
        provider: { type: string }
        config_dir: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
          description: Env vars that pin the CLI at this credential's config dir (e.g. `CLAUDE_CONFIG_DIR`).
        argv: { type: array, items: { type: string } }
        command: { type: string, description: The whole thing as one shell line. }
        run_it_yourself: { type: boolean, const: true }
        instructions: { type: string }

    BrokerLogin:
      type: object
      description: |
        One login on the macOS broker, in flight or finished. Starting, polling and
        cancelling all answer this same shape, so a client parses a login exactly once.
      required:
        [login_id, credential, engine, state, done, url, user_code, message, detail,
         verified, started_at, ended_at]
      properties:
        login_id: { type: string, description: The broker's id for this login. Poll it, cancel it, feed it input. }
        credential: { $ref: "#/components/schemas/Credential" }
        engine:
          type: string
          enum: [claude, codex, agy]
          description: The vendor CLI the broker is driving. It executes these three by name and nothing else.
        state:
          type: string
          enum: [starting, awaiting_user, verifying, completed, failed, timed_out, cancelled]
          description: |
            `starting` — spawned, nothing useful printed yet. `awaiting_user` — there is a
            `url` or a `user_code` and the human has to act. `verifying` — the CLI exited
            and the broker is checking whether a login actually landed. The last four are
            terminal; read `done` rather than matching on them.
        done: { type: boolean, description: "`true` once `state` is terminal. This is the poll's stop condition." }
        url: { type: [string, "null"], description: Consent URL, to open in a browser signed in to the right account. }
        user_code: { type: [string, "null"], description: Device code to type, for the flows that use one. }
        message: { type: [string, "null"], description: The CLI's last meaningful line, redacted by the broker before it left. }
        detail: { type: [string, "null"], description: What to do next, or why it ended. }
        verified:
          type: [boolean, "null"]
          description: |
            The **broker's** verdict on whether a login landed, from a verify it ran itself;
            `completed` requires it to be true, because a CLI exiting 0 only proves the TUI
            closed. `null` while the login is still running. Campus's own verdict is
            `credential.status`, and the two answer different questions.
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, "null"], format: date-time }

    Settings:
      type: object
      description: Every public settings column, plus derived project and icon-vocabulary fields.
      required:
        [id, approval_mode, campus_icon, campus_icon_choices, campus_icon_options,
         construction_threshold,
         reviewer_provider, reviewer_model,
         default_agent_provider, default_agent_model, default_project_id,
         council_skill_name, council_response_minutes, engines, registration_daily_limit,
         fallback_enabled, cross_provider_fallback_enabled, cross_provider_fallback_note,
         fallback_max_used_percent, fallback_order_caption,
         effective_default_project_id, task_attachments, created_at, updated_at]
      properties:
        id: { type: integer }
        task_attachments:
          type: object
          additionalProperties: false
          required: [max_count, max_bytes_each, max_bytes_total, content_types]
          description: |
            The bounds Rails enforces on task images, published so a client can refuse a
            file before reading and base64-encoding it. These ARE the constants the model
            validates with — a client that hardcoded them would drift the moment they
            changed, and the drift would look like an image that vanishes on save. A client
            that finds this block absent applies no rule of its own and lets the server
            author the refusal.
          properties:
            max_count: { type: integer, description: Images per task. }
            max_bytes_each: { type: integer, description: Decoded bytes, per image. }
            max_bytes_total: { type: integer, description: Decoded bytes, summed across the task. }
            content_types:
              type: array
              items: { type: string }
              description: >
                Accepted formats. Checked against each image's own leading bytes, so a
                payload labelled with one of these but shaped like something else is refused.
        approval_mode:
          type: string
          enum: [manual, full_auto]
          description: "`full_auto` lets agent-approved ideas flow to the seashore without a human."
        campus_icon:
          type: string
          enum: [globe.americas.fill, building.2.fill, graduationcap.fill, map.fill, leaf.fill, sparkles]
          default: globe.americas.fill
          description: A validated SF Symbol name used beside the Campus product label.
        campus_icon_choices:
          type: array
          description: |
            The server-authored safe vocabulary, each id with the words a person reads. The
            id is an SF Symbol name and an asset identifier — `building.2.fill` reads as a
            file extension to everyone who is not an engineer — so Rails names them and a
            client renders `label` against `id`, rather than inventing a second vocabulary
            that drifts the moment this list grows. Clients send the `id` back unchanged.
          items: { $ref: "#/components/schemas/CampusIconChoice" }
        campus_icon_options:
          deprecated: true
          type: array
          description: |
            **Deprecated — replaced by `campus_icon_choices`.** Exactly
            `campus_icon_choices[*].id`, kept for one rollout window so a client released
            against the id-only vocabulary keeps decoding this response unchanged; the
            labelled field was added beside it rather than replacing it in place, because
            changing this array's item type would have broken those clients' whole settings
            read, not just their picker. Remove it once no shipped client reads it.
          items:
            type: string
            enum: [globe.americas.fill, building.2.fill, graduationcap.fill, map.fill, leaf.fill, sparkles]
        construction_threshold: { type: number, format: float, description: "0–1. Above this undone fraction a building shows scaffolding." }
        reviewer_provider: { type: string }
        reviewer_model: { type: string }
        default_agent_provider: { type: string }
        default_agent_model: { type: string }
        default_project_id: { type: [integer, "null"], description: What the human picked; may be null. }
        council_skill_name:
          type: string
          default: ship-with-council
          description: The skill the council review runs when a PR is attached.
        council_response_minutes:
          type: integer
          default: 30
          minimum: 0
          maximum: 1440
          description: How long a council review is given to come back before it is given up on.
        engines:
          type: object
          description: |
            This installation's engine overrides, keyed by provider and merged **over** the
            built-ins. The one place an operator can teach Campus about a new agent type — or
            stop it spawning one the day a CLI starts charging — without waiting for a release,
            which is the whole point of the registry being data. `{}` on a fresh install.

            See `GET /engines` for the merged result, which is what actually decides what gets
            spawned. An entry that is not an object is skipped rather than raised on: this is
            hand-edited jsonb, and one malformed entry must not take `GET /engines` — or every
            agent start on the machine — down with it.
          additionalProperties: { $ref: "#/components/schemas/EngineOverride" }
          example:
            hermes: { engine: hermes_cli, binary: hermes, notes: "ours; runs on the build box" }
            google: { spawnable: false }
        registration_daily_limit:
          type: integer
          default: 10
          minimum: 0
          description: |
            How many `POST /registrations` calls may mint an active member in one calendar
            day (server's time zone). `0` is a deliberate kill switch: every registration
            answers with the waitlist instead. Gates intake only — it says nothing about
            how fast an administrator can disable or re-enable an account once it exists.
        fallback_enabled:
          type: boolean
          default: true
          description: |
            PRD_AGENT_FALLBACK.md decision 1. The front door for the whole credential-
            fallback feature; off means a rate-limited run fails exactly as it always has,
            with no takeover offered. S1 ships the column and the setting only — nothing
            reads it yet, since nothing in this slice triggers a takeover (see S3).
        fallback_max_used_percent:
          type: integer
          default: 99
          minimum: 10
          maximum: 99
          description: |
            The usage threshold `CredentialSelector.pick_fallback` gates a candidate on:
            used% at or under this value qualifies. Bounded 10-99 — below 10 refuses almost
            every credential before a run even starts, and 100 is not "stricter than 99", it
            is "the threshold check never refuses anything", which `fallback_enabled`
            already covers as its own, more honest switch.
        cross_provider_fallback_enabled:
          type: boolean
          default: true
          description: |
            Whether a takeover may continue work on a DIFFERENT provider once every credential
            for the run's own provider is spent. Ships true (the owner's own decision,
            `DefaultCrossProviderFallbackOn`): doing so sends the task's description, its
            comments and the interrupted run's transcript to a vendor the work has not used,
            which is why the toggle stays in Settings for anyone who wants it off. Same-provider
            fallback, between the user's own logins with one vendor, is governed by
            `fallback_enabled` alone and needs no opt-in.
        cross_provider_fallback_note:
          type: string
          description: |
            Rails' own explanation of the switch above, for a client to render verbatim rather
            than writing its own account of what crossing a provider boundary means. Read-only,
            not part of `SettingsPatch`. Rendered verbatim in the Mac and web Settings screens,
            beside the `cross_provider_fallback_enabled` toggle.
          examples: ["When every credential for a run's own provider is rate limited, Campus continues the work on a different provider. Doing that sends the task's description, its comments and the interrupted run's transcript to a vendor this work has not used. It is on by default; turn it off here if that is not acceptable for your work. Same-provider fallback, between your own logins with one vendor, is unaffected and needs no permission."]
        fallback_pause_note:
          type: string
          description: |
            What `fallback_enabled` means, authored by Rails so no client has to explain a
            boolean for itself. It is a pause rather than a queue: while it is off a
            rate-limited run simply fails as it did before the feature existed, and turning it
            back on applies to runs that fail from then on. Work already refused while it was
            off is never resumed by itself. Read-only, not part of `SettingsPatch`.
        fallback_order_caption:
          type: string
          description: |
            PRD_AGENT_FALLBACK.md §9's exact, static caption for above the credentials
            list — read-only, not part of `SettingsPatch`. Deliberately silent on Auto
            landing: Auto is least-used by design, not list order, and a client must never
            render this sentence as claiming otherwise.
          examples: ["This is the fallback order. When a run hits a rate limit, Campus first tries the same provider's other CLI logins, then everything below, top to bottom. API keys are billed per token, so they start at the bottom."]
        effective_default_project_id:
          type: [integer, "null"]
          description: Server-derived — the picked project, else the oldest one. Read-only.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CampusIconChoice:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          type: string
          enum: [globe.americas.fill, building.2.fill, graduationcap.fill, map.fill, leaf.fill, sparkles]
          description: The validated SF Symbol name. This is what `PATCH /settings` accepts.
        label:
          type: string
          description: Server-authored display name, e.g. "Buildings". Never an asset identifier.
          examples: [Globe, Buildings, Graduation cap]

    EngineOverride:
      type: object
      description: |
        One settings-side engine entry. Deliberately loose: the shape belongs to the registry,
        which normalises string keys and decides what a missing field means, and enumerating
        the rules here would put them in two places and let them drift.
      properties:
        engine: { type: string, description: The invocation. An entry naming none can never be spawnable. }
        binary: { type: string, description: What must be on `PATH`. }
        spawnable:
          type: boolean
          description: |
            Omit to leave it on. `false` — or the string `"false"`, which is what a
            form-encoded PATCH sends — switches it off.
        notes: { type: string, description: Why this entry is the way it is. Write it down here or it will not survive. }

    SettingsPatch:
      type: object
      description: |
        The writable slice. `effective_default_project_id` is derived and rejected here, and
        every property except `construction_threshold` is human-only as described on the endpoint.
      properties:
        approval_mode: { type: string, enum: [manual, full_auto] }
        campus_icon:
          type: string
          enum: [globe.americas.fill, building.2.fill, graduationcap.fill, map.fill, leaf.fill, sparkles]
          description: Human-only. Must be one of the `campus_icon_choices` ids from GET /settings.
        construction_threshold: { type: number, format: float }
        reviewer_provider: { type: string }
        reviewer_model: { type: string }
        default_agent_provider: { type: string }
        default_agent_model: { type: string }
        default_project_id: { type: [integer, "null"] }
        council_skill_name: { type: string }
        council_response_minutes: { type: integer }
        registration_daily_limit: { type: integer, minimum: 0 }
        fallback_enabled: { type: boolean }
        cross_provider_fallback_enabled: { type: boolean }
        fallback_max_used_percent: { type: integer, minimum: 10, maximum: 99 }
        engines:
          type: object
          description: |
            **Human-only**, on top of `settings:write` — an agent token that sends this key gets
            `403` and nothing on the request is written. Merged over the built-ins, so an entry
            here can add a provider Campus has never heard of or switch a built-in off.
          additionalProperties: { $ref: "#/components/schemas/EngineOverride" }

    Skill:
      type: object
      description: "`Skill#as_json_public` — a markdown file an agent is handed when it matches."
      required: [id, name, description, body, tags, auto_assignable, created_at, updated_at]
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 80, description: Unique, case-insensitively. }
        description: { type: string }
        body: { type: string, description: Markdown spliced into the agent's landing instructions. }
        tags:
          type: array
          items: { type: string }
          description: Normalized on write — lowercased, `_` → `-`, squished, de-duplicated.
        auto_assignable: { type: boolean, description: The matcher may attach this one automatically. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SkillInput:
      type: object
      properties:
        name: { type: string, maxLength: 80 }
        description: { type: string }
        body: { type: string }
        auto_assignable: { type: boolean }
        tags:
          description: An array, or a comma-separated string (`"rails, api"`).
          oneOf:
            - type: array
              items: { type: string }
            - type: string

    SkillMatchExplanation:
      type: object
      description: Returned by `GET /skills?task_id=…&explain=true` — why each skill was or was not chosen.
      required: [task_id, signals, rule, considered, matched, rejected]
      properties:
        task_id: { type: integer }
        signals:
          type: object
          description: The task's words, grouped by the field they came from.
          properties:
            title: { type: array, items: { type: string } }
            description: { type: array, items: { type: string } }
            specialist_type: { type: array, items: { type: string } }
            project: { type: array, items: { type: string } }
        rule: { type: string, description: The scoring rule in words. }
        considered: { type: integer }
        matched:
          type: array
          items: { $ref: "#/components/schemas/SkillMatchRow" }
        rejected:
          type: array
          items: { $ref: "#/components/schemas/SkillMatchRow" }

    SkillMatchRow:
      type: object
      required: [skill_id, name, score, verdict, reasons]
      properties:
        skill_id: { type: integer }
        name: { type: string }
        score: { type: integer }
        verdict: { type: string, examples: [matched, "score below 3", "over cap of 3"] }
        reasons: { type: array, items: { type: string } }

    Cron:
      type: object
      description: "`Cron#as_json_public` — a scheduled action that puts work on the board."
      required: [id, name, schedule, enabled, action_type, payload, last_run_at, next_run_at, created_at, updated_at]
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 80 }
        schedule: { type: string, description: Five-field cron expression or an `@macro`., examples: ["0 9 * * mon-fri", "@daily"] }
        enabled: { type: boolean, description: A disabled cron keeps an informational `next_run_at` but never fires. }
        action_type: { type: string, enum: [create_task, run_playbook] }
        payload: { type: object, description: Shape depends on `action_type`; validated on write. }
        last_run_at: { type: [string, "null"], format: date-time }
        next_run_at: { type: [string, "null"], format: date-time, description: Null when the schedule can never occur. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CronInput:
      type: object
      properties:
        name: { type: string, maxLength: 80 }
        schedule: { type: string }
        enabled: { type: boolean }
        action_type: { type: string, enum: [create_task, run_playbook] }
        payload:
          type: object
          description: |
            `create_task` — `{ title, description?, priority?, project_id? }`.
            `run_playbook` — `{ steps: [{ title, description?, priority?, project_id? }], … }`,
            where top-level `project_id`/`priority` are defaults for each step.
          properties:
            title: { type: string }
            description: { type: string }
            priority: { $ref: "#/components/schemas/Priority" }
            project_id: { type: [integer, "null"] }
            playbook: { type: string }
            steps:
              type: array
              items:
                type: object
                required: [title]
                properties:
                  title: { type: string }
                  description: { type: string }
                  priority: { $ref: "#/components/schemas/Priority" }
                  project_id: { type: [integer, "null"] }

    LandingPrompt:
      type: object
      required: [landing_prompt]
      properties:
        landing_prompt: { type: string, description: Markdown. }

    DirListing:
      type: object
      required: [path, parent, home, git, writable, entries]
      properties:
        path: { type: string }
        parent: { type: [string, "null"], description: Null at the home directory — the browse root. }
        home: { type: string }
        git: { type: boolean, description: This directory is a git repo. }
        writable: { type: boolean }
        entries:
          type: array
          description: Sub-directories only, hidden ones skipped, capped at 500, sorted case-insensitively.
          items:
            type: object
            required: [name, path, git]
            properties:
              name: { type: string }
              path: { type: string }
              git: { type: boolean }

    IslandPresentation:
      type: object
      required: [version, status, selection, renderer, refresh, snapshot]
      properties:
        version:
          type: integer
          const: 1
          description: The API-owned Island presentation contract version.
        status:
          type: object
          required: [state, severity, heading, message, retryable, actions]
          properties:
            state:
              type: string
              enum: [ready, unauthorized, forbidden, data_unavailable, rate_limited]
            severity:
              type: string
              enum: [info, error]
            heading: { type: string, description: User-facing copy authored by Rails. }
            message: { type: string, description: User-facing recovery detail authored by Rails. }
            retryable: { type: boolean }
            actions:
              type: array
              items:
                type: object
                required: [id, label]
                properties:
                  id: { type: string, enum: [retry] }
                  label: { type: string }
        selection:
          $ref: "#/components/schemas/IslandSelectionContract"
        renderer:
          type: object
          required: [contract_version]
          properties:
            contract_version:
              type: integer
              const: 1
        refresh:
          type: object
          required: [after_ms]
          properties:
            after_ms: { type: integer, minimum: 1 }
        snapshot:
          oneOf:
            - { $ref: "#/components/schemas/WorldSnapshot" }
            - { type: "null" }

    IslandSelectionContract:
      type: object
      additionalProperties: false
      required: [version, limit, action, priority]
      description: Rails-authored contract for Island click, lasso, list, and drag approval.
      properties:
        version: { type: integer, const: 1 }
        limit: { type: integer, const: 100 }
        action: { $ref: "#/components/schemas/TaskApprovalBatchAction" }
        priority:
          type: object
          additionalProperties: false
          required: [label, recommended, options]
          properties:
            label: { type: string, enum: [Priority] }
            recommended: { $ref: "#/components/schemas/IslandSelectionOption" }
            options:
              type: array
              minItems: 4
              maxItems: 4
              items: { $ref: "#/components/schemas/IslandSelectionOption" }

    IslandSelectionOption:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id: { type: string, enum: [recommended, P0, P1, P2, P3] }
        label: { type: string }

    ProjectPathValidation:
      type: object
      description: Version 1 of Rails-authored project-path semantics and presentation copy.
      required: [contract_version, valid, reason, severity, message, remediation, normalized_path]
      properties:
        contract_version: { type: integer, const: 1 }
        valid: { type: boolean }
        reason:
          type: string
          enum: [ready, directory_missing, not_a_directory, unsupported_mode, outside_home,
                 permission_denied, directory_not_searchable, parent_not_writable,
                 repository_not_writable, repository_without_head, git_init_not_writable,
                 sandbox_without_git]
        severity: { type: string, enum: [none, warning, error] }
        message: { type: [string, "null"], description: API-authored explanation or success semantics. }
        remediation: { type: [string, "null"], description: API-authored next action; null when none is needed. }
        normalized_path: { type: string, description: Expanded, real path when it exists. }

    WorldSnapshot:
      type: object
      required: [projects, imaginarium, seashore, in_progress, alarms, agents, agent_summary, board, connection_health, service_runtime, onboarding, generated_at]
      properties:
        projects:
          type: array
          items: { $ref: "#/components/schemas/ProjectSnapshot" }
        imaginarium:
          type: array
          description: Ideas awaiting review, newest first, capped at 300.
          items: { $ref: "#/components/schemas/Task" }
        seashore:
          type: array
          description: Claimable backlog in claim order, capped at 300 — the same order `sort=priority` gives.
          items: { $ref: "#/components/schemas/Task" }
        in_progress:
          type: array
          description: |
            The work actually underway — stage `in_progress` **or** `department` — newest-updated
            first, capped at 300. Without it the renderer knows an agent is busy but not with
            what: the office whiteboard could only say "task #123" and a building's construction
            ring had no titles behind it.

            Plain tasks, with no `assignee` key; join on `assignee_id` against `agents`.
          items: { $ref: "#/components/schemas/Task" }
        alarms:
          type: array
          description: Every blocked task, longest-waiting first.
          items: { $ref: "#/components/schemas/AlarmTask" }
        agents:
          type: array
          description: Active agents only.
          items: { $ref: "#/components/schemas/Agent" }
        agent_summary:
          $ref: "#/components/schemas/AgentSummary"
        board:
          $ref: "#/components/schemas/BoardSummary"
        connection_health:
          $ref: "#/components/schemas/ConnectionHealthContract"
        service_runtime:
          $ref: "#/components/schemas/ServiceRuntimeContract"
        onboarding:
          $ref: "#/components/schemas/OnboardingContract"
        generated_at: { type: string, format: date-time }

    OnboardingContract:
      type: object
      description: |
        Version 1 of the Rails-authored empty-Island setup checklist. Provider setup is
        explicitly optional; clients render these states and labels without choosing a
        preferred provider or inferring readiness from empty arrays.
      required: [contract_version, state, title, message, steps]
      properties:
        contract_version: { type: integer, const: 1 }
        state: { type: string, enum: [setup_required, ready] }
        title: { type: string }
        message: { type: string }
        steps:
          type: array
          items:
            type: object
            required: [id, state, title, message, action]
            properties:
              id: { type: string, enum: [create_project, connect_provider] }
              state: { type: string, enum: [required, optional, complete] }
              title: { type: string }
              message: { type: string }
              action:
                oneOf:
                  - type: "null"
                  - type: object
                    required: [id, label]
                    properties:
                      id: { type: string, enum: [new_project, credentials] }
                      label: { type: string }

    ServiceRuntimeContract:
      type: object
      description: |
        Version 1 of Rails-authored service compatibility, readiness, severity, recovery
        actions, and domain copy. A native client may activate local processes before this
        endpoint is reachable; once Rails answers, it renders this contract and does not
        recreate broker or background-job semantics.
      required: [contract_version, deployment, compatibility, api, background_jobs, broker, current, recovery_actions]
      properties:
        contract_version: { type: integer, const: 1 }
        deployment: { type: string, enum: [local, remote] }
        compatibility:
          type: object
          required: [state, required_runtime_version, api_version]
          properties:
            state: { type: string, enum: [compatible, incompatible] }
            required_runtime_version: { type: string }
            api_version: { type: string }
        api:
          type: object
          required: [state]
          properties:
            state: { type: string, enum: [ready] }
        background_jobs:
          type: object
          required: [state]
          properties:
            state: { type: string, enum: [ready, unavailable, external] }
        broker:
          type: object
          required: [state, version, session_type]
          properties:
            state: { type: string, enum: [ready, locked, unavailable, withheld, not_applicable] }
            version: { type: [string, "null"] }
            session_type: { type: [string, "null"] }
        current:
          type: object
          required: [state, severity, title, message]
          properties:
            state: { type: string, enum: [ready, degraded, blocked, api_only] }
            severity: { type: string, enum: [none, warning, error] }
            title: { type: string }
            message: { type: string }
        recovery_actions:
          type: array
          items:
            type: object
            required: [id, label, request]
            properties:
              id: { type: string, enum: [retry_broker] }
              label: { type: string }
              request:
                type: object
                required: [method, path]
                properties:
                  method: { type: string, enum: [POST] }
                  path: { type: string, const: /service_runtime/retry_broker }

    ConnectionHealthContract:
      type: object
      description: |
        Versioned, Rails-authored connection semantics for native clients. A successful
        snapshot carries the current live or polling-current presentation. If a later REST
        refresh fails, the client follows the supplied relative-delay transitions without
        recreating state names, severity, freshness thresholds, or user-facing copy.
      required: [contract_version, current, freshness, transitions]
      properties:
        contract_version: { type: integer, const: 1 }
        current: { $ref: "#/components/schemas/ConnectionHealthPresentation" }
        freshness:
          type: object
          required: [confirmed_at, offline_after_seconds]
          properties:
            confirmed_at:
              type: string
              format: date-time
              description: When Rails assembled the last snapshot that successfully landed.
            offline_after_seconds:
              type: integer
              minimum: 0
              description: Rails-authored elapsed time before repeated failures become offline.
        transitions:
          type: array
          minItems: 2
          items:
            type: object
            required: [after_seconds, presentation]
            properties:
              after_seconds:
                type: integer
                minimum: 0
                maximum: 86400
                description: Elapsed time from accepting the snapshot before this state applies.
              presentation: { $ref: "#/components/schemas/ConnectionHealthPresentation" }

    ConnectionHealthPresentation:
      type: object
      required: [state, severity, label, title, message]
      properties:
        state: { type: string, enum: [live, polling_current, stale, offline] }
        severity: { type: string, enum: [none, info, warning, error] }
        label: { type: string, description: Short API-authored status text for the global pip. }
        title: { type: [string, "null"], description: API-authored banner heading when one is needed. }
        message: { type: string, description: API-authored explanation safe to render verbatim. }

    BoardSummary:
      type: object
      description: |
        The Board Mansion's one window, computed in the same pass as the counts so the count
        and the preview can never disagree. `unread > 0` is what makes the window glow.

        A **preview**, not the inbox: it is `Board.summary`, which trims each item to the
        fields a glowing window needs and returns at most three. `GET /board` returns the
        full `BoardInbox` — with `urgent`, `generated_at` and whole `BoardMessage` items.
      required: [unread, active, top]
      properties:
        unread: { type: integer, description: Messages the human has not marked read. Zero means the window is dark. }
        active: { type: integer, description: Everything still waiting, read or not. }
        top:
          type: array
          maxItems: 3
          description: The three most pressing items, most severe first — a trimmed `BoardMessage`.
          items:
            type: object
            required: [id, kind, severity, age_seconds, at, read]
            properties:
              id: { type: string, examples: ["blocked:42", "board:17"] }
              kind:
                type: string
                enum: [blocked, question, agent_error, council, agent_message, credentials_exhausted, resource, direct]
              severity: { $ref: "#/components/schemas/BoardSeverity" }
              title: { type: [string, "null"] }
              task_id: { type: [integer, "null"] }
              agent_id: { type: [integer, "null"] }
              project_id: { type: [integer, "null"] }
              age_seconds: { type: integer }
              at: { type: string, format: date-time }
              read:
                type: boolean
                description: Flattened from `read_at` — the summary carries the boolean, the inbox carries the timestamp.
