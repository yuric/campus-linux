      description: |
        The deliberately small analytics surface the marketing deployment can compute
        without Campus jobs or island product tables. Email matching is case-insensitive;
        only a self-registration at or after the waitlist entry counts as conversion. The
        denominator is the raw accepted-signup set: one persisted stripped/lowercased unique
        email. Replays do not add rows; provider aliases remain distinct; source, automation,
        bot, and lead quality are not classified or inferred.
      security:
        - cookieAuth: []
      x-required-scope: admin
      responses:
