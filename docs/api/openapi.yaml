    AdminWaitlist:
      type: object
      additionalProperties: false
      required: [waitlist_entries, pagination]
      properties:
        waitlist_entries:
          type: array
          items: { $ref: "#/components/schemas/WaitlistEntry" }
        pagination: { $ref: "#/components/schemas/Pagination" }

    AdminWaitlistEntryEnvelope:
      type: object
      additionalProperties: false
      required: [waitlist_entry]
      properties:
        waitlist_entry: { $ref: "#/components/schemas/WaitlistEntry" }

    AdminAuditEvent:
      type: object
      additionalProperties: false
      required: [id, action, actor, subject_type, subject_id, metadata, ip_address, created_at,
                 dismissed_at, dismissed_by]
      properties:
        id: { type: integer }
        action: { type: string }
        actor: { $ref: "#/components/schemas/User" }
        subject_type: { type: string }
        subject_id: { type: [string, "null"] }
        metadata: { type: object, additionalProperties: true }
        ip_address: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        dismissed_at:
          type: [string, "null"]
          format: date-time
          description: |
            When an administrator archived this entry, or null. Archiving hides the row from
            the default index and destroys nothing; `?include_dismissed=true` returns it in
            full. Additive — a client that predates archival keeps decoding every other field
            and, because the filter is applied server-side, keeps seeing the list it expects.
        dismissed_by:
          oneOf:
            - { $ref: "#/components/schemas/User" }
            - { type: "null" }
          description: |
            Who archived it. The PUBLIC user serialization, never the administrator one:
            reading the activity log is no reason to learn when a colleague's account was
            disabled. Null once that account is gone: this field is bookkeeping about the
            current view, so it nullifies rather than holding the account in place, and an
            archival with no name on it is the honest state after the person is gone. That is
            no longer the only thing standing between an archival and anonymity, and readers
            should not treat it as one: the separate `dismissal_events` log
            records the same act and RESTRICTS on delete, so `DELETE /admin/users/{id}` now
            refuses an account that has ever archived or restored a row. A null here therefore
            means the account left by some route other than that endpoint, not that Campus
            forgot who archived it.

    AdminAuditEventEnvelope:
      type: object
      additionalProperties: false
      required: [audit_event]
      properties:
        audit_event: { $ref: "#/components/schemas/AdminAuditEvent" }

    AnalyticsDashboardSnapshot:
      type: object
      additionalProperties: false
      required: [id, today, generated_at, environments]
      properties:
        id:
          type: string
          format: uuid
          description: Opaque server-authored identity for this aggregate response.
        today:
          type: string
          format: date
          description: The one UTC calendar date used to derive every weekly range and maturity decision.
        generated_at:
          type: string
          format: date-time
          description: The one server timestamp repeated in all three nested contracts.
        environments:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [local, production] }

    AnalyticsDashboard:
      type: object
      additionalProperties: false
      required: [contract_version, snapshot, summary, funnel, engagement]
      properties:
        contract_version: { type: integer, const: 1 }
        snapshot: { $ref: "#/components/schemas/AnalyticsDashboardSnapshot" }
        summary: { $ref: "#/components/schemas/AnalyticsSummary" }
        funnel: { $ref: "#/components/schemas/AnalyticsFunnel" }
        engagement: { $ref: "#/components/schemas/AnalyticsEngagement" }

    AnalyticsSummary:
      type: object
      additionalProperties: false
      required: [contract_version, weeks, environments, generated_at]
      properties:
        contract_version: { type: integer, const: 1 }
        weeks:
          type: array
          description: Twelve trailing UTC calendar weeks, newest first.
          items:
            type: object
            required: [week_start, agent_shipped_tasks, active_islands, activation, feedback_submitted]
            properties:
              week_start: { type: string, format: date }
              agent_shipped_tasks:
                type: integer
                description: Distinct agent-worked tasks that reached done this week, either route, any approval mode.
              active_islands:
                type: integer
                description: Islands with at least one meaningful action this week.
              activation:
                type: object
                nullable: true
                description: Null while the cohort is immature or the current deployment's facts were not requested.
                required: [cohort_size, activated, rate]
                properties:
                  cohort_size: { type: integer }
                  activated: { type: integer }
                  rate: { type: number, nullable: true }
              feedback_submitted:
                type: integer
                minimum: 0
                description: Human feedback rows submitted this week; a counter, not a meaningful-action signal. Its island-linked cache is cleared for the whole UTC week across every environment when that week touches the raw-retention cutoff, so the aggregate may disappear up to six days early but never outlives retained raw feedback.
        environments:
          type: array
          items: { type: string, enum: [local, production] }
        generated_at: { type: string, format: date-time }

    AnalyticsRate:
      type: [number, "null"]
      minimum: 0
      maximum: 1

    AnalyticsFirstProjectOutcome:
      type: object
      additionalProperties: false
      required: [maturity, cohort_size, created_or_imported, rate]
