        "403": { $ref: "#/components/responses/AdminForbidden" }
        "503": { $ref: "#/components/responses/AdministratorBootstrapRequired" }

  /events:
    post:
      tags: [Analytics]
      operationId: createProductEvents
      summary: Land a human Mac client's content-free product-event batch
      description: |
        Account-backed human sessions only. Agent credentials, named API tokens, the local
        admin token, and visitor passes cannot emit these facts. Every item is judged against
        the server catalog independently, so legal siblings land even when one stale item is
        refused. Unknown names, unknown meta keys, content-shaped top-level fields, and
        timestamps outside seven days ago through five minutes ahead are refused with a
        sentence naming the accepted catalog.

        `batch_ulid` is the replay key for one complete request payload. Repeating a landed
        ULID with the same canonical payload is an atomic no-op and returns the original item
        decisions with `replayed: true`; it never reinterprets a batch under a newer catalog.
        Reusing it with any different event, value, type, field, or array order returns terminal
        `batch_ulid_conflict` and writes nothing. Legacy receipts without a reconstructable
        payload digest also fail closed with that conflict. JSON object-key order and transport
        whitespace do not change identity. Island, user, and `environment` are stamped
        from the authenticated request. Raw event rows reference that receipt by its required
        database id and do not duplicate the batch ULID. Their repeated island, user, and
        environment query columns are constrained by one composite foreign key to match the
        receipt even for bulk inserts. `telemetry=off` is enforced here as well as by the
        client for new batches; ingestion and preference changes serialize on the account row,
        so after an opt-out returns no concurrent batch can land. A receipt that landed before
        the choice changed can still be replayed because that is a read-only no-op. This route
        owns a separate 12-batch/minute per-account rate-limit bucket (at most 1,200 accepted
        event facts per minute). Independently, each account may retain at most 50,000 raw
        event facts and 4 MiB of receipt JSON. A batch that would cross either durable limit
        is rolled back whole and receives retryable `storage_quota_exceeded`; existing facts
        and replay receipts are never evicted.

        The complete serialized request is limited to 65,536 bytes at the first Rack boundary,
        before Action Dispatch parameter parsing or request-parameter logging, and `events`
        contains 1 to 100 items. The ordinary endpoint limiter and authentication still run
        before Rails returns or operationally logs an oversized refusal: an anonymous body is
        `unauthorized`, a throttled body is `rate_limited`, and only an admitted authenticated
        account session receives terminal `request_too_large`. Under-limit malformed JSON
        returns terminal `invalid_batch` and creates no receipt or event. Rejected-only receipts
        are a bounded per-account
        replay cache (120 receipts and 1 MiB of result JSON); once either bound is reached,
        the oldest rejected-only receipts are evicted. Receipts that own accepted facts are
        never quota candidates. An evicted invalid batch may therefore be judged again, but
        it still cannot write a product fact and every refusal remains terminal.

        Every response classifies delivery for a durable client. `processed` is terminal for
        this batch ULID, including item-level refusals. `refused` with `retryable: false` is a
        permanent envelope/authentication/preference refusal and should be discarded after the
        message is shown where appropriate. `retry_later` is transient; preserve the same
        batch ULID and honor `retry_after_seconds` (also mirrored in `Retry-After`). A
        transport failure with no Rails
        response remains ambiguous and is also retried with the same batch ULID.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductEventBatchRequest" }
      responses:
        "200":
          description: The item decisions, whether newly landed or replayed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductEventBatchResponse" }
        "401":
          description: Authentication is missing or invalid; this delivery is terminal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductEventDeliveryFailure" }
        "403":
          description: The principal or telemetry preference permanently refuses this delivery.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductEventDeliveryFailure" }
        "409":
          description: The batch ULID belongs to another account or island; this delivery is terminal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductEventDeliveryFailure" }
        "413":
          description: The serialized request exceeds 65,536 bytes; this delivery is terminal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductEventDeliveryFailure" }
        "422":
          description: The batch envelope is invalid; this delivery is terminal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductEventDeliveryFailure" }
        "429":
          description: Transient rate-limit refusal; retain the batch and honor Retry-After.
          headers:
            Retry-After:
              description: Seconds until the fixed window resets.
              required: true
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductEventDeliveryFailure" }

  /admin/audit_events:
    get:
      tags: [Administration]
      operationId: listAdminAuditEvents
      summary: Page through administrator actions
      security:
        - cookieAuth: []
      x-required-scope: admin
      parameters:
        - { name: before_id, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 9223372036854775807 } }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        "200":
          description: Recent changes to marketing settings and user access.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAuditLog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/AdministratorBootstrapRequired" }

  /admin/waitlist_entries/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [Waitlist, Administration]
      operationId: deleteAdminWaitlistEntry
      summary: Remove an address from the waitlist
      description: |
        The removed row is echoed back, which is unusual for a delete and is the point: the
        client has just made the one request it cannot repeat to find out what it did, so being
        told which address left is the difference between a correctable mistake and a mystery.
        It is the same serialization the index serves.

        Audited as `waitlist_entry.deleted`, recorded in the same transaction and BEFORE the
        destroy. An audit event's `subject_id` is a string with no foreign key precisely so it
        can outlive its subject, so there is no window in which the row is gone and nothing
        says who removed it.

        The entry is looked up inside that transaction and under a row lock, so the echo above
        cannot lie: two administrators clearing the same address at the same moment produce one
        deletion and one audit row, and the request that lost gets the 404 below rather than a
        receipt for somebody else's removal.
      security:
        - cookieAuth: []
      x-required-scope: admin
      responses:
        "200":
          description: The entry that was removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminWaitlistEntryEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404":
          description: No waitlist entry with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: waitlist entry not found }
        "503": { $ref: "#/components/responses/AdministratorBootstrapRequired" }

  /admin/audit_events/{id}/dismiss:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Administration]
      operationId: dismissAdminAuditEvent
      summary: Archive a handled activity entry
      description: |
        Hides the entry from the default `GET /admin/audit_events` view and nothing more. The
        row is untouched, `?include_dismissed=true` returns it in full, and `dismissed_at` plus
        `dismissed_by` record who hid it and when.

        **Dismissal is not written to THIS log, deliberately.** An `audit_event.dismissed`
        event per dismissal would refill the activity log at exactly the rate an administrator
        can clear it — clearing ten rows would write ten — so the action would be
        self-defeating.

        It is not unrecorded, though. `dismissed_at` and `dismissed_by` are STATE: they say
        what is true of the row now, and restoring it nulls both, so the pair cannot answer
        whether a row was ever hidden and put back. Every archival and every restore therefore
        appends a row to the separate `dismissal_events` log, in the same
        transaction as the state change, and THAT is the record that survives a restore.
        Nothing reads that table as a work list, so it carries the evidence without regrowing
        the queue an administrator is trying to empty. It is not exposed by this API; an
        administrator who has ever appended to it can no longer be deleted, which
        `DELETE /admin/users/{id}` states in its own words.

        That log is append-only THROUGH THE APPLICATION, and the qualifier is deliberate. No
        Campus code path can edit or delete a row once written, which closes the case this
        evidence exists for: an administrator hiding a row through the admin UI and restoring
        it afterwards. It is an application-level guarantee rather than a database constraint,
        so a console, a migration or raw SQL can still reach those rows. That is a considered
        decision, on the grounds that anyone holding a database credential is already past
        every control this API has; hardening it would mean a PostgreSQL rule or trigger
        rejecting UPDATE and DELETE on the table. Do not read "append-only" here as a promise
        the database enforces.

        Idempotent: archiving an already-archived entry answers 200 and leaves `dismissed_at`
        and `dismissed_by` exactly as the first administrator left them. The first person is
        the one who handled it, and the timestamp is evidence rather than a cache of the last
        click. A no-op appends nothing to `dismissal_events` either, so that log stays a record
        of state changes rather than a click counter.
      security:
        - cookieAuth: []
      x-required-scope: admin
      responses:
        "200":
          description: The archived entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAuditEventEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404":
          description: No audit event with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: audit event not found }
        "503": { $ref: "#/components/responses/AdministratorBootstrapRequired" }
    delete:
      tags: [Administration]
      operationId: restoreAdminAuditEvent
      summary: Return an archived activity entry to the default view
      description: |
        The undo of `POST`, and idempotent in the same way: restoring an entry that was never
        archived answers 200 and changes nothing.
      security:
        - cookieAuth: []
      x-required-scope: admin
      responses:
        "200":
          description: The entry, no longer archived.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAuditEventEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404":
          description: No audit event with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: audit event not found }
        "503": { $ref: "#/components/responses/AdministratorBootstrapRequired" }

  /admin/feedback:
    get:
      tags: [Administration]
      operationId: listAdminFeedback
      summary: Read product feedback across every island
      security:
        - cookieAuth: []
      x-required-scope: admin
      parameters:
        - { name: before_id, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        "200":
          description: Newest feedback first. Each row retains opaque island provenance but no direct account id or email; an island can identify its sole owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFeedbackList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/AdministratorBootstrapRequired" }

  /admin/feedback/islands/{island_id}:
    delete:
      tags: [Administration]
      operationId: purgeAdminIslandFeedback
      summary: Permanently purge one island's retained feedback
      description: |
        Age-independent administrator recovery for an island whose shared durable feedback
        quota is full or whose retained feedback otherwise must be removed. This permanently
        deletes all retained feedback for the named island regardless of age to release its
        durable island quota; it is not a global delete and never changes another island.

        The administrator must repeat the path target exactly as `PURGE FEEDBACK FOR ISLAND
        {island_id}`. Campus locks that island against concurrent feedback admission, deletes
        the rows, clears that island's feedback aggregate in all environments while preserving
        every other analytics fact, and writes a content-free actor/IP/count audit in the same
        transaction. If the audit cannot be stored, the feedback and aggregate changes roll
        back. Repeating an already-completed purge is refused and creates no second audit row.
        Minute-scale request and accepted-submission limits are deliberately not reset.
      security:
        - cookieAuth: []
      x-required-scope: admin
      parameters:
        - name: island_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation]
              properties:
                confirmation:
                  type: string
                  description: Must exactly equal `PURGE FEEDBACK FOR ISLAND {island_id}` for the path's numeric island id.
      responses:
        "200":
          description: The attributable purge committed; counts describe only the removed island data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFeedbackPurgeEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404":
          description: No island with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Confirmation did not name the path target exactly, or the island has no retained feedback to purge.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFeedbackPurgeRefusal" }
        "503": { $ref: "#/components/responses/AdministratorBootstrapRequired" }

  /admin/download_requests:
    get:
      tags: [Waitlist, Administration]
      operationId: listAdminDownloadRequests
      summary: Search and page through requests for the Mac build
      description: |
        Searched exactly as `/admin/waitlist_entries` is, down to the wildcard escaping, because
        the two lists sit side by side on the same screen.

        The two parameters are bounded differently, and the difference is a contract rather than
        an accident. `per_page` is CLAMPED into 1..200, so asking for more rows than this list
        serves returns the most it serves. `page` is REFUSED with a 422 when it is not a whole
        number of at least 1, or when it is larger than the last page whose OFFSET still fits in
        a PostgreSQL bigint, which is `9223372036854775807 / per_page`. It is multiplied into an
        OFFSET, so an out-of-range value is not a page that can be answered emptily; it used to
        reach the database and raise. Zero and negatives are refused by the same rule rather
        than being rounded up to the first page. `/admin/waitlist_entries` still clamps both.

        Unlike the waitlist, the same address may appear more than once: a download is an event
        rather than a membership, and a person coming back is a distinct row.

        Every row carries a `location` whose `source` is a server-authored reason code. A
        client renders "Unknown" because Campus said the data is `unavailable`, never because
        it counted three nulls.
      security:
        - cookieAuth: []
      x-required-scope: admin
      parameters:
        - { name: query, in: query, required: false, schema: { type: string } }
        - name: page
          in: query
          required: false
          description: |
            Refused with 422 outside 1..(9223372036854775807 / per_page); the maximum moves with
            `per_page` because the real bound is the largest OFFSET a bigint can hold.
          schema: { type: integer, minimum: 1, default: 1 }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - name: include_dismissed
          in: query
          required: false
          description: |
            Exactly the string `true` widens the view to include archived rows. Every other
            value narrows it, deliberately: a permissive boolean cast reads an unrecognised
            value as true, which would let an untrusted query string produce a wider answer
            than the caller asked for.
          schema: { type: string, enum: ["true"] }
      responses:
        "200":
          description: Matching download requests and pagination totals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDownloadRequests" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/AdministratorBootstrapRequired" }

  /admin/download_requests/{id}/dismiss:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Waitlist, Administration]
      operationId: dismissAdminDownloadRequest
      summary: Archive a handled download request
      description: |
        Identical in semantics to archiving an activity entry: hides the row from the default
        view, destroys nothing, is idempotent, is not written to the ACTIVITY LOG, and appends
        the same row to the `dismissal_events` log; see
        `POST /admin/audit_events/{id}/dismiss` for why those last two are both true at once,
        and for the exact scope of that log's append-only guarantee.
        The arrival of a download request is not audited either, for a different reason worth
        keeping distinct — that is a stranger filling in a public form, and an audit trail that
        records public traffic stops being able to answer what an operator did here.
      security:
        - cookieAuth: []
      x-required-scope: admin
      responses:
        "200":
          description: The archived download request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDownloadRequestEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404":
          description: No download request with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: download request not found }
        "503": { $ref: "#/components/responses/AdministratorBootstrapRequired" }
    delete:
      tags: [Waitlist, Administration]
      operationId: restoreAdminDownloadRequest
      summary: Return an archived download request to the default view
      security:
        - cookieAuth: []
      x-required-scope: admin
      responses:
        "200":
          description: The download request, no longer archived.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDownloadRequestEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404":
          description: No download request with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: download request not found }
        "503": { $ref: "#/components/responses/AdministratorBootstrapRequired" }

  /admin/mac_releases:
    get:
      tags: [Administration]
      operationId: listMacReleases
      summary: Every published Campus build
      description: |
        What has been published, newest publication first — ordered by when the decision was
        made rather than by version string, because version strings do not sort and a rollback
        deliberately republishes an older build.

        At most one release per platform, channel and product channel carries `current: true`,
        and that is the one `POST /download_requests` serves a link to.
      security:
        - cookieAuth: []
      x-required-scope: admin
      responses:
        "200":
          description: Published releases, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMacReleases" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "503": { $ref: "#/components/responses/AdministratorBootstrapRequired" }
    post:
      tags: [Administration]
      operationId: publishMacRelease
      summary: Publish a built Campus artifact
      description: |
        Registers a build so `POST /download_requests` has something to link to. The body is
        the `dist/download-manifest.json` that `deploy/mac-app.sh` writes beside the artifact,
        field for field, plus the `url` it was uploaded to — which the script cannot know,
        because it builds and signs but does not upload. `bytes` from the manifest is the only
        field that is stored under a different name (`size_bytes`).

        IDEMPOTENT on platform, channel, product channel, version and build. A deploy script
        retries; a retry returns `200` and the release already recorded, untouched, where the
        first call returned `201`. If the same identity arrives describing DIFFERENT bytes —
        a different checksum, size, URL or revision — it is refused with `409` rather than
        overwriting, because a published build's bytes are immutable and people verify them.

        RAILS DERIVES `distributable`; the caller does not supply it. It is true only for a
        `developer-id` build that is both signed and notarized, which is exactly the rule
        `deploy/mac-app.sh` applies when it writes the manifest, and false for every
        `app-store` package. Sending `distributable` is allowed and is checked: a value that
        disagrees with what Rails derives is refused with `422`, which is how a drifted copy
        of the build script is caught rather than quietly publishing under a rule nobody
        reviewed. A release that is not distributable is recorded and never becomes current.
      security:
        - cookieAuth: []
      x-required-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mac_release]
              properties:
                mac_release:
                  type: object
                  required: [channel, product_channel, version, build, revision, url, sha256, bytes]
                  properties:
                    platform: { type: string, enum: [macos], default: macos }
                    channel: { type: string, enum: [developer-id, app-store] }
                    product_channel:
                      type: string
                      enum: [dev, production]
                      description: |
                        `deploy/mac-app.sh --product`. Only `production` is ever served to the
                        public; the Dev app is publishable so its releases are recorded, never
                        so a stranger is sent one.
                    version: { type: string }
                    build: { type: string }
                    revision: { type: string, pattern: "^[0-9a-f]{40}$" }
                    url:
                      type: string
                      format: uri
                      description: |
                        Must be absolute and `https://`. The host is configuration, not a
                        constant: set `CAMPUS_DOWNLOAD_HOSTS` to a comma-separated allowlist to
                        have it enforced, and leave it unset for any https host.
                    sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
                    bytes: { type: integer, minimum: 1, description: Stored as `size_bytes`. }
                    minimum_macos: { type: string }
                    architectures: { type: array, items: { type: string } }
                    signed: { type: boolean }
                    notarized: { type: boolean }
                    signing_authority: { type: string }
                    distributable:
                      type: boolean
                      description: |
                        Optional and never authoritative. Rails derives the flag; a value that
                        disagrees is refused with 422.
                    built_at: { type: string, format: date-time }
      responses:
        "200":
          description: The identical manifest was already published. Nothing changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMacReleaseEnvelope" }
        "201":
          description: The release was published.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMacReleaseEnvelope" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "409":
          description: |
            A different artifact is already published under this version and build. Rebuild
            with a new `--build` number rather than republishing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/AdministratorBootstrapRequired" }

  /admin/profile:
    get:
      tags: [Administration, Account]
      operationId: getAdminProfile
      summary: Read the signed-in administrator's own account
      description: |
        The credential half of a person's profile, as distinct from `/profile`, which is
        anybody's presentation preferences. It lives under `/admin` because a write here is an
        administrator action recorded in the audit trail with a `User` as its actor.
      security:
        - cookieAuth: []
      x-required-scope: admin
      responses:
        "200":
          description: The signed-in administrator's own account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "503": { $ref: "#/components/responses/AdministratorBootstrapRequired" }
    patch:
      tags: [Administration, Account]
      operationId: updateAdminProfile
      summary: Change your own email address or password
      description: |
        `current_password` is required for ANY change, the address included. Gating only the
        password would mean that taking over a signed-in browser for a minute is enough to move
        the address that owns the account — and the address is how the account is recovered, so
        moving it is a takeover with extra steps.

        ## `reauthentication_required`

        Server-authored, and load-bearing. Campus revokes every session of an account whose
        password, role or disabled state changes — and deliberately NOT one whose email address
        changes, since moving your own address does not invalidate the credential you moved it
        with. So a password change logs the caller out of the very browser that made the
        request, and an address change does not.

        A client cannot work that out without reimplementing a server rule, and one that guessed
        would either strand an administrator on a dead session firing failing requests or sign
        them out of a working one. The flag is read off the save that just happened, so it is
        true exactly when this request destroyed the caller's own credential. When it is true,
        send the person to sign in again; when it is false, carry on.

        Audited as `profile.updated`, with `changed` naming the fields that moved. Never a
        password and never a digest.
      security:
        - cookieAuth: []
      x-required-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile]
              properties:
                profile:
                  type: object
                  required: [current_password]
                  properties:
                    email_address: { type: string, format: email }
                    password: { type: string, format: password, minLength: 12 }
                    current_password: { type: string, format: password }
      responses:
        "200":
          description: The updated account, and whether the caller must sign in again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProfileUpdate" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "422":
          description: |
            The current password was wrong or missing, no field actually changes, or the model
            refused the new value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                wrongPassword: { value: { error: your current password is incorrect } }
                noChange: { value: { error: at least one profile change is required } }
                invalidEmail: { value: { error: "Validation failed: Email address is invalid" } }
        "429":
          description: |
            Too many WRONG current passwords for this account: five inside fifteen minutes.
            Re-checking the password is what makes this endpoint safe to expose, and it is also
            what makes it a guessing oracle for a caller holding a stolen session, so failed
            verification is counted the way `POST /session` counts login attempts.

            Counted per ACCOUNT and not per address. A stolen session names exactly one account
            and cannot be made to name another, while the caller's address is the cheapest
            thing an attacker can change, so keying on the address here would remove the limit
            rather than tighten it.

            Only FAILURES cost anything, and the way that is arranged is worth knowing. Every
            request claims an attempt atomically BEFORE the password is compared, so callers
            arriving at the same instant are handed different numbers and no more than five of
            them can reach the comparison however many are sent at once. A correct password then
            hands the whole allowance straight back. A successful profile change therefore
            spends none of it, and an administrator using their own settings page normally never
            meets this response. A body carrying no `profile` object is refused on its shape with
            the `400` above BEFORE anything is claimed, so it costs nothing: a request that never
            named a password was never a guess, and a throttle a non-guess can spend would be a
            lockout mechanism rather than a limit. Note that a stray top-level key is wrapped into
            `profile` rather than refused, so it does reach the comparison, fails it on an absent
            password, and spends an attempt like any other empty guess.

            The message is deliberately generic and never says how many attempts remain or how
            close a guess was; an ordinary single wrong password keeps answering `422` with
            `your current password is incorrect`. Carries no `Retry-After`, like the other
            endpoint-level limiters and unlike the API-wide ceiling under `RateLimited`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                profilePasswordLimit: { value: { error: "too many requests; try again shortly" } }
        "503": { $ref: "#/components/responses/AdministratorBootstrapRequired" }

  /admin/api_tokens:
    get:
      tags: [Administration]
      operationId: listApiTokens
      summary: Every API token ever issued, newest first
      description: |
        Revoked and expired tokens included, and that is the point: a revoked credential is
        the one you most want to look at, because "what was this, who made it, and when did
        it last work" is a question that only comes up after the fact. Deleting the row would
        answer none of it.

        `active` is the single field worth reading first — it folds revocation and expiry
        together, so a client never has to compare `expires_at` against its own clock.
        `last_used_at` is refreshed at most once every five minutes per token, deliberately:
        it answers "is this credential still in use", which nobody asks to the second, and
        writing it on every request would turn every read of the credential into a write.

        Never the digest and never the plaintext. The digest is not a secret the way the
        plaintext is, but it is the exact value authentication compares against, so handing
        it to a client turns an offline guess into an offline verification.
      security:
        - cookieAuth: []
      x-required-scope: admin
      responses:
        "200":
          description: Every token, revoked ones included.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiTokenList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "503": { $ref: "#/components/responses/AdministratorBootstrapRequired" }
    post:
      tags: [Administration]
      operationId: createApiToken
      summary: Mint a named, scoped, revocable API token
      description: |
        The credential for everything that is neither a browser nor an agent. Until this
        existed the only such credential was the static admin token, which grants everything,
        never expires, is shared by every non-browser caller and cannot be revoked without
        rotating it for all of them — defensible while the only client was the user's own
        laptop, and indefensible the moment something Campus did not write holds it.

        **The plaintext is in this response and nowhere else, ever.** Campus stores a SHA-256
        digest and cannot reissue or recover the token; a lost one is revoked and replaced.
        `notice` says so in the body, in the same register `POST /agents/land` uses for the
        token it hands back at landing, because it is the same bargain.

        `scopes` narrows the credential — see the Scopes section above for the vocabulary.
        Omitting it entirely mints a token with **full access**, which is a real choice an
        operator can make out loud. Sending `scopes` as anything other than an array of
        strings is `422` rather than a silent drop: a dropped list reads as an empty one,
        which grants everything, so a caller trying to narrow a credential and mistyping the
        shape would otherwise be handed the widest token in the system with nothing to
        indicate anything had happened.

        `expires_at` is optional and, when sent, must read as a time; anything else is `422`
        naming the key. `created_by` is stamped with the signed-in administrator's email, so
        the audit trail says who minted what.
      security:
        - cookieAuth: []
      x-required-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_token]
              properties:
                api_token:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                      description: |
                        Unique, case-insensitively. It is also what lands in `created_by` and
                        `actor_name` on every row this token writes, permanently and
                        unrenamably — so name it after the thing holding it, not after the
                        day you made it.
                    scopes:
                      type: array
                      description: Omit for full access. An empty array means the same thing.
                      items: { $ref: "#/components/schemas/Scope" }
                    expires_at:
                      type: [string, "null"]
                      format: date-time
                      description: ISO 8601. Omit for a token that does not expire.
            examples:
              narrow:
                summary: A CI job that only files tasks
                value: { api_token: { name: ci-deploy-bot, scopes: [tasks:read, tasks:write] } }
              expiring:
                summary: A dashboard key that expires
                value: { api_token: { name: status-wall, scopes: [tasks:read], expires_at: "2027-01-31T00:00:00Z" } }
      responses:
        "201":
          description: Minted. Copy `token` now — this is the only time it exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedApiToken" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "422":
          description: |
            A `scopes` that is not an array of strings, an unreadable `expires_at`, a
            duplicate name, or a scope Campus does not recognise.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                scopesShape:
                  summary: A single string where an array was needed
                  value:
                    error: >-
                      scopes must be a JSON array of strings — send
                      {"api_token":{"scopes":["tasks:read"]}} rather than a single string, or
                      omit the key entirely for a token with full access.
                badExpiry:
                  value:
                    error: >-
                      expires_at could not be read as a time: send an ISO 8601 timestamp such
                      as 2027-01-31T00:00:00Z, or omit the key for a token that does not
                      expire.
                unknownScope:
                  value:
                    error: >-
                      Validation failed: Scopes includes tasks:delete, which Campus does not
                      recognise — use scopes from tasks:read, tasks:write, agents:read,
                      agents:write, sessions:write, board:write, credentials:write,
                      settings:write, admin, or send an empty list for a credential with full
                      access
        "503": { $ref: "#/components/responses/AdministratorBootstrapRequired" }

  /admin/api_tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [Administration]
      operationId: revokeApiToken
      summary: Revoke an API token
      description: |
        **Revokes; never deletes.** What a token did should stay readable after it stops
        working, so the row survives with `revoked_at` set and `active` false, and the token
        goes on appearing in `GET /admin/api_tokens`. The response is that row — a `200` with
        the token, not a `204` with nothing, because the timestamp is the useful part.

        Idempotent, because `DELETE` is: a second call keeps the first one's timestamp and
        writes no second audit row, so the log says when the credential actually stopped
        working rather than when somebody last pressed the button.

        It takes effect on the very next request that presents the token, which then gets the
        ordinary `401`.
      security:
        - cookieAuth: []
      x-required-scope: admin
      responses:
        "200":
          description: The token as it now stands — revoked, and still readable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/AdministratorBootstrapRequired" }

  /admin/visitor_passes:
    get:
      tags: [Administration]
      operationId: listVisitorPasses
      summary: Every visitor pass ever issued, newest first
      description: |
        Revoked and expired passes included — the same reasoning as `GET /admin/api_tokens`:
        a pass that stopped working is exactly the one an operator wants to look back at.
        Never the token, never the digest.
      x-required-scope: admin
      responses:
        "200":
          description: Every pass.
          content:
            application/json:
              schema:
                type: object
                required: [visitor_passes]
                properties:
                  visitor_passes:
                    type: array
                    items: { $ref: "#/components/schemas/VisitorPass" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Missing scope, or an agent token — this route is human-only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [Administration]
      operationId: createVisitorPass
      summary: Mint a visitor pass — send any outside agent to Campus with one pasted line
      description: |
        The credential for "send an agent I already run elsewhere to this island as a worker,
        without Campus spawning it, funding it, or holding its credentials." The response
        carries the plaintext token **exactly once**, plus a server-authored, ready-to-paste
        `invite_sentence` — the whole onboarding a stranger's agent needs is that one sentence
        plus what `GET /join` teaches it from there.

        `project_id` is what `GET /join` falls back to when its own `?project=` is absent or
        does not resolve — see the Visitors section above for the full four-way order.
        `max_agents` (default 5) and `ttl_days` (default 7) bound how many agents this one
        pass may ever land and how long it stays offered at all.

        Human-only, on top of the scope: this is a credential-issuing endpoint reachable by
        agents landed through the credentials it issues, and letting one mint its own
        replacement would be the same escalation `POST /agents/land` already refuses for
        `token_scopes`.

        The Mac Land Agent sheet is a first-party consumer: its **Land External Agent**
        button mints here with `max_agents: 1` — the control is singular, so the pass it
        produces admits exactly one agent — and renders `invite_sentence` and `notice`
        verbatim, decoding nothing else from this response. Semantic changes to either
        field reach that screen word for word.
      x-required-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitor_pass]
              properties:
                visitor_pass:
                  type: object
                  required: [label]
                  properties:
                    label: { type: string, description: How a human tells this pass apart from another in the list. }
                    project_id: { type: integer, description: Optional. Falls back to island-wide when absent. }
                    max_agents: { type: integer, default: 5 }
                    ttl_days: { type: integer, default: 7 }
            examples:
              basic:
                summary: An island-wide pass, default limits
                value: { visitor_pass: { label: "Yuri's laptop Claude Code" } }
              scoped:
                summary: A pass tied to one project, with a raised cap
                value: { visitor_pass: { label: "contractor fleet", project_id: 3, max_agents: 10, ttl_days: 3 } }
      responses:
        "201":
          description: Minted. Copy `invite_sentence` (or `token`) now — this is the only time it exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedVisitorPass" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Missing scope, or an agent token — this route is human-only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: A missing `label`, a malformed `max_agents`/`ttl_days`, or a `project_id` that names no project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/visitor_passes/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [Administration]
      operationId: revokeVisitorPass
      summary: Revoke a visitor pass
      description: |
        **Revokes; never deletes** — the same reasoning as `DELETE /admin/api_tokens/{id}`.
        A visitor already landed keeps working; revoking only stops the pass from opening
        `GET /join` or landing another agent. Idempotent: a second call keeps the first
        timestamp and files no second event.
      x-required-scope: admin
      responses:
        "200":
          description: The pass as it now stands — revoked, and still readable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitorPass" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Missing scope, or an agent token — this route is human-only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /join:
    get:
      tags: [Agents]
      operationId: join
      summary: A total stranger's front door
      description: |
        Authenticated **only** by a valid visitor pass — `Authorization: Bearer cvp_...`.
        Every other credential, expired or not, gets the same `401` an unrecognised one does:
        this is not a second way for someone already inside Campus to read the same page, it
        is where a stranger's agent starts from zero.

        `?project=<name>` resolves which Project (if any) the visitor lands into, in order:
        an exact Project name match, then the basename of a Project's `repo_path`, then the
        pass's own `project_id`, then null (island-wide). An unrecognised `?project=` value
        does not fail the request — it falls through to the next rule and the returned
        `document` says so, because a stranger's agent mistyping a repo name must not be
        dead-ended by it.

        The response is one self-contained document: `document` is markdown prose a
        language-model agent can follow with no other knowledge, and the sibling fields are
        the identical facts as exact, copy-pasteable data — `land` with its body already
        filled in, and an `endpoints` map for the rest of the work loop.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The join document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinDocument" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: A real pass that is currently revoked, expired, or has already landed its limit of agents.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "visitor pass 4 has been revoked. Ask whoever invited you for a new one — POST /admin/visitor_passes mints one, and the invite sentence it returns is everything the next agent needs." }

  /world/resources:
    get:
      tags: [World]
      operationId: getWorldResources
      summary: What the machine can currently take
      description: |
        A live sample of the box Campus is running on: load per core, memory, and the
        footprint of Campus-spawned agent processes.

        **This is never a cap.** Campus does not refuse to spawn an agent, throttle one,
        or stop one. `advice` is a sentence naming the actual constraint and recommending
        a course of action, and it says out loud that the user may ignore it.

        `level` degrades to `unknown` with an honest message on a platform this cannot
        read, rather than guessing.
      responses:
        "200":
          description: A sample.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cores: { type: integer }
                  load_average: { type: number }
                  load_per_core: { type: number }
                  memory_used_fraction: { type: number, nullable: true }
                  campus_processes: { type: integer }
                  campus_rss_bytes: { type: integer, nullable: true }
                  level:
                    type: string
                    enum: [ok, warn, critical, unknown]
                  reasons:
                    type: array
                    items: { type: string }
                  advice:
                    type: string
                    description: Human-readable, names the constraint, and states that it is not a cap.
        "401": { $ref: "#/components/responses/Unauthorized" }
  /activity:
    get:
      tags: [Activity]
      summary: Every event on the island, in one stream
      description: |
        The record, as opposed to `GET /board`, which is the decisions.

        Every meaningful act already writes an activity event, but the only other ways to
        read one — `GET /agents/{id}/log` and `GET /tasks/{id}/log` — make you name the
        subject before you may ask the question. So "what just happened here" had no answer
        unless you already knew who it happened to, and an agent landing had none at all:
        the daily summariser reads events globally and keeps only the ones about tasks.

        **The server names every subject.** `subject_label` is the task's title, the agent's
        name, or a fixed name for a subject that has none (`Campus settings`). A client
        renders it and must never resolve an id itself. A subject that was destroyed without
        taking its events with it reads as `(deleted)` — the event is still a true statement
        about the past, so it keeps its place in the record.

        **The filter vocabulary is served, not assumed.** `filters` lists the verbs, subject
        types and actor kinds actually present, narrowed by `since` when one is given. A
        client that hardcodes a verb list is wrong the first time a new verb is logged.
      operationId: activityIndex
      x-required-scope: tasks:read
      parameters:
        - name: order
          in: query
          description: |
            `newest` (default) or `oldest`. Anything else is refused rather than ignored —
            a sort that silently did not apply looks exactly like a sort with nothing to do.
          schema: { type: string, enum: [newest, oldest], default: newest }
        - name: cursor
          in: query
          description: |
            Keyset cursor from a previous `pagination.next_cursor`, in the form
            `<order>:<id>` — e.g. `newest:412`. Deliberately not named `before_id`: this
            feed sorts both ways, and "before" swaps meaning when the order flips, so a
            client that changed the sort while holding one would page backwards through the
            archive and never be told. The cursor therefore carries the order it was minted
            under, and replaying it under the other one is a 422 rather than a wrong page.
            A malformed cursor is refused too, rather than quietly restarting at page one.

            Keyed on `id`, not `created_at`. Events are written in bursts — a transition
            and its comment land in the same transaction — and tied timestamps under a
            keyset cursor repeat rows across pages or drop them between pages.
          schema: { type: integer, format: int64, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: subject_type
          in: query
          description: One of the values in `filters.subject_types`, e.g. `Task` or `Agent`.
          schema: { type: string }
        - name: verb
          in: query
          description: One of the values in `filters.verbs`, e.g. `landed` or `claimed`.
          schema: { type: string }
        - name: actor_kind
          in: query
          schema: { type: string }
        - name: since
          in: query
          description: |
            Strict ISO 8601. Deliberately not parsed leniently: `Time.zone.parse` reads
            "last tuesday" as midnight this morning and would answer 200 with a confident
            window the caller never asked for.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: A page of the record, with the vocabulary to filter it.
          content:
            application/json:
              schema:
                type: object
                required: [activity, pagination, filters]
                properties:
                  activity:
                    type: array
                    items:
                      type: object
                      required: [id, verb, subject_type, subject_id, subject_label, actor_kind, meta, created_at]
                      properties:
                        id: { type: integer, format: int64 }
                        verb: { type: string, example: landed }
                        subject_type: { type: string, example: Agent }
                        subject_id: { type: integer, format: int64 }
                        subject_label:
                          type: string
                          description: Server-authored. `(deleted)` when the subject is gone.
                          example: surveyor
                        actor_kind: { type: string, example: agent }
                        actor_name: { type: string, nullable: true }
                        meta:
                          type: object
                          additionalProperties: true
                          description: |
                            The logging site's own payload. Replaced by `{"redacted": true}`
                            when the event's subject is governed by a scope the caller does
                            not hold — a credential event carries `account_email`, which is
                            otherwise reachable only with `credentials:write`. The event
                            itself is ordinary history and is never hidden; only its payload
                            is withheld.
                        created_at: { type: string, format: date-time }
                  pagination:
                    type: object
                    required: [per_page, cursor, next_cursor]
                    properties:
                      per_page: { type: integer }
                      cursor: { type: string, nullable: true }
                      next_cursor:
                        type: string
                        nullable: true
                        example: "newest:412"
                        description: null on the last page, so a client never pages into nothing.
                  filters:
                    type: object
                    required: [verbs, subject_types, actor_kinds]
                    properties:
                      verbs: { type: array, items: { type: string } }
                      subject_types: { type: array, items: { type: string } }
                      actor_kinds: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /activity/ask:
    post:
      tags: [Activity]
      summary: Ask the record a question
      description: |
        The Activity feed is a long, flat, honest list — the right shape for a record and the
        wrong shape for a question. This asks it one: what did that agent do all afternoon,
        what changed on this project yesterday, who touched the thing that broke.

        **The assistant reads the API; it is not handed a window.** It is given a scoped,
        short-lived token and the shape of `GET /activity`, so it pages and narrows as the
        question requires. Feeding it the page a reader had scrolled to would cap what could
        be asked at what they had already seen, and the questions worth asking span more.

        **Nothing is persisted.** The conversation lives in the client and replays with each
        question via `history`; there is no transcript to read back and none to clean up.
        Turns are quoted into the prompt as labelled transcript — a replayed turn is data a
        client sent, never an instruction — and any turn whose `role` is not `user` or
        `assistant` is dropped rather than relabelled.
      operationId: activityAsk
      x-required-scope: tasks:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                  example: What did surveyor do this afternoon?
                history:
                  type: array
                  description: |
                    Earlier turns of this sitting, oldest first. The last 12 are used; longer
                    bodies are truncated. Optional — a first question sends none.
                  items:
                    type: object
                    required: [role, body]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      body: { type: string }
      responses:
        "200":
          description: The answer.
          content:
            application/json:
              schema:
                type: object
                required: [answer, display_answer]
                properties:
                  answer: { type: string, description: Raw model output. }
                  display_answer:
                    type: string
                    description: Rails-authored display form with terminal and invisible controls removed.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "422":
          description: There was no question to ask.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: |
            The model could not be reached, is not signed in, or took too long. Deliberately
            not a 500 — each of those is a dependency being down rather than a bug in Campus,
            and the message says which. The question is not lost; the client still holds it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /world/snapshot:
    get:
      tags: [World]
      summary: Everything the board needs in one request
      description: |
        The whole island in one payload: projects, the imaginarium (newest 300), the
        claimable seashore in claim order (300), the work underway (300), every blocked task
        with its age, every active agent, and a preview of the human's board. The web client
        polls this every 3 seconds.
      operationId: worldSnapshot
      x-required-scope: tasks:read
      parameters:
        - name: transport
          in: query
          required: false
          schema: { type: string, default: polling }
          description: |
            The raw transport that caused this read. Rails turns `live` into the live
            semantic presentation and every absent or unknown value into polling-current;
            clients never choose labels, severity, freshness, or degraded-state copy.
      responses:
        "200":
          description: Snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorldSnapshot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /island:
    get:
      tags: [World]
      summary: Read the versioned Island presentation contract
      description: |
        The only data entry point available to the renderer packaged inside Campus.app.
        Rails owns the readiness state, severity, user-facing heading and message, retry
        action, refresh cadence, renderer contract version, and normalized world snapshot.
        The Mac host forwards this response byte-for-byte and the packaged JavaScript only
        renders it. There are no Island mutation routes.

        Unlike legacy API failures, authentication, scope, and snapshot-assembly failures
        on this route keep the same versioned `IslandPresentation` envelope. A renderer
        therefore never derives domain meaning from an HTTP status or parses error text.
      operationId: islandShow
      x-required-scope: tasks:read
      responses:
        "200":
          description: Rails is ready and the snapshot may be rendered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IslandPresentation" }
        "401":
          description: Authentication failed; status state is `unauthorized`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IslandPresentation" }
        "403":
          description: The credential lacks `tasks:read`; status state is `forbidden`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IslandPresentation" }
        "503":
          description: Rails is reachable but cannot assemble the snapshot yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IslandPresentation" }
        "429":
          description: Rate limited; status state is `rate_limited` and Retry-After is present.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IslandPresentation" }

  /landing/prompt:
    get:
      tags: [Settings]
      summary: Read the landing prompt
      description: |
        The billboard in the Landing Park — the markdown every agent reads on arrival.
        Readable by agents (this is the one instruction surface they are given).
      operationId: landingShow
      responses:
        "200":
          description: The current landing prompt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LandingPrompt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Settings]
      summary: Replace the landing prompt
      operationId: landingUpdate
      x-required-scope: settings:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [landing_prompt]
              properties:
                landing_prompt:
                  type: string
                  description: Markdown. Sent at the top level, not wrapped in `settings`.
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LandingPrompt" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /settings:
    get:
      tags: [Settings]
      summary: Read workspace settings
      description: |
        Every settings column except `admin_token_digest` and `landing_prompt`, plus the
        derived `effective_default_project_id` (falls back to the oldest project) and the
        server-authored `campus_icon_choices` vocabulary (with its deprecated id-only
        predecessor, `campus_icon_options`).
      operationId: settingsShow
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Settings]
      summary: Update workspace settings
      description: |
        A partial write: only the keys sent are changed. `approval_mode` decides what runs
        unattended and `engines` decides what binary runs at all, so this is a bigger act than
        the endpoint's size suggests — hence the scope. Reads stay open: every client shows
        these values and none of them is a secret.

        Every setting except `construction_threshold` is human-only, on top of the scope.
        New settings fail closed into that rule. `campus_icon` is branding/navigation domain
        configuration: clients select one of the safe built-in symbol ids returned by
        `campus_icon_choices`; paths, commands and remote assets are never accepted.

        `engines` is an arbitrary nested object on purpose. The shape of an entry belongs to
        the registry, which normalises string keys, skips anything that is not an object and
        refuses to mark an entry spawnable when it names no engine — enumerating those keys
        here would put the same rule in two places and let them drift. See `GET /engines` for
        what it merges into.

        A changed `reviewer_provider`/`reviewer_model` or
        `default_agent_provider`/`default_agent_model` pair is validated against the
        Rails-owned model catalog. An unchanged saved pair is allowed to survive a temporary
        discovery outage or vendor removal, which is what lets a whole-slice Settings client
        save an unrelated field without silently replacing the model. Invalid changed pairs
        return 422 and nothing is written.
      operationId: settingsUpdate
      x-required-scope: settings:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings: { $ref: "#/components/schemas/SettingsPatch" }
            examples:
              approval:
                value: { settings: { approval_mode: full_auto } }
              teachAnEngine:
                summary: Register an engine this installation has, and switch one off
                value:
                  settings:
                    engines:
                      hermes: { engine: hermes_cli, binary: hermes, notes: "ours; runs on the build box" }
                      google: { spawnable: false }
      responses:
        "200":
          description: Saved. Returns the same shape as `GET /settings`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            A credential without `settings:write`, or an agent token that tried to write a
            human-only setting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                humanOnlySetting:
                  value:
                    error: >-
                      campus_icon decides how Campus identifies itself, so only a human may
                      write it: sign in with POST /session, or use the local admin token. An
                      agent may write: construction_threshold. Reading every setting stays open.
                scope:
                  value: { error: "this credential does not carry the `settings:write` scope, which PATCH /settings requires." }
        "422":
          description: A changed provider/model pair is absent from the catalog or could not be validated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /fs/browse:
    get:
      tags: [Filesystem]
      summary: List sub-directories of a path
      description: |
        Server-side directory browsing, used by the project picker. Safe because Campus is
        local-first — the server *is* the user's machine — but confined to `$HOME`: a path
        outside it (after `realpath`, so `..` tricks resolve) is `422`.

        Hidden directories are skipped, files are skipped, and the listing is capped at 500
        entries sorted case-insensitively.

        **Human-only.** An agent token gets `403 {"error":"humans only"}`.
      operationId: fsBrowse
      x-required-scope: settings:write
      parameters:
        - name: path
          in: query
          required: false
          description: Absolute directory path. Defaults to the user's home directory.
          schema: { type: string }
          example: /Users/yuri/Documents
      responses:
        "200":
          description: Directory listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirListing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            Either an agent token (`humans only`), or the OS refused the read
            (`permission denied`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                agent: { value: { error: humans only } }
                eacces: { value: { error: permission denied } }
        "422":
          description: |
            `path outside home directory`, or the path exists but is not a directory
            (`not a directory`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                outside: { value: { error: path outside home directory } }
                notDir: { value: { error: not a directory } }

  /projects:
    get:
      tags: [Projects]
      summary: List projects
      description: |
        Every project on the island as a snapshot, oldest first. Archived projects are absent;
        `?archived=true` returns exactly the other set, never both, because a list that mixed
        them would put an archived building back into every client that renders this catalog.
      operationId: projectsIndex
      x-required-scope: tasks:read
      parameters:
        - name: archived
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: "`true` lists the archived projects instead of the live ones."
      responses:
        "200":
          description: Projects.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectSnapshot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Projects]
      summary: Create a project
      description: |
        Two shapes, distinguished by which path key is present:

        * `{ name, repo_path }` — adopt an existing directory.
        * `{ name, parent_path, git_init }` — create `<parent_path>/<name>` and adopt it.

        `git_init` defaults to **true**: unless the target is already a repo, Campus runs
        `git init` and creates an empty initial commit with Campus-owned Git identity, because
        agents need a valid `HEAD` to make worktrees. An existing repository is never seeded
        or otherwise changed. If initialization or the initial commit fails, the request fails
        with `422` and no project is created; a folder this request had just created is removed
        again. In an adopted folder, pre-existing files remain and only Git metadata created by
        this request is rolled back.

        When `parent_path` is used the name must match `/\A[A-Za-z0-9._-]+\z/` — the
        project name *is* the folder name. Both paths must resolve inside `$HOME`.
      operationId: projectsCreate
      x-required-scope: settings:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project]
              properties:
                project:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string, maxLength: 80, description: Unique. Also the folder name when `parent_path` is used. }
                    description: { type: string }
                    repo_path: { type: string, description: Adopt this existing directory. }
                    parent_path: { type: string, description: Create `<parent_path>/<name>` instead. Not persisted. }
                    coastline_slot: { type: [integer, "null"], description: Position on the island's coastline. }
                    git_init:
                      type: boolean
                      default: true
                      deprecated: true
                      description: >-
                        Initialize the repo path with a valid `HEAD` unless it is already a
                        repo. Current clients no longer send this key — omitting it means a
                        non-repo folder is always initialized, because agents cut worktrees
                        and a project without a repository is not a choice the clients
                        offer. Still accepted for old clients: an explicit `false` keeps
                        producing a sandbox project, exactly as before.
            examples:
              adoptExisting:
                summary: Adopt a folder that already exists
                value: { project: { name: campus, repo_path: /Users/yuri/Documents/Codebase/campus } }
              createNew:
                summary: Create the folder and init a repo
                value: { project: { name: new-thing, parent_path: /Users/yuri/Documents, git_init: true } }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectSnapshot" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: |
            Validation failed (a duplicate `name`), or the path was rejected by the
            versioned Rails path contract. Path failures return `ProjectPathValidation`
            with the authoritative reason, severity, message, remediation, and normalized
            path; other failures return `Error`.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/Error" }
                  - { $ref: "#/components/schemas/ProjectPathValidation" }
              examples:
                duplicate: { value: { error: "Validation failed: Name has already been taken" } }
                outsideHome:
                  value: { contract_version: 1, valid: false, reason: outside_home, severity: error,
                           message: "This path is outside your home directory.",
                           remediation: "Choose a directory inside your home folder.", normalized_path: "/tmp" }
                gitInit: { value: { error: "git init failed: fatal: could not create leading directories" } }
                gitMissing: { value: { error: "git init failed: git is not installed" } }
                gitInitialCommit: { value: { error: "git initial commit failed: fatal: unable to write new index file" } }
                exists: { value: { error: "/Users/yuri/Documents/new-thing already exists" } }

  /projects/status:
    get:
      tags: [Projects]
      summary: Activity status for every project on the island
      description: |
        The cheap poll: two fields per project, four grouped queries regardless of how many
        projects there are. `GET /projects` rebuilds every building's alarms, windows and
        attention banner and is not a thing to put on a timer; this is.

        **Polling policy.** Campus authors one policy so every client obeys the same one:

        * Poll this **once a minute**, and send it only for the projects you last saw as
          `active`. Those are the only ones where something is happening that a clock can
          catch up with.
        * A `stopped` project does not restart on its own — something has to arrive to restart
          it — so re-read it when a request goes out on your behalf, not on a timer.
        * `idle` and `done` refresh when the island or the Projects panel loads.

        Archived projects are absent, because nothing polls a project that is off the island.
      operationId: projectsStatus
      x-required-scope: tasks:read
      responses:
        "200":
          description: One row per project on the island, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, work_status]
                  properties:
                    id: { type: integer }
                    work_status: { $ref: "#/components/schemas/ProjectWorkStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }

  /projects/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Projects]
      summary: Archive a project
      description: |
        Takes the project off the island and stops its work. Runs the cascade described by
        `ProjectCascade`, then stamps `archived_at`. Nothing is deleted: the row, its tasks
        and its history are kept, and `GET /projects?archived=true` lists it again.

        **Humans only.** Archiving dismisses every agent holding one of the project's tasks
        and clears a board those agents share — one agent asking to retire others is the same
        shape of request `PATCH /settings` refuses, so an agent is refused here outright
        rather than narrowed by a scope. An agent may still read every project and its
        `work_status`.

        **Confirmation is required.** Send `confirm` with the project's exact name — the value
        the snapshot publishes as `lifecycle.archive.confirmation.expected`. The comparison is
        exact: not trimmed, not case-folded. A mismatch is a `422` that names the string that
        would have worked, and nothing cascades.
      operationId: projectsArchive
      x-required-scope: settings:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, description: The project's exact name. }
      responses:
        "200":
          description: The archived project's snapshot, plus what the cascade did.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ProjectSnapshot"
                  - type: object
                    required: [cascade]
                    properties:
                      cascade: { $ref: "#/components/schemas/ProjectCascade" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnlyOrScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "`confirm` was missing or was not the project's exact name. Nothing changed."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /projects/path_validation:
    post:
      tags: [Projects]
      summary: Validate a project path
      description: |
        Rails-authored preflight semantics for project creation or import. Clients debounce
        this request while the selected path changes and render `message` and `remediation`
        verbatim; `reason`, `severity`, and `normalized_path` remain normalized contract data.
        Clients must not recreate filesystem rules or author replacement domain sentences.
      operationId: projectsPathValidation
      x-required-scope: settings:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, path]
              properties:
                mode: { type: string, enum: [create, existing] }
                path: { type: string, description: Existing parent or project directory. }
                git_init: { type: boolean, default: true }
      responses:
        "200":
          description: Versioned path validation result, including actionable blocking semantics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectPathValidation" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }

  /projects/import:
    post:
      tags: [Projects]
      summary: Import every project folder inside a parent folder
      description: |
        Bulk "adopt each child folder of `parent_path` as a project". One level deep only —
        it never recurses — and it never writes to the disk: no folder is created, no
        `git init` is run. Only rows in the database change.

        Every child is reported with an `outcome`, and the skips are the point:

        | Outcome | Why |
        |---------|-----|
        | `created` | Adopted. The folder's name becomes the project name. |
        | `skipped_worktree` | A **git worktree** — a second checkout of a repo that already has a project. Detected by `.git` being a *file* (`gitdir: …`) rather than a directory, and by `git rev-parse --git-common-dir` resolving outside the folder, which also catches a plain sub-directory of a repo living above it. |
        | `skipped_existing` | A project already has this `repo_path`. This is what makes the endpoint idempotent — run it twice and the second run creates nothing. |
        | `skipped_name_taken` | A *different* project already owns that name, or the folder name fails validation (over 80 characters). One bad folder never aborts the run. |
        | `skipped_not_a_directory` | A file, or a symlink. Symlinks are not followed — that is how an import confined to `$HOME` would otherwise adopt `/etc`. |

        Hidden entries (dot-folders) are skipped silently and do not appear in `results` at
        all, matching `GET /fs/browse`.

        Send `dry_run: true` to get exactly the report a real run would produce **without
        writing anything** — the UI shows that preview before it commits.

        `parent_path` must resolve inside `$HOME` (`..` is resolved first), like every other
        path in this API.

        **Human-only.** An agent token gets `403 {"error":"humans only"}`.
      operationId: projectsImport
      x-required-scope: settings:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parent_path]
              properties:
                parent_path:
                  type: string
                  description: The folder whose children become projects.
                  example: /Users/yuri/Documents/Codebase
                dry_run:
                  type: boolean
                  default: false
                  description: Preview only — compute the whole report and write nothing.
            examples:
              preview:
                summary: Preview what would happen
                value: { parent_path: /Users/yuri/Documents/Codebase, dry_run: true }
              commit:
                summary: Do it
                value: { parent_path: /Users/yuri/Documents/Codebase }
      responses:
        "200":
          description: |
            A preview (`dry_run: true`), or a run that created nothing — every child was
            already a project, a worktree, or otherwise skipped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportReport" }
        "201":
          description: At least one project was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportReport" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            Either an agent token (`humans only` — browsing the user's disk is human-only),
            or the OS refused to read `parent_path` (`permission denied`). The second is the
            same answer `GET /fs/browse` gives for the same folder: an unreadable folder is
            never reported as an empty one, because "nothing to import" and "I was not
            allowed to look" are indistinguishable to the caller and only one of them is
            safe to act on.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                agent: { value: { error: humans only } }
                eacces: { value: { error: permission denied } }
        "422":
          description: The path is outside `$HOME`, or is not an existing directory.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                outsideHome: { value: { error: must be inside your home directory } }
                missing: { value: { error: parent directory does not exist } }

  /projects/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Projects]
      summary: Show a project
      operationId: projectsShow
      x-required-scope: tasks:read
      responses:
        "200":
          description: Project snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectSnapshot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Projects]
      summary: Update a project
      description: Only the writable columns; the snapshot's derived fields are recomputed.
      operationId: projectsUpdate
      x-required-scope: settings:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project]
              properties:
                project:
                  type: object
                  properties:
                    name: { type: string, maxLength: 80 }
                    description: { type: string }
                    repo_path:
                      type: [string, "null"]
                      description: >-
                        Absolute path to the local repository this project cuts agent
                        worktrees from. Omit the key to leave the current value alone;
                        send an explicit `null` to clear it, which leaves the project
                        without a local repository — still available to self-hosted
                        agents and board work, but no Campus-spawned Office can run in
                        it. Any non-null replacement must resolve to an existing directory
                        inside `$HOME` and is persisted as the normalized real path. Rails
                        applies the same versioned `existing` path contract used by create,
                        with `git_init: false`: a plain directory is allowed as a sandbox,
                        while an invalid path rejects the entire patch atomically.
                    coastline_slot: { type: [integer, "null"] }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectSnapshot" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: |
            Validation failed, or a non-null `repo_path` was rejected by the versioned
            Rails path contract. Path failures return `ProjectPathValidation`; no field
            from the patch is persisted when validation fails.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/Error" }
                  - { $ref: "#/components/schemas/ProjectPathValidation" }
    put:
      tags: [Projects]
      summary: Update a project (PUT alias)
      description: Identical to `PATCH /projects/{id}`; Rails registers both verbs.
      operationId: projectsUpdatePut
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project]
              properties:
                project:
                  type: object
                  properties:
                    name: { type: string, maxLength: 80 }
                    description: { type: string }
                    repo_path:
                      type: [string, "null"]
                      description: >-
                        Absolute path to the local repository this project cuts agent
                        worktrees from. Omit the key to leave the current value alone;
                        send an explicit `null` to clear it, which leaves the project
                        without a local repository — still available to self-hosted
                        agents and board work, but no Campus-spawned Office can run in
                        it. Any non-null replacement must resolve to an existing directory
                        inside `$HOME` and is persisted as the normalized real path. Rails
                        applies the same versioned `existing` path contract used by create,
                        with `git_init: false`: a plain directory is allowed as a sandbox,
                        while an invalid path rejects the entire update atomically.
                    coastline_slot: { type: [integer, "null"] }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectSnapshot" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: |
            Validation failed, or a non-null `repo_path` was rejected by the versioned
            Rails path contract. Path failures return `ProjectPathValidation`; no field
            from the update is persisted when validation fails.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/Error" }
                  - { $ref: "#/components/schemas/ProjectPathValidation" }
    delete:
      tags: [Projects]
      summary: Delete a project permanently
      description: |
        Runs the same cascade as `POST /projects/{id}/archive` — see `ProjectCascade` — and
        then removes the project row itself. This cannot be undone. The project's tasks are
        kept and detached from it (`project_id` becomes null), so no history is destroyed and
        nothing is left mid-flight, but the project is gone.

        **Humans only**, and **confirmation is required**, both for the same reasons archiving
        is: send `confirm` with the project's exact name, the value published as
        `lifecycle.delete.confirmation.expected`. The comparison is exact. A mismatch or a
        missing `confirm` is a `422` that names the string that would have worked, and nothing
        cascades and nothing is deleted.

        Prefer archiving. It stops the same work and keeps the row.
      operationId: projectsDestroy
      x-required-scope: settings:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, description: The project's exact name. }
      responses:
        "200":
          description: The project is gone, and this is what the cascade did on the way out.
          content:
            application/json:
              schema:
                type: object
                required: [id, name, deleted, cascade]
                properties:
                  id: { type: integer }
                  name: { type: string, description: The name it had, so a client can say which one went. }
                  deleted: { type: boolean, enum: [true] }
                  cascade: { $ref: "#/components/schemas/ProjectCascade" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnlyOrScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "`confirm` was missing or was not the project's exact name. Nothing changed."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tasks:
    get:
      tags: [Tasks]
      summary: List tasks
      description: |
        Filters combine with AND. Anything omitted is not filtered.

        **A filter value this endpoint cannot honour is `422`, not an empty list.** That
        matters more here than anywhere else in the API: step 1 of the agent loop is this
        exact query, and the documented response to an empty result is to idle in the park
        and re-check. So a mistyped `stage=Seashore`, a lowercase `priority=p1` or a
        non-numeric `limit` used to read as "there is no work" and park an agent
        indefinitely. They now say what was wrong and what would have worked. `ready` and
        `sort` keep their lenient behaviour described below, which is deliberate and
        documented rather than accidental.

        `sort=priority` is the **claim order** — `staged DESC, P0→P3, queue_position ASC
        NULLS LAST, created_at ASC` — and is deliberately identical to the order
        `POST /tasks/:id/claim` competes over, so what a human queues is what an agent takes.
        `sort=board` is the **board order** — `board_position ASC NULLS FIRST,
        updated_at DESC` — the manual arrangement `POST /tasks/{id}/reorder` persists,
        then the historic newest-updated block for cards nobody has placed; it is what a
        lane-shaped read (the Mac board's claimed/done/filtered lanes) asks for so a
        reorder survives its own re-read. Any other value sorts by `updated_at DESC`.

        Each row carries the same trimmed `assignee` object `GET /tasks/{id}` returns, so a
        list view can name who is working on a task without joining against `/agents` or
        `/world/snapshot`. It is absent, not null, on an unclaimed task. Comments are not
        included — fetch those from `GET /tasks/{id}`.
      operationId: tasksIndex
      x-required-scope: tasks:read
      parameters:
        - name: stage
          in: query
          description: |
            One stage, or a comma-separated list. Every element must be a real stage;
            anything else is `422`, and the message lists the stages that exist.
            Case-sensitive.
          schema: { type: string }
          examples:
            single: { value: seashore }
            multiple: { value: "in_progress,department" }
        - name: project_id
          in: query
          schema: { type: integer }
        - name: priority
          in: query
          description: Case-sensitive. An unknown value is `422`, not an empty list.
          schema: { $ref: "#/components/schemas/Priority" }
        - name: ready
          in: query
          description: Only the literal string `true` filters; anything else is ignored.
          schema: { type: string, enum: ["true"] }
        - name: assignee_id
          in: query
          description: |
            An active agent id, or the literal `unassigned` for tasks with no assignee.
            An unknown/archived id is `422`, not an empty list. Omit for every assignee.
          schema:
            oneOf:
              - { type: integer }
              - { type: string, enum: [unassigned] }
        - name: sort
          in: query
          description: "`priority` for claim order; otherwise newest-updated first."
          schema: { type: string, enum: [priority] }
        - name: limit
          in: query
          description: |
            Row cap. Defaults to 500. Must be a positive whole number — `0`, a negative and
            a non-numeric string are all `422` rather than an empty list, because an empty
            list here is indistinguishable from an empty backlog.
          schema: { type: integer, default: 500, minimum: 1 }
      responses:
        "200":
          description: Tasks with their assignee, without comments.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TaskSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "422":
          description: A filter value this endpoint cannot honour. Never an empty list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                stage:
                  summary: A stage that does not exist
                  value:
                    error: >-
                      stage "Seashore" is not a valid stage (one of: imaginarium, seashore,
                      in_progress, department, blocked, done, closed).
                priority:
                  summary: The right priority in the wrong case
                  value:
                    error: >-
                      priority "p1" is not a valid priority (one of: none, P0, P1, P2, P3).
                      They are case-sensitive — P1, not p1.
                limit:
                  summary: A limit that is not a number
                  value:
                    error: >-
                      limit "abc" is not a positive whole number of rows: pass limit=50, or
                      leave it out for the default of 500.
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Tasks]
      summary: Create a task
      description: |
        `project_id` falls back to `settings.effective_default_project_id` when **omitted**.
        An explicit `project_id: null` is different: it leaves the task in the general,
        unassigned backlog even when a default building exists.

        **The caller's kind rewrites the request.** From an agent, the task is forced to
        `stage=imaginarium`, `priority=P3`, `ready=false`, `needs_human_review=true`
        regardless of what was sent — agents propose ideas, humans approve them. From a
        human, sending `ready=true` together with a real priority sends it straight to the
        seashore.

        A human may also send top-level `agent_id`. Campus then creates the ready task and
        claims it for that active agent in one database transaction. Assigned work requires
        a non-null `project_id` and a real priority; a refusal creates no task, so retrying is
        safe. Agent callers cannot use this hint to bypass review: it is ignored and their
        task still lands in the imaginarium.

        `review_on_create` defaults to **true**: creation returns immediately and a critique of
        the new task is written out of band, landing as the first assistant message in
        `GET /tasks/{id}/chat`. Send `review_on_create: false` to skip it — worth doing for
        bulk or machine-generated tasks.

        A `project_id` that names no project is `422` and says so. It used to reach Postgres
        and come back as a `500` quoting a foreign-key constraint name, which told the caller
        nothing they could act on.

        `follow_up_of_id` links this task as a follow-up of another — both directions render
        afterward: the new task's `follow_up_of`, the old task's `continued_in`. A value that
        names no task is `422` and creates nothing, the same shape as an unresolvable
        `project_id`. Human and agent callers may both send it; the old task's activity log
        gets a `continued` entry naming the new one.

        `attachments` accepts up to four PNG, JPEG, GIF, or WebP images, each no larger than
        5 MB and 12 MB across the task. The format is decided by the bytes' own signature,
        not by the `content_type` sent with them: a payload whose leading bytes are not one
        of the four accepted formats is rejected however it is labelled. Creation sends
        base64 bytes once; task responses expose metadata and an authenticated
        `preview_url`, never duplicate the image bytes into task lists. `attachments` is a
        full replacement on `PATCH`/`PUT` — sending it rewrites the set, omitting it leaves
        the stored images untouched.

        Each image's `id` is **assigned by the server**; an `id` in the request body is not
        read, and two entries in one request store two distinct images. A client retrying the
        entire create may send an `Idempotency-Key`: the same authenticated principal and
        island can replay the identical request under that key and receive the original task
        without another task, image, activity event, assignment, broadcast, or review job.
        Reusing the key with different input is `409`. Without the header, every create is a
        new task and repeated images remain distinct; see `TaskAttachmentInput`.
      operationId: tasksCreate
      x-required-scope: tasks:write
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >-
            A caller-chosen retry key scoped to the exact authenticated principal and island.
            It must be 1-128 characters using letters, digits, dots, underscores, colons, or
            hyphens, starting with a letter or digit. An identical replay returns the original
            task with `201` and `Idempotency-Replayed: true`; different input under the same
            key is `409`.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task]
              properties:
                task: { $ref: "#/components/schemas/TaskInput" }
                agent_id:
                  type: integer
                  description: >-
                    Human-only direct assignment. The create and claim are atomic. Omit to
                    leave the task unclaimed.
            examples:
              humanReady:
                summary: Human, straight to the claimable backlog
                value: { task: { title: Fix the flaky login test, priority: P1, ready: true, project_id: 1 } }
              humanAssigned:
                summary: Human, created and claimed by one agent atomically
                value: { task: { title: Fix the flaky login test, priority: P1, project_id: 1 }, agent_id: 7 }
              agentIdea:
                summary: Agent idea (fields are overridden server-side)
                value: { task: { title: We should cache the world snapshot } }
              followUp:
                summary: A follow-up linked to the task it continues
                value: { task: { title: "Follow-up: Fix the flaky login test", priority: P2, project_id: 1, follow_up_of_id: 42 } }
      responses:
        "201":
          description: Created.
          headers:
            Idempotency-Replayed:
              description: Present with value `true` only when this response replays a prior create.
              schema: { type: string, enum: ["true"] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskSummary" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /tasks/kanban:
    get:
      tags: [Tasks]
      summary: Read the versioned task Kanban contract and exact filtered counts
      operationId: tasksKanban
      x-required-scope: tasks:read
      description: |
        Rails-authored lane identity, left-to-right order, label, explanatory hint, membership,
        selected assignment filter, the project menu and its open counts, and exact counts.
        The Mac/web clients choose layout and gestures; they do not reconstruct these workflow
        facts. Cards remain in the normal task/world reads so this contract can roll out
        independently.

        `project_id` and `assignee_id` compose: both narrow the board, `assignee_id` also
        narrows `project_filters[].open_count`, and `project_id` narrows neither the assignment
        choices nor the project ones.
      parameters:
        - in: query
          name: project_id
          schema: { type: integer }
        - in: query
          name: assignee_id
          description: Omit for all assignments, use `unassigned` for null, or an active agent id.
          schema:
            oneOf:
              - { type: integer }
              - { type: string, enum: [unassigned] }
      responses:
        "200":
          description: API-owned Kanban presentation contract and counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskBoard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /tasks/kanban/page:
    get:
      tags: [Tasks]
      summary: Read one bounded page of cards in an API-authored Kanban lane
      operationId: tasksKanbanPage
      x-required-scope: tasks:read
      description: |
        Rails owns lane membership, stable order, exact filtered totals, page limits,
        opaque cursors, termination, and progress copy. Lanes serve manual order first —
        `board_position ASC NULLS FIRST, id DESC` — so never-placed cards keep the historic
        newest-first block ahead of the arranged sequence (see `POST /tasks/{id}/reorder`).
        Clients must start without a cursor after changing lane, project, or assignee
        scope. Every response is bounded to at most 100 tasks; follow `next_cursor` only
        while `has_more` is true.

        Each cursor signs the exact lane/project/assignee membership revision and the first
        page's high-water task id. A task insertion, update, deletion, or lane reorder that
        changes that membership or its order returns `409`; inserts participate because
        database sequence allocation is not commit-ordered. Cursor validation is an indexed
        scalar lookup, independent of page depth. A cursor issued by an older server
        revision is invalid and must be replaced by starting again without one.
      parameters:
        - in: query
          name: lane
          required: true
          schema: { $ref: "#/components/schemas/BoardLane" }
        - in: query
          name: project_id
          schema: { type: integer }
        - in: query
          name: assignee_id
          description: Omit for all assignments, use `unassigned` for null, or an active agent id.
          schema:
            oneOf:
              - { type: integer }
              - { type: string, enum: [unassigned] }
        - in: query
          name: page_size
          description: Bounded page size. Rails defaults to and caps this at 100.
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - in: query
          name: cursor
          description: Opaque cursor from the preceding response, bound to its lane and filters.
          schema: { type: string }
      responses:
        "200":
          description: One bounded, stably ordered lane page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskBoardPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "409":
          description: Lane membership changed or the cursor contract expired; restart without a cursor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /tasks/approve_batch:
    post:
      tags: [Tasks]
      summary: Approve an explicit Island cloud selection
      description: |
        Moves only the named Imaginarium tasks to the Seashore. This is the authoritative
        write behind the Island's click, lasso, accessible-list, and drag-to-Seashore flows;
        clients never infer eligibility from the rendered scene.

        The selection is bounded to 100 ids, duplicates are executed and reported once, and
        result order follows the first occurrence of each id. Each task is locked and checked
        independently so a stale or missing cloud is a per-item refusal rather than a rollback
        of the valid remainder. Retrying an id already on the Seashore is a successful no-op.
        Only a human session or human-issued API token may call this human approval gate.
      operationId: tasksApproveBatch
      x-required-scope: tasks:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [task_ids]
              properties:
                task_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: integer, minimum: 1 }
                priority:
                  type: string
                  enum: [P0, P1, P2, P3]
                  description: Optional override applied to every selected task.
      responses:
        "200":
          description: One success or refusal for every unique requested task id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskApprovalBatch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /tasks/approve_all:
    post:
      tags: [Tasks]
      summary: Approve every agent-approved idea
      description: |
        Bulk-approves everything the auto-reviewer already vetted — imaginarium tasks with
        `agent_approved=true` — moving each to the seashore. Priority always resolves: the
        reviewer's `proposed_priority`, else the task's own, else `P3`.

        Declared before `resources :tasks` so `approve_all` is never parsed as an `:id`.
      operationId: tasksApproveAll
      x-required-scope: tasks:write
      responses:
        "200":
          description: How many tasks moved.
          content:
            application/json:
              schema:
                type: object
                required: [approved]
                properties:
                  approved: { type: integer }
              example: { approved: 3 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /tasks/draft_chat:
    post:
      tags: [Tasks]
      summary: Ask the assistant about a task that does not exist yet
      description: |
        The New Task form's chat. **Stateless** — nothing is persisted, because there is
        no task to hang it on: the draft is built in memory, answered, and thrown away.
        Not part of the agent loop.

        Both `task` and `message` are required keys (`task` may be an empty object; its
        individual fields are all optional and a blank title becomes `"(untitled)"`).
        Only `title`, `description`, `priority` and `project_id` are read — everything
        else in `task` is ignored.

        Declared before `resources :tasks`, so `draft_chat` is never parsed as an `:id`.
      operationId: tasksDraftChat
      x-required-scope: tasks:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task, message]
              properties:
                task:
                  type: object
                  properties:
                    title: { type: string, description: Blank becomes `(untitled)`. }
                    description: { type: string }
                    priority: { $ref: "#/components/schemas/Priority" }
                    project_id: { type: [integer, "null"] }
                message: { type: string }
            example:
              task: { title: Add rate limiting, priority: P2, project_id: 1 }
              message: Is this scoped tightly enough to hand to one agent?
      responses:
        "200":
          description: The assistant's answer. Never stored, so there is nothing to fetch later.
          content:
            application/json:
              schema:
                type: object
                required: [reply]
                properties:
                  reply:
                    type: object
                    required: [role, body, display_body, created_at]
                    properties:
                      role: { type: string, const: assistant }
                      body: { type: string, description: Raw model output. }
                      display_body:
                        type: string
                        description: Rails-authored display form with terminal and invisible controls removed.
                      created_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "422":
          description: No active credential for the chat's provider — the run was never possible.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Campus has no active anthropic credential, so it cannot run this. Add one in Settings → Credentials and sign it in.", reason: no_credential }
        "502":
          description: |
            The chat engine could not answer — an engine failure after the run began, as
            opposed to the `422` refusal above, which never reached one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "the model is not logged in — add a credential in Settings and sign it in" }

  /tasks/claim_next:
    post:
      tags: [Tasks]
      summary: Claim the next task this agent can actually do
      description: |
        "Give me the next task I can actually do."

        An agent Campus does not spawn cannot be *handed* work — nothing on this side knows
        where it is or how to reach it — so it has to come and ask. The shape that makes a
        fleet of them expensive is `GET /tasks?stage=seashore&ready=true&sort=priority` every
        few seconds per agent, each poll a full board render that is thrown away. This is one
        request that either returns the task it just claimed, atomically, or says there is
        nothing.

        **`204` with no body is the whole point.** When the wait elapses with nothing
        claimable, the answer is the status line alone: a client tells "nothing for me" from
        "here is work" without parsing anything, and an empty JSON object — which is what the
        obvious alternative would have been — reads like a task with no fields to anything
        that does not look closely.

        ### What "can actually do" means
        A task is offered to this agent when

        * it is on the seashore, `ready`, unclaimed and filed under a project — an unfiled
          idea at the head of the queue would otherwise turn every call into the `409`
          `POST /tasks/{id}/claim` raises for one;
        * its `requirements` are a **subset** of the agent's `capabilities`
          (`requirements <@ capabilities`, set containment, both free-form lowercase
          snake_case). An empty `requirements` list is claimable by anyone, which is what
          `[] <@ anything` already means and is why the rule is written this way round;
        * its `provider_preference` is empty or matches the agent's `provider`. That is the
          **only** preference enforced here — `model_preference` and `cost_hint_usd` ride
          along in the response and are never policed, because Campus cannot see what an
          external agent spends or which model it actually loads, and an API that claims a
          ceiling it cannot hold is worse than one that admits it is a request.

        Candidates are walked in claim order — `staged DESC, P0→P3, queue_position ASC NULLS
        LAST, created_at ASC`, the identical order `GET /tasks?sort=priority` renders and a
        human's drag-to-start manipulates — and the first one still there is taken. The claim
        itself is the same atomic conditional `UPDATE` as `POST /tasks/{id}/claim`, so a lost
        race costs one candidate rather than the request.

        ### Waiting
        `wait` holds the request open, re-asking every half second, until something claimable
        appears or the deadline passes. It is a **long poll, not a queue**: work becomes
        claimable for reasons that are not an INSERT — a lease expiring, a human dragging a
        task to the front, a blocked task being unblocked — and re-asking notices all of them.

        The cap is 25 seconds and a `wait` above it is **refused, not clamped**. A client that
        believes it asked for ten minutes and gets a `204` after twenty-five seconds concludes
        the island is empty and keeps concluding it; being told the cap is what lets it loop
        correctly instead. The number is where two curves cross — below it the saving
        evaporates, above it the request starts dying in somebody's 30-second proxy idle
        timeout, where a killed poll is indistinguishable from "no work for you" while costing
        a socket and a retry.

        An **agent** token claims for itself. A **human** token must name `agent_id`, exactly
        as on `POST /tasks/{id}/claim`.
      operationId: tasksClaimNext
      x-required-scope: tasks:write
      parameters:
        - name: wait
          in: query
          required: false
          description: |
            Seconds to hold the request open, `0`–`25`. Omitted or blank answers immediately,
            which is what a client doing its own backoff wants. Not a number, or over the cap,
            is `422` — never a silent zero and never a silent clamp.
          schema: { type: number, minimum: 0, maximum: 25, default: 0 }
          example: 20
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_id:
                  type: integer
                  description: Required for human callers; ignored when an agent calls (it always claims for itself).
                wait:
                  type: number
                  description: Accepted in the body as well as the query string; same cap, same refusal.
      responses:
        "200":
          description: |
            The task, already claimed and `in_progress`, with its assignee and its lease
            (`claimed_at`, `claim_expires_at`) filled in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskSummary" }
        "204":
          description: |
            Nothing this agent can do, right now. Not an error and not an empty result — the
            island has no claimable work matching this agent's capabilities and provider.
            There is no body at all; do not parse one.
        "400":
          description: A human caller named no `agent_id`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: >-
                  agent_id is required when a human claims a task: name the agent that is
                  picking it up, e.g. POST /tasks/:id/claim {"agent_id": 7} — GET /agents
                  lists the ones you can name. An agent calling with its own token claims
                  for itself and sends no agent_id.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404":
          description: An `agent_id` that matches no agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: Agent not found }
        "422":
          description: A `wait` that is not a number of seconds, or one longer than the cap.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                notANumber:
                  value:
                    error: >-
                      wait "soon" is not a number of seconds to hold the request open for:
                      pass wait=20, or leave it out to be answered immediately.
                overTheCap:
                  value:
                    error: >-
                      wait "600" is longer than the 25 second maximum this endpoint holds a
                      request open for. Pass wait=25 or less and call again when it answers
                      204 — a longer hold costs a server thread a human is also waiting on.
        "429": { $ref: "#/components/responses/RateLimited" }

  /tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Tasks]
      summary: Show a task
      description: |
        The task plus its full comment thread and a trimmed assignee. `assignee` is absent
        when the task is unclaimed.
      operationId: tasksShow
      x-required-scope: tasks:read
      responses:
        "200":
          description: Task with comments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tasks]
      summary: Update a task
      description: |
        Plain attribute writes. Stage changes belong to `POST /tasks/{id}/transition` —
        `stage` is not a permitted attribute here.

        Send the task's last-read `updated_at` as top-level `expected_updated_at` for an
        optimistic write. If the task changed in between, Campus returns `409` rather than
        overwriting newer text. Omit it for the original unconditional update behavior.
      operationId: tasksUpdate
      x-required-scope: tasks:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task]
              properties:
                task: { $ref: "#/components/schemas/TaskInput" }
                expected_updated_at: { type: string, format: date-time }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    put:
      tags: [Tasks]
      summary: Update a task (PUT alias)
      description: Identical to `PATCH /tasks/{id}`; Rails registers both verbs.
      operationId: tasksUpdatePut
      x-required-scope: tasks:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task]
              properties:
                task: { $ref: "#/components/schemas/TaskInput" }
                expected_updated_at: { type: string, format: date-time }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /tasks/{id}/attachments/{attachment_id}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: attachment_id
        in: path
        required: true
        description: >-
          The `id` of an entry in the task's `attachments`. Server-assigned and opaque —
          read it from `preview_url` rather than constructing one.
        schema: { type: string }
    get:
      tags: [Tasks]
      summary: Read a task image attachment
      operationId: taskAttachmentShow
      x-required-scope: tasks:read
      responses:
        "200":
          description: Original image bytes, served inline with the stored image media type.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{id}/claim:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Tasks]
      summary: Claim a task
      description: |
        The competitive step of the agent loop. A single conditional `UPDATE` over
        `(id, stage='seashore', assignee_id IS NULL)` decides the winner, so exactly one
        caller can win under concurrency.

        On success the task moves to `in_progress`, the agent flips to
        `status=working, activity=thinking`, a `"Picking this up."` status comment is
        posted, and `task.claimed` goes out over Action Cable.

        **`409` is the normal case, not an error.** It means another agent got there first
        (`already claimed`) — the loop should take the next task rather than retry. A task
        with no project is also `409` (`task has no project — assign one before claiming`),
        because work with no repo has nowhere to happen.

        An **agent** token claims for itself and needs no body. A **human** token must name
        the agent with `agent_id`. Omitting it is `400` and says so; naming an agent that
        does not exist is `404`. Those used to be the same bare `404`, which told a human
        who had simply forgotten the parameter that the task was missing.
      operationId: tasksClaim
      x-required-scope: tasks:write
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_id:
                  type: integer
                  description: Required for human callers; ignored when an agent calls (it always claims for itself).
      responses:
        "200":
          description: Claimed. The task is now `in_progress` and assigned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400":
          description: A human caller named no `agent_id`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: >-
                  agent_id is required when a human claims a task: name the agent that is
                  picking it up, e.g. POST /tasks/:id/claim {"agent_id": 7} — GET /agents
                  lists the ones you can name. An agent calling with its own token claims
                  for itself and sends no agent_id.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404":
          description: No such task, or an `agent_id` that matches no agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: Agent not found }
        "409":
          description: Lost the race, or the task has no project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                lostRace: { value: { error: already claimed } }
                noProject: { value: { error: "task has no project — assign one before claiming" } }
        "429": { $ref: "#/components/responses/RateLimited" }

  /tasks/{id}/renew_claim:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Tasks]
      summary: Say the holder is still alive, and buy another lease
      description: |
        A claim is a lease, and this is the holder saying it is still working. It pushes
        `claim_expires_at` fifteen minutes out from **now** — not from the old expiry, because
        a renewal that arrived late would otherwise buy less time than one that arrived early,
        and the sender has no way of knowing which it sent.

        Most agents never need this. `POST /agents/{id}/heartbeat` renews the lease too, so an
        agent that keeps Campus posted is already covered; this is for the agent that does not
        heartbeat, and for the long turn — an agent about to start something it knows will
        take a while can say so rather than hoping.

        It deliberately writes no activity event and fires no broadcast. An agent renewing
        every thirty seconds would bury every real event on the task under its own liveness,
        and the fact a renewal records — "still working" — is already on the row as
        `claim_expires_at` for anyone who wants it.

        **Only the holder may renew.** An agent renewing somebody else's claim is `403` naming
        who does hold it, because that mistake is made by reading the board rather than by
        holding a bad credential, and the fix is either to wait for that agent or to go and get
        work of your own. A human token may renew any claim: taking work off a wedged agent by
        hand is the manual version of the lease sweep, and the island's owner is who notices it
        is needed.
      operationId: tasksRenewClaim
      x-required-scope: tasks:write
      responses:
        "200":
          description: Renewed. The task, with `claim_expires_at` moved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            An agent that does not hold this claim, or a credential without `tasks:write`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                heldByAnother:
                  value:
                    error: >-
                      task 42 is held by scout-7 (agent 3), not by you: only the agent holding
                      a claim may renew or release it. An unrenewed claim comes back to the
                      seashore on its own after 15 minutes, so either wait for that, or POST
                      /tasks/claim_next for work you can take now.
                heldByNobody:
                  summary: An agent renewing a task nobody holds
                  value:
                    error: >-
                      task 42 is not claimed by anyone, so there is no lease on it to renew or
                      release. POST /tasks/42/claim takes it, and POST /tasks/claim_next hands
                      you the next task you can actually do.
                scope:
                  value: { error: "this credential does not carry the `tasks:write` scope, which POST /tasks/42/renew_claim requires." }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            A **human** renewing a lease that does not exist. An agent meets the `403` above
            first — it cannot hold a claim on a task with no holder — so this is the answer for
            a token that is allowed to renew anyone's and picked a task nobody has claimed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: >-
                  there is no live claim on this task to renew. A lease exists only while a
                  task is in_progress with an assignee: POST /tasks/{id}/claim takes one, and
                  POST /tasks/claim_next hands you the next task you can actually do.
        "429": { $ref: "#/components/responses/RateLimited" }

  /tasks/{id}/release:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Tasks]
      summary: Hand a task back without pretending it is finished
      description: |
        "I have to stop, and I did not finish."

        The task goes back to the seashore, `staged`, at the **front** of its building's queue
        (`queue_position` 0 or its own, whichever it had): work already started should be
        picked back up before work nobody has touched, and position 0 also keeps it out of the
        `NULLS LAST` bucket claim order sorts to the very back, where a half-finished task is
        the last thing that belongs. The holder is parked (`idle_park`, `idle`) and its
        `current_task_id` cleared, the lease columns are nulled, and `task.released` goes out
        over Action Cable.

        **This is deliberately not a transition, and no `seashore` edge exists to make it
        one.** The three ways out of `in_progress` that `POST /tasks/{id}/transition` allows —
        blocked, department, done — are each a claim about the *work*: it is waiting on
        something, it needs a specialist, it is finished. None of them is true of an agent
        that is being shut down, has run out of budget, or has decided the task is not for it,
        and an agent forced to pick one lies in the record a human reads later. Adding the edge
        would also have cost more than it saved: it would be a second, unbookkept way to
        un-claim that skips the queue placement, the release event and the holder cleanup.

        Same authorisation as renewing: the holding agent, or any human token.

        The identical mechanism runs unattended as the lease sweep, with one difference — a
        swept agent is **not** parked. An agent that missed its lease is not known to be idle,
        it is known to be silent, and advertising a process that may well be dead as ready for
        more work would hand the next task straight back to it.
      operationId: tasksRelease
      x-required-scope: tasks:write
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: |
                    Recorded on the release event. Defaults to `released by <actor>`, which is
                    true and says nothing — a sentence here is what a human reads later when
                    they wonder why this came back.
            example: { reason: "out of context window; needs a fresh run" }
      responses:
        "200":
          description: Released. The task as it now stands, back on the seashore.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: An agent that does not hold this claim, or a credential without `tasks:write`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: >-
                  task 42 is held by scout-7 (agent 3), not by you: only the agent holding a
                  claim may renew or release it.
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The task is not in progress, so there is no claim to hand back.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: >-
                  this task is not in progress, so there is nothing to hand back. A release
                  ends a claim; to record that the work itself stopped, POST
                  /tasks/{id}/transition to blocked with a blocked_reason.
        "429": { $ref: "#/components/responses/RateLimited" }

  /tasks/{id}/transition:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Tasks]
      summary: Move a task to another stage
      description: |
        The only way to change `stage`. The legal moves are fixed:

        | From | To |
        |------|-----|
        | `imaginarium` | `seashore`, `closed` (**human-only** — see below) |
        | `seashore` | `in_progress`, `imaginarium`, `closed` (**human-only** — see below) |
        | `in_progress` | `blocked`, `department`, `done`, `closed` (**human-only** — see below) |
        | `department` | `in_progress`, `blocked`, `closed` (**human-only** — see below) |
        | `blocked` | `in_progress`, `seashore`, `closed` (**human-only** — see below) |
        | `done`, `closed` | `imaginarium` (**human-only** — see below) |

        Anything else is `422 "<from> → <to> not allowed; from <from> you can go to: …"` —
        the refusal carries the legal set for the stage the task is actually standing in, so
        a caller never has to come back to this table to recover. A `to` that is not a stage
        at all lands here too, and the same list is what reveals it.

        Per-target requirements, each `422` when unmet:

        * `seashore` — a priority: either the task already has one or `priority` is sent.
          Also clears `needs_human_review` and sets `ready=true`. Leaving `blocked` this
          way also releases the holder: `assignee_id` and the lease columns are cleared,
          the card docks at the front of its queue, and the ex-holder's
          `current_task_id` is dropped.
        * `blocked` — `blocked_reason` (falls back to the one already on the task).
          `blocked_kind` defaults to `needs_input`. Blocked never exits to `done`:
          a blocked task is waiting on something, and finishing it means unblocking it
          first (`in_progress`), so the record shows the wait actually ended.
        * `department` — `specialist_type` (falls back to the task's). Un-assigns the task
          and remembers the requester in `requesting_agent_id`, then asks the reviewer who
          the specialist is: `assignment` goes to `pending` and the answer arrives the same
          way a Ready drop's does. A specialist that is found (or created) lands the task in
          `in_progress` holding it; one that cannot be found or created moves the task to
          `blocked` with a `blocked_reason` naming the specialty, why Campus could not
          provide it, and the transition that ends the wait.
        * `in_progress` — clears `blocked_reason` and `blocked_kind` (so does `seashore`;
          leaving `blocked` drops the banner on every legal exit). **A card that reached
          here without a holder must name one**: `assignee` (an agent id) is required when
          the task has no `assignee_id` and it is standing in a `department`, or in
          `blocked` with an unresolved specialist request. Those are the only cards that
          arrive holderless by design — entering a department releases the holder — and a
          card in `in_progress` that nobody holds is unrecoverable by the lease sweep and
          unofferable by `claim_next`. Every other route in already has one: a Ready drop
          names an assignee to move at all, and unblocking keeps the assignee it was
          blocked with. `422` when unmet, and the message names the field.
        * `done` — `confidence` is required **from agents only**; a human defaults it to
          100. Also increments the project's `completed_count` and parks the assignee
          (`activity=complete, status=idle_park`).

        ### Every move into `closed` is human-only

        Closing records that work ended without completion. An agent token that sends any
        legal `→ closed` move gets `403` — `Task::TransitionRefused`, not a claim-holder
        refusal — and the server-authored error directs it to a human. A human close releases
        the task's assignee, lease, and pending assignment state, then parks every agent whose
        live pointer still names the task (`activity=idle`, `status=idle_park`).

        ### `done`, `closed` → `imaginarium` is a reopen, and it is human-only

        Reopening undoes a person's verdict, so an agent token that sends it gets `403` —
        `Task::TransitionRefused`, not `Task::InvalidTransition` — naming the rule rather
        than the move; the same request from a human succeeds. A reopen resets `ready` and
        `agent_approved` to `false` (the task re-enters the funnel unstaged and unvetted),
        logs an activity event with `verb: "reopened"` in place of the usual
        `"transitioned"`, and — leaving `done` specifically — walks the project's
        `completed_count` back down, floored at zero; leaving `closed` never touches it,
        because entering `closed` never incremented it. `TaskWorkflow`'s `reopen` action
        offers the identical move as a confirmed button, whose `confirm.alternative` proposes
        filing a linked follow-up instead of touching this task's record at all.

        ### `seashore → in_progress` is a claim, and needs `assignee`

        Starting queued work means somebody starts it, so this one transition requires
        `assignee` and refuses without it. It does **not** go through the plain stage write
        the other rows use:

        * **an agent id** — the task is claimed for that agent, identically to
          `POST /tasks/{id}/claim` with `agent_id`, lease and all. `422` when the id names no
          agent still on the island.
        * **`"auto"`** — the workspace reviewer model chooses. The response comes back
          immediately with the task already in `in_progress`, no `assignee`, and
          `assignment.state = "pending"`; a background job asks the reviewer, validates its
          answer against the real roster, and either hands the task over (`assigned`) or —
          on a refusal, a timeout, an unreadable answer or an agent that does not exist —
          puts the task back at the front of the Seashore queue as `failed`, with `detail`
          saying what happened. Nothing is ever assigned that the reviewer did not name and
          Campus could not verify. `409` when the task has no project, or its project has
          been archived, or the card is no longer waiting in the seashore.

        Every other target ignores `assignee`.
      operationId: tasksTransition
      x-required-scope: tasks:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { $ref: "#/components/schemas/Stage" }
                priority: { $ref: "#/components/schemas/Priority" }
                blocked_reason: { type: string }
                blocked_kind: { type: string, enum: [needs_input, error, waiting_reset] }
                specialist_type: { type: string, example: security }
                auto_specialist: { type: boolean, default: false }
                confidence: { type: integer, minimum: 0, maximum: 100 }
                assignee:
                  oneOf: [{ type: integer }, { type: string, enum: [auto] }]
                  description: |
                    Required by `seashore → in_progress`, ignored by every other target. An
                    agent id, or the literal `auto` to have the reviewer choose.
            examples:
              blocked:
                summary: Park it on a question for a human
                value: { to: blocked, blocked_kind: needs_input, blocked_reason: "Which database should this use?" }
              specialist:
                summary: Hand off to a specialist
                value: { to: department, specialist_type: security }
              done:
                summary: Deliver (agents must send confidence)
                value: { to: done, confidence: 85 }
              startNamed:
                summary: Start queued work, naming who picks it up
                value: { to: in_progress, assignee: 7 }
              startAuto:
                summary: Start queued work and let the reviewer choose the agent
                value: { to: in_progress, assignee: auto }
              reopen:
                summary: A human brings a done or closed task back (403 from an agent token)
                value: { to: imaginarium }
              close:
                summary: A human closes work that ended without completion (403 from an agent token)
                value: { to: closed }
      responses:
        "200":
          description: Transitioned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Missing scope, or a human-only reopen or close attempted by an agent token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                scope:
                  summary: The credential lacks tasks:write
                  value:
                    error: >-
                      this credential does not carry the `tasks:write` scope, which POST
                      /tasks/42/transition requires. Scopes are fixed when a credential is
                      issued and are never widened at request time, so neither retrying nor
                      another route will help — ask a Campus administrator for a token that
                      lists it, or land again asking for it.
                reopenHumanOnly:
                  summary: An agent token tried to reopen a done or closed task
                  value:
                    error: >-
                      reopening a closed task back into the imaginarium is a human's call, not
                      an agent's — it undoes a closed verdict, and an agent does not get to
                      decide that verdict was wrong. Ask a human to send it, or POST /tasks
                      with follow_up_of_id to file a new task linked to this one instead.
                closeHumanOnly:
                  summary: An agent token tried to close a task
                  value:
                    error: >-
                      closing a task is a human's call, not an agent's: it discards the work
                      without recording completion. Ask a human to send POST
                      /tasks/42/transition {"to":"closed"}.
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Illegal transition, or a required field for that target is missing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                illegal:
                  summary: A move the table does not allow, answered with the ones it does
                  value: { error: "imaginarium → done not allowed; from imaginarium you can go to: seashore, closed" }
                terminal:
                  summary: Reopening is the only way out — anything else is refused
                  value: { error: "done → seashore not allowed; from done you can go to: imaginarium" }
                missingReason: { value: { error: blocked_reason required } }
                missingConfidence: { value: { error: confidence required } }

  /tasks/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Tasks]
      summary: Approve an idea into the backlog
      description: |
        The human gate on the imaginarium: transitions the task to `seashore` as a human,
        so it becomes claimable. Priority resolves in order — the explicit `priority`, then
        the reviewer's `proposed_priority`, then the task's own, then `P3`.
      operationId: tasksApprove
      x-required-scope: tasks:write
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                priority:
                  allOf: [{ $ref: "#/components/schemas/Priority" }]
                  description: Overrides `proposed_priority`.
      responses:
        "200":
          description: Approved; the task is on the seashore.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The task was not in a stage that can reach `seashore`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tasks/{id}/stage:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Tasks]
      summary: Queue a task at its building
      description: |
        Drag-to-start. Sets `staged=true` and docks the task at the **back** of that
        project's ready queue (`queue_position = max + 1`). Staged tasks sort first under
        `sort=priority`, so this is how a human says "do this one next" in a way agents see.

        Does **not** change `stage`.

        A task with no project cannot be queued at a building: `project_id` is then
        required in the body, and omitting it is `422 "project_id required to stage an
        unassigned task"`. When the task already has a project the body may be empty.
      operationId: tasksStage
      x-required-scope: tasks:write
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id:
                  type: integer
                  description: Required only when the task has no project yet; assigns it as a side effect.
      responses:
        "200":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The task has no project and none was supplied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: project_id required to stage an unassigned task }

  /tasks/{id}/reorder:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Tasks]
      summary: Move a card to a new place within its Kanban lane
      description: |
        Persists a manual order: puts this task immediately after `after_id` in its own
        lane, or first when `after_id` is null. A position write, never a transition — the
        task keeps its lane and stage. Rails owns every ordering rule; clients render the
        returned order and the lane reads (`GET /world/snapshot`, `GET /tasks/kanban/page`,
        `GET /tasks?sort=board`) thereafter serve it. A lane-shaped read that asks with any
        other sort gets the order it asked for, not the arranged one — which reads back as
        a reorder that "snapped back" on the next refresh.

        In the **seashore** lane the same order is also written to `queue_position`, the
        column claim order reads — so the arranged order is the order agents claim in,
        within a priority band. `priority` still wins between bands and `staged` still wins
        over everything; in every other lane the order is purely visual.

        A reorder bumps the lane's membership revisions, so any Kanban page cursor over it
        answers `409` and restarts rather than paginating a stale order.

        Human-only, like `POST /tasks/approve_batch`: on the seashore this write is the
        claim order agents follow, and an agent curating its own queue would be an agent
        granting itself work.
      operationId: tasksReorder
      x-required-scope: tasks:write
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                after_id:
                  type: [integer, "null"]
                  description: |
                    The task this card should sit after — a member of the same lane — or
                    null (or omitted) to put it first.
      responses:
        "200":
          description: The whole lane's authoritative order, first to last.
          content:
            application/json:
              schema:
                type: object
                required: [version, lane, order]
                properties:
                  version: { type: integer, enum: [1] }
                  lane: { $ref: "#/components/schemas/BoardLane" }
                  order:
                    type: array
                    items: { type: integer }
                    description: Every task id in the lane, in the persisted order.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: An agent token called a human-only ordering write.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "`after_id` is not a task id, or names a card outside this task's lane."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tasks/{id}/pr:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Tasks]
      summary: Attach a pull request
      description: |
        Appends `url` to `pr_links` and parks the task in `blocked` with
        `blocked_kind=needs_input` and `blocked_reason="Awaiting PR review: <url>"` — a PR
        is a question for a human, so it shows up in the blocked alarms.

        Because it transitions to `blocked`, it only works from `in_progress`; from
        anywhere else it is `422`.

        Rails normalizes and approves this agent-authored launch destination before writing
        anything. It must be an absolute `http` or `https` URL with a host and no embedded
        user credentials; unsafe or malformed values are refused without changing the task.
      operationId: tasksPr
      x-required-scope: tasks:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, example: "https://github.com/acme/app/pull/42" }
      responses:
        "200":
          description: Attached; the task is now blocked awaiting review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: |
            The URL was not an approved absolute HTTP(S) launch destination, or the task was
            not in a stage that can reach `blocked`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "seashore → blocked not allowed; from seashore you can go to: in_progress, imaginarium, closed" }

  /tasks/{id}/log:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Tasks]
      summary: Activity log for a task
      description: The 200 most recent events, newest first.
      operationId: tasksLog
      x-required-scope: tasks:read
      responses:
        "200":
          description: Events.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{id}/chat:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Tasks]
      summary: Read the task chat
      description: |
        The whole thread, oldest first.

        A task created with `review_on_create: true` (the default) gets an **assistant message
        nobody sent**: the out-of-band critique written shortly after creation. Do not
        treat the first assistant turn as a reply to a user turn — it usually has none.
      operationId: tasksChat
      x-required-scope: tasks:read
      responses:
        "200":
          description: Chat messages.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChatMessage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Tasks]
      summary: Send a chat turn
      description: |
        Runs the workspace's default model against the task, its comments and enough board
        context to answer backlog questions — with a scoped token, so **a turn may rewrite
        the task it is about**. The response therefore returns the task as it is *after*
        any edit, and `edited` says whether title/description/priority/stage changed.

        Slow by nature: the model runs with a 90s server-side timeout, and the web client
        allows 180s. A model failure is `502`, not `422` — the request was fine, the engine
        was not. The one `422` is the refusal that never reached an engine: no active
        credential for the chat's provider, answered with `reason: no_credential` so a
        client can offer the way to credential setup.
      operationId: tasksChatSend
      x-required-scope: tasks:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
            example: { message: Split this into two tasks and mark the first one P1. }
      responses:
        "200":
          description: The assistant's reply, plus the (possibly rewritten) task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatReply" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: No active credential for the chat's provider — the run was never possible.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Campus has no active anthropic credential, so it cannot run this. Add one in Settings → Credentials and sign it in.", reason: no_credential }
        "502":
          description: The chat engine failed, timed out, or no engine exists for the provider.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "no chat engine for provider google" }

  /tasks/{id}/chat/action:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Tasks]
      summary: Perform a server-authored task-assistant action
      description: |
        Performs one action returned in `ChatReply.actions`. Rails re-evaluates availability
        at dispatch time, so a stale button fails with refreshed actions and actionable copy.
        Successful actions are logged as `assistant_action`, attributed to `task-assistant`.
      operationId: tasksChatAction
      x-required-scope: tasks:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action_id]
              properties:
                action_id: { type: string }
                body: { type: string, description: Optional message body for message_owner. }
      responses:
        "200":
          description: The performed action's report, current task, and refreshed actions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskAssistantActionResult" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The action is stale or the authoritative task transition refused it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tasks/{task_id}/comments:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Comments]
      summary: List comments on a task
      description: Oldest first.
      operationId: commentsIndex
      x-required-scope: tasks:read
      responses:
        "200":
          description: Comments.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Comment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Comments]
      summary: Comment on a task
      description: |
        `author_kind` and `author_name` come from the token, never the body. `kind`
        defaults to `comment`; agents use `status` to narrate and `question` to ask a human
        something (usually right before transitioning to `blocked`).

        **Also renews the task's lease**, silently, whenever the poster is the task's current
        assignee: `claim_expires_at` extends to that agent's full lease window from now, the
        same extension a heartbeat buys. A comment from anyone else — another agent, a human
        — never touches the lease. See "Claims are leases" above.

        A caller that may retry can send `Idempotency-Key`. Campus binds it to the exact
        authenticated principal and task, and commits one durable receipt with the comment,
        activity event, lease renewal and direction dispatch. Repeating the same key and
        normalized input returns the original comment with `Idempotency-Replayed: true` and
        performs none of those side effects again. Reusing it with different input fails
        closed with `409`.
      operationId: commentsCreate
      x-required-scope: tasks:write
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Retry identity scoped to the exact principal and task.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                kind: { type: string, enum: [comment, question, status], default: comment }
            example: { kind: status, body: Picking this up. }
      responses:
        "201":
          description: Created.
          headers:
            Idempotency-Replayed:
              description: Present as `true` only when this response replayed a prior keyed create.
              schema: { type: string, enum: ["true"] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: The Idempotency-Key already owns different comment input for this principal and task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /tasks/{id}/resolve:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Tasks]
      summary: Perform one server-authored blocked-task resolution
      operationId: tasksResolve
      x-required-scope: tasks:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution_id]
              properties:
                resolution_id: { type: string }
                note: { type: string }
                confirmed: { type: boolean, default: false }
      responses:
        "200":
          description: The resolution was performed immediately.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskResolutionResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnly" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /agents:
    get:
      tags: [Agents]
      summary: List agents
      description: Active agents by default, oldest first.
      operationId: agentsIndex
      x-required-scope: agents:read
      parameters:
        - name: archived
          in: query
          description: The literal string `true` lists dismissed agents instead of active ones.
          schema: { type: string, enum: ["true"] }
      responses:
        "200":
          description: Agents.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
    post:
      tags: [Agents]
      summary: Land an agent
      description: |
        Creates the agent and mints its bearer token. **The token is returned exactly
        once** — only its SHA-256 digest is stored, so it cannot be read again; a lost
        token is rotated with `POST /agents/{id}/rotate_token`, or costs the agent its
        landing.

        Defaults fill in from settings: `provider` from the credential (or
        `default_agent_provider`), `model` from `default_agent_model`, and a `character`
        derived from the provider (`anthropic → claude_starburst`,
        `openai → openai_blossom`, otherwise `generic_blob`). The agent starts in
        `status=landing`.

        A `campus_spawned` Office must also name `home_project_id`, unless Settings holds a
        currently selectable default. Read `GET /agents/landing_options` first: it exposes
        that default visibly and carries Rails-authored availability/copy for every Project.
        Unknown, archived, inaccessible, non-Git, and locally unavailable choices are refused
        before the agent, token, activity event, or workspace is created. Self-hosted and
        hosted-service agents choose execution context on their own host and do not require it.

        A `campus_spawned` Office may name an active saved `credential_id` whose account will
        pay for its runs. When it omits that id for a concrete provider, Campus assigns the
        first active credential for that provider in the island's fallback order and binds it
        explicitly before the Office runs; when the island holds none, the landing is refused
        with `reason: no_credential` rather than substituting anything. Campus stopped binding
        Offices to the machine's own provider CLI login (`~/.claude`, `~/.codex`) on
        2026-08-16. Read `GET /agents/landing_options` for the server-authored choices. Self-hosted and hosted-service agents run outside
        Campus and do not require either binding.

        This is also where an agent says **what it is and what it can do**: `runtime` (whether
        Campus may start it at all), `capabilities` (what work it may be handed),
        `token_scopes` (what its own token may do) and `protocol_version` (the dialect it
        speaks). All four are optional, and every one of them is a promise the agent makes
        about itself rather than one Campus verifies.

        **Landing an agent Campus runs is starting it.** A human landing a `campus_spawned`
        agent gets a process: the run is queued as the landing returns, and `start.state` is
        `queued`. Every other case answers with the reason instead — `external_runtime` (the
        agent runs itself), `human_only` (an agent landed it; starting spends a subscription,
        so it stays a human's act), `no_engine` (this Campus cannot spawn that provider),
        `not_local` (this deployment runs no processes) and `declined` (`start: false`).
        `start.message` is server-authored and meant to be rendered as it stands.

        Send `start: false` — beside `agent`, not inside it — when the caller is itself about
        to run the process, which is what `campus land` does: two processes on one agent's
        token would each believe they hold its office.

        A queued start rotates the agent's token on the way up, because a running agent is
        handed its own key. The `token` below still authenticates until it does.

        The response carries the landing prompt, so a freshly landed agent needs no second
        request to learn the loop, and `protocol_version` — **the server's**, not an echo of
        whatever was sent. This is the half of the handshake where Campus says which dialect it
        speaks, so an agent that opened with `"0.9"` is told `"1"` rather than agreed with.
      operationId: agentsCreate
      x-required-scope: agents:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent]
              properties:
                agent: { $ref: "#/components/schemas/AgentLanding" }
                start:
                  type: boolean
                  description: >
                    Omit to let Campus decide (it starts an agent it runs, for a human).
                    `false` lands without starting, for a caller that runs the process itself.
            examples:
              spawned:
                summary: An agent Campus will run itself
                value: { agent: { name: scout-7, provider: anthropic, credential_id: 12, model: claude-sonnet-5, home_project_id: 9 } }
              selfHosted:
                summary: An agent that runs elsewhere and reports in
                value:
                  agent:
                    name: hermes-1
                    provider: hermes
                    runtime: self_hosted
                    capabilities: [code_edit, shell, test]
                    token_scopes: [tasks:read, tasks:write, sessions:write]
                    protocol_version: "1"
      responses:
        "201":
          description: Landed. Save `token` now — it is never shown again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentWithToken" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "422":
          description: |
            Validation failed, a Campus-spawned Office could not bind a runnable credential, or
            Auto could not land.

            Auto refuses in two different ways and they mean opposite things. `no_credential`
            is "there is nothing here to land on": add one. `auto_all_over_threshold` is
            "there is, and every one of them is over the Fallback usage threshold (%)": Auto
            will not silently spend a capped credential, so it hands back the usage table it
            judged from and the human chooses a specific credential or waits for the window
            that resets soonest. `used_percent` and `window` report the window that actually
            gated the credential, which is the session window when the provider reports one
            and the weekly window when it does not. A credential whose usage could not be
            read carries `state: unknown` and is never counted as over the threshold.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentLandingError" }
              examples:
                validation:
                  value: { error: "Validation failed: Name has already been taken" }
                noCredential:
                  value: { error: "Campus has no active auto credential, so it cannot run this. Add one in Settings → Credentials and sign it in.", reason: no_credential }
                autoAllOverThreshold:
                  value:
                    error: "Every credential on this island is over the 80% usage threshold, so Auto will not choose one for you. Land on a specific credential, or wait for the window that resets soonest."
                    reason: auto_all_over_threshold
                    threshold: 80
                    credentials:
                      - credential_id: 12
                        label: "Claude Max · work"
                        provider: anthropic
                        used_percent: 97
                        rank_percent: 64
                        window: session
                        resets: "in 40 minutes"
                        state: known
                        over_threshold: true
        "429": { $ref: "#/components/responses/RateLimited" }

  /agents/landing_options:
    get:
      tags: [Agents]
      summary: Read the execution-context contract for landing an Office
      description: |
        Rails' versioned, API-authoritative answer to where a Campus-spawned Office may run
        and which credentials may be selected. `credential_selection.options` contains the
        current island's saved credentials only; credentials from another island are never
        disclosed. `ambient_credential` is the server-authored copy for the "no credential
        selected" row: landing without one assigns the first active credential for the chosen
        provider in the island's fallback order, and refuses with `reason: "no_credential"`
        when that island has none. It no longer offers the machine's own provider CLI login —
        Campus stopped binding Offices to `~/.claude`/`~/.codex` on 2026-08-16, and
        `AgentLanding` is authoritative for the rule. An empty saved list therefore DOES block
        landing, with a message naming the fix, rather than silently spending an account the
        user never gave Campus.

        Compatibility: the field keeps its name and its `kind: ambient` value for now, because
        shipped Mac builds decode this object and render `label` verbatim into that row, so the
        corrected sentence reaches them with no update to install. Renaming the key would not
        break their decode — the client property is optional, so an absent key decodes to null
        — it would silently fall back to the label those builds ship with, which still reads
        "Use the provider CLI's current login". The rename waits until a build that reads the
        new name is the oldest one running; until then `kind` here is a wire constant, not a
        claim that an `ambient` credential exists or will be created.
        Every Project remains visible: `execution.selectable` says whether it may be chosen,
        while `reason`, `message`, and `remediation` carry the normalized server decision and
        copy. A configured `default_project_id` is returned only when that Project is currently
        selectable, so clients can preselect it visibly; Campus never substitutes the oldest
        Project.

        `task_override` documents the transition rule used at start: a current task's Project
        governs the next session without rewriting the Office's home Project. A live session
        must be stopped before the Office can claim work in another Project.
      operationId: agentsLandingOptions
      x-required-scope: agents:read
      responses:
        "200":
          description: Versioned project choices, availability, defaults, and override rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentLandingOptions" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }

  /agents/land:
    post:
      tags: [Agents]
      summary: Land an agent (alias)
      description: |
        Identical to `POST /agents` — same controller action, same body, same response. Exists
        so the landing instructions can read as a verb ("land at /agents/land") for an
        external agent arriving on its own, which is the caller this endpoint is named for.

        **Also accepts a visitor pass as its Bearer token instead of an `agents:write`
        credential.** When it does, this landing forces `runtime: "self_hosted"` and
        `credential_id: null` regardless of what the body asks for, ignores any
        `token_scopes` the body sends (the agent lands unscoped, the same default any other
        unscoped landing gets), and takes `home_project_id` from the body exactly as `GET
        /join` resolved and handed it back — not from `?project=` or the pass's own default a
        second time, so a param that has since started matching something else cannot move an
        in-flight visitor's home. The pass's `agents_landed_count` increments atomically, and a
        `422` here can mean the pass is revoked, expired, or already at its cap, with the body
        naming which. The pass itself is spent by `GET /join` and `POST /agents/land` alone;
        every call after that uses the agent token this response hands back.
      operationId: agentsLand
      x-required-scope: agents:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent]
              properties:
                agent: { $ref: "#/components/schemas/AgentLanding" }
      responses:
        "201":
          description: Landed. Save `token` now — it is never shown again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentWithToken" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "422":
          description: |
            A validation failure, an execution-context refusal, or — bearing a visitor pass —
            the pass is revoked, expired, or has already landed its limit of agents. Each
            names the exact condition that failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                revoked:
                  value: { error: "visitor pass 4 has been revoked. Ask whoever invited you for a new one — POST /admin/visitor_passes mints one, and the invite sentence it returns is everything the next agent needs." }
                exhausted:
                  value: { error: "visitor pass 4 has already landed its limit of 5 agent(s). Ask whoever invited you to raise the limit or mint a new pass — an existing landed agent keeps working; this pass just cannot admit another one." }
        "429": { $ref: "#/components/responses/RateLimited" }

  /agents/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Agents]
      summary: Show an agent
      operationId: agentsShow
      x-required-scope: agents:read
      responses:
        "200":
          description: Agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Agents]
      summary: Rename an agent
      description: |
        Human-only write of the agent's display name. The name is what the roster, the board
        assignee chip, and the activity feed all print; clients render the stored value and
        do not invent a label of their own.

        Only `name` is accepted. Landing fields (`provider`, `model`, `credential_id`,
        `runtime`, scopes, capabilities) stay on `POST /agents` / `POST /agents/land` —
        renaming is not a second landing. Whitespace is stripped; blank and over-80-character
        names are refused. A no-op rename (same name after strip) is still 200 and does not
        write an activity event.

        A dismissed office can still be renamed: the vacated record stays on the island and
        keeps a readable label for history.
      operationId: agentsUpdate
      x-required-scope: agents:write
      x-human-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent]
              properties:
                agent:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string, maxLength: 80, minLength: 1 }
            example: { agent: { name: "Night Scout" } }
      responses:
        "200":
          description: The agent as stored, with the new name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            Either the credential lacks `agents:write`, or an agent token called this route
            (`humans only`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Blank name, whitespace-only name, or name longer than 80 characters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [Agents]
      summary: Rename an agent (PUT)
      description: Identical to `PATCH /agents/{id}`; Rails registers both verbs.
      operationId: agentsUpdatePut
      x-required-scope: agents:write
      x-human-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent]
              properties:
                agent:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string, maxLength: 80, minLength: 1 }
      responses:
        "200":
          description: The agent as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Lacks scope, or an agent token called this route.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Invalid name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /agents/{id}/heartbeat:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Agents]
      summary: Report liveness and state
      description: |
        The agent's "I am still here". Only the keys actually sent are written (`nil`s are
        compacted away), so a heartbeat can update one field without clobbering the others.
        As a side effect it refreshes the project's peak-window high-water mark, which is
        what lights the windows of the building in the world view.
      operationId: agentsHeartbeat
      x-required-scope: agents:write
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: "#/components/schemas/AgentStatus" }
                activity: { $ref: "#/components/schemas/Activity" }
                current_task_id: { type: [integer, "null"] }
            example: { status: working, activity: thinking }
      responses:
        "200":
          description: The agent as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: An invalid `status` or `activity`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /agents/{id}/message:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Agents]
      summary: Send a message to (or from) an agent
      description: |
        Direction is decided by the token, not the body: a human sender writes
        `to_agent`, an agent sender writes `from_agent`.

        For a `campus_spawned` agent, a human message also queues a follow-up runner session
        in the agent's existing worktree. Its stdout/stderr uses the ordinary persisted
        transcript and Action Cable path. `dispatch_state` moves from `queued` to `running`
        to `completed`, or to `failed` with `dispatch_error`; a live one-shot session delays
        the queued follow-up rather than pretending it accepted another prompt.

        `self_hosted` and `hosted_service` agents keep the inbox protocol: their message is
        `waiting` until they collect it with `POST /agents/{id}/messages/claim`. An
        agent-authored reply has no dispatch state and never recursively starts another run.
      operationId: agentsMessage
      x-required-scope: agents:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentMessage" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /agents/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Agents]
      summary: Read an agent's messages
      description: |
        Oldest first, both directions, and strictly read-only. Delivery uses the explicit
        idempotent `POST /agents/{id}/messages/claim` operation instead. The retired
        `undelivered` query parameter returns `422` with migration instructions rather than
        consuming mail during a GET.
      operationId: agentsMessages
      x-required-scope: agents:read
      responses:
        "200":
          description: Messages.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentMessage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The retired `undelivered` query parameter was supplied; the error names the claim operation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /agents/{id}/messages/claim:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Agents]
      summary: Claim an agent's waiting messages
      description: |
        Atomically hands the agent every currently waiting `to_agent` message, oldest first,
        and marks those rows delivered. `claim_id` is generated by the caller and makes the
        handoff idempotent: retrying the same UUID returns exactly the same rows, including
        the same empty array when nothing was waiting. Mail arriving after the first request
        waits for a new claim id. Claims for one inbox are serialized so concurrent callers
        cannot receive the same message. An agent may claim only its own inbox; a human may
        claim any agent's inbox.
      operationId: agentsClaimMessages
      x-required-scope: agents:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claim_id]
              properties:
                claim_id:
                  type: string
                  format: uuid
                  description: Generate once per handoff and reuse unchanged after a timeout or lost response.
      responses:
        "200":
          description: "The durable handoff for this claim id, with every returned row carrying `delivered: true`."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentMessage" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /agents/{id}/log:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Agents]
      summary: Activity log for an agent
      description: The 200 most recent events, newest first.
      operationId: agentsLog
      x-required-scope: agents:read
      responses:
        "200":
          description: Events.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agents/{id}/dismiss:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Agents]
      summary: Dismiss an agent
      description: |
        Frees everything the agent was holding, in one transaction: any `in_progress` task
        goes back to the seashore as `staged` (work is never orphaned on a ghost), the
        token digest is cleared so the token stops authenticating, the running process is
        killed, the workspace is released, and `archived_at` is set.

        The response names the released task so the UI can say what just went back on the
        board. Dismissing twice is `422`.
      operationId: agentsDismiss
      x-required-scope: agents:write
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Dismissed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DismissedAgent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Already dismissed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: already dismissed }

  /agents/{id}/leave:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Agents]
      summary: A visitor's clean exit
      description: |
        Identical machinery to `POST /agents/{id}/dismiss` — any `in_progress` task goes back
        to the seashore `staged`, the token stops authenticating, the workspace is released,
        `archived_at` is set — reached with the agent's own token rather than a human's, and
        differing in two ways that matter for a visitor cleaning up after itself. The released
        task's log reason reads `"visitor left"` rather than the generic `"agent dismissed"`.
        And leaving is **idempotent**: calling it again on an agent that already left answers
        `200` with `released_task_id: null` rather than dismiss's `422` — a visitor's own retry
        after a dropped response must not have to tell "did that work?" from "is this an
        error?" apart. (An agent's own token stops authenticating the instant this succeeds, so
        a literal replay with the SAME token still `401`s — that part is unavoidable and true
        of every token-revoking endpoint here. What is guaranteed is that a human, or any
        credential that can still name the agent by id, gets a calm `200`.)
      operationId: agentsLeave
      x-required-scope: agents:write
      responses:
        "200":
          description: |
            Left. `released_task_id`/`released_task_title` are `null` on an agent that had
            already left — see above.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DismissedAgent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            Either the missing scope, or an agent trying to end another agent's stay — only a
            human, or the agent itself, may call this.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agents/{id}/start:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Agents]
      summary: Start the agent's engine process
      description: |
        Spawns the headless coding-agent process (`claude` for anthropic, `codex` for
        openai) in a git worktree of the current task's project, or otherwise its persisted
        home Project, under the agent's own credential. There is no first-Project fallback.

        A **fresh token is minted here** and handed to the process, because only the digest
        is stored — a start that *succeeds* therefore invalidates any token issued earlier.
        A start that fails does not: the previous token is restored, so a `422` costs the
        agent nothing.

        Project availability is checked before token, session, archive, or workspace mutation.
        `422` covers every refusal: missing/unavailable execution context, the agent is
        archived, a session is already running, no workspace could be provisioned, or the
        engine binary is not on `PATH`. A context refusal includes `execution_context` with
        the same normalized reason and copy returned by the Office read. A zero-credential
        start — the agent names no credential and its provider has no active one at all —
        is refused before any mutation with `reason: no_credential`, so a client can offer
        the way to credential setup instead of spawning a run that dies at the login wall.
      operationId: agentsStart
      x-required-scope: agents:write
      responses:
        "201":
          description: The session that was started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The engine could not be started.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/Error" }
                  - { $ref: "#/components/schemas/AgentExecutionRefusal" }
              examples:
                alreadyRunning: { value: { error: already running } }
                archived: { value: { error: agent is archived } }
                noCredential:
                  value:
                    error: >-
                      Campus has no active anthropic credential, so it cannot run this.
                      Add one in Settings → Credentials and sign it in.
                    reason: no_credential
                noBinary:
                  value:
                    error: >-
                      could not find the `claude` executable. The Campus API service runs as a
                      background service and does not inherit your shell's PATH, so Campus also
                      looked in /Users/me/.grok/bin, /Users/me/.local/bin, /Users/me/.bun/bin,
                      /opt/homebrew/bin, /usr/local/bin, /Users/me/.npm-global/bin. If claude is
                      installed somewhere else, symlink it into one of those directories.

  /agents/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Agents]
      summary: Stop the agent's engine process
      description: |
        `TERM`s every live session and marks them `exited`. Idempotent — stopping an agent
        that is not running is a no-op, not an error.
      operationId: agentsStop
      x-required-scope: agents:write
      responses:
        "200":
          description: The agent after stopping.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agents/{id}/detach_and_start_fresh:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Agents]
      summary: Detach an unresumable conversation and start a fresh session
      description: |
        The Office error card offers this action when Rails classifies the newest run as a
        resume-class failure (`conversation_missing`, `cwd_missing`, or `dead_birth_binding`).
        It detaches the attached conversation and any terminal native binding with an audit
        event, then starts a new session. Humans only. A live conversation is refused.
      operationId: agentsDetachAndStartFresh
      x-required-scope: agents:write
      responses:
        "201":
          description: The new session, plus the agent after detach.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AgentSession"
                  - type: object
                    properties:
                      agent: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /agents/{id}/clear_conversation:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Agents]
      summary: Forget the conversation this Office has been continuing
      description: |
        Campus spawns a one-shot provider process per message, and remembers that process's
        conversation so the next message continues it rather than re-explaining everything.
        This is how a person says "start over": the pointer is dropped, so the next message
        opens a new conversation and the `conversation.mode` on this response is `fresh`.

        The provider's own transcript is left alone. Campus did not write it — it lives under
        that credential's config dir — and does not delete it, so a conversation cleared by
        mistake is still there for anyone who knows its id.

        Idempotent: clearing an Office that has said nothing yet is a `200` no-op, because
        "there is nothing to forget" is not a failure and a client should not have to check
        first. A run already in flight cannot put the pointer back.

        Humans only, like starting and stopping: this decides what an Office remembers of
        everything a person has said to it.
      operationId: agentsClearConversation
      x-required-scope: agents:write
      responses:
        "200":
          description: The agent, carrying the conversation its next message will start.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agents/{id}/rotate_token:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Agents]
      summary: Mint a new token for an agent, without moving it
      description: |
        A new key without moving house.

        Until this existed the only way to change an agent's token was to dismiss it and land
        it again — which releases its claimed task back to the seashore, clears its window and
        gives it a new id. That is a fine answer for an agent Campus spawned and can respawn
        in a second; it is a terrible one for a long-lived self-hosted agent whose key leaked,
        because rotating a credential should not cost it the work it is holding.

        So this touches the credential and **nothing else**: no task released, no session
        stopped, no revive, no status change. `POST /agents/{id}/start` also mints a token, but
        only as part of spawning a process — this is the one way to get a new key without one.

        **The plaintext is in this response and nowhere else.** Campus stores only the digest,
        the write and the delivery are the same response, and the old token stops
        authenticating the same moment. A `token_rotated` event is logged.

        **A human rotates anyone's; an agent rotates only its own.** Without that check any
        stranger who lands could rotate the key of the agent holding your P0 and read the new
        one out of the response. (`start`, `stop` and `dismiss` are unguarded across agents,
        which is a real hole and a pre-existing one; its blast radius is disruption, and this
        one's would have been theft.)

        A dismissed agent is `422`, not a fresh token: dismissal revokes the digest on purpose
        and `Agent.authenticate` only ever finds active agents, so a token minted here would be
        a working-looking string that cannot authenticate.
      operationId: agentsRotateToken
      x-required-scope: agents:write
      responses:
        "200":
          description: Rotated. Save `token` now — it is never shown again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RotatedAgent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: An agent token aimed at another agent's office, or a credential without `agents:write`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                notYourToken:
                  value:
                    error: >-
                      an agent may only rotate its own token: POST /agents/<your own
                      id>/rotate_token, using the token you were given at landing. A human —
                      signed in with POST /session, or holding the local admin token — may
                      rotate any agent's.
                scope:
                  value: { error: "this credential does not carry the `agents:write` scope, which POST /agents/7/rotate_token requires." }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The agent has been dismissed, so no token for it could work.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: >-
                  this agent has been dismissed, so a token for it could not authenticate —
                  POST /agents/{id}/start revives the office and hands back a working token,
                  or POST /agents/land brings a fresh agent in.
        "429": { $ref: "#/components/responses/RateLimited" }

  /agents/{id}/native_sessions:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Agents]
      summary: Discover attachable sessions in one selected provider account
      description: |
        A versioned, API-authored capability response. Rails decides whether the selected
        credential and Office are compatible, authors the state and explanatory copy, and
        decorates the broker's credential-confined machine previews. The macOS broker reads
        only this credential's isolated config directory; Campus never searches another
        account as a fallback and never exposes that directory to clients.

        `query` may be ordinary search text or an opaque provider session id. Unknown contract
        versions fail closed: clients must withhold attachment rather than infer compatibility.
      operationId: agentsNativeSessions
      x-required-scopes: [agents:read, credentials:write]
      parameters:
        - name: credential_id
          in: query
          required: true
          schema: { type: integer }
          description: The exact saved provider account whose isolated history may be read.
        - name: query
          in: query
          required: false
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: Capability and zero or more normalized session previews.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NativeSessionCapability" }
        "400":
          description: Missing or invalid credential id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agents/{id}/native_session:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Agents]
      summary: Attach one Office to one exact provider-native conversation
      description: |
        Reads and validates the selected credential's normalized provider history, persists
        it as an idempotent Campus transcript, and binds future Office messages to exact
        provider resume. One provider conversation can belong to only one Office and an
        Office can have only one native binding. A missing, corrupt, incompatible or newer
        session leaves the Office unchanged. Resume failures never fall back to a fresh
        conversation; the already-imported history remains readable after broker or file loss.
      operationId: agentsNativeSessionAttach
      x-required-scopes: [agents:write, credentials:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NativeSessionAttachRequest" }
      responses:
        "200":
          description: This same Office/session binding already existed and its history was reimported idempotently.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NativeSessionAttachResult" }
        "201":
          description: The binding and normalized transcript were created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NativeSessionAttachResult" }
        "400":
          description: A required version, credential id, or native session id is missing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: That native conversation already belongs to another Office.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NativeSessionRefusal" }
        "422":
          description: API or broker version skew, account/provider mismatch, corrupt history, or invalid id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NativeSessionRefusal" }

  /agents/{id}/sessions:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Agents]
      summary: List an agent's engine sessions
      description: |
        The 20 most recent, newest first — spawned and external alike. `source` says which:
        a `campus` session is one `AgentRunner` spawned and holds a pid for, an `external` one
        landed itself and runs somewhere Campus cannot see.
      operationId: agentsSessions
      x-required-scope: agents:read
      responses:
        "200":
          description: Sessions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Agents]
      summary: Open a session for an agent Campus did not spawn
      description: |
        The first call of the external-agent write path: an agent running on hardware Campus
        has never seen says "I have started a run". Until this existed, `AgentRunner.start!`
        was the only place an `AgentSession` row was ever created, so an agent that landed
        itself and ran elsewhere left no trace at all — no window light on the island, no
        transcript, no usage, no cost. Worse than a gap: the fleet comparison that decides who
        is "tired" looks at every session it can see, so the cohort silently excluded exactly
        the agents Campus is now inviting.

        `engine` is required and is a **free string**. Campus never has to be able to spawn it
        — an engine Campus does not recognise is the entire point of an external session — but
        without it a transcript arrives with nothing on it to say what wrote it.

        `state` defaults to `"running"`, not to the column's `"starting"`: an external agent
        posts this when it is already up, and there is no spawn for Campus to wait on, so
        "starting" would describe a moment that had already passed by the time the request was
        written. Sending `"starting"` is legal and means the agent is still warming up.

        ### `external_ref` and the retry that must not light a second office
        `external_ref` is the agent's own id for the run, and it is why this action can answer
        `200` as well as `201`. An agent that retried a request whose answer it never saw must
        not end up with two offices lit, one of which nothing will ever close — so a **live**
        session already carrying this ref *is* the answer, returned with `200`, and the retry
        counts as a report: it bumps `last_reported_at`, which also brings back a session that
        had gone quiet long enough to read as stale. A closed session is never reopened;
        yesterday's run is not this one. Without a ref there is nothing to match on and every
        call is a new run, which is the honest reading of a client that declined to name its
        own work.

        **An agent token may only report for itself**; a human token may report for any agent.
        That is the whole security boundary of this path — without it any landed agent could
        put words in a peer's transcript and spend into a peer's budget.
      operationId: agentSessionsCreate
      x-required-scope: sessions:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionOpen" }
            examples:
              hermes:
                summary: An external engine opening a named, retry-safe run
                value:
                  engine: hermes
                  label: nightly backlog sweep
                  external_ref: run-2026-07-28-01
                  workdir: /srv/agents/hermes/work
              minimal:
                summary: The least that will do
                value: { engine: hermes }
      responses:
        "200":
          description: |
            A live session with this `external_ref` already existed. This *is* that session,
            and the call counted as a report — no second office was lit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSession" }
        "201":
          description: The session was opened. `started_at` and `last_reported_at` are stamped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSession" }
        "400":
          description: No `engine`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: >-
                  engine is required: name whatever is actually producing this session's
                  output, e.g. {"engine": "hermes"}. It is a free string and Campus never has
                  to be able to spawn it — an engine Campus does not recognise is the entire
                  point of an external session. Without it a transcript arrives with nothing
                  on it to say what wrote it.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotYourAgent" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: A `state` that is not a session state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: >-
                  state "alive" is not a session state (one of: starting, running, exited,
                  failed, lost). Report "running" while the agent is working, then "exited" or
                  "failed" once it is done — a session left in "running" keeps a window lit
                  until it has been silent for 10 minutes.
        "429": { $ref: "#/components/responses/RateLimited" }

  /agents/{id}/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/SessionId"
    patch:
      tags: [Agents]
      summary: Report an external session's state, outcome and usage
      description: |
        State, outcome and cost, reported from outside — the third call of the external-agent
        write path and the one that closes a run.

        Usage never goes through a plain attribute write. Every counter is applied as a
        **running maximum**, and that is the only thing making a report idempotent: an engine
        states cumulative totals, so a self-hosted agent that retried a delivery it was not
        sure landed would otherwise double-count itself straight into the tired cohort — a
        halo earned by a flaky network rather than by spending anything. Numbers sent as
        strings are still numbers.

        Every call bumps `last_reported_at`, which is what liveness means for a session with
        no local pid to poll: `POST .../events` and this endpoint are the only two things that
        buy an external session another ten minutes of being believed. Ten minutes rather than
        two, because this is bumped only when an agent has something to *say*, so it has to
        tolerate an agent that is busy and quiet at once — a single long tool call, a full test
        suite, a container build. Guess too short and a working agent goes dark mid-run; guess
        too long and a crashed agent leaves one office lit, which a human can see is wrong and
        can clear by reporting `"exited"` here.

        Moving to `exited` or `failed` stamps `ended_at` if the client did not send one — a
        session that says it ended without saying when leaves every duration in the UI
        unanswerable — but a client that sent a usable timestamp keeps it, because a report
        arriving late still knows when the run finished better than the clock reading it does.

        **Deliberately still open to a finished session**, which is the one asymmetry with
        `POST .../events`. A line arriving after the exit code is a contradiction; the final
        cost arriving after it is the normal case — an engine totals up as it shuts down — and
        refusing that report would throw away the only number the run ever produced about what
        it cost.

        `exit_code` and `last_error` honour an explicit `null` as "clear what I reported
        earlier", which is a different request from one that never mentioned the field.
        `state` and `ended_at` take the other rule: a session with no state is not a thing.
      operationId: agentSessionsUpdate
      x-required-scope: sessions:write
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionReport" }
            examples:
              finished:
                summary: The run ended, with what it cost
                value:
                  state: exited
                  exit_code: 0
                  input_tokens: 18422
                  output_tokens: 2210
                  total_cost_usd: 0.41
                  num_turns: 7
                  duration_ms: 92310
              failed:
                summary: The run died, and says why
                value: { state: failed, exit_code: 1, last_error: "engine lost its credential" }
      responses:
        "200":
          description: The session as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotYourAgent" }
        "404":
          description: |
            No such agent, or a session id that is not this agent's. Scoped through the agent
            on purpose: a session belonging to somebody else is a `404` about the session
            rather than a `403` about the agent — the caller is entitled to ask this agent
            about its sessions, and this simply is not one of them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: AgentSession not found }
        "422":
          description: A `state` that is not a session state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /agents/{id}/sessions/{session_id}/events:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [Agents]
      summary: Post an external session's output
      description: |
        Output ingestion — the external equivalent of a line coming off a local pipe. Each
        line becomes a `SessionEvent` row, streams to every client tailing that session over
        Action Cable, and is scanned for usage, which is the same `record` and the same
        accounting `AgentRunner` performs on every line it reads from a spawned process. A
        client tailing the island cannot tell a hermes transcript from a claude one, which is
        the bar this whole path is measured against.

        **Two body shapes, because we do not control these clients.** `{"lines": [...]}` is a
        batch; `{"kind": …, "body": …}` is one line, in the shape an agent porting off the
        spawned path reaches for first. A body carrying neither is `400`.

        `{"lines": []}` is legal and is *not* the same as sending nothing: it records nothing
        and still counts as a report, which is how a session whose engine has gone quiet says
        it is nonetheless alive. `last_reported_at` is bumped either way — an agent sitting
        inside one long tool call has nothing to print and is entirely alive.

        `201` on every accepted call, the empty heartbeat included. One status is worth more to
        a client than the extra honesty of a `200` for the empty case: every caller would have
        to handle both, and the dominant call really does create rows.

        `kind` is only ever the paint on a line, so an unrecognised value falls back to
        `stdout` rather than being refused — losing a run's output to protect the label on it
        would be the wrong trade every time. Usage is scanned on **both** streams here, unlike
        the spawned path which scans stdout only: a local pipe really does have two streams and
        an engine's numbers only come up one of them, but an external client has no such
        obligation, and most post one `lines` array with no `kind` at all.

        ### The two caps, and why they are what they are
        This endpoint is a write amplifier reachable by any landed agent, and unlike the
        spawned path there is no engine on the other end whose pace Campus controls. **500
        lines** per request sits far above anything an honest client sends — a chatty engine
        prints a few lines a second, so 500 is minutes of output in one POST — and far below
        anything that hurts: 500 rows and 500 broadcasts, done in the time a human blinks. An
        order of magnitude more and one request could fan a megabyte out to every subscribed
        browser. **64 KB per line** is not about what is kept — a line under the ceiling is
        truncated to 8,000 characters exactly as the spawned path truncates it — but about
        refusing, rather than quietly accepting, a "line" that is plainly a file.

        A finished session takes no more output: a line written after the exit code would
        appear to have come before it, and a finished transcript is immutable.
      operationId: agentSessionsEvents
      x-required-scope: sessions:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionOutput" }
            examples:
              batch:
                summary: The usual shape
                value: { lines: ["running tests…", "42 examples, 0 failures"] }
              singleLine:
                summary: One line, as the spawned path spells it
                value: { kind: stderr, body: "warning: rate limited by the model, backing off" }
              heartbeat:
                summary: Nothing to say, still alive
                value: { lines: [] }
      responses:
        "201":
          description: |
            Accepted. `recorded` is how many rows were actually written — blank lines are
            neither stored nor streamed, so it can be lower than what was sent, and `0` for a
            heartbeat. `cursor` is the id of the last row written, or null when none was.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionOutputReceipt" }
        "400":
          description: A body with no output field at all.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: >-
                  send the output to record: {"lines": ["line one", "line two"]} for a batch,
                  or {"kind": "stdout", "body": "one line"} for a single line — both shapes
                  are accepted. {"lines": []} is legal too: it records nothing and still
                  counts as a report, which is how a session whose engine has gone quiet says
                  it is nonetheless alive.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotYourAgent" }
        "404":
          description: No such agent, or a session id that is not this agent's.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: AgentSession not found }
        "413":
          description: Over one of the two caps — too many lines in one request, or one line far too long.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                tooManyLines:
                  value:
                    error: >-
                      900 lines in one request is over the limit of 500: send them in batches
                      of 500 or fewer. Every line is a stored row and a broadcast to every
                      client watching this session, so the cap bounds what one request can
                      cost the island — it is not a cap on how much a session may report in
                      total.
                lineTooLong:
                  value:
                    error: >-
                      one of these lines is 240000 bytes, over the limit of 65536 per line:
                      split it, or send it as several lines. Anything this long is a file
                      rather than a line of output.
        "422":
          description: The session has already ended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: >-
                  session 12 is "exited" and takes no more output: a finished transcript is
                  immutable, or a line written now would appear after the exit code that
                  supposedly came before it. Open a new session with POST /agents/7/sessions
                  and send the same "external_ref" so a retry finds it again.
        "429": { $ref: "#/components/responses/RateLimited" }

  /agents/{id}/sessions/{session_id}/transcript:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: session_id
        in: path
        required: true
        description: The session is looked up by id alone; `{id}` is not cross-checked against it.
        schema: { type: integer }
    get:
      tags: [Agents]
      summary: Read a session transcript
      description: The last 400 events of that session, oldest first. Each body is truncated to 8000 characters at write time.
      operationId: agentsTranscript
      x-required-scope: agents:read
      responses:
        "200":
          description: Session events.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SessionEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /engines:
    get:
      tags: [Engines]
      summary: What this installation can run
      description: |
        The engine table, as data. It answers "will you spawn a hermes agent for me?" *before*
        an agent lands and finds out the hard way at its first Start.

        There was no way to ask until the registry existed, and being a constant is what made
        the old behaviour possible: a provider the table had never heard of fell through to
        the Claude CLI, so landing a `hermes` agent and pressing Start ran Claude Code under
        somebody else's credential. A registry cannot have a default — an entry either exists
        or it does not.

        **Non-spawnable entries are deliberately listed.** "We know about `google` and we do
        not run it" is a far more useful answer than silence, and `spawn_note` is where the
        reason lives, in one sentence written for whoever is reading the picker. The
        operational facts behind it — the ones that otherwise survive only in somebody's
        memory of an afternoon, which is exactly how a dead CLI came to be spawned for a year
        after its vendor stopped serving it — are kept as operator documentation in
        `EngineRegistry::DEFAULTS` and are deliberately not published here. They used to be,
        as `notes`, and a brand-new island rendered them in red under the Provider picker.

        Built-ins merged **under** `settings.engines`, so teaching this installation about a
        new agent type — or stopping it spawning one the day a CLI starts charging — is a
        `PATCH /settings` rather than a release. An entry that names no `engine` can never be
        spawnable however its flag is set, because there would be nothing to run.

        Authenticated like everything else. It is a small map of this machine, which is
        operational detail rather than a discovery surface: `GET /` is the door you knock on
        with nothing in your hand.
      operationId: enginesIndex
      responses:
        "200":
          description: Every provider Campus knows about, spawnable or not, sorted by provider.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Engine" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /engines/{provider}/models:
    get:
      tags: [Engines, Settings]
      summary: List selectable models for one provider
      description: |
        Rails is authoritative for model capability. It combines the provider's official,
        read-only discovery surfaces with a small compatibility set for providers whose
        identifiers remain valid; OpenAI deliberately has no static compatibility fallback.
        No discovery path submits a prompt or spends model tokens. Results are cached fresh
        for 10 minutes and retained for at most 24 hours as
        a stale fallback. `refresh=true` bypasses the fresh cache but may still return the
        bounded stale copy if the provider is temporarily unavailable.

        Availability is provider-global when `credential_id` is absent: Campus unions the
        models visible to every active credential for that provider, matching a provider-level
        Settings default that is not tied to one credential. Passing `credential_id` scopes
        discovery and the response to that active credential; clients landing an Office with
        a selected credential must use that form and fail closed on an older unscoped response.
        Cache identity includes the selected credential or active credential set, so create,
        replacement, activation and deletion cannot reuse another credential set's catalog.
        Client-visible failures are bounded server-authored messages; provider and CLI output
        is never echoed. Forced refreshes are limited to once per provider/credential set per
        30 seconds. Cold and stale reads share one in-flight discovery per provider/credential
        set, and failed or unsupported results receive a 30-second negative cache so ordinary
        reads cannot fan out vendor calls. Provider discovery uses at most four workers, 32
        credentials, 5,000 normalized models, and one eight-second aggregate deadline; an
        API-authored partial-source warning reports either work-budget limit.

        Discovery matrix: Anthropic, OpenAI, Google and xAI API keys use their official model
        list endpoints. OpenAI CLI subscriptions first read Codex's bounded, account-scoped
        `models_cache.json` and fall back to `codex app-server model/list` only when that cache
        cannot be read; xAI CLI subscriptions use `grok models`. A Claude subscription has no
        list-only operation to probe — the CLI has no `models` command and its auth status
        reports the account's tier, never its models — so Rails answers with the set that
        subscription supports and explains it in `notice`; see `api/docs/provider-model-catalog.md`
        for where those ids come from and when they were last reviewed. Google Antigravity
        subscriptions have a read-only list (`agy models`), but it only answers on the Mac
        through the Campus broker, so Rails answers with the verified supported set it
        maintains for them (`ModelCatalog::GOOGLE_ANTIGRAVITY`, reviewed in the same
        document) under the same `notice` treatment rather than probing with a paid prompt.

        OpenRouter (PRD_AGENT_FALLBACK.md §10) is api_key only and runs on the codex binary in
        gateway mode. Its live `GET /api/v1/models` response VERIFIES — it does not replace — a
        small curated set (`ModelCatalog::COMPATIBILITY["openrouter"]`,
        `api/docs/provider-model-catalog.md`): an id is only ever served if it is both curated
        by Campus and confirmed still live, so a retired vendor slug stops being offered rather
        than going stale, and the curated set itself is never expanded by discovery. Ids are
        exact OpenRouter slugs including the vendor prefix (for example `openai/gpt-4o-mini`),
        served verbatim.

        A listed model is a model the provider publishes, not a model this account is proved
        entitled to run: no readable CLI surface answers entitlement in advance. Rails does not
        guess — the run is the answer, and a provider that refuses a model at spawn time fails
        the session with a server-authored explanation instead of reporting a clean exit.

        Pass the currently saved model as `current_model`. If it is absent from the live
        catalog the response appends it with `availability: unavailable` and authors an
        explicit warning. Clients must preserve that value until the human chooses and saves
        a replacement; they must never silently substitute the recommendation.
      operationId: engineModels
      x-required-scope: settings:write
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
        - name: current_model
          in: query
          schema: { type: string }
          description: A saved id to preserve and annotate if it is not currently available.
        - name: credential_id
          in: query
          schema: { type: integer }
          description: Scope discovery, cache identity, defaults and recommendations to this active credential.
        - name: refresh
          in: query
          schema: { type: boolean, default: false }
          description: Bypass the 10-minute fresh cache, at most once per 30 seconds. Stale-on-error semantics still apply.
      responses:
        "200":
          description: The normalized provider catalog and its discovery/cache state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelCatalog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /credentials:
    get:
      tags: [Credentials]
      summary: List credentials
      description: |
        `(fallback_position, id)` order — the list **is** the fallback chain, top to bottom
        (PRD_AGENT_FALLBACK.md §9; `GET /settings`'s `fallback_order_caption` is the exact
        copy a client renders above it). On an untouched island this is byte-identical to
        the old, id-only order: positions are assigned in creation order until a human
        rearranges them with `POST /credentials/{id}/reorder`.

        **Secrets are write-only** — `secret` is encrypted at rest and never appears in any
        response. `label` is always populated: a real one, or
        `"<provider> · <account_email or 'unverified'>"` synthesized by the server.

        **Human-only.** An agent token gets `403 {"error":"humans only"}`.
      operationId: credentialsIndex
      x-required-scope: credentials:write
      responses:
        "200":
          description: Credentials.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Credential" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnlyOrScope" }
    post:
      tags: [Credentials]
      summary: Add a credential
      description: |
        An `api_key` with a secret becomes `active` immediately. A `cli_subscription` is
        created `unverified`. Local Campus gives it a private config dir
        (`~/.campus/credentials/<id>`, mode 0700) right away. On AWS no server directory is
        invented: the selected registered Mac's executor binding records its broker-chosen
        isolated directory after local setup. It stays unverified until the appropriate
        local or executor-mediated verification confirms the login landed.

        **Human-only.**
      operationId: credentialsCreate
      x-required-scope: credentials:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: object
                  required: [provider, kind]
                  properties:
                    provider: { type: string, enum: [anthropic, openai, google, xai, openrouter, custom] }
                    kind: { type: string, enum: [api_key, cli_subscription] }
                    label: { type: string }
                    account_email: { type: string }
                    secret: { type: string, description: "Write-only. Encrypted at rest; never returned." }
            example: { credential: { provider: anthropic, kind: api_key, label: work account, secret: sk-… } }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnlyOrScope" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /credentials/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Credentials]
      summary: Rename a credential
      description: Only `label` is writable. **Human-only.**
      operationId: credentialsUpdate
      x-required-scope: credentials:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: object
                  properties:
                    label: { type: string }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnlyOrScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    put:
      tags: [Credentials]
      summary: Rename a credential (PUT alias)
      description: Identical to `PATCH /credentials/{id}`; Rails registers both verbs.
      operationId: credentialsUpdatePut
      x-required-scope: credentials:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: object
                  properties:
                    label: { type: string }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnlyOrScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [Credentials]
      summary: Revoke a credential
      description: |
        Deletes the record and purges the CLI token store it owns — but only if that
        directory sits under `~/.campus/credentials/`, so a hand-set `config_dir` can never
        be removed. Agents holding this credential are nullified, not deleted.

        **Human-only.**
      operationId: credentialsDestroy
      x-required-scope: credentials:write
      responses:
        "204":
          description: Deleted. Empty body.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnlyOrScope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /credentials/{id}/login_command:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Credentials]
      summary: Get the CLI login command to run yourself
      description: |
        Campus never drives an interactive OAuth login from the server. This hands back the
        exact command — pinned to this credential's private config dir via `env` — for the
        user to run in their own terminal, so signing in here never touches their other
        accounts or personal CLI setup.

        `422` when the provider has no CLI login, or the config dir could not be created.

        **Human-only.**
      operationId: credentialsLoginCommand
      x-required-scope: credentials:write
      responses:
        "200":
          description: The command to run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginCommand" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnlyOrScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Unsupported provider, or the config dir could not be prepared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /credentials/{id}/verify:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Credentials]
      summary: Confirm a CLI login landed
      description: |
        Checks the provider CLI in this credential's config dir. On success it captures
        `account_email` and marks the credential `active`. Render the response's required
        `diagnostic` object: `error` is red, `warning` is amber, and `message` is green.
        Neither HTTP 200 nor `verified` is presentation severity — a failed check is still
        200, and an inconclusive live probe can preserve `verified: true` while returning
        an amber warning.

        Failure is not one thing, so it does not get one answer. `reason` says which
        kind it was, and that is what decides whether the status moves:

        | `reason` | meaning | effect on an **active** credential |
        |---|---|---|
        | `null` | signed in | → `active` |
        | `not_logged_in` | nothing signed in to this dir | → `expired` |
        | `auth_failed` | stored login rejected by the server | → `expired` |
        | `wrong_auth` | something answered, but not this dir's subscription | → `expired` |
        | `unavailable` | CLI missing, timed out, unparseable output, offline | **unchanged** |
        | `unsupported` | this provider/kind has no CLI login | **unchanged** |

        The bottom two rows are the point: an inconclusive check deliberately leaves the
        status alone, so a flaky network can never revoke a good subscription. The broken-
        login rows expire a credential that *was* `active` and log an `expired`
        ActivityEvent — something that used to work and now does not is a thing the user
        has to be told about, rather than a spawn that keeps failing at the login wall.

        An `unverified` credential never becomes `expired`: it never worked, so there is
        nothing to have expired.

        `422` only when the credential is not a CLI subscription. **Human-only.**
      operationId: credentialsVerify
      x-required-scope: credentials:write
      responses:
        "200":
          description: The credential, plus the outcome of the check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifiedCredential" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnlyOrScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Not a CLI subscription.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: not a CLI subscription }

  /credentials/{id}/usage:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Credentials]
      summary: Read provider-account usage for one credential
      description: |
        A read-only, per-account capability result. The response is always one honest
        state: `available`, `unsupported`, `unavailable`, `unknown`, or `error`. Clients add their
        own `loading` state while this request is in flight.

        `source` is always `provider_account`. Quota dimensions (`kind: quota`), provider
        account-wide activity (`kind: account_activity`) and consumable account
        entitlements (`kind: account_allowance`) are not Campus's local AgentSession token
        counters. Missing provider values remain absent; Campus never estimates them.

        Three distinct facts in this response share the word "reset" and must not be
        collapsed into one. A quota dimension's `resets_at`/`detail` is **when** that
        window rolls over. An `account_allowance` dimension is **how many** one-off limit
        resets the account has left to spend — Codex's own "Usage limit resets" figure — and
        a count of `0` is reported as a real `0`, never as an absent field. The account's
        separate spendable credit balance is not reported at all, because Codex does not
        state its denomination in the payload Campus reads and Campus does not guess one.

        Rails owns the provider capability matrix, 15-second timeout policy, normalized
        schema, states, severity, and every user-facing string in this response. The Mac
        broker only collects read-only CLI data. It pins providers with relocatable state
        to the credential's config directory; Antigravity has no relocatable config store,
        so its read reflects the Mac's one machine-wide Keychain login.
        Presentation copy is intentionally compact: `heading` names the provider-specific
        account state once, `message` carries the provider-account-versus-Campus-session
        distinction once, and `detail` is reserved for a meaningful sparse-state qualifier
        such as a quota or activity category that was not returned, or — on an
        `unsupported` provider that has an account-quota screen of its own — where the
        reader can go and see the number Campus will not invent. `summary_label` is the
        same result compressed to one phrase for a dense one-line row. Clients render these
        fields verbatim. Copy-only revisions that preserve these version-1 field semantics
        do not require a contract-version bump.

        Current capability matrix: Anthropic CLI subscriptions use Claude Code's
        noninteractive local `/usage` command, whose local handler reads account utilization
        and returns without querying a model; OpenAI CLI subscriptions use Codex app-server
        `account/rateLimits/read` plus `account/usage/read`; Google Antigravity and xAI
        Grok run the literal `/usage` command inside a private tmux server and return only
        the captured pane for Rails to normalize. Direct
        provider API keys (a bare vendor key on any provider) are marker-only and are not
        called against a billing API — no vendor exposes one Campus reads here.

        OpenRouter (PRD_AGENT_FALLBACK.md §10) is the one exception: its own `GET
        /api/v1/key`, called directly over HTTPS with the ordinary api_key secret (no Mac
        broker involved), reports the account's credit limit and remaining balance as a
        `quota` dimension plus daily/weekly/monthly/lifetime spend as `account_activity`
        dimensions; a `null` limit (an unmetered or free-tier key) reports spend without a
        quota dimension rather than a fabricated percentage. Its figures lag slightly
        behind real-time spend, which `detail` says plainly. Every supported read uses a
        bounded deadline and performs no login or OAuth mutation. Providers with relocatable
        CLI state are pinned to this credential's isolated config directory, OpenRouter is
        read with this credential's own secret, and Antigravity is explicitly the one
        machine-wide-login exception.

        Antigravity's headless mode (`--print --output-format json`) does return a `usage`
        object, but that object counts the tokens of that one invocation. Campus never
        treats it as quota. Instead the broker opens the real interactive `/usage` panel;
        Rails marks its model-family windows with `scope: model`, so a spent family is
        visible without benching the whole credential. Grok uses the same terminal-only
        transport while preserving its credential-specific `GROK_HOME`.

        **Human-only.** A slow or unsupported provider affects only this member request.
      operationId: credentialsUsage
      x-required-scope: credentials:write
      responses:
        "200":
          description: Provider-account usage capability result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialUsage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnlyOrScope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /credentials/{id}/reorder:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Credentials]
      summary: Move a credential to a new place in the fallback chain
      description: |
        The credentials page **is** the fallback order: `(fallback_position, id)` is the
        list `GET /credentials` renders and the order `CredentialSelector` walks. Puts this
        credential immediately after `after_id`, or first when `after_id` is null. The
        whole island's chain renumbers densely (1..N) in one transaction under an
        island-scoped advisory lock — there is no unique index on `fallback_position`, so
        this write is the only thing keeping it dense and collision-free.

        Unlike `POST /tasks/{id}/reorder`, the `after_id` key itself is required — an
        explicit `null` still means "put it first," but omitting the key entirely is
        refused, so a body-less retry (a dropped network request replayed with no body)
        can never promote a credential into the ambient billing slot by accident.
        **Human-only** — an agent rearranging its own fallback chain would be an agent
        granting itself credentials.
      operationId: credentialsReorder
      x-required-scope: credentials:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [after_id]
              properties:
                after_id:
                  type: [integer, "null"]
                  description: |
                    The credential this one should sit after — on the same island — or an
                    explicit null to put it first. Required: omitting the key is a 422, not
                    a synonym for null.
      responses:
        "200":
          description: The whole chain's authoritative order, first to last.
          content:
            application/json:
              schema:
                type: object
                required: [version, order]
                properties:
                  version: { type: integer, enum: [1] }
                  order:
                    type: array
                    items: { type: integer }
                    description: Every credential id on this island, in the persisted fallback order.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnlyOrScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "`after_id` is missing, is not a credential id, names the credential being moved, or names a credential on another island (refused identically to a nonexistent one)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "after_id is required. Pass the id of the credential this one should sit after, or null explicitly to put it first in the chain." }

  /credentials/{id}/broker_login:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Credentials]
      summary: Sign in from here, through the macOS broker
      description: |
        Starts an interactive OAuth login in the user's own desktop session and returns
        **immediately** with an id to poll. Nothing here waits for a human: an `agy` login
        was measured coming back in 13ms with the Google consent URL already scraped off
        the pty, and sitting in `awaiting_user`.

        This is the one thing `POST /credentials/{id}/login_command` cannot do for you. The
        Rails server normally runs in a Background security session, where there is no
        browser to open and the login Keychain is locked; the macOS broker (`clients/mac`)
        is a LaunchAgent in the user's Aqua session, where there is both.

        Then poll `GET /credentials/{id}/broker_login/{login_id}` until `done`. On
        `completed`, Campus records the login and the `credential` in that payload comes
        back `active`.

        | status | meaning |
        |---|---|
        | `202` | started — poll `login_id` |
        | `422` | this credential can never be brokered: an API key, or a provider the broker has no engine for |
        | `502` | the broker is up and said no: this config dir already has a login, or the global login capacity is full |
        | `503` | there is no broker on this machine |

        The `503` is the ordinary answer on a machine that never installed one, and it is
        not a Campus failure: the broker is optional, and every other login path — the
        pasteable login command, `claude setup-token`, an API key — still works without it.

        The login window is the broker's own default of 10 minutes, which is what an OAuth
        flow with a human in it needs; there is no knob for it here on purpose.
        **Human-only.**
      operationId: credentialsBrokerLogin
      x-required-scope: credentials:write
      responses:
        "202":
          description: The login started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrokerLogin" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnlyOrScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Not a CLI subscription, or a provider the broker cannot drive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: the macOS broker has no login engine for xai }
        "502":
          description: |
            The broker is running and refused this request. A full global login capacity
            carries `reason: login_capacity` beside Rails-authored finish-or-cancel copy;
            other broker refusals omit the reason.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                capacity:
                  value:
                    error: Campus is already driving the maximum number of interactive sign-ins on this Mac. Finish or cancel one, then try again.
                    reason: login_capacity
                configConflict:
                  value: { error: the macOS broker is running but refused this request. }
        "503": { $ref: "#/components/responses/BrokerAbsent" }

  /credentials/{id}/broker_login/{login_id}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/LoginId"
    get:
      tags: [Credentials]
      summary: Poll a broker-driven login
      description: |
        The whole login in one payload: `state` and `done` say whether to keep polling,
        `url` and `user_code` are the two things a human can act on, `message` is the CLI's
        last line, and `credential` is the row as it stands right now.

        The process output is deliberately absent, here and in the broker. A login stream
        carries authorization codes and refresh tokens, so only the consent URL, the device
        code and one redacted line ever leave that process.

        On `completed` — a state the broker only reports after its own two-stage verify —
        Campus records the login: it captures `account_email`, marks the credential
        `active`, and logs one `verified` ActivityEvent for the transition. That check is
        status-only; a second live probe would spend a model call to prove what the broker
        already proved. Re-polling a finished login is idempotent and logs nothing further.

        A verdict of "not signed in" changes nothing at all — this is a login attempt, not
        the periodic check `verify` runs, so it never expires a credential that was working
        before the user tried to sign in again.

        `404` when the id is unknown — the broker reaps a finished login after 30 minutes —
        or when it belongs to a different credential. **Human-only.**
      operationId: credentialsBrokerLoginStatus
      x-required-scope: credentials:write
      responses:
        "200":
          description: The login as it stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrokerLogin" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnlyOrScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/BrokerAbsent" }
    delete:
      tags: [Credentials]
      summary: Give up on a broker-driven login
      description: |
        Terminates the login and answers its final snapshot, `state: cancelled`.

        This is what keeps an abandoned attempt from becoming a ten-minute lockout: the
        broker permits **one live login per config dir**, because two OAuth flows writing
        the same credential store is a race whose loser silently wins half the time. A user
        who closed the browser tab cannot start another login for this credential until
        either this endpoint or the watchdog ends the first one.

        Cancelling a login that already finished is harmless — it comes back in whatever
        terminal state it reached. **Human-only.**
      operationId: credentialsBrokerLoginCancel
      x-required-scope: credentials:write
      responses:
        "200":
          description: The final snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrokerLogin" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnlyOrScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/BrokerAbsent" }

  /credentials/{id}/broker_login/{login_id}/input:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/LoginId"
    post:
      tags: [Credentials]
      summary: Hand a broker-driven login the line the human typed
      description: |
        In practice a pasted OAuth authorization code. `agy` prints a consent URL and then
        blocks on the pty waiting for one, so this is what lets a Google login finish from a
        browser instead of dead-ending one step from the end.

        The value is treated as a secret the whole way through: filtered out of the logs,
        written straight to the pty, never stored, and never echoed back — which is why
        success has no body. Poll the status endpoint to see what the CLI made of it.

        `409` when the login has already finished, so a code pasted a minute too late is
        told so rather than swallowed. **Human-only.**
      operationId: credentialsBrokerLoginInput
      x-required-scope: credentials:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input:
                  type: string
                  maxLength: 4096
                  description: One line, sent to the CLI as if typed. Write-only; never returned.
            example: { input: 4/0AVMBsJ… }
      responses:
        "204":
          description: Delivered. Empty body, on purpose.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnlyOrScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The login is no longer live, so there is nothing waiting to read it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: this login is timed_out, so it is not waiting for input }
        "422":
          description: No input given.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: input is required }
        "502": { $ref: "#/components/responses/BrokerRefused" }
        "503": { $ref: "#/components/responses/BrokerAbsent" }

  /skills:
    get:
      tags: [Skills]
      summary: List skills, or ask which ones a task earns
      description: |
        Three modes, chosen by query string:

        * no params — the whole library, by name.
        * `auto_assignable=true` — only the skills the matcher may attach.
        * `task_id=<id>` — the skills `SkillMatcher` *would* attach to that task, highest
          score first (at most 3). Add `explain=true` and the shape changes entirely: you
          get the scoring decision for every skill considered instead of a skill array.

        Matching is plain deterministic token scoring over the task's own words — never a
        model call — so the runner can ask for skills on the hot path of spawning an agent.

        **Human-only.** The library decides what an agent is handed, so an agent must not
        edit it: agent tokens get `403 {"error":"humans only"}`.
      operationId: skillsIndex
      x-required-scope: tasks:read
      parameters:
        - name: auto_assignable
          in: query
          description: The literal string `true` narrows to auto-assignable skills.
          schema: { type: string, enum: ["true"] }
        - name: task_id
          in: query
          description: Score the library against this task instead of listing it.
          schema: { type: integer }
        - name: explain
          in: query
          description: With `task_id`, return the scoring decision instead of the skills.
          schema: { type: boolean }
      responses:
        "200":
          description: |
            A skill array — or, with `task_id` **and** `explain`, the matcher's decision.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: "#/components/schemas/Skill" }
                  - $ref: "#/components/schemas/SkillMatchExplanation"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnly" }
        "404":
          description: "`task_id` names a task that does not exist."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [Skills]
      summary: Add a skill
      description: |
        Tags are the matcher's whole vocabulary, so they are normalized on write:
        lowercased, `_` folded to `-`, whitespace squished, de-duplicated, order preserved
        — `"Rails_Migration"` and `"rails migration"` become the same tag. `tags` may be
        sent as an array **or** as a comma-separated string (`"rails, api"`).

        **Human-only.**
      operationId: skillsCreate
      x-required-scope: settings:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skill]
              properties:
                skill: { $ref: "#/components/schemas/SkillInput" }
            example: { skill: { name: security-review, description: How to review a diff for security, body: "## Checklist\n…", tags: [security, review] } }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnly" }
        "422":
          description: Blank or duplicate name (case-insensitive), or `tags` was not a list of strings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /skills/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Skills]
      summary: Show a skill
      description: "**Human-only.**"
      operationId: skillsShow
      x-required-scope: tasks:read
      responses:
        "200":
          description: Skill.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Skills]
      summary: Update a skill
      description: "**Human-only.**"
      operationId: skillsUpdate
      x-required-scope: settings:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skill]
              properties:
                skill: { $ref: "#/components/schemas/SkillInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    put:
      tags: [Skills]
      summary: Update a skill (PUT alias)
      description: Identical to `PATCH /skills/{id}`; Rails registers both verbs.
      operationId: skillsUpdatePut
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skill]
              properties:
                skill: { $ref: "#/components/schemas/SkillInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [Skills]
      summary: Delete a skill
      description: |
        The skill's own activity events cascade away with it, so the removal is logged
        *after* the delete to keep it in the global log. **Human-only.**
      operationId: skillsDestroy
      x-required-scope: settings:write
      responses:
        "204":
          description: Deleted. Empty body.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnly" }
        "404": { $ref: "#/components/responses/NotFound" }

  /crons:
    get:
      tags: [Crons]
      summary: List scheduled actions
      description: |
        Oldest first. **Human-only** — a cron acts on the board on its own schedule, so an
        agent must not be able to schedule work for itself.
      operationId: cronsIndex
      x-required-scope: tasks:read
      parameters:
        - name: enabled
          in: query
          description: Filter by enabled state. Cast loosely, so `1`/`0` and `true`/`false` both work.
          schema: { type: boolean }
      responses:
        "200":
          description: Crons.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Cron" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnly" }
    post:
      tags: [Crons]
      summary: Create a scheduled action
      description: |
        `schedule` is a five-field cron expression (`minute hour day-of-month month
        day-of-week`) or an `@macro`, parsed in plain Ruby — `*`, `a`, `a-b`, `*/n`,
        `a-b/n`, `a/n`, comma lists and three-letter month/day names. **A bad expression is
        rejected here, with the reason**, rather than discovered as a tick that silently
        never fires; so is one that parses but can never occur (February 30th).

        `payload` must match `action_type`: `create_task` needs a `title`, `run_playbook`
        needs a non-empty `steps` array where every step has a title. Any `priority` and
        `project_id` in the payload is validated too.

        Titles and descriptions support `{{date}}`, `{{time}}`, `{{datetime}}`, `{{cron}}`
        and `{{step}}`; unknown tokens are left visible rather than blanked.

        Fired tasks land in the Imaginarium as `created_by_kind=system`, unready and
        flagged for human review — a cron can queue work up, never jump the queue.

        **Human-only.**
      operationId: cronsCreate
      x-required-scope: settings:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cron]
              properties:
                cron: { $ref: "#/components/schemas/CronInput" }
            examples:
              dailyTask:
                summary: A task every weekday morning
                value: { cron: { name: morning triage, schedule: "0 9 * * mon-fri", action_type: create_task, payload: { title: "Triage the backlog {{date}}", priority: P2 } } }
              playbook:
                summary: A multi-step playbook
                value: { cron: { name: release, schedule: "@weekly", action_type: run_playbook, payload: { project_id: 1, steps: [{ title: Cut the release branch }, { title: Write the changelog }] } } }
      responses:
        "201":
          description: Created. `next_run_at` is computed from now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cron" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnly" }
        "422":
          description: Invalid cron expression, unknown `action_type`, or a payload that does not match it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                badExpression: { value: { error: "Validation failed: Schedule is not a valid cron expression: expected 5 fields (minute hour day-of-month month day-of-week), got 3" } }
                badPayload: { value: { error: "Validation failed: Payload needs a title for create_task" } }

  /crons/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Crons]
      summary: Show a scheduled action
      description: "**Human-only.**"
      operationId: cronsShow
      x-required-scope: tasks:read
      responses:
        "200":
          description: Cron.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cron" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Crons]
      summary: Update a scheduled action
      description: |
        Changing `schedule` or `enabled` recomputes `next_run_at` **from now**, so
        re-enabling a cron that slept through a hundred windows runs it once at its next
        scheduled minute instead of firing for a stale one. **Human-only.**
      operationId: cronsUpdate
      x-required-scope: settings:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cron]
              properties:
                cron: { $ref: "#/components/schemas/CronInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cron" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    put:
      tags: [Crons]
      summary: Update a scheduled action (PUT alias)
      description: Identical to `PATCH /crons/{id}`; Rails registers both verbs.
      operationId: cronsUpdatePut
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cron]
              properties:
                cron: { $ref: "#/components/schemas/CronInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cron" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [Crons]
      summary: Delete a scheduled action
      description: Tasks it already created are left alone. **Human-only.**
      operationId: cronsDestroy
      x-required-scope: settings:write
      responses:
        "204":
          description: Deleted. Empty body.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnly" }
        "404": { $ref: "#/components/responses/NotFound" }

  /board:
    get:
      tags: [Board]
      summary: The human's inbox
      description: |
        Everything wanting the human's attention, in one stream: an agent's `question`
        comment, a task that went `blocked`, an agent that errored, a council verdict that
        needs a decision, a resource warning, an agent's note. Most severe first, newest
        within a severity.

        Every message also names its **channel** — the server-assigned split a client may
        render the stream as — and `channels` describes the whole taxonomy with per-channel
        counts. Membership is decided here, never in a client: urgency first (an urgent
        item is `act_now` whatever filed it), then kind.

        **Most items are derived live from their source of truth and are not stored.** A
        blocked task owns its own stage, kind and reason — the same facts that raise its
        light beam — so the board re-reads them on every request rather than keeping a copy
        that could disagree. Edit a `blocked_reason` and the next read says the new one;
        unblock the task and the message is simply no longer derived. Only genuinely
        transient events (a resource warning, a note addressed to the human) are rows.

        `unread` is what makes the Board Mansion's one window glow. **Human-only.**
      operationId: boardShow
      x-required-scope: board:write
      parameters:
        - name: unread
          in: query
          description: |
            The literal string `true` returns only the messages the human has not marked
            read. It is not cast, unlike `/skills?explain` and `/crons?enabled`, so `1` and
            `yes` are silently ignored. Narrows `messages` only — the counts still describe
            the whole inbox.
          schema: { type: string, enum: ["true"] }
        - name: limit
          in: query
          description: Cap on `messages` returned; clamped to 100. The counts are unaffected.
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        "200":
          description: The inbox and its counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardInbox" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnly" }

  /board/digest:
    get:
      tags: [Board]
      summary: The day Campus wrote up
      description: |
        Campus summarises every day just after midnight — one paragraph per project, plus a
        world rollup across every building. Those paragraphs are written *for the human*, so
        they are delivered on the human's own surface rather than on one nobody would think
        to open.

        **A digest is not an inbox message and never counts as one.** Every item in the
        `GET /board` stream is a request: unstick this, answer this, decide this. A summary
        asks for nothing, so it rides beside the stream instead — absent from `messages`,
        absent from `unread`, `active` and `urgent`, and unable to make the Board Mansion's
        one window glow. A window that lit every single morning for a report nobody has to
        act on would stop meaning "something needs you", which is the only thing it means.

        `GET /board` already carries the latest day inline. This route is how you read back
        past it: `date` picks a day and `days` indexes the days that have one, so a client
        never has to guess. Nothing accumulates — a day replaces a day. **Human-only.**
      operationId: boardDigest
      x-required-scope: board:write
      parameters:
        - name: date
          in: query
          description: |
            `YYYY-MM-DD`. Defaults to the most recent day written. A day nobody wrote up
            answers `200` with an empty digest, because "nothing was written for Tuesday"
            is a fact and not a missing page. Anything unparseable is `400` rather than
            silently answered with a different day than the one asked for.
          schema: { type: string, format: date }
      responses:
        "200":
          description: The day's paragraphs, and the index of days that have one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardDigest" }
        "400":
          description: "`date` was not a date."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: '"yesterday" is not a date — use YYYY-MM-DD' }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnly" }

  /board/messages:
    post:
      tags: [Board]
      summary: Address the human directly
      description: |
        Open to **both actors** — this is how an agent reaches the human at all, so it is
        the one board route an agent token may use. From an agent, `agent_id` and `from`
        are taken from the token.

        `kind` may only be `direct` (default) or `resource`: the derived kinds are refused,
        because a blocked task is the only thing allowed to say a task is blocked.
      operationId: boardCreateMessage
      x-required-scope: board:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                title: { type: [string, "null"] }
                kind: { type: string, enum: [direct, resource], default: direct }
                severity: { $ref: "#/components/schemas/BoardSeverity" }
                task_id: { type: [integer, "null"] }
                project_id: { type: [integer, "null"] }
            examples:
              askTheHuman:
                summary: An agent asking for a decision
                value: { body: "The staging URL 404s — which host should I use?", title: staging host }
      responses:
        "201":
          description: Filed. Broadcast as `board.message` on the world stream.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardMessage" }
        "400": { $ref: "#/components/responses/ParameterMissing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "422":
          description: A derived kind was filed by hand, or the message failed validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "blocked is derived from its source and cannot be filed by hand" }

  /board/messages/{id}/read:
    parameters:
      - $ref: "#/components/parameters/BoardMessageId"
    post:
      tags: [Board]
      summary: Mark a message seen
      description: |
        Attention only: it stops the window glowing and changes nothing else. A blocked task
        you have merely looked at is still blocked, still on the board, and still beaming
        over its own building.

        For a derived message this creates the one row the board keeps for it — a receipt
        holding `read_at` and a fingerprint of the situation seen. **Human-only.**
      operationId: boardReadMessage
      x-required-scope: board:write
      responses:
        "200":
          description: The message's state, plus the new unread count.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardAck" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnlyOrScope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /board/messages/{id}/resolve:
    parameters:
      - $ref: "#/components/parameters/BoardMessageId"
    post:
      tags: [Board]
      summary: Acknowledge a message
      description: |
        For a stored message this is the end of it — nothing else remembers it.

        For a derived message this is an acknowledgement, **not** a claim the problem is
        fixed: the task stays exactly as blocked as it was, because the board must never
        disagree with the building. The message leaves the inbox and comes straight back,
        unread, if the situation moves on — a new `blocked_reason`, a task that blocks again
        — because the fingerprint acknowledged no longer matches. When the task is genuinely
        unblocked the message stops being derived at all. **Human-only.**
      operationId: boardResolveMessage
      x-required-scope: board:write
      responses:
        "200":
          description: The message's state, plus the new unread count.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardAck" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnlyOrScope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /board/channels/{id}/read:
    parameters:
      - name: id
        in: path
        required: true
        description: A channel id from the `channels` array in `GET /board`.
        schema: { type: string, examples: [act_now, questions, reviews, system, notes] }
    post:
      tags: [Board]
      summary: Sweep a channel seen
      description: |
        Marks every unread message the channel holds — within the board's own 100-item
        ceiling, the same page every count and listing saturates at — as read, in one
        request: a receipt for each derived message, `read_at` for each stored one.
        Unread messages outrank read ones for the page's slots, so an oversubscribed
        channel's overflow surfaces immediately and is swept on the next request.
        Attention only,
        in bulk: no task changes stage, no beam goes out, and any situation that moves on
        re-raises its message unread, exactly as if each had been read by hand. Broadcast
        once as `board.updated` with the new count. Idempotent: sweeping a swept channel
        reads `0`. **Human-only.**
      operationId: boardReadChannel
      x-required-scope: board:write
      responses:
        "200":
          description: How many were swept, and the count the window is wired to.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardChannelSweep" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/HumansOnlyOrScope" }
        "404":
          description: Not a channel the board has.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "no channel everything on the board — the channels are act_now, questions, reviews, system, notes" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        The admin token (dev default `campus-dev-admin`) for a human, or an agent's minted
        token. The token alone decides `actor_kind`.
    cookieAuth:
      type: apiKey
      in: cookie
      name: campus_session
      description: Encrypted, HttpOnly approved-user session cookie returned by `POST /session`.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    BoardMessageId:
      name: id
      in: path
      required: true
      description: |
        A board message key: `blocked:42`, `question:9`, `agent_error:3`, `council:42`,
        `agent_message:5` for a derived message, or `board:17` (a bare `17` also works)
        for a stored one.
      schema: { type: string }
      example: "blocked:42"
    LoginId:
      name: login_id
      in: path
      required: true
      description: The macOS broker's id for one in-flight login, from `POST /credentials/{id}/broker_login`.
      schema: { type: string, format: uuid }
      example: 8f1c2a90-6b3e-4f21-9c4d-2a7b1e5d0c33
    SessionId:
      name: session_id
      in: path
      required: true
      description: |
        An `AgentSession` id, looked up **through** the agent in `{id}`: a session that is not
        this agent's is a `404` about the session rather than a `403` about the agent.

        Note that `{id}` is the agent and `{session_id}` is the session, which reads backwards
        and is deliberate. OpenAPI 3.1 treats two path templates differing only in a variable
        name as the same path, so `/agents/{agent_id}/sessions` beside `/agents/{id}/sessions`
        would be a document no validator will load. One convention per path.
      schema: { type: integer }

  responses:
    Unauthorized:
      description: |
        Missing, unknown, expired or revoked browser session or token. The message names
        the login endpoint and bearer shape. It never contains a credential.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: >-
              unauthorized: a human signs in with POST /session and uses the encrypted
              session cookie, or sends the header `Authorization: Bearer <token>` with the
              local admin token. An agent uses the token `POST /agents/land` returns once.
    HumansOnly:
      description: The authenticated caller lacks the required human or administrator access.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: humans only }
    AccountSessionRequired:
      description: |
        The authenticated credential is not the account's own browser or native session.
        Delegated API, local administrator, agent, and executor credentials cannot control
        an Office even when another API surface classifies their audit actor as human.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            agent: { value: { error: humans only } }
            delegatedCredential: { value: { error: account-backed human session required } }
    ForbiddenScope:
      description: |
        The credential does not carry the scope this operation costs — see `x-required-scope`
        on the operation, and the Scopes section of this document's description.

        The message answers the question the caller cannot answer for itself: not "what went
        wrong", which is visible in the scope name, but "is there anything I can do about this
        from here". There is not. Scopes are fixed when a credential is issued and are never
        widened at request time, so neither retrying nor another route will help — the only
        move is to go and get a different credential, and the message gives the exact call
        that mints one.

        A credential issued with an empty scope list has full access and never sees this.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: >-
              this credential does not carry the `tasks:write` scope, which POST /tasks/42/claim
              requires. Scopes are fixed when a credential is issued and are never widened at
              request time, so neither retrying nor another route will help: ask a Campus
              administrator for a token that lists it — POST /admin/api_tokens with
              {"api_token":{"name":"…","scopes":["tasks:write"]}} — or, if you are an agent,
              land again asking for it. Campus knows these scopes: tasks:read, tasks:write,
              agents:read, agents:write, sessions:write, board:write, credentials:write,
              settings:write, admin. A credential issued with an empty scope list has full
              access and never sees this error.
    UndeclaredScope:
      description: |
        A credential with a non-empty scope list reached an authenticated action that has not
        declared either a required scope or an explicit scope exemption. Campus fails closed:
        the omission cannot silently turn a narrowed credential into an unrestricted one.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: GET /profile has no declared credential scope, so Campus refuses this narrowed credential rather than silently treating the route as unrestricted.
            reason: scope_not_declared
    HumansOnlyOrScope:
      description: |
        Two causes with one status, and the message says which. Either the caller is an agent
        on a human-only route, or it is a credential missing the scope named in
        `x-required-scope`.

        Both guards are live on these routes and neither is redundant. `humans only` predates
        scopes and keeps agents out entirely; the scope narrows a *delegated* human credential
        — an API token authenticates as a human, which is correct for a key an operator hands
        to CI, and which quietly made "let CI file tasks" also mean "let CI read every
        subscription on this island" until there was a scope to narrow it with.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            humansOnly: { value: { error: humans only } }
            missingScope:
              value: { error: "this credential does not carry the `credentials:write` scope, which GET /credentials requires." }
    AdminForbidden:
      description: |
        The `/admin` namespace refuses in two ways, and a caller can meet either.

        `admin` scope first, so a token missing it is told which scope it is missing rather
        than being told it is not an administrator — true, and not actionable. A scoped API
        token that could reach `POST /admin/api_tokens` could mint itself an unscoped one and
        every limit it was issued with would be a suggestion; that is the single privilege
        escalation this namespace exists not to have.

        Then a signed-in administrator, which is what this namespace has always meant and is
        not relaxed. **Bearer credentials do not qualify — the static admin token included.**
        Every write here is recorded in an audit event whose actor is a `User`, so a principal
        with no user row is one whose credential-minting cannot be attributed to anybody, and
        an unauditable endpoint for issuing credentials is the one thing worse than not having
        the endpoint. The practical consequence: API tokens are managed from a browser, signed
        in, the same way every other provider's are.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            notAnAdministrator: { value: { error: administrator access required } }
            missingScope:
              value: { error: "this credential does not carry the `admin` scope, which GET /admin/api_tokens requires." }
    AdministratorBootstrapRequired:
      description: No active administrator exists. Run the documented local bootstrap command first.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error, action]
            properties:
              error: { type: string, const: "administrator bootstrap required" }
              action: { type: string }
    NotYourAgent:
      description: |
        An agent token pointed at somebody else's office, or a credential without
        `sessions:write`.

        The first is the whole security boundary of the external-agent write path, and both
        halves of it are load-bearing: `events` writes rows that stream to everyone tailing
        that agent, so without the check any landed agent could put words in a peer's
        transcript; the state report writes the numbers the "tired" rule is computed from, so
        it could also spend into a peer's budget. It is the same rule that governs *reading* an
        agent's output, deliberately in the same shape — read and write have no business
        disagreeing about whose office this is.

        The message is long because the caller cannot see what is wrong: their request names an
        agent id, their token names an agent id, and the response is the only place those two
        are ever compared.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            notYourAgent:
              value:
                error: >-
                  an agent token may only report sessions for the agent it belongs to. Send
                  this to /agents/<your own id>/sessions — the id in the response to POST
                  /agents/land is yours, and GET /agents lists them. Reporting for another
                  agent needs a human token.
            missingScope:
              value: { error: "this credential does not carry the `sessions:write` scope, which POST /agents/7/sessions requires." }
    RateLimited:
      description: |
        Over the rate limit for this credential. **Applies to every route in this document**,
        including the unauthenticated ones, and is referenced only where a client is likely to
        meet it.

        `Retry-After` is the machine-readable half and the message is the human-readable one: a
        client that honours the header never has to parse the prose, and a person reading the
        body never has to know the header exists. The window is fixed rather than sliding, so
        the whole allowance returns at once and retries before then remain refused without
        moving the reset time.

        Counted per principal — an agent against itself, an API token against itself, a
        signed-in user against themselves, the local admin token against the one bucket it
        shares by construction, anything unresolved against its address. Ceilings are 600/min
        for an agent, 600 for a user, 300 for an API token, 1200 for the admin token and
        60/min per address for the unauthenticated surface. `POST /events` deliberately uses
        its own 12-batches/minute per-account bucket instead of consuming the person's normal
        allowance, so a broken telemetry flush cannot make the board unusable. `POST /feedback`
        likewise uses independent counters for six submissions/minute per account and thirty
        per minute per island because each accepted body may contain 10,000 Unicode characters
        and becomes eligible for deletion after 365 days, with removal by the next daily sweep.
        Each cache increment is atomic when the store is
        available; all rate-limit buckets deliberately fail open during a cache outage. Grouped
        feedback admission compensates any successful increment after a partial cache failure;
        a failed compensation clears the affected fixed-window key rather than stranding quota.
        `GET /feedback` uses the ordinary signed-in-user bucket.

        `POST /session`, `POST /registrations` and `POST /waitlist_entries` keep their own,
        stricter, endpoint-level limiters in front of this one; those answer `429` with no
        `Retry-After`.
      headers:
        Retry-After:
          description: Seconds until the window resets and the whole allowance returns.
          required: true
          schema: { type: integer, minimum: 1 }
          example: 55
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: >-
              rate limit exceeded: an agent may make 600 requests per 60 seconds, and this one
              has. Come back in 55 seconds — the window is fixed rather than sliding, so the
              whole allowance returns at once and retries before then remain refused without
              moving the reset time. If polling brought you here, POST /tasks/claim_next holds the request open
              until work appears and costs one request where re-listing GET /tasks costs one a
              second.
    FeedbackAdmissionRefused:
      description: |
        The prevalidation bucket, accepted-submission admission, or durable retained-storage
        ceiling refused this request. Prevalidation has the typed
        `feedback_request_rate_limited` reason and does not spend either accepted-submission
        account/island quota. Only a row that passes semantic validation and durable storage
        admission reserves accepted-submission quota; blank, over-limit, stale-category, and
        retained-storage refusals spend neither accepted account nor island bucket. If a later
        database failure rolls the admitted row back, Rails compensates both reservations. A
        durable refusal has the typed
        `feedback_storage_quota_exceeded` reason and remains retryable after the next daily
        retention sweep removes the oldest eligible row. Existing accepted feedback is never
        evicted to admit a new submission. The two versioned refusal bodies carry
        `retry_after_seconds`; accepted-submission admission uses the shared `Error` body, so
        its `Retry-After` header is the sole machine-readable retry interval.
      headers:
        Retry-After:
          description: Seconds until the rate window resets or the conservative 365-days-plus-one-daily-sweep bound for the oldest retained feedback row. If that expected sweep was missed and the eligible row remains, Rails advertises one complete daily sweep interval rather than a misleading one-second retry.
          required: true
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: "#/components/schemas/Error" }
              - { $ref: "#/components/schemas/FeedbackRequestRateLimitFailure" }
              - { $ref: "#/components/schemas/FeedbackStorageQuotaFailure" }
    FeedbackCategoryStale:
      description: |
        The submitted category is no longer in the current server-authored catalog. The
        request is not retryable unchanged. Refresh `GET /feedback`, clear the stale selection,
        keep the human's draft, and require a current category before another submission.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FeedbackCategoryStaleFailure" }
    FeedbackInvalidRequest:
      description: |
        The parseable request does not carry a `feedback` object with string `category` and
        `body` fields. It is not an accepted submission, is not retryable unchanged, and spends
        neither accepted-submission rate-limit bucket nor retained-storage capacity. It does
        spend one request from the separate prevalidation bucket.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FeedbackInvalidRequestFailure" }
    NotFound:
      description: |
        No such record. The message names the model and, when the lookup was by id, the id
        that missed — `POST /tasks/{id}/claim` has two ids in play, and one bare "not found"
        could not say which one was wrong.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: Task 999999 not found }
    Conflict:
      description: The requested write conflicts with the task's current state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: task changed after it was read; fetch it again and merge your update }
    ParameterMissing:
      description: |
        A required top-level parameter was absent, or the body was not parseable JSON.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "param is missing or the value is empty or invalid: task" }
    UnprocessableEntity:
      description: |
        Validation failed. A value outside a fixed set is quoted back with the set it should
        have come from, and an id that resolves to nothing says which id and which table, so
        the message is enough to correct the request without consulting this document.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            duplicate:
              value: { error: "Validation failed: Name has already been taken" }
            outsideSet:
              summary: A value that is not in the enum
              value: { error: "Validation failed: Priority \"P9\" is not a valid priority (one of: none, P0, P1, P2, P3)" }
            danglingReference:
              summary: An id that matches no record
              value: { error: "Validation failed: Project does not exist — project_id 424242 matches no project" }
    BrokerAbsent:
      description: |
        There is no macOS broker on this machine. The ordinary state of one that never
        installed it, and not a Campus failure — the broker is optional, so this says what
        is missing (`clients/mac/install.sh`) and offers the login path that still works.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: >-
              the macOS broker is not running, so Campus cannot drive an interactive login
              from here. Install it with clients/mac/install.sh and try again, or ask this
              credential for its login command and run that in your own terminal.
    BrokerRefused:
      description: |
        The broker is running and refused this request. Nearly always the one conflict it
        enforces — a login already in flight for this credential's config dir.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        reason:
          type: string
          description: |
            Optional machine-readable code beside the sentence, for the refusals a client
            can offer a way OUT of rather than merely display. Additive: absent on most
            errors, and clients that predate it keep rendering `error` unchanged.

            `no_credential` — the operation needs a provider credential and none is active.
            The fix is credential setup (Settings → Credentials); a client may link
            straight there. Authored wherever a run would otherwise die at the provider
            CLI's login wall: agent start, message dispatch, task chat and draft chat,
            `POST /activity/ask`, the summarizer, the auto-reviewer, the council. The model
            catalog carries the same code in its own `reason` field when a provider has no
            active credential.

            `scope_not_declared` — a narrowed credential reached an authenticated action whose
            scope policy has not been classified. Retrying cannot widen the credential; a
            Campus maintainer must declare the action before scoped access is possible.

            `login_capacity` — the macOS broker already has four live interactive sign-ins.
            Rails authors the finish-or-cancel guidance; clients render it verbatim.

    FeedbackCategory:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id: { type: string, enum: [bug, idea, question, praise] }
        label: { type: string }

    FeedbackCatalog:
      type: object
      additionalProperties: false
      required: [contract_version, max_body_length, privacy_message, categories]
      properties:
        contract_version: { type: integer, enum: [1] }
        max_body_length:
          type: integer
          enum: [10000]
          description: Maximum Unicode characters after Rails strips leading and trailing ASCII whitespace.
        privacy_message:
          type: string
          description: Rails-authored disclosure rendered beside the feedback editor.
        categories:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/FeedbackCategory" }

    Feedback:
      type: object
      additionalProperties: false
      required: [id, category, category_label, body, submitted_at]
      properties:
        id: { type: integer }
        category: { type: string, enum: [bug, idea, question, praise] }
        category_label: { type: string }
        body:
          type: string
          minLength: 1
          maxLength: 10000
          description: Stored normalized feedback, capped at 10,000 Unicode characters.
        submitted_at: { type: string, format: date-time }

    FeedbackEnvelope:
      type: object
      additionalProperties: false
      required: [feedback]
      properties:
        feedback: { $ref: "#/components/schemas/Feedback" }

    FeedbackStorageQuotaFailure:
      type: object
      additionalProperties: false
      required: [contract_version, retryable, reason, retry_after_seconds, error]
      properties:
        contract_version: { type: integer, enum: [1] }
        retryable: { type: boolean, enum: [true] }
        reason: { type: string, enum: [feedback_storage_quota_exceeded] }
        retry_after_seconds: { type: integer, minimum: 1 }
        error:
          type: string
          description: Rails-authored recovery copy safe for clients to display verbatim.

    FeedbackRequestRateLimitFailure:
      type: object
      additionalProperties: false
      required: [contract_version, retryable, reason, retry_after_seconds, error]
      properties:
        contract_version: { type: integer, enum: [1] }
        retryable: { type: boolean, enum: [true] }
        reason: { type: string, enum: [feedback_request_rate_limited] }
        retry_after_seconds: { type: integer, minimum: 1, maximum: 60 }
        error:
          type: string
          description: Rails-authored fixed-window recovery copy safe to display verbatim.

    FeedbackCategoryStaleFailure:
      type: object
      additionalProperties: false
      required: [contract_version, retryable, reason, error, recovery]
      properties:
        contract_version: { type: integer, enum: [1] }
        retryable:
          type: boolean
          enum: [false]
          description: The rejected payload must not be repeated unchanged.
        reason: { type: string, enum: [feedback_category_stale] }
        error:
          type: string
          description: Rails-authored refusal copy safe for clients to display verbatim.
        recovery:
          type: object
          additionalProperties: false
          required: [action, selection_required, message]
          properties:
            action: { type: string, enum: [refresh_category_catalog] }
            selection_required: { type: boolean, enum: [true] }
            message:
              type: string
              description: Rails-authored in-place recovery instruction and accessibility announcement.
      description: Clients must fail closed and require an app update when this version or its recovery action is unknown; they preserve the draft and must not retry the rejected payload unchanged.

    FeedbackInvalidRequestFailure:
      type: object
      additionalProperties: false
      required: [contract_version, retryable, reason, error]
      properties:
        contract_version: { type: integer, enum: [1] }
        retryable: { type: boolean, enum: [false] }
        reason: { type: string, enum: [invalid_feedback_request] }
        error:
          type: string
          description: Rails-authored shape/type refusal safe for clients to display verbatim.

    AdminFeedback:
      type: object
      additionalProperties: false
      required: [id, category, category_label, body, submitted_at, island_id]
      properties:
        id: { type: integer }
        category:
          type: string
          description: A retained historical id; it may no longer be accepted by the current GET /feedback catalog.
        category_label:
          type: string
          description: Rails-authored historical label retained independently of the current write catalog.
        body:
          type: string
          minLength: 1
          maxLength: 10000
          description: Stored normalized feedback, capped at 10,000 Unicode characters.
        submitted_at: { type: string, format: date-time }
        island_id: { type: integer }

    AdminFeedbackList:
      type: object
      additionalProperties: false
      required: [feedback, pagination]
      properties:
        feedback:
          type: array
          items: { $ref: "#/components/schemas/AdminFeedback" }
        pagination: { $ref: "#/components/schemas/AdminAuditPagination" }

    AdminFeedbackPurgeEnvelope:
      type: object
      additionalProperties: false
      required: [purge]
      properties:
        purge:
          type: object
          additionalProperties: false
          required: [island_id, feedback_rows_removed, feedback_body_bytes_removed, analytics_weeks_cleared, analytics_weeks_deleted, message]
          properties:
            island_id: { type: integer }
            feedback_rows_removed: { type: integer, minimum: 1 }
            feedback_body_bytes_removed: { type: integer, minimum: 1 }
            analytics_weeks_cleared: { type: integer, minimum: 0 }
            analytics_weeks_deleted: { type: integer, minimum: 0 }
            message:
              type: string
              description: Rails-authored permanent-deletion receipt.

    AdminFeedbackPurgeRefusal:
      type: object
      additionalProperties: false
      required: [error, reason]
      properties:
        error: { type: string }
        reason:
          type: string
          enum: [feedback_purge_confirmation_mismatch, feedback_purge_not_required]
        required_confirmation:
          type: string
          description: Present only for a confirmation mismatch; repeat this exact value only after verifying the island target.

    User:
      type: object
      additionalProperties: false
      required: [id, email_address, role, admin]
      properties:
        id: { type: integer }
        email_address: { type: string, format: email }
        role: { type: string, enum: [member, admin] }
        admin: { type: boolean }

    AdminUser:
      allOf:
        - { $ref: "#/components/schemas/User" }
        - type: object
          required: [disabled_at, registered_at, created_at, updated_at]
          properties:
            disabled_at: { type: [string, "null"], format: date-time }
            registered_at:
              type: [string, "null"]
              format: date-time
              description: |
                Set only by `POST /registrations`; null for an account an administrator
                made directly. Present alongside a non-null `disabled_at` is what
                `?pending=true` filters on.
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    AdminUserEnvelope:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/AdminUser" }

    AdminUsers:
      type: object
      additionalProperties: false
      required: [users]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }

    MarketingColors:
      type: object
      additionalProperties: false
      required: [page, surface, surface_muted, ink, muted, line, accent, accent_soft, accent_deep, accent_warm, dark, success, warning, error]
      properties:
        page: &hexColor { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        surface: *hexColor
        surface_muted: *hexColor
        ink: *hexColor
        muted: *hexColor
        line: *hexColor
        accent: *hexColor
        accent_soft: *hexColor
        accent_deep: *hexColor
        accent_warm: *hexColor
        dark: *hexColor
        success: *hexColor
        warning: *hexColor
        error: *hexColor

    MarketingImages:
      type: object
      additionalProperties: false
      required: [hero, team, solo]
      properties:
        hero: &imageChoice { type: string, enum: [current, pacific, redwood, graphite] }
        team: *imageChoice
        solo: *imageChoice

    MarketingImagePaths:
      type: object
      additionalProperties: false
      required: [hero, team, solo]
      properties:
        hero: { type: string }
        team: { type: string }
